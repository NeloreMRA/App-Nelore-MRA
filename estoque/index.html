<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153e2c">
<title>Estoque Gado · App Nelore MRA</title>
<link rel="icon" href="../logo.webp">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--verde:#1f6a49;--verde-esc:#153e2c;--verde-claro:#eef6f1;--ouro:#b39a3b;--fundo:#f4f6f4;--borda:#e3e8e4;--linha:#eef1ef;--texto:#17211c;--suave:#5d6a62;--muito-suave:#8a958d;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--texto);background:var(--fundo)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:var(--fundo)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.hidden{display:none!important}
.topo{background:var(--verde-esc);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.topo-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topo img{width:34px;height:34px;border-radius:50%}
.topo .t{font-size:16px;font-weight:800;line-height:1.1}.topo .s{font-size:11.5px;opacity:.75}
.topo .acoes{margin-left:auto;display:flex;gap:6px}
.icobtn{background:#ffffff14;color:#fff;border:1px solid #ffffff30;border-radius:9px;height:36px;padding:0 11px;font-size:13px;font-weight:600;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:20px 16px 120px}
.offline{background:#fff3d6;border:1px solid #ecd28f;color:#6b4f12;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
/* números do topo */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--suave);font-weight:600;display:flex;align-items:center;gap:6px}.kpi .l i{width:8px;height:8px;border-radius:50%;background:var(--k)}
.kpi .v{font-size:26px;font-weight:800;margin-top:4px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.cat{background:#fff;border:1px solid var(--borda);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}.cat b{margin-left:4px}
/* barra */
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0 12px}
.barra h2{margin:0;font-size:17px;margin-right:auto}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.btn-primary{background:var(--verde);color:#fff}.btn-ghost{background:#fff;border:1px solid var(--borda);color:#334139}.btn-ouro{background:var(--ouro);color:#fff}.btn-danger{background:#fff;border:1px solid #e7bbb5;color:#a33627}
/* tabela (computador) */
.card{background:#fff;border:1px solid var(--borda);border-radius:14px;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#f8faf8;color:var(--suave);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--borda);text-align:left;white-space:nowrap}
td{border-bottom:1px solid var(--linha);padding:3px 6px;vertical-align:middle}
td.n,th.n{text-align:right}
.cel{width:100%;border:1px solid transparent;border-radius:7px;padding:8px;background:transparent;min-width:70px}
.cel:hover{border-color:#dce3de}.cel:focus{outline:none;border-color:#72a386;background:#fff}
.cel.num{text-align:right;width:84px;min-width:60px}
.tot{font-weight:800;text-align:right;padding-right:12px}
.grupo td{background:#f6faf7;font-weight:800;color:var(--verde-esc);padding:9px 12px;font-size:13.5px}
tfoot td{background:#eef3ef;font-weight:800;padding:11px 10px}
.quando{font-size:11.5px;color:var(--muito-suave);white-space:nowrap;line-height:1.3}
.xbtn{border:0;background:none;color:#b0473a;font-size:18px;padding:4px 8px;border-radius:6px}.xbtn:hover{background:#fbeeec}
/* lista (celular) */
.lista-cel{display:none}
.pasto{background:#fff;border:1px solid var(--borda);border-radius:14px;margin-bottom:12px;overflow:hidden}
.pasto-cab{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#f6faf7;border-bottom:1px solid var(--linha);font-weight:800;color:var(--verde-esc)}
.pasto-cab span{font-size:13px;color:var(--suave);font-weight:700}
.lin{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--linha);cursor:pointer}
.lin:last-child{border-bottom:0}
.lin .c{flex:1;min-width:0}.lin .c b{font-size:15px}.lin .c small{display:block;color:var(--suave);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lin .mf{font-size:12.5px;color:var(--suave);text-align:right;white-space:nowrap}
.lin .tt{font-size:18px;font-weight:800;min-width:42px;text-align:right}
.vazio{padding:34px 20px;text-align:center;color:var(--suave);line-height:1.5}
.fab{display:none;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--verde);color:#fff;border:0;border-radius:16px;padding:15px 20px;font-size:16px;font-weight:800;box-shadow:0 8px 24px #153e2c55;z-index:8}
/* janelas */
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.folha{background:#fff;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.folha.larga{width:min(860px,100%)}
.folha-cab{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--linha)}.folha-cab h2{margin:0;font-size:17px}
.folha-cab .x{margin-left:auto;border:0;background:#f1f4f2;width:34px;height:34px;border-radius:50%;font-size:18px}
.folha-corpo{padding:16px 18px;overflow:auto}
.folha-pe{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--linha);background:#fafbfa}.folha-pe .esq{margin-right:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:12.5px;color:var(--suave);font-weight:700}
.input{width:100%;border:1px solid #d7ded9;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;outline:none}
.input:focus{border-color:#72a386;box-shadow:0 0 0 3px #72a38622}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.passo{display:flex;align-items:center;border:1px solid #d7ded9;border-radius:10px;overflow:hidden}
.passo button{border:0;background:#f1f4f2;width:46px;height:46px;font-size:20px;font-weight:700;color:var(--verde-esc)}
.passo input{border:0;text-align:center;font-size:18px;font-weight:700;width:100%;min-width:0;outline:none;height:46px}
.menu{position:absolute;right:16px;top:54px;background:#fff;color:var(--texto);border:1px solid var(--borda);border-radius:12px;box-shadow:0 10px 30px #0003;padding:6px;z-index:20;min-width:200px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:8px;font-size:14.5px}.menu button:hover{background:#f3f6f4}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17211c;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:50;max-width:90vw;text-align:center}
.hist td{padding:9px 10px}
@media(max-width:860px){
  main{padding:12px 16px 110px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:10px 12px}.kpi .v{font-size:22px}
  .cats{flex-wrap:nowrap;overflow-x:auto;margin:10px -16px 0;padding:0 16px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
  .barra .desk,.card.tabela{display:none}
  .lista-cel{display:block}
  .fab{display:block}
  .modal{padding:0;align-items:flex-end}
  .folha,.folha.larga{width:100%;max-height:96vh;border-radius:18px 18px 0 0}
  .folha-pe{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
@media(min-width:861px){.topo .so-cel{display:none}}
@media print{.topo,.barra,.fab,.offline,.xbtn,.lista-cel{display:none!important}.card.tabela{display:block!important}.cel{border:0}}
</style>
</head>
<body>
<header class="topo"><div class="topo-in">
  <img src="../logo.webp" alt="Nelore MRA">
  <div><div class="t">Estoque Gado</div><div class="s" id="quem"></div></div>
  <div class="acoes">
    <button class="icobtn so-cel" onclick="abrirMenu(event)" aria-label="Mais opções">⋯</button>
    <button class="icobtn" onclick="location.href='../index.html'">← App</button>
  </div>
</div></header>
<main>
  <div id="offline" class="offline hidden">📵 Sem internet. Pode editar normal: fica guardado e envia sozinho quando a internet voltar.</div>
  <div class="kpis" id="kpis"></div>
  <div class="cats" id="cats"></div>
  <div class="barra">
    <h2>Rebanho por pasto</h2>
    <button class="btn btn-primary desk" onclick="novaLinha()">+ Linha</button>
    <button class="btn btn-ghost desk" onclick="exportar(linhas,'estoque_gado_atual')">⬇ Excel</button>
    <button class="btn btn-ghost desk" onclick="window.print()">🖨 Imprimir</button>
    <button class="btn btn-ghost desk" onclick="abrirHistorico()">📅 Meses fechados</button>
    <button class="btn btn-ouro desk" onclick="fecharMes()">Fechar mês</button>
  </div>
  <div class="card tabela" id="tabela"><div class="vazio">Carregando...</div></div>
  <div class="lista-cel" id="listaCel"></div>
</main>
<button class="fab" onclick="editarLinha()">+ Adicionar</button>
<datalist id="dlCategorias"></datalist><datalist id="dlLocais"></datalist>

<script>
/* ESTOQUE GADO — planilha geral do rebanho: uma linha por pasto + categoria (apps/estoque/linhas).
   Computador: edita direto na tabela. Celular: lista por pasto, toca na linha pra editar.
   "Fechar mês" guarda uma foto em apps/estoque/fechamentos/AAAA-MM. */
const FIREBASE_CONFIG={apiKey:'AIzaSyD9yib_iQYHcOG2B2C70cWXJ9SkTiIDt94',authDomain:'app-nelore-mra.firebaseapp.com',projectId:'app-nelore-mra',storageBucket:'app-nelore-mra.firebasestorage.app',messagingSenderId:'1043343802346',appId:'1:1043343802346:web:219f5d73748271a85dfc93'};
const ADMIN_EMAIL='mandrade.gado@terra.com.br', USER_DOMAIN='@app-nelore-mra.firebaseapp.com';
const CATEGORIAS=['Vacas','Novilhas','Bezerros','Bezerras','Garrotes','Touros','Bois','Matrizes','Receptoras','Doadoras'];
firebase.initializeApp(FIREBASE_CONFIG);
const fs=firebase.firestore();
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const base=fs.collection('apps').doc('estoque');
const colLinhas=base.collection('linhas'), colFech=base.collection('fechamentos');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=v=>{const n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
const fmt=n=>Number(n||0).toLocaleString('pt-BR');
let eu=null, meuNome='', linhas=[];

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function statusRede(){$('#offline').classList.toggle('hidden',navigator.onLine)}
addEventListener('online',statusRede);addEventListener('offline',statusRede);statusRede();

firebase.auth().onAuthStateChanged(async u=>{
  if(!u){location.href='../index.html';return}
  eu=u;const ehAdmin=String(u.email||'').toLowerCase()===ADMIN_EMAIL;
  let perfil=null;
  try{const d=await fs.collection('users').doc(u.uid).get();perfil=d.exists?d.data():null}catch(e){console.warn(e)}
  if(!ehAdmin&&(!perfil||perfil.ativo===false||!(perfil.apps&&perfil.apps.estoque))){alert('Você não tem acesso ao Estoque Gado. Fale com o administrador.');location.href='../index.html';return}
  meuNome=ehAdmin?'Administrador':((perfil&&(perfil.nome||perfil.usuario))||String(u.email).replace(USER_DOMAIN,''));
  $('#quem').textContent=meuNome;
  colLinhas.onSnapshot(snap=>{
    linhas=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(digitando()){resumo();redesenharDepois=true}else desenhar();
  },e=>{$('#tabela').innerHTML=$('#listaCel').innerHTML=`<div class="vazio">Não consegui carregar.<br><small>${esc(e.message)}</small></div>`});
});

// Enquanto alguém digita numa célula a tabela não se reorganiza (senão o cursor pula);
// reorganiza quando a pessoa sai da tabela.
let redesenharDepois=false, ultimaEdicao=0;
const digitando=()=>!!(document.activeElement&&document.activeElement.classList.contains('cel'))||Date.now()-ultimaEdicao<800;
document.addEventListener('focusout',e=>{if(e.relatedTarget&&e.relatedTarget.classList&&e.relatedTarget.classList.contains('cel'))return;setTimeout(function tenta(){if(!redesenharDepois)return;if(digitando()){setTimeout(tenta,400);return}redesenharDepois=false;desenhar()},150)});
const ordenadas=ls=>ls.slice().sort((a,b)=>String(a.local||'~').localeCompare(String(b.local||'~'),'pt-BR',{numeric:true})||String(a.categoria||'').localeCompare(String(b.categoria||''),'pt-BR')||String(a.criadoEm||'').localeCompare(String(b.criadoEm||'')));
function totais(ls){const t={m:0,f:0,cat:{},loc:{}};ls.forEach(l=>{const m=num(l.machos),f=num(l.femeas);t.m+=m;t.f+=f;const c=l.categoria||'(sem categoria)';t.cat[c]=(t.cat[c]||0)+m+f;const p=l.local||'(sem local)';t.loc[p]=(t.loc[p]||0)+m+f});return t}
function resumo(){
  const t=totais(linhas);
  const k=(l,v,c)=>`<div class="kpi" style="--k:${c}"><div class="l"><i></i>${l}</div><div class="v">${v}</div></div>`;
  $('#kpis').innerHTML=k('Total de cabeças',fmt(t.m+t.f),'#1f6a49')+k('Machos',fmt(t.m),'#2a78d6')+k('Fêmeas',fmt(t.f),'#d2559a')+k('Pastos',Object.keys(t.loc).filter(x=>x!=='(sem local)').length,'#b39a3b');
  $('#cats').innerHTML=Object.entries(t.cat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<span class="cat">${esc(c)}<b>${fmt(v)}</b></span>`).join('');
  $('#dlCategorias').innerHTML=[...new Set([...CATEGORIAS,...linhas.map(l=>l.categoria).filter(Boolean)])].map(c=>`<option value="${esc(c)}">`).join('');
  $('#dlLocais').innerHTML=[...new Set(linhas.map(l=>l.local).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
  document.querySelectorAll('tr[data-id]').forEach(tr=>{const l=linhas.find(x=>x.id===tr.dataset.id);if(l){const c=tr.querySelector('.tot');if(c)c.textContent=fmt(num(l.machos)+num(l.femeas))}});
  const ft=$('#ftM');if(ft){ft.textContent=fmt(t.m);$('#ftF').textContent=fmt(t.f);$('#ftT').textContent=fmt(t.m+t.f)}
}
function desenhar(){
  resumo();
  const vazio='<div class="vazio">Nenhuma linha ainda.<br>Adicione cada pasto com a categoria e a quantidade de machos e fêmeas.</div>';
  if(!linhas.length){$('#tabela').innerHTML=vazio;$('#listaCel').innerHTML=`<div class="card">${vazio}</div>`;return}
  const ls=ordenadas(linhas);const t=totais(ls);
  // computador: tabela editável
  let html='',loc=null;
  ls.forEach(l=>{
    const p=l.local||'(sem local)';
    if(p!==loc){loc=p;html+=`<tr class="grupo"><td colspan="4">📍 ${esc(p)}</td><td class="n">${fmt(t.loc[p])}</td><td colspan="3"></td></tr>`}
    const quando=l.atualizadoEmLocal?new Date(l.atualizadoEmLocal).toLocaleDateString('pt-BR'):'';
    html+=`<tr data-id="${l.id}">
      <td><input class="cel" list="dlLocais" value="${esc(l.local)}" placeholder="Pasto" onchange="editar('${l.id}','local',this.value)"></td>
      <td><input class="cel" style="min-width:120px" list="dlCategorias" value="${esc(l.categoria)}" placeholder="Categoria" onchange="editar('${l.id}','categoria',this.value)"></td>
      <td class="n"><input class="cel num" inputmode="numeric" value="${l.machos??''}" onchange="editar('${l.id}','machos',this.value)"></td>
      <td class="n"><input class="cel num" inputmode="numeric" value="${l.femeas??''}" onchange="editar('${l.id}','femeas',this.value)"></td>
      <td class="tot">${fmt(num(l.machos)+num(l.femeas))}</td>
      <td><input class="cel" style="min-width:160px" value="${esc(l.obs)}" placeholder="—" onchange="editar('${l.id}','obs',this.value)"></td>
      <td class="quando">${quando}<br>${esc(l.atualizadoPor||'')}</td>
      <td><button class="xbtn" title="Excluir linha" onclick="apagar('${l.id}')">×</button></td></tr>`;
  });
  $('#tabela').innerHTML=`<table><thead><tr><th>Local / pasto</th><th>Categoria</th><th class="n">Machos</th><th class="n">Fêmeas</th><th class="n">Total</th><th>Observação</th><th>Atualizado</th><th></th></tr></thead>
    <tbody>${html}</tbody><tfoot><tr><td colspan="2">TOTAL</td><td class="n" id="ftM">${fmt(t.m)}</td><td class="n" id="ftF">${fmt(t.f)}</td><td class="n" id="ftT">${fmt(t.m+t.f)}</td><td colspan="3"></td></tr></tfoot></table>`;
  // celular: lista por pasto
  const grupos={};ls.forEach(l=>{(grupos[l.local||'(sem local)']=grupos[l.local||'(sem local)']||[]).push(l)});
  $('#listaCel').innerHTML=Object.entries(grupos).map(([p,ls2])=>`<div class="pasto"><div class="pasto-cab">📍 ${esc(p)}<span>${fmt(t.loc[p])} cab.</span></div>
    ${ls2.map(l=>`<div class="lin" onclick="editarLinha('${l.id}')"><div class="c"><b>${esc(l.categoria||'Sem categoria')}</b>${l.obs?`<small>${esc(l.obs)}</small>`:''}</div>
      <div class="mf">♂ ${fmt(num(l.machos))}<br>♀ ${fmt(num(l.femeas))}</div><div class="tt">${fmt(num(l.machos)+num(l.femeas))}</div></div>`).join('')}</div>`).join('');
}
const carimbo=()=>({atualizadoEm:firebase.firestore.FieldValue.serverTimestamp(),atualizadoEmLocal:new Date().toISOString(),atualizadoPor:meuNome});
function novaLinha(){
  const ref=colLinhas.doc();
  ref.set({local:'',categoria:'',machos:'',femeas:'',obs:'',criadoEm:new Date().toISOString(),...carimbo()}).catch(e=>toast('Não salvou: '+e.message));
  // mostra a linha nova na hora e já põe o cursor nela
  if(!linhas.some(l=>l.id===ref.id))linhas.push({id:ref.id,local:'',categoria:'',machos:'',femeas:'',obs:''});
  redesenharDepois=false;ultimaEdicao=0;desenhar();
  const tr=document.querySelector(`tr[data-id="${ref.id}"]`);if(tr){tr.scrollIntoView({block:'nearest'});tr.querySelector('.cel').focus()}
}
function editar(id,campo,valor){
  ultimaEdicao=Date.now();
  valor=String(valor).trim();
  if((campo==='machos'||campo==='femeas')&&valor!==''&&!Number.isFinite(Number(valor.replace(',','.')))){toast('Digite só número.');desenhar();return}
  colLinhas.doc(id).update({[campo]:valor,...carimbo()}).catch(e=>toast('Não salvou: '+e.message));
  if(campo==='local'||campo==='categoria')redesenharDepois=true;
}
function apagar(id){if(!confirm('Excluir esta linha do estoque?'))return;colLinhas.doc(id).delete().catch(e=>toast('Não excluiu: '+e.message));fecharJanela()}

/* ---------- formulário do celular ---------- */
function fecharJanela(){const m=$('#janela');if(m)m.remove()}
function passo(id,d){const i=$('#'+id);i.value=Math.max(0,num(i.value)+d)}
function editarLinha(id){
  const l=id?linhas.find(x=>x.id===id):null;
  const m=document.createElement('div');m.className='modal';m.id='janela';m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="folha"><div class="folha-cab"><h2>${l?'Editar':'Adicionar ao estoque'}</h2><button class="x" onclick="fecharJanela()">×</button></div>
    <div class="folha-corpo">
      <div class="field"><label>Local / pasto</label><input id="eLocal" class="input" list="dlLocais" value="${esc(l?l.local:'')}" placeholder="Ex: Pasto Aroeira"></div>
      <div class="field"><label>Categoria</label><input id="eCat" class="input" list="dlCategorias" value="${esc(l?l.categoria:'')}" placeholder="Ex: Vacas"></div>
      <div class="duas">
        <div class="field"><label>Machos</label><div class="passo"><button type="button" onclick="passo('eM',-1)">−</button><input id="eM" inputmode="numeric" value="${l?num(l.machos):0}"><button type="button" onclick="passo('eM',1)">+</button></div></div>
        <div class="field"><label>Fêmeas</label><div class="passo"><button type="button" onclick="passo('eF',-1)">−</button><input id="eF" inputmode="numeric" value="${l?num(l.femeas):0}"><button type="button" onclick="passo('eF',1)">+</button></div></div>
      </div>
      <div class="field" style="margin-bottom:0"><label>Observação</label><input id="eObs" class="input" value="${esc(l?l.obs:'')}" placeholder="opcional"></div>
    </div>
    <div class="folha-pe">${l?`<button class="btn btn-danger esq" onclick="apagar('${l.id}')">Excluir</button>`:'<span class="esq"></span>'}<button class="btn btn-ghost" onclick="fecharJanela()">Cancelar</button><button class="btn btn-primary" onclick="salvarLinha(${l?`'${l.id}'`:''})">Salvar</button></div></div>`;
  document.body.appendChild(m);
}
function salvarLinha(id){
  const d={local:$('#eLocal').value.trim(),categoria:$('#eCat').value.trim(),machos:String(num($('#eM').value)),femeas:String(num($('#eF').value)),obs:$('#eObs').value.trim()};
  if(!d.local&&!d.categoria){toast('Informe pelo menos o pasto ou a categoria.');return}
  if(id)colLinhas.doc(id).update({...d,...carimbo()}).catch(e=>toast('Não salvou: '+e.message));
  else colLinhas.add({...d,criadoEm:new Date().toISOString(),...carimbo()}).catch(e=>toast('Não salvou: '+e.message));
  fecharJanela();toast(navigator.onLine?'Salvo.':'Guardado no aparelho. Envia quando a internet voltar.');
}
function abrirMenu(ev){
  ev.stopPropagation();const old=$('.menu');if(old){old.remove();return}
  const m=document.createElement('div');m.className='menu';
  m.innerHTML=`<button onclick="fecharMes()">📌 Fechar mês</button><button onclick="abrirHistorico()">📅 Meses fechados</button><button onclick="exportar(linhas,'estoque_gado_atual')">⬇ Excel</button><button onclick="window.print()">🖨 Imprimir</button>`;
  document.body.appendChild(m);setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}),0);
}

/* ---------- fechamento do mês ---------- */
async function fecharMes(){
  if(!linhas.length){toast('Não tem nada no estoque pra fechar.');return}
  const d=new Date();const sug=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const mes=prompt('Fechar o estoque de qual mês? (AAAA-MM)',sug);if(!mes)return;
  if(!/^\d{4}-\d{2}$/.test(mes)){toast('Use o formato AAAA-MM, ex: '+sug);return}
  const ref=colFech.doc(mes);
  try{const ex=await ref.get();if(ex.exists&&!confirm(`O mês ${mes} já foi fechado. Substituir pela foto de agora?`))return}catch(e){}
  const ls=ordenadas(linhas).map(({id,...r})=>({local:r.local||'',categoria:r.categoria||'',machos:num(r.machos),femeas:num(r.femeas),obs:r.obs||''}));
  const t=totais(ls);
  ref.set({mes,linhas:ls,machos:t.m,femeas:t.f,total:t.m+t.f,fechadoEm:firebase.firestore.FieldValue.serverTimestamp(),fechadoEmLocal:new Date().toISOString(),fechadoPor:meuNome}).catch(e=>toast('Não salvou: '+e.message));
  toast(`Estoque de ${mes} fechado: ${fmt(t.m+t.f)} cabeças.`);
}
async function abrirHistorico(){
  let docs=[];
  try{docs=(await colFech.get()).docs.map(d=>d.data()).sort((a,b)=>b.mes.localeCompare(a.mes))}catch(e){toast('Não consegui abrir: '+e.message);return}
  window.__fech=docs;
  const m=document.createElement('div');m.className='modal';m.id='janela';m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="folha larga"><div class="folha-cab"><h2>📅 Meses fechados</h2><button class="x" onclick="fecharJanela()">×</button></div>
    <div class="folha-corpo">${docs.length?`<table class="hist"><thead><tr><th>Mês</th><th class="n">Machos</th><th class="n">Fêmeas</th><th class="n">Total</th><th></th></tr></thead><tbody>
    ${docs.map((d,i)=>`<tr><td><b>${esc(d.mes)}</b><div class="quando">${esc(d.fechadoPor||'')} ${d.fechadoEmLocal?new Date(d.fechadoEmLocal).toLocaleDateString('pt-BR'):''}</div></td><td class="n">${fmt(d.machos)}</td><td class="n">${fmt(d.femeas)}</td><td class="n"><b>${fmt(d.total)}</b></td>
    <td style="text-align:right;white-space:nowrap"><button class="btn btn-ghost" style="padding:6px 10px;font-size:12.5px" onclick="verFech(${i})">Ver</button> <button class="btn btn-ghost" style="padding:6px 10px;font-size:12.5px" onclick="exportar(__fech[${i}].linhas,'estoque_gado_'+__fech[${i}].mes)">⬇</button></td></tr>`).join('')}</tbody></table>`:'<div class="vazio">Nenhum mês fechado ainda.</div>'}
    <div id="fechDet"></div></div></div>`;
  document.body.appendChild(m);
}
function verFech(i){
  const d=window.__fech[i];
  $('#fechDet').innerHTML=`<h3 style="margin:18px 0 8px">Estoque de ${esc(d.mes)}</h3><div style="overflow-x:auto"><table class="hist"><thead><tr><th>Local</th><th>Categoria</th><th class="n">M</th><th class="n">F</th><th class="n">Total</th></tr></thead><tbody>
    ${d.linhas.map(l=>`<tr><td>${esc(l.local)}</td><td>${esc(l.categoria)}</td><td class="n">${fmt(l.machos)}</td><td class="n">${fmt(l.femeas)}</td><td class="n"><b>${fmt(l.machos+l.femeas)}</b></td></tr>`).join('')}</tbody></table></div>`;
}
function exportar(ls,nome){
  if(typeof XLSX==='undefined'){toast('Sem internet pra gerar o Excel agora.');return}
  if(!ls||!ls.length){toast('Nada pra exportar.');return}
  const rows=ordenadas(ls).map(l=>({LOCAL:l.local||'',CATEGORIA:l.categoria||'',MACHOS:num(l.machos),FEMEAS:num(l.femeas),TOTAL:num(l.machos)+num(l.femeas),OBSERVACAO:l.obs||''}));
  const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:22},{wch:16},{wch:9},{wch:9},{wch:9},{wch:40}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Estoque');XLSX.writeFile(wb,nome+'.xlsx');
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
</body>
</html>
