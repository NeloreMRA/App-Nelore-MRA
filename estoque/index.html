<style>

<script>
/* ESTOQUE GADO — planilha livre, igual Excel (células, fórmulas, várias abas).
   Cada aba é um documento em apps/estoque/abas/{id}: {nome, ordem, celulas:{A1:'...'}, negrito:{A1:true}, larguras:{A:120}}.
   Fórmulas: =SOMA(C2:C10), =C2+D2, MÉDIA, MÁXIMO, MÍNIMO, CONT.NÚM, CONT.VALORES, SOMASE, CONT.SE, ARRED, ABS.
   "Fechar mês" guarda uma cópia de todas as abas em apps/estoque/fechamentos/AAAA-MM. */
const FIREBASE_CONFIG={apiKey:'AIzaSyD9yib_iQYHcOG2B2C70cWXJ9SkTiIDt94',authDomain:'app-nelore-mra.firebaseapp.com',projectId:'app-nelore-mra',storageBucket:'app-nelore-mra.firebasestorage.app',messagingSenderId:'1043343802346',appId:'1:1043343802346:web:219f5d73748271a85dfc93'};
const ADMIN_EMAIL='mandrade.gado@terra.com.br', USER_DOMAIN='@app-nelore-mra.firebaseapp.com';
firebase.initializeApp(FIREBASE_CONFIG);
const fs=firebase.firestore();
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const base=fs.collection('apps').doc('estoque');
const colAbas=base.collection('abas'), colFech=base.collection('fechamentos'), colLinhasAntigas=base.collection('linhas');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DEL=()=>firebase.firestore.FieldValue.delete();
const MAX_COL=52;
let eu=null, meuNome='', abas=[], abaId=null, cel={}, neg={}, larg={}, valor=()=>'';
let sel={r:1,c:0,r2:1,c2:0}, ed=null, desfazer=[], estender=false, nR=60, nC=14, arrastando=null, insRef=null, ultimoToque=0;

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
addEventListener('online',status);addEventListener('offline',status);

/* ================= referências de célula ================= */
const colNome=c=>{let s='';c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26)}return s};
const colIdx=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1};
const ref=(r,c)=>colNome(c)+r;
const parseRef=s=>{const m=/^(\$?)([A-Z]{1,2})(\$?)(\d+)$/.exec(String(s).toUpperCase());return m?{c:colIdx(m[2]),r:+m[4],fc:!!m[1],fr:!!m[3]}:null};
const montaRef=p=>(p.fc?'$':'')+colNome(p.c)+(p.fr?'$':'')+p.r;
function numDe(s){
  s=String(s).trim();
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))return Number(s.replace(/\./g,'').replace(',','.'));
  if(/^-?\d+([.,]\d+)?$/.test(s))return Number(s.replace(',','.'));
  return null;
}
const fmtNum=v=>v.toLocaleString('pt-BR',{maximumFractionDigits:2});
const semAcento=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\./g,'');

/* ================= fórmulas ================= */
function tokens(f){
  const t=[];let i=0,m;
  while(i<f.length){
    const ch=f[i],rest=f.slice(i);
    if(/\s/.test(ch)){i++;continue}
    if(ch==='"'){const j=f.indexOf('"',i+1);if(j<0)throw 0;t.push({k:'str',v:f.slice(i+1,j)});i=j+1;continue}
    if((m=/^[A-Za-zÀ-ú_][A-Za-zÀ-ú0-9_.]*(?=\s*\()/.exec(rest))){t.push({k:'fn',txt:m[0]});i+=m[0].length;continue}
    if((m=/^(\$?[A-Za-z]{1,2}\$?\d+)(?::(\$?[A-Za-z]{1,2}\$?\d+))?(?![A-Za-z0-9_])/.exec(rest))){t.push(m[2]?{k:'rng',a:m[1].toUpperCase(),b:m[2].toUpperCase()}:{k:'ref',a:m[1].toUpperCase()});i+=m[0].length;continue}
    if((m=/^\d+(?:[.,]\d+)?/.exec(rest))){t.push({k:'num',txt:m[0]});i+=m[0].length;continue}
    if('+-*/^();,'.includes(ch)){t.push({k:'op',v:ch});i++;continue}
    throw 0;
  }
  return t;
}
const emitir=(t,nomeFn=x=>x,op=x=>x,numTxt=x=>x)=>t.map(k=>k.k==='fn'?nomeFn(k.txt):k.k==='op'?op(k.v):k.k==='num'?numTxt(k.txt):k.k==='str'?`"${k.v}"`:k.k==='ref'?k.a:k.a+':'+k.b).join('');
const NOMES={SOMA:'SOMA',SUM:'SOMA',MEDIA:'MEDIA',AVERAGE:'MEDIA',MAXIMO:'MAXIMO',MAX:'MAXIMO',MINIMO:'MINIMO',MIN:'MINIMO',
  CONTNUM:'CONTNUM',CONT:'CONTNUM',CONTAR:'CONTNUM',COUNT:'CONTNUM',CONTVALORES:'CONTVALORES',COUNTA:'CONTVALORES',
  ARRED:'ARRED',ROUND:'ARRED',ABS:'ABS',SOMASE:'SOMASE',SUMIF:'SOMASE',CONTSE:'CONTSE',COUNTIF:'CONTSE'};
const EXCEL={SOMA:'SUM',MEDIA:'AVERAGE',MAXIMO:'MAX',MINIMO:'MIN',CONTNUM:'COUNT',CONTVALORES:'COUNTA',ARRED:'ROUND',ABS:'ABS',SOMASE:'SUMIF',CONTSE:'COUNTIF'};
function criterio(c){
  if(typeof c==='number')return x=>x===c;
  const m=/^(<=|>=|<>|<|>|=)?(.*)$/.exec(String(c));const op=m[1]||'=',alvo=m[2],n=numDe(alvo);
  return x=>{
    if(n!==null&&typeof x==='number')return op==='='?x===n:op==='<>'?x!==n:op==='<'?x<n:op==='>'?x>n:op==='<='?x<=n:x>=n;
    const a=String(x??'').toLowerCase(),b=alvo.toLowerCase();return op==='='?a===b:op==='<>'?a!==b:false;
  };
}
function avaliar(f,val){
  let t;try{t=tokens(f)}catch(e){return{err:'#ERRO'}}
  let p=0;
  const ERR=e=>{throw{e}};
  const come=v=>{if(t[p]&&t[p].k==='op'&&t[p].v===v){p++;return true}return false};
  const n=v=>{if(v&&v.rng)ERR('#VALOR!');if(v&&v.err)ERR(v.err);if(v===''||v==null)return 0;if(typeof v==='number')return v;const x=numDe(v);if(x===null)ERR('#VALOR!');return x};
  const faixaVals=(a,b)=>{const A=parseRef(a),B=parseRef(b);const r1=Math.min(A.r,B.r),r2=Math.max(A.r,B.r),c1=Math.min(A.c,B.c),c2=Math.max(A.c,B.c);
    if((r2-r1+1)*(c2-c1+1)>100000)ERR('#ERRO');const vs=[];for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)vs.push(val(r,c));return{rng:vs}};
  const nums=args=>{const o=[];args.forEach(a=>{if(a&&a.rng)a.rng.forEach(v=>{if(v&&v.err)ERR(v.err);if(typeof v==='number')o.push(v)});else o.push(n(a))});return o};
  const FN={
    SOMA:a=>nums(a).reduce((s,x)=>s+x,0),
    MEDIA:a=>{const v=nums(a);if(!v.length)ERR('#DIV/0!');return v.reduce((s,x)=>s+x,0)/v.length},
    MAXIMO:a=>{const v=nums(a);return v.length?Math.max(...v):0},
    MINIMO:a=>{const v=nums(a);return v.length?Math.min(...v):0},
    CONTNUM:a=>nums(a).length,
    CONTVALORES:a=>a.reduce((s,x)=>s+(x&&x.rng?x.rng.filter(v=>v!=='').length:(x!==''?1:0)),0),
    ARRED:a=>{const d=a.length>1?n(a[1]):0,k=10**d;return Math.round(n(a[0])*k)/k},
    ABS:a=>Math.abs(n(a[0])),
    SOMASE:a=>{if(!a[0]||!a[0].rng)ERR('#VALOR!');const ok=criterio(a[1]),s=a[2]&&a[2].rng?a[2].rng:a[0].rng;let tot=0;a[0].rng.forEach((v,i)=>{if(ok(v)&&typeof s[i]==='number')tot+=s[i]});return tot},
    CONTSE:a=>{if(!a[0]||!a[0].rng)ERR('#VALOR!');const ok=criterio(a[1]);return a[0].rng.filter(v=>ok(v)).length},
  };
  function prim(){
    const k=t[p++];if(!k)ERR('#ERRO');
    if(k.k==='num')return Number(k.txt.replace(',','.'));
    if(k.k==='str')return k.v;
    if(k.k==='ref'){const r=parseRef(k.a);if(!r)ERR('#REF!');const v=val(r.r,r.c);if(v&&v.err)ERR(v.err);return v}
    if(k.k==='rng'){if(!parseRef(k.a)||!parseRef(k.b))ERR('#REF!');return faixaVals(k.a,k.b)}
    if(k.k==='fn'){const nome=NOMES[semAcento(k.txt)];if(!come('('))ERR('#ERRO');const args=[];
      if(!come(')')){do{args.push(expr())}while(come(';')||come(','));if(!come(')'))ERR('#ERRO')}
      if(!nome)ERR('#NOME?');return FN[nome](args)}
    if(k.k==='op'&&k.v==='('){const v=expr();if(!come(')'))ERR('#ERRO');return v}
    ERR('#ERRO');
  }
  function un(){if(come('-'))return -n(un());if(come('+'))return n(un());return prim()}
  function pot(){let a=un();while(come('^'))a=n(a)**n(un());return a}
  function termo(){let a=pot();for(;;){if(come('*'))a=n(a)*n(pot());else if(come('/')){const d=n(pot());if(d===0)ERR('#DIV/0!');a=n(a)/d}else return a}}
  function expr(){let a=termo();for(;;){if(come('+'))a=n(a)+n(termo());else if(come('-'))a=n(a)-n(termo());else return a}}
  try{
    const v=expr();if(p<t.length)ERR('#ERRO');if(v&&v.rng)ERR('#VALOR!');
    if(typeof v==='number'&&!Number.isFinite(v))ERR('#NÚM!');
    return v===''?0:v;
  }catch(e){if(e&&e.e)return{err:e.e};return{err:'#ERRO'}}
}
function criarCalc(cm){
  const cache=new Map(),andando=new Set();
  function v(r,c){
    const k=ref(r,c),raw=cm[k];
    if(raw==null||raw==='')return '';
    const s=String(raw);
    if(s[0]==="'")return s.slice(1);
    if(s[0]!=='='||s.length===1){const x=numDe(s);return x===null?s:x}
    if(cache.has(k))return cache.get(k);
    if(andando.has(k))return{err:'#CICLO!'};
    andando.add(k);let res;try{res=avaliar(s.slice(1),v)}finally{andando.delete(k)}
    cache.set(k,res);return res;
  }
  return v;
}
// muda as referências de uma fórmula quando copia/cola ou arrasta (C2 → C3...)
function moverFormula(f,dr,dc){
  let t;try{t=tokens(f)}catch(e){return f}
  const m=a=>{const p=parseRef(a);if(!p)return a;if(!p.fr)p.r+=dr;if(!p.fc)p.c+=dc;return p.r<1||p.c<0?'#REF!':montaRef(p)};

function ajustarFormula(f,tipo,idx,delta){

    else{if(v>idx)v--;else if(v===idx){if(papel==='so')return '#REF!';if(papel==='fim')v--}}

  for(const k in mud){const v=mud[k]==null?'':String(mud[k]);antes[k]=cel[k]??'';if(v==='')delete cel[k];else cel[k]=v;up['celulas.'+k]=v===''?DEL():v}
  if(!semDesfazer)desfazer.push({aba:abaId,cel:antes});

  desenhar();
}
function gravarTudo(semDesfazer){
  if(!semDesfazer){const a=abas.find(x=>x.id===abaId)||{};desfazer.push({aba:abaId,tudo:{celulas:{...(a.celulas||{})},negrito:{...(a.negrito||{})},larguras:{...(a.larguras||{})}}})}

  if(u.aba!==abaId){toast('Volte na aba onde fez a mudança pra desfazer.');desfazer.push(u);return}

}

function porRef(el,r1,c1,r2,c2){

function mover(dr,dc,ext){

  const r=Math.max(1,r0+dr),c=Math.min(MAX_COL-1,Math.max(0,c0+dc));

  if(ctrl&&(l==='b'||l==='n')){e.preventDefault();negrito();return}
  if(ctrl&&l==='a'){e.preventDefault();const u=usado();sel={r:1,c:0,r2:Math.max(1,u.mr),c2:Math.max(0,u.mc)};pintarSel();return}
  if(ctrl||e.altKey)return;
  const ar={ArrowDown:[1,0],ArrowUp:[-1,0],ArrowRight:[0,1],ArrowLeft:[0,-1]}[k];
  if(ar){e.preventDefault();mover(ar[0],ar[1],e.shiftKey);return}
  if(k==='Enter'){e.preventDefault();mover(e.shiftKey?-1:1,0);return}
  if(k==='Tab'){e.preventDefault();mover(0,e.shiftKey?-1:1);return}
  if(k==='F2'){e.preventDefault();editar('editar');return}

const fx=$('#fx');
fx.addEventListener('focus',()=>{if(!ed)editar('editar',null,true)});
fx.addEventListener('input',()=>{if(!ed)editar('editar',null,true);$('#ed').value=fx.value;insRef=null;crescer()});
fx.addEventListener('keydown',teclaEditor);
fx.addEventListener('blur',()=>setTimeout(()=>{const a=document.activeElement;if(ed&&a!==$('#ed')&&a!==fx)confirmar()},0));

function limpar(){const F=faixa(),m={};for(let r=F.r1;r<=F.r2;r++)for(let c=F.c1;c<=F.c2;c++){const k=ref(r,c);if(cel[k]!=null)m[k]=''}if(Object.keys(m).length)gravar(m)}
function preencher(){// Ctrl+D: copia a 1ª linha da seleção pra baixo
  const F=faixa();if(F.r1===F.r2){toast('Selecione as células de baixo junto com a de cima.');return}
  const m={};for(let c=F.c1;c<=F.c2;c++){const raw=cel[ref(F.r1,c)]??'';for(let r=F.r1+1;r<=F.r2;r++)m[ref(r,c)]=raw[0]==='='?'='+moverFormula(raw.slice(1),r-F.r1,0):raw}
  gravar(m);
}
function negrito(){
  confirmar();const F=faixa(),liga=!neg[ref(sel.r,sel.c)],up={};
  for(let r=F.r1;r<=F.r2;r++)for(let c=F.c1;c<=F.c2;c++){const k=ref(r,c);if(liga)neg[k]=true;else delete neg[k];up['negrito.'+k]=liga?true:DEL()}
  abaRef().update(up).catch(e=>toast('Não salvou: '+e.message));desenhar();
}
function autoSoma(){
  confirmar();const F=faixa();const fz=(c,a,b)=>`=SOMA(${colNome(c)}${a}:${colNome(c)}${b})`;
  if(F.r1!==F.r2||F.c1!==F.c2){
    const m={};
    if(F.r1===F.r2){m[ref(F.r1,F.c2+1)]=`=SOMA(${ref(F.r1,F.c1)}:${ref(F.r1,F.c2)})`;sel={r:F.r1,c:F.c2+1,r2:F.r1,c2:F.c2+1}}
    else{for(let c=F.c1;c<=F.c2;c++)m[ref(F.r2+1,c)]=fz(c,F.r1,F.r2);sel={r:F.r2+1,c:F.c1,r2:F.r2+1,c2:F.c2}}
    gravar(m);verCelula(sel.r,sel.c);return;
  }
  let r=sel.r-1;while(r>=1&&typeof valor(r,sel.c)==='number')r--;
  if(r<sel.r-1){editar('digitar',fz(sel.c,r+1,sel.r-1));return}
  let c=sel.c-1;while(c>=0&&typeof valor(sel.r,c)==='number')c--;
  if(c<sel.c-1){editar('digitar',`=SOMA(${ref(sel.r,c+1)}:${ref(sel.r,sel.c-1)})`);return}
  editar('digitar','=SOMA(');
}

/* ================= copiar / colar ================= */
let clip=null;
const naPlanilha=()=>!ed&&document.activeElement===$('#wrap');
document.addEventListener('copy',e=>{if(!naPlanilha())return;e.preventDefault();copiar(e)});
document.addEventListener('cut',e=>{if(!naPlanilha())return;e.preventDefault();copiar(e);limpar()});
document.addEventListener('paste',e=>{if(!naPlanilha())return;e.preventDefault();colar(e.clipboardData.getData('text/plain'))});
function copiar(e){
  const F=faixa(),linhas=[],raws=[];
  for(let r=F.r1;r<=F.r2;r++){const a=[],b=[];for(let c=F.c1;c<=F.c2;c++){const v=valor(r,c);a.push(v&&v.err?v.err:typeof v==='number'?String(v).replace('.',','):v);b.push(cel[ref(r,c)]??'')}linhas.push(a.join('\t'));raws.push(b)}
  const txt=linhas.join('\n');clip={txt,raws,r:F.r1,c:F.c1};e.clipboardData.setData('text/plain',txt);
  toast('Copiado.');
}
function colar(txt){
  if(txt==null)return;const m={};
  if(clip&&txt.replace(/\r/g,'').replace(/\n$/,'')===clip.txt){
    clip.raws.forEach((row,i)=>row.forEach((raw,j)=>{const c=sel.c+j;if(c>=MAX_COL)return;
      m[ref(sel.r+i,c)]=raw[0]==='='?'='+moverFormula(raw.slice(1),sel.r-clip.r,sel.c-clip.c):raw}));
  }else{
    txt.replace(/\r/g,'').replace(/\n$/,'').split('\n').forEach((l,i)=>l.split('\t').forEach((v,j)=>{const c=sel.c+j;if(c<MAX_COL)m[ref(sel.r+i,c)]=v}));
  }
  gravar(m);
}

/* ================= linhas e colunas ================= */
function deslocar(tipo,idx,delta){
  const nc={},nn={};
  const mv=(k,v,dest,ehCel)=>{const p=parseRef(k);if(!p)return;let {r,c}=p;
    if(tipo==='r'){if(delta<0&&r===idx)return;if(delta>0?r>=idx:r>idx)r+=delta}
    else{if(delta<0&&c===idx)return;if(delta>0?c>=idx:c>idx)c+=delta;if(c>=MAX_COL)return}
    if(ehCel&&typeof v==='string'&&v[0]==='='&&v.length>1)v='='+ajustarFormula(v.slice(1),tipo,idx,delta);
    dest[ref(r,c)]=v};
  for(const k in cel)mv(k,cel[k],nc,true);
  for(const k in neg)mv(k,neg[k],nn,false);
  cel=nc;neg=nn;
  if(tipo==='c'){const nl={};for(const k in larg){let c=colIdx(k);if(delta<0&&c===idx)continue;if(delta>0?c>=idx:c>idx)c+=delta;nl[colNome(c)]=larg[k]}larg=nl}
}
function linhaCol(acao){
  confirmar();const F=faixa();
  if(acao==='ins-acima')deslocar('r',F.r1,1);
  else if(acao==='ins-abaixo')deslocar('r',F.r2+1,1);
  else if(acao==='exc-linha'){if(!confirm(F.r1===F.r2?`Excluir a linha ${F.r1}?`:`Excluir as linhas ${F.r1} a ${F.r2}?`))return;for(let r=F.r2;r>=F.r1;r--)deslocar('r',r,-1)}
  else if(acao==='ins-esq')deslocar('c',F.c1,1);
  else if(acao==='ins-dir')deslocar('c',F.c2+1,1);
  else if(acao==='exc-col'){if(!confirm(F.c1===F.c2?`Excluir a coluna ${colNome(F.c1)}?`:`Excluir as colunas ${colNome(F.c1)} a ${colNome(F.c2)}?`))return;for(let c=F.c2;c>=F.c1;c--)deslocar('c',c,-1)}
  gravarTudo();
}

/* ================= menus ================= */
function menu(e,itens){
  fecharMenus();if(e.stopPropagation)e.stopPropagation();
  const m=document.createElement('div');m.className='menu';
  m.innerHTML=itens.map((it,i)=>it==='-'?'<hr>':`<button data-i="${i}">${it[0]}</button>`).join('');
  document.body.appendChild(m);
  let x=e.clientX,y=e.clientY;
  if(e.type==='click'){const b=(e.currentTarget&&e.currentTarget.getBoundingClientRect?e.currentTarget:e.target).getBoundingClientRect();x=b.left;y=b.bottom+4}
  m.style.left=Math.max(8,Math.min(x,innerWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-m.offsetHeight-8))+'px';
  m.onmousedown=ev=>ev.preventDefault();
  m.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;fecharMenus();itens[b.dataset.i][1]()};
  const fora=ev=>{if(!m.contains(ev.target)){m.remove();document.removeEventListener('pointerdown',fora)}};
  setTimeout(()=>document.addEventListener('pointerdown',fora),0);
}
const fecharMenus=()=>document.querySelectorAll('.menu').forEach(m=>m.remove());
function menuLinhas(e){menu(e,[['⬆ Inserir linha acima',()=>linhaCol('ins-acima')],['⬇ Inserir linha abaixo',()=>linhaCol('ins-abaixo')],['✕ Excluir linha',()=>linhaCol('exc-linha')],'-',
  ['⬅ Inserir coluna à esquerda',()=>linhaCol('ins-esq')],['➡ Inserir coluna à direita',()=>linhaCol('ins-dir')],['✕ Excluir coluna',()=>linhaCol('exc-col')],'-',['🧹 Limpar células',limpar]])}
function menuAba(e){menu(e,[['✏️ Renomear aba',renomearAba],['➕ Nova aba',()=>novaAba()],['🗑 Excluir aba',excluirAba]])}
function menuArquivo(e){menu(e,[['📌 Fechar mês',fecharMes],['📅 Meses fechados',abrirHistorico],'-',['⬇ Baixar Excel',exportarAtual],['⬆ Abrir Excel',()=>$('#arqImp').click()],['🖨 Imprimir',()=>window.print()],'-',
  ['✏️ Renomear aba',renomearAba],['➕ Nova aba',()=>novaAba()],['🗑 Excluir aba',excluirAba]])}

/* ================= abas ================= */
function novaAba(){
  confirmar();
  const nome=prompt('Nome da nova aba:',`Planilha ${abas.length+1}`);if(!nome||!nome.trim())return;
  const r=colAbas.doc();
  abaId=r.id;try{localStorage.setItem('estoque_aba',r.id)}catch(e){}
  sel={r:1,c:0,r2:1,c2:0};
  r.set({nome:nome.trim().slice(0,40),ordem:Math.max(0,...abas.map(a=>a.ordem||0))+1,celulas:{},negrito:{},larguras:{},criadoEm:new Date().toISOString(),...carimbo()}).catch(e=>toast('Não salvou: '+e.message));
}
function renomearAba(){const a=abas.find(x=>x.id===abaId);if(!a)return;const n=prompt('Novo nome da aba:',a.nome||'');if(!n||!n.trim())return;abaRef().update({nome:n.trim().slice(0,40)}).catch(e=>toast('Não salvou: '+e.message))}
function excluirAba(){
  const a=abas.find(x=>x.id===abaId);if(!a)return;
  if(abas.length<2){toast('Precisa ter pelo menos uma aba.');return}
  if(!confirm(`Excluir a aba "${a.nome}" com tudo que tem nela?`))return;
  abaId=abas.find(x=>x.id!==a.id).id;
  colAbas.doc(a.id).delete().catch(e=>toast('Não excluiu: '+e.message));
}

/* ================= fechamento do mês ================= */
async function fecharMes(){
  confirmar();
  const d=new Date();const sug=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const mes=prompt('Fechar o estoque de qual mês? (AAAA-MM)',sug);if(!mes)return;
  if(!/^\d{4}-\d{2}$/.test(mes)){toast('Use o formato AAAA-MM, ex: '+sug);return}
  const ref0=colFech.doc(mes);
  try{const ex=await ref0.get();if(ex.exists&&!confirm(`O mês ${mes} já foi fechado. Substituir pela cópia de agora?`))return}catch(e){}
  ref0.set({mes,abas:abas.map(a=>({nome:a.nome||'',celulas:a.celulas||{},negrito:a.negrito||{},larguras:a.larguras||{}})),fechadoEm:firebase.firestore.FieldValue.serverTimestamp(),fechadoEmLocal:new Date().toISOString(),fechadoPor:meuNome}).catch(e=>toast('Não salvou: '+e.message));
  toast(`Estoque de ${mes} guardado.`);
}
// meses fechados no formato antigo (lista de linhas) viram planilha também
const abasDoFech=d=>d.abas||(d.linhas?[{nome:'Estoque',...linhasParaCelulas(d.linhas)}]:[]);
function fecharJanela(){const m=$('#janela');if(m)m.remove()}
async function abrirHistorico(){
  confirmar();let docs=[];
  try{docs=(await colFech.get()).docs.map(d=>d.data()).sort((a,b)=>b.mes.localeCompare(a.mes))}catch(e){toast('Não consegui abrir: '+e.message);return}
  window.__fech=docs;
  const m=document.createElement('div');m.className='modal';m.id='janela';m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="folha"><div class="folha-cab"><h2>📅 Meses fechados</h2><button class="x" onclick="fecharJanela()">×</button></div>
    <div class="folha-corpo">${docs.length?`<table class="hist"><thead><tr><th>Mês</th><th>Fechado por</th><th></th></tr></thead><tbody>
    ${docs.map((d,i)=>`<tr><td><b>${esc(d.mes)}</b></td><td class="quando">${esc(d.fechadoPor||'')} ${d.fechadoEmLocal?new Date(d.fechadoEmLocal).toLocaleDateString('pt-BR'):''}</td>
    <td style="text-align:right"><button class="btn" onclick="verFech(${i})">Ver</button> <button class="btn" onclick="exportar(abasDoFech(__fech[${i}]),'estoque_gado_'+__fech[${i}].mes)">⬇ Excel</button></td></tr>`).join('')}</tbody></table>`:'<div class="carregando">Nenhum mês fechado ainda.</div>'}
    <div id="fechDet"></div></div></div>`;
  document.body.appendChild(m);
}
function tabelaLeitura(a){
  const cm=a.celulas||{},v=criarCalc(cm);let mr=0,mc=-1;
  for(const k in cm){const p=parseRef(k);if(p&&cm[k]!==''){mr=Math.max(mr,p.r);mc=Math.max(mc,p.c)}}
  if(!mr)return '<div class="quando">Aba vazia.</div>';
  let h='<div style="overflow-x:auto"><table class="hist"><tbody>';
  for(let r=1;r<=mr;r++){h+='<tr>';for(let c=0;c<=mc;c++){const x=v(r,c),b=(a.negrito||{})[ref(r,c)];
    const t=x&&x.err?x.err:typeof x==='number'?fmtNum(x):esc(x);h+=`<td class="${typeof x==='number'?'n':''}"${b?' style="font-weight:800"':''}>${t}</td>`}h+='</tr>'}
  return h+'</tbody></table></div>';
}
function verFech(i){const d=window.__fech[i];$('#fechDet').innerHTML=abasDoFech(d).map(a=>`<h3 style="margin:18px 0 8px">${esc(d.mes)} · ${esc(a.nome)}</h3>${tabelaLeitura(a)}`).join('')}

/* ================= Excel ================= */
function exportarAtual(){confirmar();exportar(abas,'estoque_gado')}
function exportar(lista,nome){
  if(typeof XLSX==='undefined'){toast('Sem internet pra gerar o Excel agora.');return}
  if(!lista||!lista.length){toast('Nada pra exportar.');return}
  const wb=XLSX.utils.book_new(),usados=new Set();
  lista.forEach(a=>{
    const cm=a.celulas||{},v=criarCalc(cm),ws={};let mr=0,mc=0;
    for(const k in cm){const p=parseRef(k);if(!p||cm[k]==='')continue;const x=v(p.r,p.c),raw=String(cm[k]);
      const c=x&&x.err?{t:'s',v:x.err}:typeof x==='number'?{t:'n',v:x}:{t:'s',v:String(x)};
      if(raw[0]==='='&&raw.length>1){const f=paraExcel(raw.slice(1));if(f)c.f=f}
      ws[ref(p.r,p.c)]=c;mr=Math.max(mr,p.r);mc=Math.max(mc,p.c)}
    ws['!ref']=mr?`A1:${ref(mr,mc)}`:'A1';
    ws['!cols']=Array.from({length:mc+1},(_,c)=>({wpx:(a.larguras||{})[colNome(c)]||(c===0?140:100)}));
    let n=String(a.nome||'Planilha').replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||'Planilha',b=n,i=2;while(usados.has(n))n=b.slice(0,28)+' '+i++;usados.add(n);
    XLSX.utils.book_append_sheet(wb,ws,n);
  });
  XLSX.writeFile(wb,nome+'.xlsx');
}
async function importar(arq){
  if(!arq)return;if(typeof XLSX==='undefined'){toast('Sem internet pra abrir o Excel agora.');return}
  let wb;try{wb=XLSX.read(await arq.arrayBuffer(),{type:'array',cellFormula:true})}catch(e){toast('Não consegui ler esse arquivo.');return}
  let n=0;
  for(const nomeAba of wb.SheetNames){
    const ws=wb.Sheets[nomeAba],c={};let qt=0;
    for(const k in ws){if(k[0]==='!')continue;const x=ws[k];const p=parseRef(k);if(!p||p.c>=MAX_COL)continue;let raw;
      if(x.f)raw='='+x.f;else if(x.t==='n'&&!(x.z&&/[dmy]/i.test(String(x.z))))raw=String(x.v).replace('.',',');else raw=x.w!=null?String(x.w):String(x.v??'');
      if(raw!==''){c[ref(p.r,p.c)]=raw;qt++}}
    if(qt>15000){toast(`A aba "${nomeAba}" é grande demais (máx. 15 mil células).`);continue}
    let nome=nomeAba,i=2;while(abas.some(a=>a.nome===nome))nome=`${nomeAba} (${i++})`;
    const r=colAbas.doc();
    if(!n){abaId=r.id;sel={r:1,c:0,r2:1,c2:0}}
    r.set({nome:nome.slice(0,40),ordem:Math.max(0,...abas.map(a=>a.ordem||0))+1+n,celulas:c,negrito:{},larguras:{},criadoEm:new Date().toISOString(),...carimbo()}).catch(e=>toast('Não salvou: '+e.message));
    n++;
  }
  if(n)toast(n===1?'Planilha aberta numa aba nova.':`${n} abas novas criadas.`);
}
