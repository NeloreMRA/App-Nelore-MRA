function atualizarFiltrosAposRenomear(nomeAnterior, nomeNovo){
  if(state.filtroBusca.grupo === nomeAnterior) state.filtroBusca.grupo = nomeNovo;
}

function textoParaBusca(valor){
  return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR');
}

function renderCadastro(){
  renderTopbar('Cadastro de grupos', false);
  const c = document.getElementById('content');
  c.innerHTML = '';

  // centros conhecidos: os dos lançamentos + os que já estão nos grupos (vindos do HTML, mesmo sem lançamentos)
  const centrosCadastro = Array.from(new Set(state.centrosDisponiveis.concat(...state.cadastro.map(g => g.centros)))).sort();
  if(centrosCadastro.length === 0 && state.cadastro.length === 0){
    c.insertAdjacentHTML('beforeend', '<p class="hint">Suba um arquivo primeiro na aba "Upload de arquivo" para descobrir os centros de custo disponíveis.</p>');
    return;
  }
  if(state.centrosDisponiveis.length === 0){
    c.insertAdjacentHTML('beforeend', '<p class="hint">Ainda não há lançamentos. Suba o MOV BANCO na aba "Upload de arquivo" para ver os valores e todos os centros.</p>');
  }

  const apelidosCard = document.createElement('details');
  apelidosCard.className = 'apelidos-card';
  const apelidosResumo = document.createElement('summary');
  apelidosResumo.textContent = `Nomes dos Centros de Custo (${centrosCadastro.length})`;
  apelidosResumo.title = 'Clique para abrir ou recolher a lista de apelidos';
  apelidosCard.appendChild(apelidosResumo);
  const apelidosConteudo = document.createElement('div');
  apelidosConteudo.className = 'apelidos-conteudo';
  const apelidosHint = document.createElement('div');
  apelidosHint.className = 'hint';
  apelidosHint.style.margin = '0 0 10px';
  apelidosHint.textContent = 'Dê um apelido pra cada código — ele passa a aparecer em toda a aplicação.';
  apelidosConteudo.appendChild(apelidosHint);
  const grid = document.createElement('div');
  grid.className = 'apelidos-grid';
  centrosCadastro.forEach(centro => {
    if(centro === 'NAO_IDENTIFICADO') return;
    const linha = document.createElement('div');
    linha.className = 'apelido-linha';
    const cod = document.createElement('span'); cod.className = 'codigo'; cod.textContent = centro;
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'apelido';
    input.value = state.apelidos[centro] || '';
    input.oninput = () => { state.apelidos[centro] = input.value; };
    input.onblur = () => { salvarDados(); render(); };
    linha.appendChild(cod); linha.appendChild(input);
    grid.appendChild(linha);
  });
  apelidosConteudo.appendChild(grid);
  apelidosCard.appendChild(apelidosConteudo);
  c.appendChild(apelidosCard);

  const hint = document.createElement('p');
  hint.className = 'hint';
  hint.textContent = 'Crie os grupos e abra “Editar centros” somente no grupo que quiser organizar. Use a busca para encontrar rapidamente um centro de custo.';
  c.appendChild(hint);

  const addBtn = document.createElement('button');
  addBtn.className = 'btn primary adicionar-grupo';
  addBtn.textContent = '+ Adicionar grupo';
  addBtn.onclick = async () => {
    let numero = state.cadastro.length + 1;
    let nome = `Novo grupo ${numero}`;
    while(state.cadastro.some(g => textoParaBusca(g.nome) === textoParaBusca(nome))){
      numero++;
      nome = `Novo grupo ${numero}`;
    }
    state.cadastro.push({id: nextGrupoId++, nome, centros: []});
    await salvarDados();
    render();
  };
  c.appendChild(addBtn);

  const gruposLista = document.createElement('div');
  gruposLista.className = 'grupos-lista';

  state.cadastro.forEach(grupo => {
    const card = document.createElement('div');
    card.className = 'grupo-card';

    const topo = document.createElement('div');
    topo.className = 'linha-topo';
    const input = document.createElement('input');
    input.className = 'nome-grupo';
    input.value = grupo.nome;
    input.placeholder = 'Nome do grupo (ex: Fazenda Itaguaçu)';
    const erroNome = document.createElement('div');
    erroNome.className = 'campo-erro';
    input.onkeydown = (e) => { if(e.key === 'Enter') input.blur(); };
    input.onblur = async () => {
      const nomeAnterior = grupo.nome;
      const nomeNovo = input.value.trim();
      const duplicado = state.cadastro.some(g => g.id !== grupo.id && textoParaBusca(g.nome) === textoParaBusca(nomeNovo));
      if(!nomeNovo || duplicado){
        erroNome.textContent = !nomeNovo ? 'O grupo precisa ter um nome.' : 'Já existe outro grupo com esse nome.';
        erroNome.classList.add('visivel');
        input.value = nomeAnterior;
        return;
      }
      erroNome.classList.remove('visivel');
      if(nomeNovo === nomeAnterior) return;
      grupo.nome = nomeNovo;
      atualizarFiltrosAposRenomear(nomeAnterior, nomeNovo);
      await salvarDados();
      render();
    };
    const remover = document.createElement('button');
    remover.className = 'remover-grupo';
    remover.textContent = 'Remover grupo';
    remover.onclick = async () => {
      if(!confirm(`Remover o grupo “${grupo.nome}”? Os arquivos enviados não serão apagados.`)) return;
      remover.disabled = true;
      state.cadastro = state.cadastro.filter(g => g.id !== grupo.id);
      if(state.filtroBusca.grupo === grupo.nome) state.filtroBusca.grupo = 'TODOS';
      const salvou = await salvarDados();
      if(!salvou) alert('O grupo saiu da tela, mas não foi possível salvar a exclusão no navegador.');
      render();
    };
    topo.appendChild(input);
    topo.appendChild(remover);
    card.appendChild(topo);
    card.appendChild(erroNome);

    const resumo = document.createElement('div');
    resumo.className = 'grupo-resumo';
    const contagem = document.createElement('span');
    contagem.className = 'grupo-contagem';
    const editar = document.createElement('button');
    editar.className = 'btn editar-centros';
    editar.type = 'button';
    editar.textContent = 'Editar centros';
    editar.setAttribute('aria-expanded', 'false');
    resumo.appendChild(contagem);
    resumo.appendChild(editar);
    card.appendChild(resumo);

    const editor = document.createElement('div');
    editor.className = 'centros-editor';
    const busca = document.createElement('input');
    busca.type = 'search';
    busca.className = 'centros-busca';
    busca.placeholder = 'Buscar por código ou nome…';
    busca.setAttribute('aria-label', `Buscar centros para ${grupo.nome}`);
    const centrosLista = document.createElement('div');
    centrosLista.className = 'centros-lista';
    editor.appendChild(busca);
    editor.appendChild(centrosLista);
    card.appendChild(editor);

    function atualizarContagem(){
      const total = grupo.centros.length;
      contagem.textContent = total === 0 ? 'Nenhum centro selecionado' : `${total} centro${total === 1 ? '' : 's'} selecionado${total === 1 ? '' : 's'}`;
    }

    function renderOpcoes(){
      centrosLista.innerHTML = '';
      const termo = textoParaBusca(busca.value);
      const opcoes = centrosCadastro.filter(centro => textoParaBusca(nomeCentro(centro)).includes(termo));
      if(opcoes.length === 0){
        const vazio = document.createElement('div');
        vazio.className = 'centros-vazio';
        vazio.textContent = 'Nenhum centro encontrado.';
        centrosLista.appendChild(vazio);
        return;
      }
      opcoes.forEach(centro => {
        const linha = document.createElement('label');
        linha.className = 'centro-opcao' + (grupo.centros.includes(centro) ? ' selecionado' : '');
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = grupo.centros.includes(centro);
        const nome = document.createElement('span');
        nome.textContent = nomeCentro(centro);
        check.onchange = () => {
          if(check.checked && !grupo.centros.includes(centro)) grupo.centros.push(centro);
          if(!check.checked) grupo.centros = grupo.centros.filter(x => x !== centro);
          linha.classList.toggle('selecionado', check.checked);
          salvarDados();
          atualizarContagem();
        };
        linha.appendChild(check);
        linha.appendChild(nome);
        centrosLista.appendChild(linha);
      });
    }

    editar.onclick = () => {
      const aberto = editor.classList.toggle('aberto');
      editar.setAttribute('aria-expanded', String(aberto));
      editar.textContent = aberto ? 'Fechar editor' : 'Editar centros';
      if(aberto){
        renderOpcoes();
        busca.focus();
      }
    };
    busca.oninput = renderOpcoes;
    atualizarContagem();

    gruposLista.appendChild(card);
  });

  c.appendChild(gruposLista);
}

/* =========================================================================
   GRADE ESTILO EXCEL (usada pela aba Movimentações / DRE)
   Letras de coluna, número de linha, seleção com arrastar / Shift / Ctrl,
   Soma · Média · Contagem na barra de status, redimensionar colunas e linhas,
   ocultar/reexibir colunas, autoajuste (duplo clique na borda) e Ctrl+C.
   ========================================================================= */
const gradeEstado = {};   // por id de grade: rolagem e célula ativa, pra sobreviver aos redesenhos

function letraColuna(i){
  let s = '';
  i++;
  while(i > 0){
    const m = (i - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}

function carregarLayoutGrade(id){
  const padrao = {larguras:{}, alturas:{}, ocultas:[]};
  try{
    const raw = localStorage.getItem('app_nelore_mra_contabil_grade_' + id);
    if(raw) return Object.assign(padrao, JSON.parse(raw));
  }catch(e){}
  return padrao;
}

function salvarLayoutGrade(id, layout){
  try{ localStorage.setItem('app_nelore_mra_contabil_grade_' + id, JSON.stringify(layout)); }catch(e){}
}

function fmtPct(v){
  return (v * 100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
}

function textoCelula(valor, tipo){
  if(valor === null || valor === undefined || valor === '') return '';
  if(typeof valor === 'number' && tipo === 'moeda') return fmtBRL(valor);
  if(typeof valor === 'number' && tipo === 'pct') return fmtPct(valor);
  return String(valor);
}

// Quadrinho com o conteúdo completo de uma célula (lançamento ou texto cortado), aberto com um clique.
let popGrade = null;   // {el, td}
function fecharPopGrade(){
  if(!popGrade) return;
  popGrade.el.remove();
  popGrade = null;
}

function abrirPopGrade(td, detalhe){
  fecharPopGrade();
  const el = document.createElement('div');
  el.className = 'xl-pop no-print';
  const titulo = document.createElement('div');
  titulo.className = 'xl-pop-titulo';
  titulo.textContent = detalhe.titulo || '';
  el.appendChild(titulo);
  if(detalhe.itens && detalhe.itens.length){
    const lista = document.createElement('dl');
    detalhe.itens.forEach(([rotulo, valor]) => {
      const dt = document.createElement('dt');
      dt.textContent = rotulo;
      const dd = document.createElement('dd');
      dd.textContent = valor;
      if(/^-R\$/.test(valor)) dd.className = 'neg';
      lista.appendChild(dt);
      lista.appendChild(dd);
    });
    el.appendChild(lista);
  }
  document.body.appendChild(el);
  const r = td.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - w - 10);
  let top = r.bottom + 6;
  if(top + h > window.innerHeight - 10) top = Math.max(10, r.top - h - 6);
  el.style.left = Math.max(10, left) + 'px';
  el.style.top = top + 'px';
  popGrade = {el, td};
  const fechar = (e) => {
    if(!popGrade || popGrade.el !== el){ document.removeEventListener('mousedown', fechar, true); return; }
    if(el.contains(e.target) || td.contains(e.target)) return;
    document.removeEventListener('mousedown', fechar, true);
    fecharPopGrade();
  };
  setTimeout(() => document.addEventListener('mousedown', fechar, true));
}

document.addEventListener('scroll', fecharPopGrade, true);
window.addEventListener('resize', fecharPopGrade);

function fecharMenuGrade(){
  document.querySelector('.xl-menu')?.remove();
}

function abrirMenuGrade(x, y, itens){
  fecharMenuGrade();
  const menu = document.createElement('div');
  menu.className = 'xl-menu no-print';
  itens.forEach(item => {
    if(item === '-'){
      const sep = document.createElement('div');
      sep.className = 'xl-menu-sep';
      menu.appendChild(sep);
      return;
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = item.rotulo;
    if(item.atalho){
      const at = document.createElement('span');
      at.textContent = item.atalho;
      btn.appendChild(at);
    }
    btn.disabled = !!item.desabilitado;
    btn.onclick = () => { fecharMenuGrade(); item.acao(); };
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(6, Math.min(x, window.innerWidth - r.width - 6)) + 'px';
  menu.style.top = Math.max(6, Math.min(y, window.innerHeight - r.height - 6)) + 'px';
  setTimeout(() => {
    const fechar = (e) => {
      if(menu.contains(e.target)) return;
      fecharMenuGrade();
      document.removeEventListener('mousedown', fechar, true);
    };
    document.addEventListener('mousedown', fechar, true);
  });
}

/*
  opts = {
    id,                         // chave do layout salvo (larguras, alturas, colunas ocultas)
    colunas: [{campo, titulo, largura, tipo:'txt'|'moeda'|'pct', arvore:true?}],
    linhas:  [{key, classe, nivel, toggle:{aberto}|null, valores:{campo: valor}, dica}],
    aoAlternar(linha)           // clique no +/− de uma linha
  }
  Devolve {el, montarNoDom(), irParaLinha(key)}.
*/
function criarGradeExcel(opts){
  const id = opts.id;
  const colunas = opts.colunas;
  const linhas = opts.linhas;
  const layout = carregarLayoutGrade(id);
  const est = gradeEstado[id] || (gradeEstado[id] = {scrollTop:0, scrollLeft:0, ativoKey:null, ativoCampo:null});
  const totalLinhas = linhas.length + 1;   // linha 0 = títulos das colunas

  const raiz = document.createElement('div');
  raiz.className = 'xl';
  const scroll = document.createElement('div');
  scroll.className = 'xl-scroll';
  scroll.tabIndex = 0;
  const status = document.createElement('div');
  status.className = 'xl-status no-print';
  // barra de fórmulas, como no Excel: endereço da célula + conteúdo completo (o que ficou cortado na coluna)
  const barraFx = document.createElement('div');
  barraFx.className = 'xl-fx no-print';
  const fxRef = document.createElement('span');
  fxRef.className = 'xl-fx-ref';
  const fxIcone = document.createElement('span');
  fxIcone.className = 'xl-fx-icone';
  fxIcone.textContent = 'fx';
  const fxTexto = document.createElement('div');
  fxTexto.className = 'xl-fx-texto';
  barraFx.appendChild(fxRef);
  barraFx.appendChild(fxIcone);
  barraFx.appendChild(fxTexto);
  if(opts.barraFx) raiz.appendChild(barraFx);   // opcional (a DRE não usa)
  raiz.appendChild(scroll);
  raiz.appendChild(status);

  let visiveis = [];      // índices (em colunas) das colunas exibidas
  let celulas = [];       // celulas[r][vc] = <td>
  let numLinha = [];      // <th> com o número de cada linha
  let letras = [];        // <th> com a letra de cada coluna exibida
  let colEls = [];
  let tabela = null, overlay = null;
  let ranges = [];
  let ativo = {r:1, c:0}, ponta = {r:1, c:0};
  let arrastando = null;
  let msgStatus = '';
  let timerMsg = null;

  const linhaKey = (r) => r === 0 ? '__titulo' : linhas[r - 1].key;
  const larguraCol = (i) => layout.larguras[colunas[i].campo] || colunas[i].largura || 100;

  function valorCelula(r, vc){
    const col = colunas[visiveis[vc]];
    if(r === 0) return col.titulo;
    const v = linhas[r - 1].valores[col.campo];
    return v === undefined ? null : v;
  }
  function tipoCelula(r, vc){
    return r === 0 ? 'txt' : (colunas[visiveis[vc]].tipo || 'txt');
  }
  function ehNumero(r, vc){
    const v = valorCelula(r, vc);
    return typeof v === 'number' && tipoCelula(r, vc) !== 'txt';
  }

  function atualizarLarguraTabela(){
    let total = 46;
    visiveis.forEach(i => total += larguraCol(i));
    tabela.style.width = total + 'px';
  }

  function montar(){
    visiveis = colunas.map((_, i) => i).filter(i => !layout.ocultas.includes(colunas[i].campo));
    if(!visiveis.length){ layout.ocultas = []; visiveis = colunas.map((_, i) => i); }
    scroll.innerHTML = '';
    tabela = document.createElement('table');
    tabela.className = 'xl-tab';

    const cg = document.createElement('colgroup');
    const colNum = document.createElement('col');
    colNum.style.width = '46px';
    cg.appendChild(colNum);
    colEls = visiveis.map(i => {
      const el = document.createElement('col');
      el.style.width = larguraCol(i) + 'px';
      cg.appendChild(el);
      return el;
    });
    tabela.appendChild(cg);

    const thead = document.createElement('thead');
    const trL = document.createElement('tr');
    trL.className = 'xl-letras';
    const canto = document.createElement('th');
    canto.className = 'xl-canto';
    canto.title = 'Selecionar tudo (Ctrl+A)';
    trL.appendChild(canto);
    letras = visiveis.map((i, vc) => {
      const th = document.createElement('th');
      th.className = 'xl-letra';
      th.dataset.vc = vc;
      th.textContent = letraColuna(i);
      // Excel marca com uma borda dupla onde existe coluna oculta
      if(vc < visiveis.length - 1 && visiveis[vc + 1] !== i + 1) th.classList.add('xl-tem-oculta');
      if(vc === visiveis.length - 1 && i < colunas.length - 1) th.classList.add('xl-tem-oculta');
      const rsz = document.createElement('div');
      rsz.className = 'xl-rsz-c';
      rsz.dataset.vc = vc;
      rsz.title = 'Arraste para mudar a largura · duplo clique para autoajustar';
      th.appendChild(rsz);
      trL.appendChild(th);
      return th;
    });
    thead.appendChild(trL);
    tabela.appendChild(thead);

    const tbody = document.createElement('tbody');
    celulas = [];
    numLinha = [];
    for(let r = 0; r < totalLinhas; r++){
      const linha = r === 0 ? null : linhas[r - 1];
      const tr = document.createElement('tr');
      tr.className = r === 0 ? 'xl-titulos' : ('xl-l ' + (linha.classe || ''));
      const altura = layout.alturas[linhaKey(r)];
      if(altura) tr.style.height = altura + 'px';

      const th = document.createElement('th');
      th.className = 'xl-num';
      th.dataset.r = r;
      th.textContent = r + 1;
      const rszR = document.createElement('div');
      rszR.className = 'xl-rsz-r';
      rszR.dataset.r = r;
      th.appendChild(rszR);
      tr.appendChild(th);
      numLinha.push(th);

      celulas.push(visiveis.map((i, vc) => {
        const col = colunas[i];
        const td = document.createElement('td');
        td.dataset.r = r;
        td.dataset.vc = vc;
        const v = valorCelula(r, vc);
        const tipo = tipoCelula(r, vc);
        const texto = textoCelula(v, tipo);
        if(tipo !== 'txt'){
          td.classList.add('xl-n');
          if(typeof v === 'number' && v < -0.004) td.classList.add('xl-neg');
          else if(typeof v === 'number' && v > 0.004) td.classList.add('xl-pos');
          td.dataset.txt = texto;
        }
        if(r > 0 && col.arvore){
          td.classList.add('xl-arv');
          td.style.paddingLeft = (10 + (linha.nivel || 0) * 16) + 'px';
          const tg = document.createElement('span');
          if(linha.toggle){
            tg.className = 'xl-tg';
            tg.textContent = linha.toggle.aberto ? '−' : '+';
            tg.title = linha.toggle.aberto ? 'Recolher' : 'Expandir';
          } else {
            tg.className = 'xl-tg-vazio';
          }
          td.appendChild(tg);
          const tx = document.createElement('span');
          tx.className = 'xl-tx';
          tx.textContent = texto;
          td.appendChild(tx);
          if(linha.dica || texto) td.title = linha.dica || texto;
        } else {
          td.textContent = texto;
        }
        tr.appendChild(td);
        return td;
      }));
      tbody.appendChild(tr);
    }
    tabela.appendChild(tbody);
    scroll.appendChild(tabela);

    overlay = document.createElement('div');
    overlay.className = 'xl-sel';
    overlay.innerHTML = '<span class="xl-alca"></span>';
    scroll.appendChild(overlay);
    atualizarLarguraTabela();
  }

  /* ---------- seleção ---------- */
  function limitar(p){
    return {
      r: Math.max(0, Math.min(totalLinhas - 1, p.r)),
      c: Math.max(0, Math.min(visiveis.length - 1, p.c)),
    };
  }
  function normal(a, b){
    return {r1:Math.min(a.r, b.r), r2:Math.max(a.r, b.r), c1:Math.min(a.c, b.c), c2:Math.max(a.c, b.c)};
  }
  function definirSelecao(a, p, adicionar){
    a = limitar(a); p = limitar(p || a);
    const rg = normal(a, p);
    if(adicionar) ranges.push(rg); else ranges = [rg];
    ativo = a; ponta = p;
    overlay.classList.remove('xl-copiado');
    pintar();
  }
  function estenderAte(p){
    p = limitar(p);
    ponta = p;
    if(!ranges.length) ranges.push(normal(ativo, p));
    else ranges[ranges.length - 1] = normal(ativo, p);
    overlay.classList.remove('xl-copiado');
    pintar();
  }
  function selecionarTudo(){
    definirSelecao({r:0, c:0}, {r:totalLinhas - 1, c:visiveis.length - 1});
  }

  let pintadas = [];
  function pintar(){
    pintadas.forEach(el => el.classList.remove('xl-s', 'xl-hl', 'xl-ativa'));
    pintadas = [];
    const linhasSel = new Set();
    const colsSel = new Set();
    ranges.forEach(rg => {
      for(let r = rg.r1; r <= rg.r2; r++){
        linhasSel.add(r);
        const linhaCels = celulas[r];
        for(let c = rg.c1; c <= rg.c2; c++){
          linhaCels[c].classList.add('xl-s');
          pintadas.push(linhaCels[c]);
        }
      }
      for(let c = rg.c1; c <= rg.c2; c++) colsSel.add(c);
    });
    linhasSel.forEach(r => { numLinha[r].classList.add('xl-hl'); pintadas.push(numLinha[r]); });
    colsSel.forEach(c => { letras[c].classList.add('xl-hl'); pintadas.push(letras[c]); });
    const tdA = celulas[ativo.r][ativo.c];
    tdA.classList.add('xl-ativa');
    pintadas.push(tdA);
    est.ativoKey = linhaKey(ativo.r);
    est.ativoCampo = colunas[visiveis[ativo.c]].campo;
    atualizarBarraFx();
    posicionarOverlay();
    atualizarStatus();
  }

  function atualizarBarraFx(){
    const col = colunas[visiveis[ativo.c]];
    fxRef.textContent = letraColuna(visiveis[ativo.c]) + (ativo.r + 1);
    const v = valorCelula(ativo.r, ativo.c);
    const linha = ativo.r > 0 ? linhas[ativo.r - 1] : null;
    fxTexto.textContent = (linha && col.arvore && linha.dica) ? linha.dica : textoCelula(v, tipoCelula(ativo.r, ativo.c));
  }

  function posicionarOverlay(){
    const rg = ranges[ranges.length - 1];
    if(!rg || !overlay || !scroll.isConnected){ if(overlay) overlay.style.display = 'none'; return; }
    const a = celulas[rg.r1][rg.c1].getBoundingClientRect();
    const b = celulas[rg.r2][rg.c2].getBoundingClientRect();
    const base = scroll.getBoundingClientRect();
    overlay.style.display = 'block';
    overlay.style.left = (a.left - base.left + scroll.scrollLeft - scroll.clientLeft - 1) + 'px';
    overlay.style.top = (a.top - base.top + scroll.scrollTop - scroll.clientTop - 1) + 'px';
    overlay.style.width = (b.right - a.left + 1) + 'px';
    overlay.style.height = (b.bottom - a.top + 1) + 'px';
  }

  function atualizarStatus(){
    const vistos = new Set();
    let soma = 0, qtd = 0, qtdNum = 0, min = Infinity, max = -Infinity;
    const tipos = new Set();
    ranges.forEach(rg => {
      for(let r = rg.r1; r <= rg.r2; r++){
        for(let c = rg.c1; c <= rg.c2; c++){
          const k = r * 64 + c;
          if(vistos.has(k)) continue;
          vistos.add(k);
          const v = valorCelula(r, c);
          if(v === null || v === '') continue;
          qtd++;
          if(ehNumero(r, c)){
            qtdNum++;
            soma += v;
            if(v < min) min = v;
            if(v > max) max = v;
            tipos.add(tipoCelula(r, c));
          }
        }
      }
    });
    const fmt = (tipos.size === 1 && tipos.has('pct')) ? fmtPct : fmtBRL;
    status.innerHTML = '';
    const esq = document.createElement('span');
    esq.className = 'xl-status-msg';
    const rg = ranges[ranges.length - 1];
    const tamanho = rg ? `${rg.r2 - rg.r1 + 1}L x ${rg.c2 - rg.c1 + 1}C` : '';
    esq.textContent = msgStatus || (vistos.size > 1 ? tamanho : '');
    status.appendChild(esq);
    const dir = document.createElement('span');
    dir.className = 'xl-calc';
    if(qtd >= 2){
      const add = (rotulo, valor, neg) => {
        const s = document.createElement('span');
        s.appendChild(document.createTextNode(rotulo + ': '));
        const b = document.createElement('b');
        b.textContent = valor;
        if(neg) b.className = 'xl-neg-txt';
        s.appendChild(b);
        dir.appendChild(s);
      };
      if(qtdNum){
        add('Média', fmt(soma / qtdNum), soma < 0);
        add('Contagem', qtd.toLocaleString('pt-BR'));
        add('Mín', fmt(min), min < 0);
        add('Máx', fmt(max), max < 0);
        add('Soma', fmt(soma), soma < 0);
      } else {
        add('Contagem', qtd.toLocaleString('pt-BR'));
      }
    }
    status.appendChild(dir);
  }

  function avisar(msg){
    msgStatus = msg;
    atualizarStatus();
    clearTimeout(timerMsg);
    timerMsg = setTimeout(() => { msgStatus = ''; atualizarStatus(); }, 2600);
  }

  // funciona tanto com a tabela rolando por dentro quanto com a página rolando
  // (a folga do cabeçalho/rodapé fixos vem do scroll-margin no CSS)
  function garantirVisivel(p){
    celulas[p.r][p.c].scrollIntoView({block:'nearest', inline:'nearest'});
  }

  /* ---------- copiar (Ctrl+C) ---------- */
  function copiar(){
    const rg = ranges[ranges.length - 1];
    if(!rg) return;
    const saida = [];
    for(let r = rg.r1; r <= rg.r2; r++){
      const cols = [];
      for(let c = rg.c1; c <= rg.c2; c++){
        const v = valorCelula(r, c);
        if(ehNumero(r, c)){
          cols.push(tipoCelula(r, c) === 'pct'
            ? fmtPct(v)
            : v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:false}));
        } else {
          cols.push(v === null ? '' : String(v).replace(/[\t\r\n]+/g, ' '));
        }
      }
      saida.push(cols.join('\t'));
    }
    const texto = saida.join('\r\n');
    const qtd = (rg.r2 - rg.r1 + 1) * (rg.c2 - rg.c1 + 1);
    const ok = () => { overlay.classList.add('xl-copiado'); avisar(`Copiado: ${qtd} célula(s) — cole no Excel com Ctrl+V`); };
    const plano = () => {
      const ta = document.createElement('textarea');
      ta.value = texto;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ avisar('Não foi possível copiar.'); }
      ta.remove();
      scroll.focus({preventScroll:true});
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(ok, plano);
    else plano();
  }

  /* ---------- largura de coluna / altura de linha ---------- */
  let dica = null;
  function mostrarDica(ev, texto){
    if(!dica){
      dica = document.createElement('div');
      dica.className = 'xl-dica';
      document.body.appendChild(dica);
    }
    dica.textContent = texto;
    dica.style.left = (ev.clientX + 12) + 'px';
    dica.style.top = (ev.clientY - 28) + 'px';
  }
  function esconderDica(){ dica?.remove(); dica = null; }

  function aplicarLargura(vc, w){
    layout.larguras[colunas[visiveis[vc]].campo] = Math.round(w);
    colEls[vc].style.width = Math.round(w) + 'px';
    atualizarLarguraTabela();
  }

  function iniciarResizeCol(e, vc){
    e.preventDefault();
    e.stopPropagation();
    // se a coluna faz parte de uma seleção de colunas inteiras, todas mudam juntas (como no Excel)
    const rg = ranges[ranges.length - 1];
    const colunaInteira = rg && rg.r1 === 0 && rg.r2 === totalLinhas - 1 && vc >= rg.c1 && vc <= rg.c2;
    const alvo = colunaInteira ? Array.from({length:rg.c2 - rg.c1 + 1}, (_, k) => rg.c1 + k) : [vc];
    const x0 = e.clientX;
    const w0 = larguraCol(visiveis[vc]);
    document.body.classList.add('xl-redim-c');
    const mover = (ev) => {
      const w = Math.max(14, w0 + ev.clientX - x0);
      alvo.forEach(c => aplicarLargura(c, w));
      posicionarOverlay();
      mostrarDica(ev, `Largura: ${Math.round(w)} pixels`);
    };
    const soltar = () => {
      window.removeEventListener('mousemove', mover);
      window.removeEventListener('mouseup', soltar);
      document.body.classList.remove('xl-redim-c');
      esconderDica();
      salvarLayoutGrade(id, layout);
      verificarCerquilhas(alvo);
      posicionarOverlay();
    };
    window.addEventListener('mousemove', mover);
    window.addEventListener('mouseup', soltar);
  }

  function iniciarResizeLin(e, r){
    e.preventDefault();
    e.stopPropagation();
    const rg = ranges[ranges.length - 1];
    const linhaInteira = rg && rg.c1 === 0 && rg.c2 === visiveis.length - 1 && r >= rg.r1 && r <= rg.r2;
    const alvo = linhaInteira ? Array.from({length:rg.r2 - rg.r1 + 1}, (_, k) => rg.r1 + k) : [r];
    const y0 = e.clientY;
    const h0 = numLinha[r].parentElement.getBoundingClientRect().height;
    document.body.classList.add('xl-redim-r');
    const mover = (ev) => {
      const h = Math.max(16, Math.round(h0 + ev.clientY - y0));
      alvo.forEach(rr => {
        layout.alturas[linhaKey(rr)] = h;
        numLinha[rr].parentElement.style.height = h + 'px';
      });
      posicionarOverlay();
      mostrarDica(ev, `Altura: ${h} pixels`);
    };
    const soltar = () => {
      window.removeEventListener('mousemove', mover);
      window.removeEventListener('mouseup', soltar);
      document.body.classList.remove('xl-redim-r');
      esconderDica();
      salvarLayoutGrade(id, layout);
      posicionarOverlay();
    };
    window.addEventListener('mousemove', mover);
    window.addEventListener('mouseup', soltar);
  }

  let canvasMedida = null;
  function autoajustar(vcs){
    canvasMedida = canvasMedida || document.createElement('canvas');
    const ctx = canvasMedida.getContext('2d');
    vcs.forEach(vc => {
      let max = 24;
      for(let r = 0; r < totalLinhas; r++){
        const td = celulas[r][vc];
        const cs = getComputedStyle(td);
        ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const texto = td.dataset.txt !== undefined ? td.dataset.txt : (td.querySelector('.xl-tx') || td).textContent;
        const extra = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0) + (td.querySelector('.xl-tg, .xl-tg-vazio') ? 24 : 0);
        max = Math.max(max, ctx.measureText(texto).width + extra + 6);
      }
      aplicarLargura(vc, Math.min(900, Math.ceil(max)));
    });
    salvarLayoutGrade(id, layout);
    verificarCerquilhas(vcs);
    posicionarOverlay();
  }

  // Número que não cabe na coluna vira "####", igual ao Excel.
  function verificarCerquilhas(vcs){
    const lista = vcs || visiveis.map((_, vc) => vc);
    const alvos = [];
    lista.forEach(vc => {
      for(let r = 1; r < totalLinhas; r++){
        const td = celulas[r][vc];
        if(td.dataset.txt === undefined || td.dataset.txt === '') continue;
        td.textContent = td.dataset.txt;
        alvos.push(td);
      }
    });
    const estouram = alvos.filter(td => td.scrollWidth > td.clientWidth + 1);
    estouram.forEach(td => { td.textContent = '#'.repeat(Math.max(1, Math.floor((td.clientWidth - 8) / 8))); });
  }

  function remontar(){
    const chave = est.ativoKey, campo = est.ativoCampo;
    montar();
    verificarCerquilhas();
    restaurarAtivo(chave, campo);
  }

  function restaurarAtivo(chave, campo){
    let r = 1;
    if(chave){
      if(chave === '__titulo') r = 0;
      else {
        const idx = linhas.findIndex(l => l.key === chave);
        if(idx >= 0) r = idx + 1;
      }
    }
    if(totalLinhas === 1) r = 0;
    let c = visiveis.findIndex(i => colunas[i].campo === campo);
    if(c < 0) c = 0;
    definirSelecao({r, c}, {r, c});
  }

  function colunasSelecionadas(){
    const s = new Set();
    ranges.forEach(rg => { for(let c = rg.c1; c <= rg.c2; c++) s.add(c); });
    return Array.from(s).sort((a, b) => a - b);
  }

  function linhaNaSelecao(r, c){
    return ranges.some(rg => r >= rg.r1 && r <= rg.r2 && (c === undefined || (c >= rg.c1 && c <= rg.c2)));
  }

  /* ---------- eventos ---------- */
  scroll.addEventListener('scroll', () => {
    est.scrollTop = scroll.scrollTop;
    est.scrollLeft = scroll.scrollLeft;
    fecharMenuGrade();
  });

  scroll.addEventListener('mousedown', (e) => {
    if(e.button !== 0) return;
    const rszC = e.target.closest('.xl-rsz-c');
    if(rszC){ iniciarResizeCol(e, +rszC.dataset.vc); return; }
    const rszR = e.target.closest('.xl-rsz-r');
    if(rszR){ iniciarResizeLin(e, +rszR.dataset.r); return; }

    e.preventDefault();
    scroll.focus({preventScroll:true});
    const ctrl = e.ctrlKey || e.metaKey;
    const td = e.target.closest('td[data-r]');
    const tg = e.target.closest('.xl-tg');
    if(td && tg){
      const r = +td.dataset.r;
      definirSelecao({r, c:+td.dataset.vc});
      opts.aoAlternar(linhas[r - 1]);
      return;
    }
    const letra = e.target.closest('.xl-letra');
    const num = e.target.closest('.xl-num');
    if(td){
      const p = {r:+td.dataset.r, c:+td.dataset.vc};
      if(e.shiftKey) estenderAte(p);
      else definirSelecao(p, p, ctrl);
      arrastando = 'cel';
    } else if(letra){
      const c = +letra.dataset.vc;
      if(e.shiftKey) definirSelecao({r:0, c:ativo.c}, {r:totalLinhas - 1, c});
      else definirSelecao({r:0, c}, {r:totalLinhas - 1, c}, ctrl);
      arrastando = 'col';
    } else if(num){
      const r = +num.dataset.r;
      if(e.shiftKey) definirSelecao({r:ativo.r, c:0}, {r, c:visiveis.length - 1});
      else definirSelecao({r, c:0}, {r, c:visiveis.length - 1}, ctrl);
      arrastando = 'lin';
    } else if(e.target.closest('.xl-canto')){
      selecionarTudo();
    }
    if(arrastando){
      window.addEventListener('mouseup', () => { arrastando = null; }, {once:true});
    }
  });

  scroll.addEventListener('mouseover', (e) => {
    if(!arrastando) return;
    if(arrastando === 'cel'){
      const td = e.target.closest('td[data-r]');
      if(td) estenderAte({r:+td.dataset.r, c:+td.dataset.vc});
    } else if(arrastando === 'col'){
      const el = e.target.closest('[data-vc]');
      if(el) estenderAte({r:totalLinhas - 1, c:+el.dataset.vc});
    } else if(arrastando === 'lin'){
      const el = e.target.closest('[data-r]');
      if(el) estenderAte({r:+el.dataset.r, c:visiveis.length - 1});
    }
  });

  // um clique numa célula de lançamento (ou com texto cortado) abre o conteúdo completo; outro clique fecha
  scroll.addEventListener('click', (e) => {
    if(e.target.closest('.xl-tg, .xl-rsz-c, .xl-rsz-r')) return;
    const td = e.target.closest('td[data-r]');
    if(!td) return;
    const rg = ranges[ranges.length - 1];
    if(ranges.length !== 1 || !rg || rg.r1 !== rg.r2 || rg.c1 !== rg.c2) return;   // arrastou/selecionou várias: não abre
    const r = +td.dataset.r;
    const linha = r > 0 ? linhas[r - 1] : null;
    if(!linha) return;
    if(popGrade && popGrade.td === td){ fecharPopGrade(); return; }
    const col = colunas[visiveis[+td.dataset.vc]];
    const cortado = td.scrollWidth > td.clientWidth + 1;
    if(col.arvore && linha.detalhe) abrirPopGrade(td, linha.detalhe);
    else if(cortado) abrirPopGrade(td, {titulo: col.arvore && linha.dica ? linha.dica : (td.dataset.txt || td.textContent)});
    else fecharPopGrade();
  });

  scroll.addEventListener('dblclick', (e) => {
    const rszC = e.target.closest('.xl-rsz-c');
    if(rszC){
      const vc = +rszC.dataset.vc;
      const sel = colunasSelecionadas();
      const rg = ranges[ranges.length - 1];
      const colunaInteira = rg && rg.r1 === 0 && rg.r2 === totalLinhas - 1 && sel.includes(vc);
      autoajustar(colunaInteira ? sel : [vc]);
      return;
    }
    const rszR = e.target.closest('.xl-rsz-r');
    if(rszR){
      const r = +rszR.dataset.r;
      delete layout.alturas[linhaKey(r)];
      numLinha[r].parentElement.style.height = '';
      salvarLayoutGrade(id, layout);
      posicionarOverlay();
      return;
    }
    const td = e.target.closest('td.xl-arv');
    if(td && !e.target.closest('.xl-tg')){
      const linha = linhas[+td.dataset.r - 1];
      if(linha && linha.toggle) opts.aoAlternar(linha);
    }
  });

  scroll.addEventListener('contextmenu', (e) => {
    const letra = e.target.closest('.xl-letra');
    const num = e.target.closest('.xl-num');
    const td = e.target.closest('td[data-r]');
    if(!letra && !num && !td) return;
    e.preventDefault();
    const itensCopiar = {rotulo:'Copiar', atalho:'Ctrl+C', acao: copiar};
    if(letra){
      const vc = +letra.dataset.vc;
      const rg = ranges[ranges.length - 1];
      const jaInteira = rg && rg.r1 === 0 && rg.r2 === totalLinhas - 1 && vc >= rg.c1 && vc <= rg.c2;
      if(!jaInteira) definirSelecao({r:0, c:vc}, {r:totalLinhas - 1, c:vc});
      const sel = colunasSelecionadas();
      abrirMenuGrade(e.clientX, e.clientY, [
        itensCopiar,
        '-',
        {rotulo:'Largura da coluna…', acao: () => {
          const atual = larguraCol(visiveis[sel[0]]);
          const resp = prompt('Largura da coluna (em pixels):', String(atual));
          const w = parseInt(resp, 10);
          if(!w || w < 10) return;
          sel.forEach(c => aplicarLargura(c, Math.min(900, w)));
          salvarLayoutGrade(id, layout);
          verificarCerquilhas(sel);
          posicionarOverlay();
        }},
        {rotulo:'Autoajuste da largura da coluna', acao: () => autoajustar(sel)},
        '-',
        {rotulo: sel.length > 1 ? `Ocultar ${sel.length} colunas` : 'Ocultar coluna', desabilitado: sel.length >= visiveis.length, acao: () => {
          sel.forEach(c => layout.ocultas.push(colunas[visiveis[c]].campo));
          salvarLayoutGrade(id, layout);
          remontar();
        }},
        {rotulo:'Reexibir colunas ocultas', desabilitado: !layout.ocultas.length, acao: () => {
          layout.ocultas = [];
          salvarLayoutGrade(id, layout);
          remontar();
        }},
        {rotulo:'Restaurar larguras padrão', acao: () => {
          layout.larguras = {};
          salvarLayoutGrade(id, layout);
          remontar();
        }},
      ]);
      return;
    }
    if(num){
      const r = +num.dataset.r;
      if(!linhaNaSelecao(r)) definirSelecao({r, c:0}, {r, c:visiveis.length - 1});
      abrirMenuGrade(e.clientX, e.clientY, [
        itensCopiar,
        '-',
        {rotulo:'Altura da linha…', acao: () => {
          const atual = Math.round(num.parentElement.getBoundingClientRect().height);
          const resp = prompt('Altura da linha (em pixels):', String(atual));
          const h = parseInt(resp, 10);
          if(!h || h < 16) return;
          const alvo = new Set();
          ranges.forEach(rg => { for(let rr = rg.r1; rr <= rg.r2; rr++) alvo.add(rr); });
          alvo.forEach(rr => {
            layout.alturas[linhaKey(rr)] = Math.min(300, h);
            numLinha[rr].parentElement.style.height = Math.min(300, h) + 'px';
          });
          salvarLayoutGrade(id, layout);
          posicionarOverlay();
        }},
        {rotulo:'Restaurar altura de todas as linhas', desabilitado: !Object.keys(layout.alturas).length, acao: () => {
          layout.alturas = {};
          salvarLayoutGrade(id, layout);
          remontar();
        }},
      ]);
      return;
    }
    const r = +td.dataset.r, c = +td.dataset.vc;
    if(!linhaNaSelecao(r, c)) definirSelecao({r, c});
    const linha = r > 0 ? linhas[r - 1] : null;
    const itens = [itensCopiar];
    if(linha && linha.toggle){
      itens.push('-');
      itens.push({rotulo: linha.toggle.aberto ? 'Recolher' : 'Expandir', atalho: linha.toggle.aberto ? '−' : '+', acao: () => opts.aoAlternar(linha)});
    }
    abrirMenuGrade(e.clientX, e.clientY, itens);
  });

  scroll.addEventListener('keydown', (e) => {
    const ctrl = e.ctrlKey || e.metaKey;
    const k = e.key;
    if(ctrl && k.toLowerCase() === 'c'){ e.preventDefault(); copiar(); return; }
    if(ctrl && k.toLowerCase() === 'a'){ e.preventDefault(); selecionarTudo(); return; }
    if(k === 'Escape'){ fecharPopGrade(); overlay.classList.remove('xl-copiado'); definirSelecao(ativo, ativo); return; }
    if(k === '+' || k === '-' || k === 'Add' || k === 'Subtract'){
      const linha = ativo.r > 0 ? linhas[ativo.r - 1] : null;
      const abrir = (k === '+' || k === 'Add');
      if(linha && linha.toggle && linha.toggle.aberto !== abrir){ e.preventDefault(); opts.aoAlternar(linha); }
      return;
    }
    const passos = {
      ArrowUp:[-1, 0], ArrowDown:[1, 0], ArrowLeft:[0, -1], ArrowRight:[0, 1],
      PageUp:[-20, 0], PageDown:[20, 0],
      Enter:[e.shiftKey ? -1 : 1, 0], Tab:[0, e.shiftKey ? -1 : 1],
    };
    const estende = e.shiftKey && (k.startsWith('Arrow') || k.startsWith('Page') || k === 'Home' || k === 'End');
    const base = estende ? ponta : ativo;
    let p = null;
    if(k === 'Home') p = ctrl ? {r:0, c:0} : {r:base.r, c:0};
    else if(k === 'End') p = ctrl ? {r:totalLinhas - 1, c:visiveis.length - 1} : {r:base.r, c:visiveis.length - 1};
    else if(passos[k]){
      const [dr, dc] = passos[k];
      if(ctrl && k.startsWith('Arrow')){
        p = {
          r: dr < 0 ? 0 : dr > 0 ? totalLinhas - 1 : base.r,
          c: dc < 0 ? 0 : dc > 0 ? visiveis.length - 1 : base.c,
        };
      } else {
        p = {r:base.r + dr, c:base.c + dc};
      }
    }
    if(!p) return;
    e.preventDefault();
    if(estende) estenderAte(p);
    else definirSelecao(p, p);
    garantirVisivel(estende ? ponta : ativo);
  });

  const aoRedimensionarJanela = () => {
    if(!scroll.isConnected){ window.removeEventListener('resize', aoRedimensionarJanela); return; }
    atualizarLarguraTabela();
    posicionarOverlay();
  };
  window.addEventListener('resize', aoRedimensionarJanela);

  montar();

  return {
    el: raiz,
    // chamar depois que o elemento estiver na página (precisa medir as células)
    montarNoDom(){
      atualizarLarguraTabela();
      verificarCerquilhas();
      scroll.scrollTop = est.scrollTop || 0;
      scroll.scrollLeft = est.scrollLeft || 0;
      restaurarAtivo(est.ativoKey, est.ativoCampo);
    },
    irParaLinha(chave){
      const idx = linhas.findIndex(l => l.key === chave);
      if(idx < 0) return;
      const c = visiveis.findIndex(i => colunas[i].arvore);
      definirSelecao({r:idx + 1, c:Math.max(0, c)});
      celulas[idx + 1][0].scrollIntoView({block:'center'});
      posicionarOverlay();
      scroll.focus({preventScroll:true});
    },
  };
}

/* =========================================================================
   ABA: MOVIMENTAÇÕES (DRE) — todos os grupos, Receitas × Despesas
   ========================================================================= */
// Mesmas contas que o antigo Fluxo de Caixa considerava (resultado, investimento e financiamento):
// tudo que movimenta o caixa, menos as próprias contas de disponibilidade.
function categoriaDoCodigo(code){
  const c0 = code[0];
  if(c0 === '3' || c0 === '4') return 'Operacional';
  if(code === '1.3' || code.startsWith('1.3.')) return 'Investimento';
  if(c0 === '2') return 'Financiamento';
  return null;
}

let dreGrade = null;
let dreDados = null;

function novoGrupoDre(id, nome){
  return {id, nome, porCodigo:new Map(), lancs:new Map(), codigosR:new Set(), codigosD:new Set(), receitas:0, despesas:0};
}

function calcularDre(dataDe, dataAte){
  const grupos = state.cadastro.map(g => novoGrupoDre(String(g.id), g.nome));
  const gruposPorCentro = new Map();
  state.cadastro.forEach((g, i) => {
    g.centros.forEach(centro => {
      if(!gruposPorCentro.has(centro)) gruposPorCentro.set(centro, []);
      gruposPorCentro.get(centro).push(grupos[i]);
    });
  });
  for(const t of state.transactions){
    const alvos = gruposPorCentro.get(t.centro);
    if(!alvos) continue;   // centro fora de qualquer grupo (ou sem centro) não entra na DRE
    if(!categoriaDoCodigo(t.code)) continue;
    if(!dentroDoPeriodo(t, dataDe, dataAte)) continue;
    alvos.forEach(g => {
      g.porCodigo.set(t.code, (g.porCodigo.get(t.code) || 0) + t.valor);
      if(!g.lancs.has(t.code)) g.lancs.set(t.code, []);
      g.lancs.get(t.code).push(t);
    });
  }

  const finalizar = (g) => {
    // Cada conta cai em Receitas ou Despesas pelo saldo dela no grupo/período (positivo = entrada).
    g.porCodigo.forEach((valor, code) => {
      if(valor > 0.004){ g.codigosR.add(code); g.receitas += valor; }
      else if(valor < -0.004){ g.codigosD.add(code); g.despesas += valor; }
    });
    g.lancs.forEach(lista => lista.sort((a, b) => a.dataISO.localeCompare(b.dataISO)));
    g.resultado = g.receitas + g.despesas;
  };
  grupos.forEach(finalizar);
  const lista = grupos;

  const totalEntradas = lista.reduce((s, g) => s + g.receitas, 0);
  const totalSaidas = lista.reduce((s, g) => s + g.despesas, 0);
  const centrosRepetidos = Array.from(gruposPorCentro.entries())
    .filter(([, gs]) => gs.length > 1)
    .map(([centro, gs]) => ({centro, grupos: gs.map(g => g.nome)}));

  return {
    grupos: lista,
    totalEntradas,
    totalSaidas,
    saldo: totalEntradas + totalSaidas,
    movTotal: totalEntradas - totalSaidas,
    centrosRepetidos,
    contaPorCodigo: new Map(state.accounts.map(a => [a.code, a])),
  };
}

// Monta a árvore de contas (com as contas-pai) só com os códigos de um lado (Receitas ou Despesas).
function arvoreContasDre(codigos, porCodigo, contaPorCodigo){
  const valores = new Map();
  codigos.forEach(code => {
    const v = porCodigo.get(code) || 0;
    const partes = code.split('.');
    for(let i = 1; i <= partes.length; i++){
      const p = partes.slice(0, i).join('.');
      valores.set(p, (valores.get(p) || 0) + v);
    }
  });
  const nos = Array.from(valores.keys())
    .filter(code => contaPorCodigo.has(code) || codigos.has(code))
    .sort((a, b) => a.localeCompare(b, undefined, {numeric:true}));
  const mapa = new Map();
  nos.forEach(code => {
    const conta = contaPorCodigo.get(code);
    mapa.set(code, {code, desc: conta ? conta.desc : code, valor: valores.get(code), filhos:[]});
  });
  const raizes = [];
  nos.forEach(code => {
    let p = code, pai = null;
    while(p.includes('.')){
      p = p.slice(0, p.lastIndexOf('.'));
      if(mapa.has(p)){ pai = mapa.get(p); break; }
    }
    (pai ? pai.filhos : raizes).push(mapa.get(code));
  });
  return raizes;
}

// Linhas da grade. incluirFechados=true devolve também o que está recolhido (com visivel=false),
// usado pra exportar pro Excel com os agrupamentos (+/−) já prontos.
function montarLinhasDre(dados, incluirFechados){
  const linhas = [];
  dados.grupos.forEach(g => {
    const kG = 'G:' + g.id;
    const gAberto = !state.dreGruposFechados.has(kG);
    linhas.push({
      key:kG, classe:'dre-grupo', nivel:0, visivel:true, toggle:{aberto:gAberto}, grupoKey:kG,
      valores:{b:g.nome, c:g.resultado, d:null},
      dica: g.nome,
    });
    if(!gAberto && !incluirFechados) return;

    [
      ['R', 'Receitas', g.receitas, dados.totalEntradas, g.codigosR, 'dre-rec'],
      ['D', 'Despesas', g.despesas, dados.totalSaidas, g.codigosD, 'dre-desp'],
    ].forEach(([lado, rotulo, valorLado, totalGeral, codigos, classe]) => {
      const kS = kG + '|' + lado;
      const sAberto = state.dreAbertos.has(kS);
      const visS = gAberto;
      linhas.push({
        key:kS, classe, nivel:1, visivel:visS, toggle: codigos.size ? {aberto:sAberto} : null,
        valores:{b:rotulo, c:valorLado, d: Math.abs(totalGeral) > 0.004 ? valorLado / totalGeral : null, e:null},
        dica: `${rotulo} de ${g.nome}`,
      });
      if(!(sAberto || incluirFechados) || !codigos.size) return;

      const emitir = (no, nivel, vis) => {
        const kN = kS + '|' + no.code;
        const aberto = state.dreAbertos.has(kN);
        const lancs = g.lancs.get(no.code) || [];
        const temLanc = codigos.has(no.code) && lancs.length > 0;
        const temFilhos = no.filhos.length > 0;
        linhas.push({
          key:kN, classe:'dre-conta nivel-conta-' + Math.min(nivel, 6), nivel, visivel:vis,
          toggle: (temFilhos || temLanc) ? {aberto} : null,
          valores:{b:no.desc, c:no.valor, d: Math.abs(valorLado) > 0.004 ? no.valor / valorLado : null, e:null},
          dica: `${no.code} — ${no.desc}`,
        });
        if(aberto || incluirFechados){
          no.filhos.forEach(f => emitir(f, nivel + 1, vis && aberto));
        }
        if(aberto && temLanc){
          lancs.forEach((t, i) => {
            const hist = t.hist.replace(CC_RE, '').trim();
            linhas.push({
              key:kN + '|L' + i, classe:'dre-lanc', nivel:nivel + 1, visivel:vis, toggle:null,
              valores:{b:fmtDataBR(t.dataISO) + '   ' + hist, c:t.valor, d:null, e:null},
              dica: `${fmtDataBR(t.dataISO)} — ${hist} (centro ${nomeCentro(t.centro)}${t.centroOrigem === 'movcaixa' ? ' · via MOV CAIXA' : ''})`,
              detalhe: {
                titulo: hist,
                itens: [
                  ['Data', fmtDataBR(t.dataISO)],
                  ['Valor', fmtBRL(t.valor)],
                  ['Conta', `${no.code} — ${no.desc}`],
                  ['Centro', nomeCentro(t.centro) + (t.centroOrigem === 'movcaixa' ? ' · via MOV CAIXA' : '')],
                ],
              },
            });
          });
        }
      };
      arvoreContasDre(codigos, g.porCodigo, dados.contaPorCodigo).forEach(no => emitir(no, 2, visS && sAberto));
    });
  });
  linhas.push({key:'T:saldo', classe:'dre-saldo', nivel:0, visivel:true, toggle:null,
    valores:{b:'Saldo', c:dados.saldo, d:null}});
  return linhas;
}

const DRE_COLUNAS = [
  {campo:'b', titulo:'Grupo / Conta', largura:360, arvore:true},
  {campo:'c', titulo:'Valor', largura:160, tipo:'moeda'},
  {campo:'d', titulo:'%', largura:80, tipo:'pct'},
];

function alternarLinhaDre(linha){
  if(linha.grupoKey){
    if(state.dreGruposFechados.has(linha.key)) state.dreGruposFechados.delete(linha.key);
    else state.dreGruposFechados.add(linha.key);
  } else {
    if(state.dreAbertos.has(linha.key)) state.dreAbertos.delete(linha.key);
    else state.dreAbertos.add(linha.key);
  }
  desenharGradeDre();
}

function desenharGradeDre(){
  const alvo = document.getElementById('dreGradeAlvo');
  if(!alvo || !dreDados) return;
  const linhas = montarLinhasDre(dreDados, false).filter(l => l.visivel);
  dreGrade = criarGradeExcel({id:'dre5', colunas:DRE_COLUNAS, linhas, aoAlternar: alternarLinhaDre});
  // a página é quem rola: guarda a posição pra tabela não "pular" ao abrir/fechar um +
  const content = document.getElementById('content');
  const topo = content.scrollTop, esquerda = content.scrollLeft;
  alvo.style.minHeight = alvo.offsetHeight + 'px';
  alvo.innerHTML = '';
  alvo.appendChild(dreGrade.el);
  dreGrade.montarNoDom();
  alvo.style.minHeight = '';
  content.scrollTop = topo;
  content.scrollLeft = esquerda;
}

// Quais linhas ficam abertas em cada visão.
// modo: 'tudo' (contas + lançamentos) | 'contas' | 'lados' (Receitas × Despesas) | 'grupos'
function conjuntosExpansaoDre(modo){
  const abertos = new Set(), fechados = new Set();
  dreDados.grupos.forEach(g => {
    const kG = 'G:' + g.id;
    if(modo === 'grupos'){ fechados.add(kG); return; }
    if(modo === 'lados') return;
    [['R', g.codigosR], ['D', g.codigosD]].forEach(([lado, codigos]) => {
      const kS = kG + '|' + lado;
      abertos.add(kS);
      const percorrer = (no) => {
        const temLanc = codigos.has(no.code) && (g.lancs.get(no.code) || []).length > 0;
        if(no.filhos.length || (modo === 'tudo' && temLanc)) abertos.add(kS + '|' + no.code);
        no.filhos.forEach(percorrer);
      };
      arvoreContasDre(codigos, g.porCodigo, dreDados.contaPorCodigo).forEach(percorrer);
    });
  });
  return {abertos, fechados};
}

function expandirDre(modo){
  if(!dreDados) return;
  const {abertos, fechados} = conjuntosExpansaoDre(modo);
  state.dreAbertos = abertos;
  state.dreGruposFechados = fechados;
  desenharGradeDre();
}

// Abre grupo → Receitas/Despesas → contas-pai até a conta e seleciona a linha dela na tabela.
function abrirContaNaDre(g, codigo){
  const kG = 'G:' + g.id;
  const kS = kG + '|' + (g.codigosR.has(codigo) ? 'R' : 'D');
  state.dreGruposFechados.delete(kG);
  state.dreAbertos.add(kS);
  const partes = codigo.split('.');
  for(let i = 1; i < partes.length; i++) state.dreAbertos.add(kS + '|' + partes.slice(0, i).join('.'));
  desenharGradeDre();
  dreGrade.irParaLinha(kS + '|' + codigo);
}

function textoPeriodoDre(){
  const f = state.filtroDre;
  if(!f.de && !f.ate) return 'Período completo';
  return (fmtDataBR(f.de) || 'o início') + ' até ' + (fmtDataBR(f.ate) || 'hoje');
}

// Período (e aba aberta) sobrevivem ao F5 — preferência só deste navegador.
const PREF_DRE = 'app_nelore_mra_contabil_pref_dre';
function salvarPreferenciasDre(){
  try{ localStorage.setItem(PREF_DRE, JSON.stringify({de:state.filtroDre.de, ate:state.filtroDre.ate, aba:state.aba})); }catch(e){}
}
function carregarPreferenciasDre(){
  try{
    const p = JSON.parse(localStorage.getItem(PREF_DRE) || 'null');
    if(!p) return;
    state.filtroDre.de = p.de || '';
    state.filtroDre.ate = p.ate || '';
    if(ABAS.some(a => a.id === p.aba)) state.aba = p.aba;
  }catch(e){}
}

function renderDre(){
  renderTopbar('Movimentações (DRE)', true, abrirImpressaoDre);
  const c = document.getElementById('content');
  c.innerHTML = '';

  if(state.accounts.length === 0){
    c.innerHTML = '<p class="hint">Nenhum dado carregado. Vá em "Upload de arquivo".</p>';
    return;
  }

  const filtro = state.filtroDre;

  // ---------- período fica na barra do topo, ao lado do título ----------
  const periodo = document.createElement('div');
  periodo.className = 'dre-periodo no-print';
  const campoData = (rotulo, campo) => {
    const lab = document.createElement('label');
    lab.textContent = rotulo;
    // campo de texto com máscara: digitar "01 01 2025" (ou 01012025) vira 01/01/2025
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.placeholder = 'dd/mm/aaaa';
    input.maxLength = 10;
    input.className = 'dre-data';
    input.dataset.campo = campo;
    input.value = fmtDataBR(filtro[campo]);
    const aplicar = () => {
      const d = input.value.replace(/\D/g, '');
      if(!d){
        input.classList.remove('invalida');
        if(filtro[campo]){ filtro[campo] = ''; salvarPreferenciasDre(); render(); }
        return;
      }
      const dia = +d.slice(0, 2), mes = +d.slice(2, 4), ano = +d.slice(4, 8);
      const dt = new Date(ano, mes - 1, dia);
      if(d.length !== 8 || dt.getFullYear() !== ano || dt.getMonth() !== mes - 1 || dt.getDate() !== dia){
        input.classList.add('invalida');
        return;
      }
      const iso = d.slice(4, 8) + '-' + d.slice(2, 4) + '-' + d.slice(0, 2);
      if(iso === filtro[campo]) return;
      filtro[campo] = iso;
      salvarPreferenciasDre();
      render();
      // terminou a data inicial: já deixa o cursor na final
      if(campo === 'de') document.querySelector('.dre-data[data-campo="ate"]')?.focus();
    };
    input.oninput = () => {
      const d = input.value.replace(/\D/g, '').slice(0, 8);
      let s = d.slice(0, 2);
      if(d.length > 2) s += '/' + d.slice(2, 4);
      if(d.length > 4) s += '/' + d.slice(4);
      input.value = s;
      input.classList.remove('invalida');
      if(d.length === 8) aplicar();
    };
    input.onkeydown = (e) => { if(e.key === 'Enter') aplicar(); };
    input.onblur = aplicar;
    lab.appendChild(input);
    return lab;
  };
  periodo.appendChild(campoData('De', 'de'));
  periodo.appendChild(campoData('Até', 'ate'));

  const dados = calcularDre(filtro.de || null, filtro.ate || null);
  dreDados = dados;

  if(dados.centrosRepetidos.length){
    const aviso = document.createElement('div');
    aviso.className = 'aviso-ultima-data no-print';
    aviso.style.cssText = 'margin:0 0 16px;max-width:none;';
    aviso.textContent = 'Atenção: ' + dados.centrosRepetidos
      .map(x => `centro ${nomeCentro(x.centro)} está em ${x.grupos.join(' e ')}`)
      .join('; ') + '. Esses lançamentos aparecem em mais de um grupo e entram mais de uma vez nos totais.';
    c.appendChild(aviso);
  }

  const layoutDre = document.createElement('div');
  layoutDre.className = 'dre-layout';

  // ---------- Entradas, Saídas, Saldo, Mov. Total ----------
  const kpis = document.createElement('div');
  kpis.className = 'dre-kpis';
  const kpi = (classe, rotulo, valor) => {
    const d = document.createElement('div');
    d.className = 'kpi ' + classe;
    const s = document.createElement('span');
    s.textContent = rotulo;
    const b = document.createElement('b');
    b.textContent = fmtBRL(valor);
    d.appendChild(s);
    d.appendChild(b);
    kpis.appendChild(d);
  };
  kpi('entrada', 'Entradas', dados.totalEntradas);
  kpi('saida', 'Saídas', dados.totalSaidas);
  kpi(dados.saldo < 0 ? 'saida' : 'entrada', 'Saldo', dados.saldo);
  kpi('total', 'Mov. Total', dados.movTotal);
  // números à esquerda + tabela, o conjunto centralizado na página
  const principal = document.createElement('div');
  principal.className = 'dre-principal';
  principal.appendChild(kpis);
  layoutDre.appendChild(principal);

  // ---------- tabela estilo Excel ----------
  const centro = document.createElement('div');
  centro.className = 'dre-centro';
  const acoes = document.createElement('div');
  acoes.className = 'dre-visao no-print';
  [
    ['Grupos', 'grupos'],
    ['Receitas × Despesas', 'lados'],
    ['Contas', 'contas'],
    ['Tudo', 'tudo'],
  ].forEach(([rotulo, modo]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = rotulo;
    b.onclick = () => expandirDre(modo);
    acoes.appendChild(b);
  });
  // visões à esquerda e período (De / Até) à direita, na mesma linha acima da tabela
  const barra = document.createElement('div');
  barra.className = 'dre-barra no-print';
  barra.appendChild(acoes);
  barra.appendChild(periodo);
  layoutDre.insertBefore(barra, principal);
  const alvoGrade = document.createElement('div');
  alvoGrade.id = 'dreGradeAlvo';
  centro.appendChild(alvoGrade);
  principal.appendChild(centro);

  // ---------- à direita: principais movimentações por grupo ----------
  const lateral = document.createElement('aside');
  lateral.className = 'dre-cards';
  const hCards = document.createElement('h3');
  hCards.className = 'dre-cards-titulo';
  hCards.textContent = 'Principais movimentações';
  lateral.appendChild(hCards);
  let algumCard = false;
  dados.grupos.forEach(g => {
    const principais = Array.from(g.porCodigo.entries())
      .filter(([, v]) => Math.abs(v) > 0.004)
      .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))
      .slice(0, 5);
    if(!principais.length) return;
    algumCard = true;
    const card = document.createElement('div');
    card.className = 'destaque-card clicavel';
    const titulo = document.createElement('h4');
    const nome = document.createElement('span');
    nome.textContent = g.nome;
    const total = document.createElement('span');
    total.className = g.resultado < -0.004 ? 'card-total-neg' : 'card-total-pos';
    total.textContent = fmtBRL(g.resultado);
    titulo.appendChild(nome);
    titulo.appendChild(total);
    card.appendChild(titulo);
    const tabela = document.createElement('table');
    const corpo = document.createElement('tbody');
    principais.forEach(([codigo, valor]) => {
      const tr = document.createElement('tr');
      const tdNome = document.createElement('td');
      const conta = dados.contaPorCodigo.get(codigo);
      tdNome.textContent = conta ? conta.desc : codigo;
      tdNome.title = codigo;
      const tdValor = document.createElement('td');
      tdValor.className = valor < 0 ? 'neg' : '';
      tdValor.textContent = fmtBRL(valor);
      tr.appendChild(tdNome);
      tr.appendChild(tdValor);
      tr.onclick = (e) => { e.stopPropagation(); abrirContaNaDre(g, codigo); };
      corpo.appendChild(tr);
    });
    tabela.appendChild(corpo);
    card.appendChild(tabela);
    card.onclick = () => {
      const kG = 'G:' + g.id;
      state.dreGruposFechados.delete(kG);
      desenharGradeDre();
      dreGrade.irParaLinha(kG);
    };
    lateral.appendChild(card);
  });
  if(!algumCard){
    const vazio = document.createElement('p');
    vazio.className = 'hint';
    vazio.textContent = 'Nenhuma movimentação no período.';
    lateral.appendChild(vazio);
  }
  layoutDre.appendChild(lateral);

  c.appendChild(layoutDre);
  desenharGradeDre();
}

/* =========================================================================
   IMPRESSÃO DA DRE — monta uma versão só pra papel (a tela não é impressa)
   ========================================================================= */
const PREF_IMPRESSAO = 'app_nelore_mra_contabil_pref_impressao_dre';
function carregarOpcoesImpressao(){
  const padrao = {resumo:true, tabela:true, cards:true, nivel:'tela', orientacao:'retrato'};
  try{ return Object.assign(padrao, JSON.parse(localStorage.getItem(PREF_IMPRESSAO) || '{}')); }catch(e){ return padrao; }
}

function abrirImpressaoDre(){
  if(!dreDados) return;
  document.querySelector('.modal-impressao')?.remove();
  const op = carregarOpcoesImpressao();
  const modal = document.createElement('div');
  modal.className = 'modal-impressao no-print';
  const card = document.createElement('div');
  card.className = 'modal-impressao-card';
  card.innerHTML = '<h2>Imprimir</h2>';

  const secao = (titulo) => {
    const h = document.createElement('div');
    h.className = 'impressao-secao';
    h.textContent = titulo;
    card.appendChild(h);
  };
  const checks = {};
  secao('Conteúdo');
  [['resumo', 'Resumo (Entradas, Saídas, Saldo, Mov. Total)'], ['tabela', 'Tabela'], ['cards', 'Principais movimentações']].forEach(([chave, rotulo]) => {
    const label = document.createElement('label');
    label.className = 'opcao-impressao';
    const ch = document.createElement('input');
    ch.type = 'checkbox';
    ch.checked = !!op[chave];
    checks[chave] = ch;
    label.appendChild(ch);
    label.appendChild(document.createTextNode(rotulo));
    card.appendChild(label);
  });
  const escolha = (titulo, nome, opcoes, atual) => {
    secao(titulo);
    const grupo = document.createElement('div');
    grupo.className = 'impressao-escolha';
    opcoes.forEach(([valor, rotulo]) => {
      const label = document.createElement('label');
      const r = document.createElement('input');
      r.type = 'radio';
      r.name = nome;
      r.value = valor;
      r.checked = valor === atual;
      label.appendChild(r);
      label.appendChild(document.createTextNode(rotulo));
      grupo.appendChild(label);
    });
    card.appendChild(grupo);
  };
  escolha('Detalhe da tabela', 'imp-nivel', [['tela', 'Como está na tela'], ['grupos', 'Grupos'], ['lados', 'Receitas × Despesas'], ['contas', 'Contas']], op.nivel);
  escolha('Orientação', 'imp-orientacao', [['retrato', 'Retrato'], ['paisagem', 'Paisagem']], op.orientacao);

  const acoes = document.createElement('div');
  acoes.className = 'acoes-impressao';
  const cancelar = document.createElement('button');
  cancelar.className = 'btn';
  cancelar.textContent = 'Cancelar';
  cancelar.onclick = () => modal.remove();
  const imprimir = document.createElement('button');
  imprimir.className = 'btn primary';
  imprimir.textContent = 'Imprimir';
  imprimir.onclick = () => {
    const escolhida = (nome) => card.querySelector(`input[name="${nome}"]:checked`).value;
    const novas = {
      resumo: checks.resumo.checked, tabela: checks.tabela.checked, cards: checks.cards.checked,
      nivel: escolhida('imp-nivel'), orientacao: escolhida('imp-orientacao'),
    };
    if(!novas.resumo && !novas.tabela && !novas.cards){ alert('Escolha pelo menos uma parte para imprimir.'); return; }
    try{ localStorage.setItem(PREF_IMPRESSAO, JSON.stringify(novas)); }catch(e){}
    modal.remove();
    imprimirDre(novas);
  };
  acoes.appendChild(cancelar);
  acoes.appendChild(imprimir);
  card.appendChild(acoes);
  modal.appendChild(card);
  modal.addEventListener('mousedown', (e) => { if(e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

function linhasDreParaImpressao(nivel){
  if(nivel === 'tela') return montarLinhasDre(dreDados, false).filter(l => l.visivel);
  const salvos = {abertos: state.dreAbertos, fechados: state.dreGruposFechados};
  const {abertos, fechados} = conjuntosExpansaoDre(nivel);
  state.dreAbertos = abertos;
  state.dreGruposFechados = fechados;
  try{
    return montarLinhasDre(dreDados, false).filter(l => l.visivel);
  }finally{
    state.dreAbertos = salvos.abertos;
    state.dreGruposFechados = salvos.fechados;
  }
}

function imprimirDre(op){
  document.getElementById('areaImpressao')?.remove();
  document.getElementById('estiloPagina')?.remove();
  const dados = dreDados;
  const area = document.createElement('div');
  area.id = 'areaImpressao';
  area.appendChild(cabecalhoImpressao('Movimentações (DRE) · ' + textoPeriodoDre()));

  if(op.resumo){
    const resumo = document.createElement('div');
    resumo.className = 'imp-resumo';
    [['Entradas', dados.totalEntradas], ['Saídas', dados.totalSaidas], ['Saldo', dados.saldo], ['Mov. Total', dados.movTotal]].forEach(([rotulo, valor]) => {
      const d = document.createElement('div');
      const s = document.createElement('span');
      s.textContent = rotulo;
      const b = document.createElement('b');
      b.textContent = fmtBRL(valor);
      if(rotulo !== 'Mov. Total' && valor < -0.004) b.className = 'neg';
      d.appendChild(s);
      d.appendChild(b);
      resumo.appendChild(d);
    });
    area.appendChild(resumo);
  }

  if(op.tabela){
    const tabela = document.createElement('table');
    tabela.className = 'imp-tabela';
    tabela.innerHTML = '<thead><tr><th>Grupo / Conta</th><th class="num">Valor</th><th class="num">%</th></tr></thead>';
    const corpo = document.createElement('tbody');
    linhasDreParaImpressao(op.nivel).forEach(l => {
      const tr = document.createElement('tr');
      tr.className = l.classe.split(' ')[0];
      const td1 = document.createElement('td');
      td1.style.paddingLeft = (6 + (l.nivel || 0) * 14) + 'px';
      td1.textContent = l.valores.b;
      const td2 = document.createElement('td');
      td2.className = 'num' + (typeof l.valores.c === 'number' && l.valores.c < -0.004 ? ' neg' : '');
      td2.textContent = textoCelula(l.valores.c, 'moeda');
      const td3 = document.createElement('td');
      td3.className = 'num';
      td3.textContent = textoCelula(l.valores.d, 'pct');
      tr.appendChild(td1);
      tr.appendChild(td2);
      tr.appendChild(td3);
      corpo.appendChild(tr);
    });
    tabela.appendChild(corpo);
    area.appendChild(tabela);
  }

  if(op.cards){
    const cards = document.querySelector('.dre-cards');
    if(cards){
      const copia = cards.cloneNode(true);
      copia.className = 'imp-cards';
      area.appendChild(copia);
    }
  }

  const estilo = document.createElement('style');
  estilo.id = 'estiloPagina';
  estilo.textContent = `@page{size:A4 ${op.orientacao === 'paisagem' ? 'landscape' : 'portrait'};margin:12mm 12mm;}`;
  document.head.appendChild(estilo);
  document.body.appendChild(area);
  document.body.classList.add('imprimindo-dre');
  const limpar = () => {
    document.body.classList.remove('imprimindo-dre');
    area.remove();
    estilo.remove();
    window.removeEventListener('afterprint', limpar);
  };
  window.addEventListener('afterprint', limpar);
  window.print();
}
