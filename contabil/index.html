   ========================================================================= */
function renderBusca(){
  renderTopbar('Busca', false);
  const c = document.getElementById('content');
  c.innerHTML = '';

  if(state.accounts.length === 0){
    c.innerHTML = '<p class="hint">Nenhum dado carregado. Vá em "Upload de arquivo".</p>';
    return;
  }

  const filtroObj = state.filtroBusca;
  renderFiltroInline(c, filtroObj, true);

  const caixa = document.createElement('div');
  caixa.className = 'busca-caixa';
  caixa.innerHTML = `<input type="text" id="buscaInput" placeholder='Busque uma conta ("Venda de Soja") ou um texto do histórico ("Fazenda Paraíso")…'>`;
  c.appendChild(caixa);

  const resultados = document.createElement('div');
  resultados.id = 'buscaResultados';
  c.appendChild(resultados);

  const input = document.getElementById('buscaInput');
  input.value = state.buscaQuery;
  input.addEventListener('input', (e) => { state.buscaQuery = e.target.value; executarBusca(state.buscaQuery); });
  executarBusca(state.buscaQuery);
}

function executarBusca(query){
  const resultados = document.getElementById('buscaResultados');
  resultados.innerHTML = '';
  const q = query.trim().toLowerCase();
  if(q.length < 2){
    resultados.innerHTML = '<p class="hint">Digite ao menos 2 letras para buscar.</p>';
    return;
  }

  const filtroObj = state.filtroBusca;
  const centrosSet = centrosDoFiltro(filtroObj.grupo);
  const dataDe = filtroObj.de || null, dataAte = filtroObj.ate || null;
  const leafTotals = somaLeafPorCodigo(centrosSet, dataDe, dataAte);

  const contasQueBatem = state.accounts.filter(a => a.desc.toLowerCase().includes(q));
  const h3a = document.createElement('h3');
  h3a.className = 'busca-secao';
  h3a.textContent = `Contas que combinam (${contasQueBatem.length})`;
  resultados.appendChild(h3a);
  if(contasQueBatem.length){
    // inclui as contas-filhas de cada conta encontrada, pra dar pra abrir até o lançamento
    const comFilhas = new Map();
    contasQueBatem.forEach(a => {
      comFilhas.set(a.code, a);
      state.accounts.forEach(f => {
        if(f.code.startsWith(a.code + '.')) comFilhas.set(f.code, f);
      });
    });
    const contasExpandidas = Array.from(comFilhas.values())
      .sort((x,y) => x.code.localeCompare(y.code, undefined, {numeric:true}));
    const tabA = construirTabelaArvore(contasExpandidas, leafTotals, {centrosSet, dataDe, dataAte, tabelaId:'tabelaBuscaContas'});
    resultados.appendChild(tabA);
    ativarSelecaoSoma(tabA);
  } else {
    resultados.appendChild(Object.assign(document.createElement('p'), {className:'hint', textContent:'Nenhuma conta com esse nome.'}));
  }

  const lancsQueBatem = state.transactions.filter(t => {
    if(centrosSet && !centrosSet.has(t.centro)) return false;
    if(!dentroDoPeriodo(t, dataDe, dataAte)) return false;
    return t.hist.toLowerCase().includes(q);
  }).sort((a,b) => b.dataISO.localeCompare(a.dataISO));

  const h3b = document.createElement('h3');
  h3b.className = 'busca-secao';
  h3b.textContent = `Lançamentos que combinam (${lancsQueBatem.length})`;
  resultados.appendChild(h3b);
  if(lancsQueBatem.length){
    const tab = document.createElement('table');
    tab.className = 'relatorio';
    tab.id = 'tabelaBuscaLancamentos';
    tab.innerHTML = '<thead><tr><th style="width:90px;">Data</th><th style="width:110px;">Conta</th><th>Histórico</th><th class="num" style="width:130px;">Valor</th></tr></thead>';
    const tbody = document.createElement('tbody');
    lancsQueBatem.slice(0, 300).forEach(t => {
      const tr = document.createElement('tr');
      tr.dataset.valor = t.valor;
      const histLimpo = t.hist.replace(CC_RE, '').trim();
      const tdData = document.createElement('td');
      tdData.textContent = fmtDataBR(t.dataISO);
      const tdConta = document.createElement('td');
      tdConta.textContent = t.code;
      const tdHistorico = document.createElement('td');
      tdHistorico.appendChild(document.createTextNode(histLimpo + ' '));
      const centro = document.createElement('span');
      centro.style.color = 'var(--texto-suave)';
      centro.textContent = `(centro ${nomeCentro(t.centro)})`;
      tdHistorico.appendChild(centro);
      const tdValor = document.createElement('td');
      tdValor.className = 'num mono' + (t.valor < 0 ? ' neg' : '');
      tdValor.textContent = fmtBRL(t.valor);
      tr.appendChild(tdData);
      tr.appendChild(tdConta);
      tr.appendChild(tdHistorico);
      tr.appendChild(tdValor);
      tbody.appendChild(tr);
    });
    tab.appendChild(tbody);
    resultados.appendChild(tab);
    ativarSelecaoSoma(tab);
    if(lancsQueBatem.length > 300){
      resultados.appendChild(Object.assign(document.createElement('p'), {className:'hint', textContent:`Mostrando os 300 mais recentes de ${lancsQueBatem.length} encontrados.`}));
    }
  } else {
    resultados.appendChild(Object.assign(document.createElement('p'), {className:'hint', textContent:'Nenhum lançamento com esse texto no histórico.'}));
  }
}

/* =========================================================================
   ABA: SEM CENTRO
   ========================================================================= */
function renderSemCentro(){
  renderTopbar('Sem centro', false);
  const c = document.getElementById('content');
  c.innerHTML = '';

  if(state.transactions.length === 0){
    c.innerHTML = '<p class="hint">Nenhum dado carregado. Vá em "Upload de arquivo".</p>';
    return;
  }

  const filtro = state.filtroSemCentro;
  const dataDe = filtro.de || null;
  const dataAte = filtro.ate || null;
  const transacoesPeriodo = state.transactions.filter(t => dentroDoPeriodo(t, dataDe, dataAte));
  const semCentroPeriodo = transacoesPeriodo.filter(t => t.centro === 'NAO_IDENTIFICADO');
  const totalTodos = transacoesPeriodo.reduce((s, t) => s + t.valor, 0);
  const totalSemCentro = semCentroPeriodo.reduce((s, t) => s + t.valor, 0);
  const totalComCentro = totalTodos - totalSemCentro;

  const resumo = document.createElement('div');
  resumo.className = 'resumo-cards sem-centro-resumo';
  const adicionarCard = (valor, rotulo, destaque) => {
    const card = document.createElement('div');
    card.className = 'card' + (destaque ? ' destaque' : '');
    const numero = document.createElement('b');
    numero.textContent = valor;
    const texto = document.createElement('span');
    texto.textContent = rotulo;
    card.appendChild(numero);
    card.appendChild(texto);
    resumo.appendChild(card);
  };
  adicionarCard(fmtBRL(totalTodos), 'TODOS no período');
  adicionarCard(fmtBRL(totalComCentro), 'TODOS sem os lançamentos sem centro');
  adicionarCard(fmtBRL(totalSemCentro), 'Diferença sem centro', true);
  adicionarCard(semCentroPeriodo.length.toLocaleString('pt-BR'), 'Lançamentos sem centro', true);
  c.appendChild(resumo);

  const conciliacao = document.createElement('div');
  conciliacao.className = 'conciliacao-centros';
  conciliacao.appendChild(document.createTextNode('TODOS '));
  const todos = document.createElement('b'); todos.textContent = fmtBRL(totalTodos); conciliacao.appendChild(todos);
  conciliacao.appendChild(document.createTextNode(' = COM CENTRO '));
  const com = document.createElement('b'); com.textContent = fmtBRL(totalComCentro); conciliacao.appendChild(com);
  conciliacao.appendChild(document.createTextNode(' + SEM CENTRO '));
  const sem = document.createElement('b'); sem.textContent = fmtBRL(totalSemCentro); conciliacao.appendChild(sem);
  c.appendChild(conciliacao);

  const filtros = document.createElement('div');
  filtros.className = 'sem-centro-filtros no-print';

  const criarData = (label, valor, campo) => {
    const wrap = document.createElement('div');
    wrap.className = 'campo-inline';
    const lab = document.createElement('label'); lab.textContent = label;
    const input = document.createElement('input');
    input.type = 'date'; input.value = valor || '';
    input.onchange = () => { state.filtroSemCentro[campo] = input.value; renderSemCentro(); };
    wrap.appendChild(lab); wrap.appendChild(input);
    return wrap;
  };
  filtros.appendChild(criarData('Data inicial', filtro.de, 'de'));
  filtros.appendChild(criarData('Data final', filtro.ate, 'ate'));

  const campoBusca = document.createElement('div');
  campoBusca.className = 'campo-inline';
  const labelBusca = document.createElement('label'); labelBusca.textContent = 'Buscar na investigação';
  const inputBusca = document.createElement('input');
  inputBusca.type = 'search';
  inputBusca.placeholder = 'Conta, histórico ou arquivo';
  inputBusca.value = state.semCentroQuery;
  campoBusca.appendChild(labelBusca); campoBusca.appendChild(inputBusca);
  filtros.appendChild(campoBusca);

  const limpar = document.createElement('button');
  limpar.className = 'btn';
  limpar.textContent = 'Limpar filtros';
  limpar.onclick = () => {
    state.filtroSemCentro = {de:'', ate:''};
    state.semCentroQuery = '';
    renderSemCentro();
  };
  filtros.appendChild(limpar);
  c.appendChild(filtros);

  const resultados = document.createElement('div');
  resultados.id = 'semCentroResultados';
  c.appendChild(resultados);

  inputBusca.addEventListener('input', () => {
    state.semCentroQuery = inputBusca.value;
    renderResultadosSemCentro();
  });
  renderResultadosSemCentro();
}

function renderResultadosSemCentro(){
  const resultados = document.getElementById('semCentroResultados');
  if(!resultados) return;
  resultados.innerHTML = '';

  const filtro = state.filtroSemCentro;
  const dataDe = filtro.de || null;
  const dataAte = filtro.ate || null;
  const q = textoParaBusca(state.semCentroQuery);
  const contaPorCodigo = new Map(state.accounts.map(a => [a.code, a]));

  const lancamentos = state.transactions.filter(t => {
    if(t.centro !== 'NAO_IDENTIFICADO' || !dentroDoPeriodo(t, dataDe, dataAte)) return false;
    if(!q) return true;
    const conta = contaPorCodigo.get(t.code);
    return textoParaBusca([t.code, conta?.desc || '', t.hist, t.arquivoNome || ''].join(' ')).includes(q);
  }).sort((a,b) => b.dataISO.localeCompare(a.dataISO) || a.code.localeCompare(b.code, undefined, {numeric:true}));

  const porConta = new Map();
  lancamentos.forEach(t => {
    const item = porConta.get(t.code) || {code:t.code, quantidade:0, total:0};
    item.quantidade++;
    item.total += t.valor;
    porConta.set(t.code, item);
  });
  const contasResumo = Array.from(porConta.values())
    .sort((a,b) => Math.abs(b.total) - Math.abs(a.total))
    .slice(0, 8);

  const hContas = document.createElement('h3');
  hContas.className = 'sem-centro-secao';
  hContas.textContent = `Maiores contas sem centro (${porConta.size})`;
  resultados.appendChild(hContas);

  if(contasResumo.length){
    const tabelaContas = document.createElement('table');
    tabelaContas.className = 'relatorio';
    tabelaContas.innerHTML = '<thead><tr><th style="width:120px;">Conta</th><th>Descrição</th><th class="num" style="width:120px;">Lançamentos</th><th class="num" style="width:150px;">Total sem centro</th></tr></thead>';
    const tbody = document.createElement('tbody');
    contasResumo.forEach(item => {
      const conta = contaPorCodigo.get(item.code);
      const tr = document.createElement('tr');
      tr.title = 'Clique para filtrar esta conta';
      tr.onclick = () => {
        state.semCentroQuery = item.code;
        const busca = document.querySelector('.sem-centro-filtros input[type=search]');
        if(busca) busca.value = item.code;
        renderResultadosSemCentro();
      };
      const tdCodigo = document.createElement('td'); tdCodigo.textContent = item.code;
      const tdDescricao = document.createElement('td'); tdDescricao.textContent = conta?.desc || 'Conta não encontrada no cadastro importado';
      const tdQtd = document.createElement('td'); tdQtd.className = 'num mono'; tdQtd.textContent = item.quantidade.toLocaleString('pt-BR');
      const tdTotal = document.createElement('td'); tdTotal.className = 'num mono' + (item.total < 0 ? ' neg' : ''); tdTotal.textContent = fmtBRL(item.total);
      tr.appendChild(tdCodigo); tr.appendChild(tdDescricao); tr.appendChild(tdQtd); tr.appendChild(tdTotal);
      tbody.appendChild(tr);
    });
    tabelaContas.appendChild(tbody);
    resultados.appendChild(tabelaContas);
  }

  const hLancamentos = document.createElement('h3');
  hLancamentos.className = 'sem-centro-secao';
  hLancamentos.textContent = `Lançamentos para investigar (${lancamentos.length})`;
  resultados.appendChild(hLancamentos);

  if(!lancamentos.length){
    resultados.appendChild(Object.assign(document.createElement('p'), {className:'hint', textContent:'Nenhum lançamento sem centro para estes filtros.'}));
    return;
  }

  const tabela = document.createElement('table');
  tabela.className = 'relatorio';
  tabela.id = 'tabelaSemCentro';
  tabela.innerHTML = '<thead><tr><th style="width:92px;">Data</th><th style="width:125px;">Conta</th><th>Histórico original</th><th style="width:160px;">Arquivo</th><th class="num" style="width:135px;">Valor</th></tr></thead>';
  const tbody = document.createElement('tbody');
  lancamentos.forEach(t => {
    const conta = contaPorCodigo.get(t.code);
    const tr = document.createElement('tr');
    tr.dataset.valor = t.valor;

    const tdData = document.createElement('td'); tdData.textContent = fmtDataBR(t.dataISO);
    const tdConta = document.createElement('td');
    tdConta.appendChild(document.createTextNode(t.code));
    const descricao = document.createElement('span');
    descricao.className = 'sem-centro-conta';
    descricao.textContent = conta?.desc || 'Conta não encontrada';
    tdConta.appendChild(descricao);
    const tdHist = document.createElement('td'); tdHist.textContent = t.hist;
    const tdArquivo = document.createElement('td'); tdArquivo.className = 'sem-centro-arquivo'; tdArquivo.textContent = t.arquivoNome || 'Arquivo não identificado';
    const tdValor = document.createElement('td'); tdValor.className = 'num mono' + (t.valor < 0 ? ' neg' : ''); tdValor.textContent = fmtBRL(t.valor);

    tr.appendChild(tdData); tr.appendChild(tdConta); tr.appendChild(tdHist); tr.appendChild(tdArquivo); tr.appendChild(tdValor);
    tbody.appendChild(tr);
  });
  tabela.appendChild(tbody);
  resultados.appendChild(tabela);
  ativarSelecaoSoma(tabela);
}

/* =========================================================================
   EXPORTAR EXCEL (aba Movimentações / DRE)
   ========================================================================= */
function exportarDreExcel(){
  const dados = calcularDre(state.filtroDre.de || null, state.filtroDre.ate || null);
  const linhas = montarLinhasDre(dados, true);
  const moeda = '"R$" #,##0.00;[Red]-"R$" #,##0.00';
  const wb = XLSX.utils.book_new();

  // Planilha 1: a mesma tabela da tela, com os agrupamentos (+/−) do Excel já montados
  const aoa = [
    ['MOVIMENTAÇÕES (DRE) — ' + textoPeriodoDre()],
    [],
    DRE_COLUNAS.map(col => col.titulo),
  ];
  const inicio = aoa.length;
  linhas.forEach(l => {
    aoa.push(DRE_COLUNAS.map(col => {
      const v = l.valores[col.campo];
      if(col.arvore) return '   '.repeat(l.nivel || 0) + (v || '');
      return v === undefined ? null : v;
    }));
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const layout = carregarLayoutGrade('dre4');
  ws['!cols'] = DRE_COLUNAS.map(col => ({wpx: layout.larguras[col.campo] || col.largura}));
  linhas.forEach((l, i) => {
    const r = inicio + i;
    DRE_COLUNAS.forEach((col, c) => {
      const cel = ws[XLSX.utils.encode_cell({r, c})];
      if(cel && typeof cel.v === 'number') cel.z = col.tipo === 'pct' ? '0.00%' : moeda;
    });
  });
  ws['!rows'] = aoa.map((_, r) => {
    if(r < inicio) return null;
    const l = linhas[r - inicio];
    return {level: Math.min(l.nivel || 0, 7), hidden: !l.visivel};
  });
  ws['!outline'] = {summaryBelow:false};
  ws['!merges'] = [{s:{r:0, c:0}, e:{r:0, c:DRE_COLUNAS.length - 1}}];
  XLSX.utils.book_append_sheet(wb, ws, 'DRE');

  // Planilha 2: resumo por grupo + Entradas / Saídas / Mov. Total
  const res = [['Grupo', 'Receitas', 'Despesas', 'Resultado', '% das entradas', '% das saídas']];
  dados.grupos.forEach(g => res.push([
    g.nome, g.receitas, g.despesas, g.resultado,
    Math.abs(dados.totalEntradas) > 0.004 ? g.receitas / dados.totalEntradas : null,
    Math.abs(dados.totalSaidas) > 0.004 ? g.despesas / dados.totalSaidas : null,
  ]));
  res.push([]);
  res.push(['ENTRADAS', dados.totalEntradas]);
  res.push(['SAÍDAS', dados.totalSaidas]);
  res.push(['SALDO', dados.saldo]);
  res.push(['MOV. TOTAL', dados.movTotal]);
  const wsRes = XLSX.utils.aoa_to_sheet(res);
  wsRes['!cols'] = [{wch:44}, {wch:18}, {wch:18}, {wch:18}, {wch:15}, {wch:15}];
  res.forEach((linha, r) => {
    if(r === 0) return;
    linha.forEach((v, c) => {
      const cel = wsRes[XLSX.utils.encode_cell({r, c})];
      if(cel && typeof cel.v === 'number') cel.z = c >= 4 ? '0.00%' : moeda;
    });
  });
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resumo');

  const sufixo = (state.filtroDre.de || state.filtroDre.ate)
    ? '_' + (state.filtroDre.de || 'inicio') + '_a_' + (state.filtroDre.ate || 'hoje')
    : '';
  XLSX.writeFile(wb, `Movimentacoes_DRE${sufixo}.xlsx`);
}

function exportarExcelAtual(){
  if(!window.XLSX){
    alert('Não foi possível carregar o recurso de exportação para Excel. Verifique a conexão com a internet, atualize a página e tente novamente.');
    return;
  }
  if(state.aba === 'dre'){ exportarDreExcel(); return; }
}

/* =========================================================================
   ROTEADOR
   ========================================================================= */
function render(){
  if(!abaPermitida(state.aba)) state.aba = primeiraAbaPermitida();
  renderSidebar();
  // na DRE o cabeçalho e o Saldo da tabela grudam nas bordas da área rolável
  document.getElementById('content').classList.toggle('conteudo-dre', state.aba === 'dre' && state.accounts.length > 0);
  if(state.aba === 'upload') renderUpload();
  else if(state.aba === 'cadastro') renderCadastro();
  else if(state.aba === 'dre') renderDre();
  else if(state.aba === 'busca') renderBusca();
  else if(state.aba === 'sem-centro') renderSemCentro();
}

document.addEventListener('keydown', (e) => {
  const pediuAtualizacao = e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r');
  if(!pediuAtualizacao) return;
  e.preventDefault();
  atualizarPagina();
});

window.addEventListener('pageshow', (e) => {
  if(e.persisted) atualizarPagina();
});

(async () => {
  await carregarDados();
  carregarPreferenciasDre();
  // grupos que ficaram gravados no HTML: ponto de partida só se ainda não houver nenhum
  if(!state.cadastro.length){
    try{
      const semente = JSON.parse(document.getElementById('grupos-embutidos')?.textContent || 'null');
      if(semente && Array.isArray(semente.cadastro)){
        state.cadastro = normalizarCadastro(semente.cadastro);
        state.apelidos = Object.assign({}, semente.apelidos || {}, state.apelidos);
        nextGrupoId = Math.max(nextGrupoId, state.cadastro.reduce((m, g) => Math.max(m, g.id), 0) + 1);
        state.precisaSalvar = true;
      }
    }catch(e){}
  }
  ultimoConteudoGrupos = conteudoGrupos();
  if(state.precisaSalvar){ state.precisaSalvar = false; salvarDados(); }
  render();
  renderSync();
  iniciarFirebase();
})();
</script>
