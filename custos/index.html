  const saldoLinha = m => filtroEst ? saldoDe[m.id] : m.saldo;
  const cfgExtrato = tableRegistry[tk];
  cfgExtrato.larguras = LARGURAS_EXTRATO;
  const larg = larguraColunas(cfgExtrato);
  const larguraTabela = colunas.reduce((a,c)=>a+larg[c.key],0) + 44;
  const th = c=>{
    const ativo = ts.colFilters[c.key] || ts.sortKey===c.key;
    const seta = ts.sortKey===c.key && c.key!=='data' ? (ts.sortDir>0?' ▲':' ▼') : '';
    return `<th><div class="th-flex"><span>${c.label}${seta}</span><button class="th-filter-btn ${ativo && !(c.key==='data' && !ts.colFilters.data)?'active':''}" onclick="toggleFilterMenu('${tk}','${c.key}', this)">▾</button></div><span class="col-resizer no-print" title="Arraste para mudar a largura (duplo clique volta ao padrão)" onpointerdown="iniciarResizeColuna(event,'${tk}','${c.key}')" ondblclick="resetLarguraColuna('${tk}','${c.key}')"></span></th>`;
  };
  const sinal = v => (v>0?'+':'') + litrosFmt(v);
  const linhas = visiveis.map(m=>{ const sl = saldoLinha(m); return `
    <tr class="mov-${m.tipo}">
      <td data-label="Data">${fmtData(m.data)}</td>
      <td data-label="Tipo"><span class="tag-mov tag-${m.tipo}" ${m.tipo==='acerto'?`title="${esc(m.desc)}"`:''}>${m.tipoNome}</span></td>
      <td data-label="Área" ${m.tipo==='uso'?`title="${esc(m.desc)}"`:''}>${esc(m.area)}</td>
      <td data-label="Litros" class="td-num" data-num="${m.litros}" data-unit="L">${sinal(m.litros)}</td>
      <td data-label="Saldo" class="td-num col-saldo ${sl<0?'text-red':''}" data-num="${sl}" data-unit="L">${litrosFmt(sl)}</td>
      ${mostrarEstacao ? `<td data-label="Estação">${esc(m.estacao||'—')}</td>` : ''}
      <td class="no-print td-acoes">${m.tipo==='uso' ? '' : `<button class="ghost" title="Excluir" onclick="excluirMovEstoque('${m.id}')">✕</button>`}</td>
    </tr>`; }).join('');
  const nomeFiltroEst = filtroEst ? [...filtroEst].join(', ') : '';
  return `
    <h2>🛢️ Estoque Diesel</h2>
    <div class="caption">Saldo do tanque = entradas − usado (Controle Diesel) ± acertos. O acerto corrige a diferença da medição.</div>


    <div class="grid cols-2 no-print estoque-forms">
      <div class="panel form-entrada">
        <p class="section-title">🟢 Entrada de diesel</p>
        <div class="grid cols-3">
          <div><label>Data</label><input type="date" id="ent-data" value="${hojeISO()}"></div>
          <div><label>Litros que entraram</label><input type="text" inputmode="decimal" id="ent-litros" placeholder="Ex: 5.500"></div>
        </div>
        <button class="primary" type="button" style="margin-top:12px;" onclick="salvarEntradaDiesel()">Lançar entrada</button>
      </div>
      <div class="panel form-acerto">
        <p class="section-title">🟠 Acerto de diesel (medição)</p>
        <div class="grid cols-3">
          <div><label>Data da medição</label><input type="date" id="ace-data" value="${hojeISO()}"></div>
          <div><label>Quanto tem no tanque (medido)</label><input type="text" inputmode="decimal" id="ace-medido" placeholder="Ex: 5.400" oninput="previaAcertoDiesel()"></div>
        </div>
        <div id="ace-previa" class="previa-acerto">Digite o valor medido para ver o acerto.</div>
        <button class="btn-acerto" type="button" onclick="salvarAcertoDiesel()">Lançar acerto</button>
      </div>
    </div>

    <div class="toolbar no-print">
      <button class="secondary" onclick="exportEstoqueDiesel()">⬇️ Exportar Excel</button>
      <button class="secondary" onclick="window.print()">🖨️ Imprimir</button>
    </div>
    <p class="section-title">Extrato do tanque</p>
    ${filtroEst ? `<div class="aviso-filtro no-print">Filtrando estação: <b>${esc(nomeFiltroEst)}</b> · o saldo mostra só essa estação <button class="ghost" type="button" onclick="limparFiltroEstacaoExtrato()">limpar</button></div>` : ''}
    <div class="extrato-layout">
    <div class="panel panel-excel" style="padding:0;">
      <div class="table-wrap">
        <table id="tbl-${tk}" class="tbl-excel sel-excel extrato" style="width:${larguraTabela}px;">
          <colgroup>${colunas.map(c=>`<col data-key="${c.key}" style="width:${larg[c.key]}px">`).join('')}<col data-key="__acoes" style="width:44px"></colgroup>
          <thead><tr>${colunas.map(th).join('')}<th class="no-print"></th></tr></thead>
          <tbody>${linhas || `<tr><td colspan="${colunas.length+1}" class="empty">Nenhuma movimentação ainda. Lance a primeira entrada acima.</td></tr>`}</tbody>
          <tfoot><tr class="linha-total"><td class="total-rotulo" colspan="4">SALDO ATUAL${filtroEst?` · ${esc(nomeFiltroEst)}`:''}</td><td class="num ${saldoFinal<0?'text-red':''}" data-label="Saldo atual">${litrosFmt(saldoFinal)}</td>${mostrarEstacao?'<td class="vazio"></td>':''}<td class="no-print vazio"></td></tr></tfoot>
        </table>
      </div>
    </div>
    <div class="extrato-resumo">
      <div class="metric card-entrada"><div class="val cor-entrada">+${litrosFmt(est.totalEntradas)}</div><div class="lbl">Entradas</div></div>
      <div class="metric card-saida"><div class="val cor-saida">−${litrosFmt(est.totalUsado)}</div><div class="lbl">Saídas</div></div>
      <div class="metric card-acerto"><div class="val cor-acerto">${sinal(est.totalAcertos)}</div><div class="lbl">Acertos</div></div>
      <div class="metric saldo-grande"><div class="val ${est.saldoAtual<0?'text-red':''}">${litrosFmt(est.saldoAtual)}</div><div class="lbl">Saldo total no tanque</div></div>
    </div>
    </div>
  `;
}
function salvarEntradaDiesel(){
  const data = document.getElementById('ent-data').value;
  const litros = parseNumBR(document.getElementById('ent-litros').value);
  if(!data){ alert('Informe a data.'); return; }
  if(!(Number(litros)>0)){ alert('Informe quantos litros entraram no tanque.'); return; }
  const row = {id:novoIdDiesel('e'), tipo:'entrada', data, entrada:litros, criadoEm:Date.now(), criadoPor:usuarioAtual()};
  diesel.estoque.push(row);
  salvarLinhaDiesel('estoque', row, true);
  render();
}
function previaAcertoDiesel(){
  const el = document.getElementById('ace-previa');
  if(!el) return;
  const medido = parseNumBR(document.getElementById('ace-medido').value);
  if(medido===''){ el.textContent = 'Digite o valor medido para ver o acerto.'; el.className='previa-acerto'; return; }
  const sistema = calcEstoqueDiesel().saldoAtual, dif = medido - sistema;
  const f = v => fmt(v,1).replace(/,0$/,'');
  el.innerHTML = `Saldo no sistema: <strong>${f(sistema)} L</strong> · Medido: <strong>${f(medido)} L</strong> → acerto de <strong>${dif>0?'+':''}${f(dif)} L</strong>`;
  el.className = 'previa-acerto ativa';
}
function salvarAcertoDiesel(){
  const data = document.getElementById('ace-data').value;
  const medido = parseNumBR(document.getElementById('ace-medido').value);
  if(!data){ alert('Informe a data da medição.'); return; }
  if(medido==='' || medido<0){ alert('Informe quanto tem no tanque.'); return; }
  const sistema = calcEstoqueDiesel().saldoAtual;
  const dif = Math.round((medido - sistema)*100)/100;
  if(dif===0){ alert('O saldo do sistema já bate com a medição. Nenhum acerto necessário.'); return; }
  if(!confirm(`Lançar acerto de ${dif>0?'+':''}${fmt(dif,1)} L?\n\nSistema: ${fmt(sistema,1)} L\nMedido: ${fmt(medido,1)} L`)) return;
  const row = {id:novoIdDiesel('a'), tipo:'acerto', data, entrada:dif, medido, saldoSistema:sistema, criadoEm:Date.now(), criadoPor:usuarioAtual()};
  diesel.estoque.push(row);
  salvarLinhaDiesel('estoque', row, true);
  render();
}
function excluirMovEstoque(id){
  const row = diesel.estoque.find(e=>e.id===id);
  if(!row) return;
  const nome = tipoEstoque(row)==='acerto' ? 'este acerto' : 'esta entrada';
  if(confirm(`Excluir ${nome} de ${fmt(row.entrada,1)} L? Não dá pra desfazer.`)) excluirLinhaDiesel('estoque', row);
}
const COLS_EXTRATO = [
  {key:'data', label:'Data', type:'date'}, {key:'tipoNome', label:'Tipo'}, {key:'area', label:'Área'},
  {key:'litros', label:'Litros', type:'number'}, {key:'saldo', label:'Saldo', type:'number'},
];
async function addExtratoSheet(wb, nome){
  const movs = calcEstoqueDiesel().movs;
  const ws = await addSheetForTable(wb, nome, COLS_EXTRATO, movs, ()=>({}));
  ws.getColumn(3).width = 20;
  movs.forEach((m,i)=>{
    const cor = m.tipo==='entrada' ? 'FFE3F0DA' : m.tipo==='acerto' ? 'FFFCE5CC' : 'FFFDEEEC';
    if(cor) ws.getRow(i+2).eachCell(c=>{ c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:cor}}; });
  });
  addLinhaTotal(ws, ['SALDO ATUAL', '', '', '', movs.length ? movs[movs.length-1].saldo : 0]);
  return ws;
}
async function exportEstoqueDiesel(){
  const wb = new ExcelJS.Workbook();
  await addExtratoSheet(wb, 'Estoque Diesel');
  const buf = await wb.xlsx.writeBuffer();
  downloadBuffer(buf, `Estoque_Diesel_${hojeISO()}.xlsx`);
}
function pageDieselResumo(){
  const lancs = dieselLancamentosFiltrados();
  const total = lancs.reduce((s,l)=>s+Number(l.litros||0),0);
  const media = lancs.length ? total/lancs.length : 0;
  const mesSel = mesFiltroDiesel();
  const estacoes = [...new Set([...diesel.estacoes, ...diesel.lancamentos.map(l=>l.estacao).filter(Boolean)])];
  const meses = [...new Set([mesAtualISO(), ...diesel.lancamentos.map(l=>String(l.data||'').slice(0,7)).filter(m=>/^\d{4}-\d{2}$/.test(m))])].sort().reverse();
  return `
    <div class="toolbar no-print" style="justify-content:flex-end;">
      <button class="secondary" onclick="window.print()">🖨️ Imprimir</button>
      <button class="secondary" onclick="exportResumoDiesel()">⬇️ Exportar Excel</button>
    </div>
    <h2>📈 Dashboard Diesel</h2>
    <div class="caption">${esc(descricaoFiltroDiesel())}</div>
    <div class="panel no-print">
      <div class="filtros-resumo">
        <div><label>Mês</label><select onchange="setFiltroDiesel('mes', this.value)"><option value="" ${!mesSel?'selected':''}>Todos os meses</option>${meses.map(m=>`<option value="${m}" ${m===mesSel?'selected':''}>${nomeMesDiesel(m)}</option>`).join('')}</select></div>
        <div><label>Estação</label><select onchange="setFiltroDiesel('estacao', this.value)"><option value="">Todas</option>${estacoes.map(e=>`<option value="${esc(e)}" ${e===dieselFiltro.estacao?'selected':''}>${esc(e)}</option>`).join('')}</select></div>
      </div>
    </div>
    <div class="resumo-kpis">
      <div class="metric"><div class="val">${fmt(total,1)} L</div><div class="lbl">Litros usados</div></div>
      <div class="metric"><div class="val">${lancs.length}</div><div class="lbl">Lançamentos</div></div>
      <div class="metric"><div class="val">${fmt(media,1)} L</div><div class="lbl">Média por lançamento</div></div>
    </div>
    <div class="resumo-grid">
      ${tabelaResumoDiesel('area', '🌾 Por Área', 'Área', agruparDiesel(lancs,'area'))}
      ${tabelaResumoDiesel('maquina', '🚜 Por Máquina', 'Máquina', agruparDiesel(lancs,'maquina'))}
      ${tabelaResumoDiesel('estacao', '📅 Por Estação', 'Estação', agruparDiesel(lancs,'estacao'))}
    </div>
  `;
}

// ---------- Excel do diesel ----------
const COLS_RESUMO = rotulo => [{key:'nome',label:rotulo},{key:'qtd',label:'Lançamentos',type:'number'},{key:'litros',label:'Litros',type:'number'},{key:'pct',label:'% do total',type:'pct'}];
function addLinhaTotal(ws, valores){
  const row = ws.addRow(valores);
  row.eachCell((cell, colNumber)=>{
    const fmtCol = ws.getColumn(colNumber).numFmt;
    if(fmtCol) cell.numFmt = fmtCol;
    cell.font = {bold:true};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFF5F3EA'}};
    cell.border = {top:{style:'medium', color:{argb:'FF38502E'}}};
  });
}
async function addResumoDieselSheets(wb, lancs, nomeAba){
  for(const [chave, rotulo, titulo] of [['area','Área','Por Área'],['maquina','Máquina','Por Máquina'],['estacao','Estação','Por Estação']]){
    const linhas = agruparDiesel(lancs, chave);
    const ws = await addSheetForTable(wb, nomeAba(titulo), COLS_RESUMO(rotulo), linhas, ()=>({}));
    ws.getColumn(1).width = 28;
    ws.getColumn(2).numFmt = '0';
    addLinhaTotal(ws, ['TOTAL', linhas.reduce((s,r)=>s+r.qtd,0), linhas.reduce((s,r)=>s+r.litros,0), linhas.length?1:0]);
  }
}
async function exportResumoDiesel(){
  const wb = new ExcelJS.Workbook();
  await addResumoDieselSheets(wb, dieselLancamentosFiltrados(), t=>`Diesel ${t}`);
  const buf = await wb.xlsx.writeBuffer();
  downloadBuffer(buf, `Dashboard_Diesel_${mesFiltroDiesel()||'todos'}.xlsx`);
}

// ---------- Backup completo (todas as abas, todas as safras) ----------
async function exportBackupCompleto(){
  if(perfilDiesel) return;
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Custos Safra · Fazenda Paraíso';
  const indice = wb.addWorksheet('Índice');
  const usados = new Set(['índice']);
  const nomeAba = nome=>{
    const base = String(nome).replace(/[:\\\/?*\[\]]/g,'-').slice(0,31);
    let n = base, i = 2;
    while(usados.has(n.toLowerCase())){ const suf = ` (${i++})`; n = base.slice(0,31-suf.length) + suf; }
    usados.add(n.toLowerCase());
    return n;
  };
  const itens = [];
  const add = async (grupo, nome, columns, rows, cd)=>{
    const n = nomeAba(nome);
    await addSheetForTable(wb, n, columns, rows, cd || (()=>({})));
    itens.push([grupo, n, rows.length]);
  };

  for(const s of Object.values(state.safras)){
    const tag = s.nome.replace(/\//g,'-');
    const col = buildColheitaCfg(s), adto = buildAdiantamentosCfg(s), vend = buildVendasCfg(s);
    await add(s.nome, `${tag} Talhões`, [{key:'talhao',label:'Talhão'},{key:'area',label:'Área (ha)',type:'number'},{key:'variedade',label:'Variedade 1'},{key:'variedade2',label:'Variedade 2'},{key:'plantado',label:'Será Plantado?'}],
      s.talhoes.map(t=>({...t, plantado: t.plantado?'Sim':'Não'})));
    await add(s.nome, `${tag} Colheita`, col.columns, col.rows, col.computeDerived);
    await add(s.nome, `${tag} Adiantamentos`, adto.columns, adto.rows, adto.computeDerived);
    await add(s.nome, `${tag} Vendas`, vend.columns, vend.rows, vend.computeDerived);
    const cad = Array.from({length:Math.max(s.locais.length, s.motoristas.length)}, (_,i)=>({local:s.locais[i]||'', motorista:s.motoristas[i]||''}));
    await add(s.nome, `${tag} Cadastros`, [{key:'local',label:'Local de entrega'},{key:'motorista',label:'Motorista'}], cad);
  }

  if(dieselPronto){
    ordenarDiesel();
    const ctrl = buildDieselControleCfg();
    await add('Diesel', 'Diesel Controle', ctrl.columns, ctrl.rows, ctrl.computeDerived);
    const wsEst = await addExtratoSheet(wb, nomeAba('Diesel Estoque'));
    itens.push(['Diesel', wsEst.name, calcEstoqueDiesel().movs.length]);
    const antes = wb.worksheets.length;
    await addResumoDieselSheets(wb, diesel.lancamentos, t=>nomeAba(`Diesel ${t}`));
    wb.worksheets.slice(antes).forEach(ws=>itens.push(['Diesel', ws.name, ws.rowCount-2]));
    const n = Math.max(diesel.maquinas.length, diesel.areas.length, diesel.estacoes.length);
    await add('Diesel', 'Diesel Cadastros', [{key:'m',label:'Máquinas'},{key:'a',label:'Áreas'},{key:'e',label:'Estações'}],
      Array.from({length:n}, (_,i)=>({m:diesel.maquinas[i]||'', a:diesel.areas[i]||'', e:diesel.estacoes[i]||''})));
  }

  // Capa / índice
  indice.columns = [{width:30},{width:36},{width:14}];
  indice.mergeCells('A1:C1');
  indice.getCell('A1').value = 'Backup · Custos Safra · Fazenda Paraíso';
  indice.getCell('A1').font = {bold:true, size:16, color:{argb:'FFFFFFFF'}};
  indice.getCell('A1').fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF38502E'}};
  indice.getCell('A1').alignment = {vertical:'middle', horizontal:'left', indent:1};
  indice.getRow(1).height = 32;
  indice.mergeCells('A2:C2');
  indice.getCell('A2').value = `Gerado em ${new Date().toLocaleString('pt-BR')}`;
  indice.getCell('A2').font = {italic:true, color:{argb:'FF6B6B5C'}};
  const cab = indice.getRow(4);
  cab.values = ['Grupo','Aba','Linhas'];
  cab.eachCell(c=>{ c.font={bold:true, color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern', pattern:'solid', fgColor:{argb:'FF4C6B3F'}}; c.alignment={horizontal:'center'}; });
  itens.forEach(([grupo, aba, linhas])=>{
    const r = indice.addRow([grupo, {text:aba, hyperlink:`#'${aba.replace(/'/g,"''")}'!A1`}, linhas]);
    r.getCell(2).font = {color:{argb:'FF1F5FA8'}, underline:true};
    r.eachCell(c=>{ c.border = {bottom:{style:'hair', color:{argb:'FFE4E0D4'}}}; });
  });

  const buf = await wb.xlsx.writeBuffer();
  downloadBuffer(buf, `Backup_Custos_Safra_${hojeISO()}.xlsx`);
}

// =================== LOGIN FIREBASE ===================
function showAuthState(loggedIn){
  document.body.classList.remove('auth-pending','auth-logged-out','authenticated');
  document.body.classList.add(loggedIn ? 'authenticated' : 'auth-logged-out');
}
function authErrorMessage(err){
  const code = err && err.code || '';
  if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'Login ou senha incorretos.';
  if(code.includes('too-many-requests')) return 'Muitas tentativas. Aguarde um pouco e tente novamente.';
  return 'Não foi possível entrar. Confira o login e a senha.';
}
function initAuth(){
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

  document.getElementById('logoutBtn').addEventListener('click', ()=>firebase.auth().signOut().then(()=>location.href='../index.html'));

  firebase.auth().onAuthStateChanged(async user=>{
    if(!user){ location.href='../index.html'; return; }
    if(user){
      // Permissão vem do App Nelore MRA: admin vê tudo; os outros precisam ter o Custos liberado
      ALLOWED_PAGES = null;
      if(String(user.email||'').toLowerCase()!==ADMIN_EMAIL){
        let perfil=null;
        try{ const d=await firebase.firestore().collection('users').doc(user.uid).get(); perfil=d.exists?d.data():null; }catch(e){ console.warn(e); }
        if(!perfil||perfil.ativo===false||!(perfil.apps&&perfil.apps.custos)){ alert('Você não tem acesso ao Custos. Fale com o administrador.'); location.href='../index.html'; return; }
        const pg=perfil.paginas&&perfil.paginas.custos;
        ALLOWED_PAGES = Array.isArray(pg)&&pg.length ? pg : null;
      }
      document.querySelectorAll('.navbtn').forEach(b=>{ b.style.display = paginaPermitida(b.dataset.page) ? '' : 'none'; });
      // Quem só tem telas de diesel nunca carrega nem grava os custos da safra (as regras também bloqueiam)
      perfilDiesel = !!ALLOWED_PAGES && ALLOWED_PAGES.every(p=>paginaDiesel(p));
      if(!paginaPermitida(currentPage)) currentPage = primeiraPaginaPermitida();
      document.body.classList.toggle('perfil-diesel', perfilDiesel);
      document.getElementById('user-badge').textContent = loginExibicao(user.email);
      showAuthState(true);
      iniciarDiesel();
      if(perfilDiesel){
        // Funcionário do diesel nunca carrega nem grava os custos da safra.
        setSyncStatus('🟡 Conectando...', 'local');
        currentPage = 'diesel-controle';
        render();
      }
      else if(!firebaseReady) initFirebase();
      else render();
    }else{
      pararDiesel();
      perfilDiesel = false;
      document.body.classList.remove('perfil-diesel');
      document.getElementById('user-badge').textContent = '';
      showAuthState(false);
      clearUndoHistory();
      firebaseReady=false;
      if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot=null; }
      db=null; docRef=null;
      setSyncStatus('⚪ Aguardando login', 'local');
    }
  });
}

if(FIREBASE_CONFIGURADO){
  initAuth();
} else {
  showAuthState(true);
  render();
}
</script>
