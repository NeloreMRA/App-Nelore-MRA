/* BACKUP COMPLETO / RESTAURAÇÃO */
function downloadFullBackup(){
  const payload={
    exportedAt:new Date().toISOString(),
    exportedFrom:'IATF MRA - backup manual',
    db:deepClone(db)
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const stamp=new Date().toISOString().slice(0,10);
  const a=document.createElement('a');a.href=url;a.download=`backup_iatf_${stamp}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  try{localStorage.setItem('app-nelore-mra-iatf-last-backup-at',new Date().toISOString())}catch(e){}
  if(page==='settings')settings();
} window.downloadFullBackup=downloadFullBackup;
function restoreFullBackup(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{
    let parsed;
    try{parsed=JSON.parse(fr.result)}catch(e){alert('Esse arquivo não é um backup válido (JSON inválido).');return}
    const raw=parsed&&parsed.db?parsed.db:parsed;
    if(!raw||!Array.isArray(raw.animals)||!Array.isArray(raw.seasons)){alert('Esse arquivo não parece ser um backup do IATF MRA.');return}
    const nSeasons=raw.seasons.length,nAnimals=raw.animals.length,nIatf=(raw.iatf||[]).length,nSemen=(raw.semen||[]).length;
    const dataInfo=parsed.exportedAt?new Date(parsed.exportedAt).toLocaleString('pt-BR'):'(data desconhecida)';
    openModal(`<h2>⚠️ Restaurar backup</h2>
    <div class="notice">Este backup foi baixado em <strong>${esc(dataInfo)}</strong> e contém:<br>
    • ${nSeasons} estação(ões)<br>• ${nAnimals} matriz(es) no total (todas as estações)<br>• ${nIatf} lançamento(s) de IATF<br>• ${nSemen} cadastro(s) de sêmen</div>
    <div class="notice" style="background:#fde7e5;border-color:#f1c9c1;color:#7a2318"><strong>Isso vai SUBSTITUIR TUDO que está no sistema agora</strong> (Firestore incluído, em todos os dispositivos conectados). Tudo que foi feito depois da data deste backup será perdido. Essa ação não tem desfazer.</div>
    <div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="danger-btn" onclick="confirmRestoreBackup()">Sim, restaurar mesmo assim</button></div>`);
    window.__pendingRestore=raw;
  };
  fr.readAsText(file);
} window.restoreFullBackup=restoreFullBackup;
function confirmRestoreBackup(){
  const raw=window.__pendingRestore;if(!raw)return;
  db=migrate(deepClone(raw));
  window.__pendingRestore=null;
  resetUndoBaseline(true);
  try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){}
  closeModal();
  localWritePending=true;
  setSyncStatus('saving','Restaurando backup...');
  syncToFirestore();
  render();
  alert('Backup restaurado. Confira os dados.');
} window.confirmRestoreBackup=confirmRestoreBackup;

/* Linhas de exportação, usadas no Excel da IATF e no Excel geral da estação */
function iatfExportRow(r){return {DATA_IATF:fmtDate(cycleDate(r.cycle)),RGD:r.rgd,'1_ACASALAMENTO':r.firstSire,'2_ACASALAMENTO_CURRAL':r.secondSire||'',QTD:r.qty,RESULTADO:r.result,RETORNO:fmtDate(r.return),TOURO_RETORNO:r.returnSire||'',RESULTADO_RETORNO:r.returnResult||'',CATEGORIA:r.category}}
// Uma aba por IATF ("1ª IATF", "2ª IATF"...), só das IATFs que têm lançamento
function iatfSheets(rows){
  const cycles=[...new Set(rows.map(r=>Number(r.cycle)))].sort((a,b)=>a-b);
  return cycles.map(c=>[`${c}ª IATF`,rows.filter(r=>Number(r.cycle)===c).map(iatfExportRow)]);
}
// Várias abas num arquivo só; abas sem linha nenhuma ficam de fora
async function downloadSheets(sheets,fname){
  sheets=sheets.filter(([,rows])=>rows&&rows.length);
  if(!sheets.length)return alert('Nenhuma linha pra exportar.');
  if(typeof ExcelJS==='undefined'){
    if(!needXLSX())return;
    const wb=XLSX.utils.book_new();
    sheets.forEach(([nome,rows])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),nome));
    downloadWorkbook(wb,fname);return;
  }
  const wb=new ExcelJS.Workbook();
  sheets.forEach(([nome,rows])=>xlsxFillSheet(wb.addWorksheet(nome),rows));
  await downloadExcelJSWorkbook(wb,fname);
}
/* Excel geral da estação (Configurações): tudo num arquivo só */
async function exportSeasonAll(){
  const est=activeSeason();
  const byRgd=(a,b)=>String(a.rgd).localeCompare(String(b.rgd),'pt-BR',{numeric:true});
  const iatfRows=seasonRows().slice().sort((a,b)=>String(a.category).localeCompare(String(b.category))||byRgd(a,b));
  const matRows=seasonAnimals().slice().sort(byRgd)

function readExcel(file,cb){if(!file||!needXLSX())return;const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(fr.result,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}))}catch(e){alert('Não consegui ler o Excel: '+e.message)}};fr.readAsArrayBuffer(file)}
function pick(row,names){const keys=Object.keys(row);for(const n of names){const k=keys.find(k=>norm(k)===norm(n));if(k)return row[k]}return''}
function importAnimalsExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const errs=[],prepared=[],seen=new Set();
    rows.forEach((r,i)=>{
      const line=i+2;
      const rgd=String(pick(r,['RGD','MATRIZ','MATRIZES'])||Object.values(r)[0]||'').trim();
      if(!rgd)return;
      const sire=String(pick(r,['1_ACASALAMENTO','1 ACASALAMENTO','1º ACASALAMENTO'])||'').trim();
      let cat=String(pick(r,['CATEGORIA'])||'').trim();
      if(sire && !sireExists(sire)){errs.push(`Linha ${line}: touro "${sire}" não existe no Estoque.`);return}
      if(cat){const m=matchList(categories(),cat);if(!m){errs.push(`Linha ${line}: categoria "${cat}" não existe (use: ${categories().join(', ')}).`);return}cat=m}
      if(seen.has(norm(rgd))){errs.push(`Linha ${line}: RGD "${rgd}" duplicado no arquivo.`);return}
      seen.add(norm(rgd));
      prepared.push({rgd,sire,cat});
    });
    if(errs.length){showImportErrors('Importação com problemas',`Corrija ${errs.length} linha(s) e envie o Excel novamente. Nenhuma matriz foi importada.`,errs);return}
    if(!prepared.length)return alert('Nenhum RGD encontrado no arquivo.');
    let novos=0,atualizados=0;
    prepared.forEach(x=>{
      const existing=seasonAnimals().find(a=>norm(a.rgd)===norm(x.rgd));
      if(existing){
        if(x.sire&&norm(x.sire)!==norm(currentSire(existing)))setAnimalSire(existing,x.sire);
        if(x.cat)existing.category=x.cat;
        atualizados++;
      }else{
        db.animals.push({id:uid('a'),seasonId:db.meta.activeSeasonId,rgd:x.rgd,firstSire:x.sire,category:x.cat||categories()[0],active:true,createdAt:todayISO()});
        novos++;
      }
      // sincroniza com lançamentos de IATF já existentes dessa matriz nesta estação
      db.iatf.forEach(r=>{
        if(r.seasonId===db.meta.activeSeasonId && norm(r.rgd)===norm(x.rgd)){
          if(x.cat)r.category=x.cat;
        }
      });
    });
    save();
    alert(`${novos} matriz(es) nova(s) e ${atualizados} atualizada(s) nesta estação.`);
    if(page==='animals')animals()
  })
}

/* Excel "normal": só o cabeçalho em negrito e a largura das colunas ajustada. Sem cor, sem
   zebra, sem borda, sem filtro e sem congelar — planilha comum, livre pra formatar/editar como
   quiser. Todos os botões "Baixar Excel" do sistema passam por aqui. */
function xlsxColumnsFor(rows){
  const keys=Object.keys(rows[0]);
  return keys.map(k=>{
    const headerLabel=String(k).replace(/_/g,' ');
    const maxLen=Math.max(headerLabel.length,...rows.map(r=>String(r[k]??'').length));
    return {header:headerLabel,key:k,width:Math.min(42,Math.max(10,maxLen+3))};
  });
}
function xlsxFillSheet(ws,rows){
  ws.columns=xlsxColumnsFor(rows);
  ws.getRow(1).font={bold:true};
  rows.forEach(r=>ws.addRow(r));
}
async function downloadExcelJSWorkbook(wb,name){
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function jsonToXlsx(rows,name,sheet){
  if(!rows||!rows.length)return alert('Nenhuma linha pra exportar.');
  if(typeof ExcelJS==='undefined'){
    // biblioteca avançada não carregou — cai pro Excel simples, sem travar o download
    if(!needXLSX())return;
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheet);downloadWorkbook(wb,name);
    return;
  }
  const wb=new ExcelJS.Workbook();
  xlsxFillSheet(wb.addWorksheet(sheet||'Dados'),rows);
  await downloadExcelJSWorkbook(wb,name);
}

async function bootAuth(){
  try{
    if(!window.firebase)throw new Error('SDK do Firebase não carregou.');
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    document.getElementById('logoutBtn').addEventListener('click',async()=>{await auth.signOut();location.href='../index.html'});

    auth.onAuthStateChanged(async user=>{
      if(user){
        // Permissão vem do App Nelore MRA: admin vê tudo; os outros precisam ter o IATF liberado
        const isAdmin=String(user.email||'').toLowerCase()===ADMIN_EMAIL;
        if(!isAdmin){
          let perfil=null;
          try{const d=await firebase.firestore().collection('users').doc(user.uid).get();perfil=d.exists?d.data():null;try{localStorage.setItem('app-nelore-mra-perfil-'+user.uid,JSON.stringify(perfil))}catch(_){}}catch(e){console.warn(e);try{perfil=JSON.parse(localStorage.getItem('app-nelore-mra-perfil-'+user.uid)||'null')}catch(_){}}
          if(!perfil||perfil.ativo===false||!(perfil.apps&&perfil.apps.iatf)){alert('Você não tem acesso ao IATF. Fale com o administrador.');location.href='../index.html';return}
          const pg=perfil.paginas&&perfil.paginas.iatf;
          ALLOWED_PAGES=Array.isArray(pg)&&pg.length?pg:null;
        }
        document.body.classList.remove('auth-pending','auth-logged-out');
        document.body.classList.add('authenticated');
        if(!appStarted){
          appStarted=true;
          init().catch(e=>{console.error(e);setSyncStatus('error','Problema de conexão')});
        }
      }else{
        location.href='../index.html';return;
        document.body.classList.remove('auth-pending','authenticated');
        document.body.classList.add('auth-logged-out');
        if(unsubscribeFirestore){try{unsubscribeFirestore()}catch(e){} unsubscribeFirestore=null}
        firestore=null;stateRef=null;
      }
    });
  }catch(e){
    console.error('Erro ao iniciar autenticação:',e);
    document.body.classList.remove('auth-pending');
    document.body.classList.add('auth-logged-out');
    const err=document.getElementById('loginError');
    if(err)err.textContent='Não foi possível conectar ao Firebase.';
  }
}
bootAuth();
</script>
</body></html>
