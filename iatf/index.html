/* DASHBOARD */

<script>
const DEFAULT_DB={"animals":[],"semen":[],"iatf":[],"meta":{"activeSeasonId":"season-2026-27"},"seasons":[{"id":"season-2026-27","name":"Estação 2026/27","startDate":"2026-07-01","endDate":"2027-06-30","active":true}],"settings":{"bullMinUses":5,"bullPriorStrength":5,"lowStock":3}};
const STORE='app-nelore-mra-iatf';
const DEFAULT_CATEGORIES=['Vacas','Primíparas','Precocinha'];
const DEFAULT_DESTINOS=['Abate','Receptora'];
const FIREBASE_CONFIG={
  apiKey:'AIzaSyD9yib_iQYHcOG2B2C70cWXJ9SkTiIDt94',
  authDomain:'app-nelore-mra.firebaseapp.com',
  projectId:'app-nelore-mra',
  storageBucket:'app-nelore-mra.firebasestorage.app',
  messagingSenderId:'1043343802346',
  appId:'1:1043343802346:web:219f5d73748271a85dfc93'
};
const ADMIN_EMAIL='mandrade.gado@terra.com.br';
// Telas liberadas pra este usuário (null = todas). Vem de users/{uid}.paginas.iatf no App Nelore MRA.
let ALLOWED_PAGES=null;
let firestore=null, stateRef=null, syncTimer=null, unsubscribeFirestore=null, applyingRemote=false, lastRemoteJSON='';

let db=null,page='dashboard',iatfCategory='',iatfCycle=1,animalSelecting=false,animalSelected=new Set();
let undoStack=[],undoBaselineJSON='',suppressUndoHistory=false,localWritePending=false;
const UNDO_LIMIT=50;
let animalSort={key:'',dir:1},iatfSort={key:'',dir:1},stockSort={key:'',dir:1};
let animalFilters={rgd:'',firstSire:'',category:'',status:''};
let iatfFilters={rgd:'',firstSire:'',qty:'',result:'',category:'',cycle:1};
let stockFilters={name:'',rgdTouro:'',tank:'',caneca:'',saldo:''};
let excelFilters={animals:{},iatf:{},stock:{},acasal:{},embrioes:{},fiv:{}};
let acasalSort={key:'',dir:1};
let embrioesSort={key:'',dir:1};
let fivSort={key:'',dir:1};
let fivData=null; // FIV (data) aberta na tela
let excelFilterContext=null;

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const norm=s=>String(s??'').trim().toUpperCase();
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const fmtDate=s=>{if(!s)return'';const [y,m,d]=String(s).slice(0,10).split('-');return y&&m&&d?`${d}/${m}/${y}`:s};
const csvSafe=s=>String(s??'');
function deepClone(x){return JSON.parse(JSON.stringify(x))}
function migrate(x){
  x=x||deepClone(DEFAULT_DB);
  x.seasons=x.seasons||[{id:'season-2026-27',name:'Estação 2026/27',startDate:'2026-07-01',endDate:'2027-06-30',active:true}];
  x.settings={bullMinUses:5,bullPriorStrength:5,...(x.settings||{})};
  if(!Array.isArray(x.settings.categories)||!x.settings.categories.length)x.settings.categories=DEFAULT_CATEGORIES.slice();
  if(!Array.isArray(x.settings.destinos)||!x.settings.destinos.length)x.settings.destinos=DEFAULT_DESTINOS.slice();
  x.meta=x.meta||{};x.meta.activeSeasonId=x.meta.activeSeasonId||x.seasons[0].id;
  x.cycleDates=x.cycleDates||{};
  x.iatfCycleCategories=x.iatfCycleCategories||{};
  x.iatfMaxCycles=x.iatfMaxCycles||{};
  x.fivDatas=x.fivDatas||{};
  x.fivLocais=x.fivLocais||{}; // Local de cada FIV: fivLocais[estação][data] // FIVs criadas (por data) em cada estação
  x.animals=x.animals||[];x.semen=x.semen||[];x.iatf=x.iatf||[];
  x.deletedAnimals=x.deletedAnimals||[];
  x.acasalamentos=x.acasalamentos||[];
  x.acasalamentos.forEach(a=>{if(!a.createdAt)a.createdAt='2026-08-30'});
  x.naoUtilizadas=x.naoUtilizadas||[];
  x.embrioes=x.embrioes||[];
  x.fiv=x.fiv||[];
  x.iatfExcluded=x.iatfExcluded||[];
  x.animals.forEach(a=>{a.active=true;if(!a.seasonId)a.seasonId=x.meta.activeSeasonId;if(!a.createdAt)a.createdAt='2026-08-30'});
  (x.deletedAnimals||[]).forEach(d=>{if(d.animal&&!d.animal.seasonId)d.animal.seasonId=x.meta.activeSeasonId});

  // --- MIGRAÇÃO v7: o "touro" passa a ser o antigo NOME DO BOTIJÃO ---
  // Onde o nome do botijão estava vazio, mantém o cadastro antigo (joga pro lado).
  if(!x.meta.stockMigrated_v7){
    const rename={};
    (x.semen||[]).forEach(s=>{
      const novo=String(s.tankName||'').trim()||String(s.name||'').trim();
      if(novo && novo!==s.name) rename[s.name]=novo;
      s.name=novo;
    });
    // remapeia acasalamentos das matrizes e das IATFs
    (x.animals||[]).forEach(a=>{if(rename[a.firstSire])a.firstSire=rename[a.firstSire]});
    (x.iatf||[]).forEach(r=>{
      if(rename[r.firstSire])r.firstSire=rename[r.firstSire];
      if(rename[r.secondSire])r.secondSire=rename[r.secondSire];
    });
    // junta eventuais duplicados criados pela fusão
    const byName={};const merged=[];
    (x.semen||[]).forEach(s=>{
      const k=norm(s.name);
      if(!k)return;
      if(byName[k]){
        byName[k].initial=Number(byName[k].initial||0)+Number(s.initial||0);
        byName[k].tank=byName[k].tank||s.tank;
        byName[k].caneca=byName[k].caneca||s.caneca;
      }else{byName[k]=s;merged.push(s)}
    });
    x.semen=merged;
    x.meta.stockMigrated_v7=true;
  }

  // --- MIGRAÇÃO v8: padroniza TUPA como TUPA MRA no estoque e nos vínculos ---
  if(!x.meta.tupaMra_v8){
    (x.semen||[]).forEach(s=>{if(norm(s.name)==='TUPA')s.name='TUPA MRA'});
    (x.animals||[]).forEach(a=>{if(norm(a.firstSire)==='TUPA')a.firstSire='TUPA MRA'});
    (x.iatf||[]).forEach(r=>{if(norm(r.firstSire)==='TUPA')r.firstSire='TUPA MRA';if(norm(r.secondSire)==='TUPA')r.secondSire='TUPA MRA'});
    (x.deletedAnimals||[]).forEach(d=>{
      if(d.animal&&norm(d.animal.firstSire)==='TUPA')d.animal.firstSire='TUPA MRA';
      (d.iatf||[]).forEach(r=>{if(norm(r.firstSire)==='TUPA')r.firstSire='TUPA MRA';if(norm(r.secondSire)==='TUPA')r.secondSire='TUPA MRA'});
    });
    x.meta.tupaMra_v8=true;
  }

  x.semen.forEach(s=>{
    s.active=true;
    s.rgdTouro=s.rgdTouro||'';
    s.addedDate=s.addedDate||'';
    if(s.usedOverride===undefined)s.usedOverride=null;
    delete s.tankName;
  });
  x.iatf.forEach(r=>{
    r.seasonId=r.seasonId||x.meta.activeSeasonId;
    if(r.date && !((x.cycleDates[r.seasonId]||{})[r.cycle])){
      x.cycleDates[r.seasonId]=x.cycleDates[r.seasonId]||{};
      x.cycleDates[r.seasonId][r.cycle]=r.date;
    }
    delete r.date;
    r.firstSire=String(r.firstSire||'').trim();
    r.secondSire=String(r.secondSire||'').trim();
    r.return=r.return||'';
    r.caneca=String(r.caneca||'').trim();
    r.returnSire=String(r.returnSire||'').trim();
    r.returnResult=normResult(r.returnResult);
    r.qty=Number(r.qty||0); r.result=normResult(r.result);
  });
  // Reconciliação: se a matriz chegou sem 1º acasalamento mas já existe um lançamento de IATF dela
  // com o acasalamento preenchido (dados restaurados/importados fora do fluxo normal de edição),
  // puxa esse valor pra Matriz. O inverso também vale: matriz com acasalamento/categoria preenchidos
  // "empresta" o valor pros lançamentos de IATF dela que ainda estiverem vazios/desatualizados.
  (x.animals||[]).forEach(a=>{
    const rows=(x.iatf||[]).filter(r=>r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd));
    if(!rows.length)return;
    // Cada IATF guarda o seu touro: só empresta o da matriz se NENHUMA IATF dela tiver touro
    // (dados importados). Se tiver, não mexe — senão uma IATF nova deixada em branco (ex.: 5ª)
    // voltava com o touro da 1ª ao recarregar.
    const algumTouro=rows.some(r=>r.firstSire);
    if(!a.firstSire&&algumTouro){
      const top=rows.slice().sort((p,q)=>Number(q.cycle)-Number(p.cycle))[0];
      a.firstSire=top.returnSire||top.firstSire||'';
    }
    rows.forEach(r=>{
      if(!algumTouro && !r.firstSire && a.firstSire)r.firstSire=a.firstSire;
      if(a.category)r.category=a.category;
    });
  });
  // Categorias vinculadas a cada IATF. Na primeira migração, infere das linhas já existentes.
  if(!x.meta.iatfCycleCategories_v9){
    (x.iatf||[]).forEach(r=>{
      const sid=r.seasonId||x.meta.activeSeasonId, cy=String(Number(r.cycle)||1);
      x.iatfCycleCategories[sid]=x.iatfCycleCategories[sid]||{};
      x.iatfCycleCategories[sid][cy]=x.iatfCycleCategories[sid][cy]||[];
      if(r.category&&!x.iatfCycleCategories[sid][cy].includes(r.category))x.iatfCycleCategories[sid][cy].push(r.category);
    });
    x.meta.iatfCycleCategories_v9=true;
  }
  // --- MIGRAÇÃO v10: Acasalamentos, Não Utilizadas e FIV passam a pertencer a uma estação
  // (igual Matrizes/IATF já eram). Nada é apagado — os lançamentos que já existiam viram
  // pertencentes à estação que estava ativa até agora, então continuam exatamente onde estavam.
  if(!x.meta.seasonScopedExtras_v10){
    (x.acasalamentos||[]).forEach(a=>{if(!a.seasonId)a.seasonId=x.meta.activeSeasonId});
    (x.naoUtilizadas||[]).forEach(a=>{if(!a.seasonId)a.seasonId=x.meta.activeSeasonId});
    (x.fiv||[]).forEach(a=>{if(!a.seasonId)a.seasonId=x.meta.activeSeasonId});
    x.meta.seasonScopedExtras_v10=true;
  }
  (x.fiv||[]).forEach(f=>{if(f.data===undefined)f.data=''});
  // restos das antigas "Configurações avançadas" (removidas)
  delete x.settings.noticeTexts;delete x.settings.brandName;delete x.settings.brandSubtitle;
  return x
}
// PRT substitui o antigo "M" (matar). PRT conta como não-prenha nos cálculos.
function normResult(v){v=norm(v);if(v==='M')v='PRT';return ['P','V','PRT'].includes(v)?v:''}
function setSyncStatus(kind,text){
  const dot=$('#syncDot'), s=$('#saveStatus');
  const colors={ok:'#6fd598',saving:'#e0b84f',error:'#e35d50',offline:'#e35d50'};
  if(dot)dot.style.background=colors[kind]||colors.saving;
  if(s)s.textContent=text||({ok:'Sincronizado',saving:'Salvando...',error:'Problema de conexão',offline:'Problema de conexão'}[kind]||'Conectando...');
}
function updateUndoButton(){
  const b=$('#undoBtn');if(b)b.disabled=!undoStack.length;
}
function resetUndoBaseline(clearHistory=false){
  undoBaselineJSON=JSON.stringify(deepClone(db));
  if(clearHistory)undoStack=[];
  updateUndoButton();
}
function registerUndoSnapshot(){
  const current=JSON.stringify(deepClone(db));
  if(!undoBaselineJSON){undoBaselineJSON=current;return}
  if(current===undoBaselineJSON)return;
  if(!suppressUndoHistory){
    undoStack.push(undoBaselineJSON);
    if(undoStack.length>UNDO_LIMIT)undoStack.shift();
  }
  undoBaselineJSON=current;
  updateUndoButton();
}
function undoLastChange(){
  if(!undoStack.length)return;
  closeExcelFilter();
  clearTimeout(syncTimer);
  const previous=undoStack.pop();
  suppressUndoHistory=true;
  try{
    db=migrate(JSON.parse(previous));
    undoBaselineJSON=JSON.stringify(deepClone(db));
    try{localStorage.setItem(STORE,undoBaselineJSON)}catch(e){console.warn('Cache local:',e)}
    render();
    // Desfazer é uma nova alteração local: volta o estado e grava a reversão no Firebase.
    localWritePending=true;
    setSyncStatus('saving','Salvando desfazer...');
    syncTimer=setTimeout(syncToFirestore,0);
  }finally{suppressUndoHistory=false;updateUndoButton()}
}
window.undoLastChange=undoLastChange;
let lastLocalEditAt=0;
let gridBatch=false, gridBatchDirty=false; // colando (Ctrl+V): junta tudo num salvamento e num Desfazer só
const PENDING_KEY=STORE+'-pending';
function save(renderToo=false){
  if(gridBatch){gridBatchDirty=true;if(renderToo)render();return}
  registerUndoSnapshot();
  try{
    localStorage.setItem(STORE,JSON.stringify(db));
    // Marca que existe uma alteração ainda não confirmada no Firebase. Só some quando o envio
    // realmente terminar com sucesso — é o que impede um F5 rápido demais de "desfazer" sua
    // edição (antes, ao recarregar, a tela sempre confiava mais no Firebase do que no que você
    // tinha acabado de fazer, e como o Firebase ainda não tinha recebido, ele te atropelava).
    localStorage.setItem(PENDING_KEY,String(Date.now()));
  }catch(e){console.warn('Cache local:',e)}
  if(renderToo)render();
  if(applyingRemote)return;
  lastLocalEditAt=Date.now();
  localWritePending=true;
  setSyncStatus('saving','Salvando...');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(syncToFirestore,250);
}
async function syncToFirestore(){
  if(!stateRef){setSyncStatus('error','Problema de conexão');return}
  try{
    const clean=deepClone(db);
    await stateRef.set({db:clean,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    lastRemoteJSON=JSON.stringify(clean);
    localWritePending=false;
    try{localStorage.removeItem(PENDING_KEY)}catch(e){}
    setSyncStatus('ok','Sincronizado');
  }catch(e){
    console.error('Erro ao sincronizar com Firestore:',e);
    localWritePending=false;
    // NÃO remove o PENDING_KEY aqui — o envio falhou de verdade, então a proteção contra F5
    // continua valendo (e a próxima abertura do app tenta reenviar sozinha).
    setSyncStatus('error','Problema de conexão');
  }
}

function activeSeason(){return db.seasons.find(s=>s.id===db.meta.activeSeasonId)||db.seasons[0]}
function seasonRows(){return db.iatf.filter(r=>r.seasonId===db.meta.activeSeasonId)}
function seasonAnimals(sid=db.meta.activeSeasonId){return db.animals.filter(a=>a.seasonId===sid)}
function seasonAcasal(sid=db.meta.activeSeasonId){return (db.acasalamentos||[]).filter(a=>a.seasonId===sid)}
function seasonNaoUtil(sid=db.meta.activeSeasonId){return (db.naoUtilizadas||[]).filter(a=>a.seasonId===sid)}
function seasonFiv(sid=db.meta.activeSeasonId){return (db.fiv||[]).filter(a=>a.seasonId===sid)}
function cycleDate(c){return ((db.cycleDates||{})[db.meta.activeSeasonId]||{})[Number(c)]||''}
function setCycleDate(c,v){db.cycleDates[db.meta.activeSeasonId]=db.cycleDates[db.meta.activeSeasonId]||{};db.cycleDates[db.meta.activeSeasonId][Number(c)]=v;save()}
function sireNames(){return [...new Set(db.semen.map(s=>String(s.name||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function sireExists(name){const n=norm(name);return sireNames().some(x=>norm(x)===n)}
function bullDatalist(){return `<datalist id="bullsList">${sireNames().map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist>`}
// Doses usadas: Qtd da IATF no touro da IATF + 1 dose por retorno no touro do retorno.
function usedSemen(){const u={};db.iatf.forEach(r=>{const s=norm(r.firstSire);if(s&&Number(r.qty)>0)u[s]=(u[s]||0)+Number(r.qty);const rs=norm(r.returnSire);if(rs)u[rs]=(u[rs]||0)+1});return u}
/* RETORNO — inseminação no curral depois de uma IATF (ex: apareceu no cio). Fica na mesma linha
   da IATF: data (r.return), touro (r.returnSire, gasta 1 dose) e resultado (r.returnResult).
   Ordem dos eventos da matriz: IATF N → retorno da N → IATF N+1 → ... */
function stockCaneca(name){const n=norm(name);if(!n)return '';const s=db.semen.find(x=>norm(x.name)===n);return s?String(s.caneca||''):''}
// Nº Caneca da linha da IATF: o que foi digitado nela; se vazio, puxa a caneca do touro no Estoque
function iatfCaneca(r){return String(r.caneca||'').trim()||stockCaneca(r.firstSire)}
function hasReturn(r){return !!(String(r.return||'').trim()||String(r.returnSire||'').trim()||normResult(r.returnResult))}
// resultado que vale pra linha: o do retorno (acontece depois da IATF), senão o da IATF
function effectiveResult(r){return normResult(r.returnResult)||normResult(r.result)}
function iatfRowIsEmpty(r){return !Number(r.qty)&&!normResult(r.result)&&!String(r.secondSire||'').trim()&&!hasReturn(r)}
function animalIatfRows(a){return db.iatf.filter(r=>r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd)).sort((x,y)=>Number(y.cycle)-Number(x.cycle))}
// Touro atual da matriz = o da ÚLTIMA IATF em que ela está (ou o do retorno dessa IATF, se tiver).
// Nunca olha IATFs anteriores: se ela está na 1ª (sem resultado) e já foi colocada na 4ª com outro
// touro, vale o da 4ª — mesmo que a 4ª ainda esteja sem touro, trocar a 1ª não mexe aqui.
function currentSire(a){
  const top=animalIatfRows(a)[0];
  if(!top)return a.firstSire||'';
  return String(top.returnSire||'').trim()?top.returnSire:(top.firstSire||'');
}
function syncAnimalSire(seasonId,rgd){const a=db.animals.find(x=>x.seasonId===seasonId&&norm(x.rgd)===norm(rgd));if(a)a.firstSire=currentSire(a)}
// Trocar o touro pela aba Matrizes mexe só na última inseminação (não reescreve IATFs antigas)
function setAnimalSire(a,val){
  const top=animalIatfRows(a)[0];
  if(top){if(String(top.returnSire||'').trim())top.returnSire=val;else top.firstSire=val}
  a.firstSire=val;
}
function usedAuto(s){return usedSemen()[norm(s.name)]||0}
function usedEffective(s){return (s.usedOverride===null||s.usedOverride===undefined)?usedAuto(s):Number(s.usedOverride||0)}
function stockBalance(s){return Number(s.initial||0)-usedEffective(s)}
function normalizedResult(r){return normResult(r)}
function isDiagnosed(r){return ['P','V','PRT'].includes(normResult(r))}
function latestStatus(rgd){
  const rows=seasonRows().filter(r=>r.rgd===rgd&&effectiveResult(r)).sort((a,b)=>Number(b.cycle)-Number(a.cycle));
  return rows.length?effectiveResult(rows[0]):''
}

async function init(){
  let localDb;
  let hadPendingWrite=false;
  try{
    const saved=localStorage.getItem(STORE);
    localDb=migrate(saved?JSON.parse(saved):deepClone(DEFAULT_DB));
    // Só confia na alteração pendente se for recente (30 min). Uma pendência velha (celular que ficou
    // dias fechado) NÃO pode subir por cima do que os outros lançaram depois.
    const pend=Number(localStorage.getItem(PENDING_KEY)||0);
    hadPendingWrite=pend>0&&Date.now()-pend<30*60*1000;
    if(!hadPendingWrite)localStorage.removeItem(PENDING_KEY);
  }catch(e){
    console.warn('Não foi possível ler o cache local:',e);
    localDb=migrate(deepClone(DEFAULT_DB));
  }
  db=localDb;
  resetUndoBaseline(true);
  bind();
  loadViewState();
  applyAllowedPages();
  render();
  setSyncStatus('saving','Conectando...');
  try{
    if(!window.firebase)throw new Error('SDK do Firebase não carregou. Verifique a internet.');
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    firestore=firebase.firestore();
    stateRef=firestore.collection('apps').doc('iatf');
    if(hadPendingWrite){
      // Da última vez que o app rodou, teve uma alteração que ainda não tinha sido confirmada
      // no Firebase (provavelmente a página foi recarregada rápido demais logo depois de editar
      // algo). Em vez de puxar o que está no Firebase — que estaria desatualizado e apagaria
      // essa edição de novo — manda o que está salvo localmente PRIMEIRO, pra não perder nada.
      setSyncStatus('saving','Terminando de salvar uma alteração pendente...');
      await syncToFirestore();
      lastRemoteJSON=JSON.stringify(deepClone(db));
    }
    const snap=hadPendingWrite?null:await stateRef.get();
    if(snap && snap.exists && snap.data() && snap.data().db){
      applyingRemote=true;
      db=migrate(snap.data().db);
      localStorage.setItem(STORE,JSON.stringify(db));
      lastRemoteJSON=JSON.stringify(deepClone(db));
      resetUndoBaseline(true);
      applyingRemote=false;
      render();
      setSyncStatus('ok','Sincronizado');
    }else if(!hadPendingWrite&&snap&&!snap.metadata.fromCache){
      // Primeira abertura: envia a base atual da V6 ao Firestore.
      await stateRef.set({db:deepClone(db),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      lastRemoteJSON=JSON.stringify(deepClone(db));
      setSyncStatus('ok','Sincronizado');
    }
    unsubscribeFirestore=stateRef.onSnapshot(s=>{
      if(!s.exists || !s.data() || !s.data().db)return;
      const incoming=migrate(s.data().db);
      const incomingJSON=JSON.stringify(deepClone(incoming));
      if(incomingJSON===lastRemoteJSON)return;
      // Se o Firestore devolveu exatamente o estado que já está na tela, é o nosso próprio salvamento.
      // Atualiza só o status e NÃO renderiza a página inteira (evita pulo de rolagem/foco).
      const currentJSON=JSON.stringify(deepClone(db));
      if(incomingJSON===currentJSON){lastRemoteJSON=incomingJSON;setSyncStatus('ok','Sincronizado');return}
      // Enquanto há uma gravação local (inclusive Desfazer), ignora um snapshot remoto antigo
      // para ele não apagar a alteração nem limpar o histórico. Também ignora nos 1.5s logo após
      // qualquer edição local — evita que um "eco" do Firestore, chegando um pouquinho atrasado
      // enquanto você ainda está digitando em outra célula, sobrescreva algo que você acabou de
      // digitar e ainda não deu tempo de sincronizar (era uma causa provável de valor "sumindo").
      if(localWritePending || (Date.now()-lastLocalEditAt)<1500)return;
      applyingRemote=true;
      db=incoming;
      lastRemoteJSON=incomingJSON;
      try{localStorage.setItem(STORE,incomingJSON)}catch(e){}
      // Mudança realmente vinda de outro dispositivo: atualiza a base, mas NÃO apaga o histórico local.
      resetUndoBaseline(false);
      applyingRemote=false;
      // volta o foco pra mesma célula (senão a atualização de outro aparelho "tira" você da célula)
      const fa=document.activeElement,fi=fa&&fa.classList&&fa.classList.contains('cell-input')?gridInfo(fa):null,fh=fi&&gridHostId(fi.table);
      render();
      if(fi){const t=gridCellInputAt(gridTableOf(fh,fi.table),fi.r,fi.c);if(t)t.focus()}
      setSyncStatus('ok','Sincronizado');
    },err=>{
      console.error('Listener Firestore:',err);
      setSyncStatus('error','Problema de conexão');
    });
    window.addEventListener('online',()=>{setSyncStatus('saving','Reconectando...');syncToFirestore()});
    window.addEventListener('offline',()=>setSyncStatus('offline','Problema de conexão'));
  }catch(e){
    console.error('Erro ao conectar ao Firebase:',e);
    setSyncStatus('error','Problema de conexão');
  }
}

/* LARGURA DAS COLUNAS — arrasta a borda direita do cabeçalho, igual Excel. Duplo clique volta ao
   automático. Fica salvo neste navegador (cada computador/celular guarda o seu). */
const COLW_KEY='app-nelore-mra-iatf-col-widths';
const RESIZABLE_TABLES=['animalTable','iatfTable','stockTable','acasalTable','fivTable'];
let colWidths=(()=>{try{return JSON.parse(localStorage.getItem(COLW_KEY)||'{}')||{}}catch(e){return {}}})();
function saveColWidths(){try{localStorage.setItem(COLW_KEY,JSON.stringify(colWidths))}catch(e){}}
function colLabel(th){return (th.textContent||'').replace(/▼/g,'').trim()}
function applyColWidths(){
  let css='';
  RESIZABLE_TABLES.forEach(id=>{
    const host=document.getElementById(id);if(!host)return;
    host.querySelectorAll('thead tr:first-child th').forEach((th,i)=>{
      const lab=colLabel(th);if(!lab)return;
      if(!th.querySelector('.col-resizer')){
        const h=document.createElement('div');h.className='col-resizer';h.title='Arraste pra mudar a largura (duplo clique volta ao normal)';
        h.addEventListener('mousedown',e=>colResizeStart(e,id,lab,th));
        h.addEventListener('dblclick',e=>{e.stopPropagation();if(colWidths[id]){delete colWidths[id][lab];saveColWidths();applyColWidths()}});
        h.addEventListener('click',e=>e.stopPropagation());
        th.appendChild(h);
      }
      const px=(colWidths[id]||{})[lab];
      if(px){const n=i+1;css+=`#${id} thead th:nth-child(${n}),#${id} tbody td:nth-child(${n}){width:${px}px!important;min-width:${px}px!important;max-width:${px}px!important;overflow:hidden}#${id} tbody td:nth-child(${n}) .cell-input{min-width:0!important;width:100%!important;max-width:100%!important}`}
    });
  });
  let st=document.getElementById('colWidthStyle');
  if(!st){st=document.createElement('style');st.id='colWidthStyle';document.head.appendChild(st)}
  if(st.textContent!==css)st.textContent=css;
}
function colResizeStart(e,id,lab,th){
  e.preventDefault();e.stopPropagation();
  const z=(tableZoomPct||100)/100,startX=e.clientX,startW=th.offsetWidth,h=e.currentTarget;
  h.classList.add('dragging');document.body.style.cursor='col-resize';
  const move=ev=>{colWidths[id]=colWidths[id]||{};colWidths[id][lab]=Math.max(36,Math.round(startW+(ev.clientX-startX)/z));applyColWidths()};
  const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);h.classList.remove('dragging');document.body.style.cursor='';saveColWidths()};
  document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
}

function restoreViewPosition(pos){

/* ===== MINI-EXCEL ==================================================================
   Seleção de intervalo (clica e arrasta, ou Shift+seta), copiar (Ctrl+C), colar (Ctrl+V)

   QUALQUER tabela editável do sistema (Matrizes, IATF, Acasalamentos, Embriões, FIV,
   Estoque), sem precisar mexer em cada tela: fica escutando o documento inteiro. */
// Colar mais linhas do que a tabela tem: cria as que faltam (por id do container da tabela)
const GRID_ADD_ROWS={
  fivTable:n=>{const d=fivAtual();if(d===null)return;fivSort={key:'',dir:1};
    for(let i=0;i<n;i++)db.fiv.push({id:uid('fiv'),seasonId:db.meta.activeSeasonId,rgdDoadora:'',sire:'',receptora:'',abcz:'',tipo:'',data:d,resultado:''});renderFivTable()},
  acasalTable:n=>{acasalSort={key:'',dir:1};
    for(let i=0;i<n;i++)db.acasalamentos.push({id:uid('ac'),seasonId:db.meta.activeSeasonId,rgd:'',category:'',iatf1:'',iatf2:'',iatf3:'',iatf4:'',fiv1:'',fiv2:'',createdAt:todayISO()});renderAcasalTable()},
  embrioesTable:n=>{embrioesSort={key:'',dir:1};
    for(let i=0;i<n;i++)db.embrioes.push({id:uid('emb'),rgd:'',touro:'',estFresco:0,estVit:0,estDt:0,saidaFresco:0,saidaVit:0,saidaDt:0});renderEmbrioesTable()}
};
const gridHostId=table=>{const h=table&&table.closest('[id]');return h?h.id:''};
const gridTableOf=(hostId,fallback)=>(hostId&&document.getElementById(hostId)?.querySelector('table'))||fallback;
// mostra a célula na tela (igual Excel: a tela acompanha a seleção)
function gridScrollTo(table,r,c){const td=table.tBodies[0]?.children[r]?.children[c];if(td)td.scrollIntoView({block:'nearest',inline:'nearest'})}
// Ctrl+Shift+seta: pula até o fim dos dados (igual Excel)
function gridJump(table,r,c,dr,dc){
  const rows=table.tBodies[0].children.length;
  const has=(rr,cc)=>{const ci=gridCellInputAt(table,rr,cc);return !!ci&&String(ci.value||'').trim()!==''};
  if(dr){
    const ok=rr=>rr>=0&&rr<rows;
    if(has(r,c)&&ok(r+dr)&&has(r+dr,c)){while(ok(r+dr)&&has(r+dr,c))r+=dr;return r}
    let x=r+dr;while(ok(x)&&!has(x,c))x+=dr;return ok(x)?x:(dr>0?rows-1:0);
  }
  const tr=table.tBodies[0].children[r];if(!tr)return c;
  const cols=[...tr.children].map((td,i)=>td.querySelector('.cell-input')?i:-1).filter(i=>i>=0);
  let k=cols.indexOf(c);if(k<0)return c;
  const ok=kk=>kk>=0&&kk<cols.length;
  if(has(r,cols[k])&&ok(k+dc)&&has(r,cols[k+dc])){while(ok(k+dc)&&has(r,cols[k+dc]))k+=dc;return cols[k]}
  let x=k+dc;while(ok(x)&&!has(r,cols[x]))x+=dc;return cols[ok(x)?x:(dc>0?cols.length-1:0)];
}
// Tab/Enter nunca saem da tabela: Enter desce, Shift+Enter sobe, Tab vai pra direita (no fim da
// linha, começo da próxima), Shift+Tab volta. Sem célula pra ir, fica na mesma.
// Touro digitado pela metade ("OURO FINO") + Tab/Enter: completa com o nome da lista do Estoque
// (o primeiro que aparece embaixo: primeiro os que começam com o texto, depois os que contêm).
// Só na lista de touros — RGD continua livre.
function completarTouro(el){
  if(el.tagName!=='INPUT'||el.getAttribute('list')!=='bullsList')return;
  const v=norm(el.value);if(!v)return;
  const nomes=sireNames();if(nomes.some(n=>norm(n)===v))return;
  const achou=nomes.find(n=>norm(n).startsWith(v))||nomes.find(n=>norm(n).includes(v));
  if(achou)el.value=achou;
}
function gridNextCell(table,r,c,isTab,back){
  if(!isTab)return gridCellInputAt(table,back?r-1:r+1,c);
  const rows=table.tBodies[0].children;
  const inputsOf=rr=>rows[rr]?[...rows[rr].children].map((td,i)=>td.querySelector('.cell-input')?i:-1).filter(i=>i>=0):[];
  const cols=inputsOf(r);
  const nx=back?cols.filter(i=>i<c).pop():cols.find(i=>i>c);
  if(nx!==undefined)return gridCellInputAt(table,r,nx);

  return cs.length?gridCellInputAt(table,rr,back?cs[cs.length-1]:cs[0]):null;

let gridDown=false, gridAnchor=null, gridFocusCell=null, gridFillFrom=null, gridFillDragging=false;
function gridInfo(cellInput){

  if(!td||!tr||!tbody)return null;
  const table=tbody.closest('table');

  const c=Array.prototype.indexOf.call(tr.children,td);

}
function gridCellInputAt(table,r,c){

function gridClear(table){

function gridHighlight(table,r1,c1,r2,c2){
  gridClear(table);

  const tbody=table.tBodies[0];if(!tbody)return;
  let lastTd=null;
  for(let r=rlo;r<=rhi;r++){
    const tr=tbody.children[r];if(!tr)continue;

      const td=tr.children[c];if(!td)continue;
      if(td.querySelector('.cell-input')){td.classList.add('cell-selected');lastTd=td}
    }

  if(lastTd){
    const handle=document.createElement('div');
    handle.className='fill-handle';
    handle.addEventListener('mousedown',e=>{
      e.preventDefault();e.stopPropagation();
      gridFillDragging=true;
      gridFillFrom={table,r1:rlo,r2:rhi,c1:clo,c2:chi};

function gridSelectionOf(table){
  const cells=table.querySelectorAll('.cell-selected');
  if(!cells.length)return null;
  let r1=Infinity,r2=-1,c1=Infinity,c2=-1;
  cells.forEach(td=>{
    const tr=td.parentElement,tbody=tr.parentElement;
    const r=Array.prototype.indexOf.call(tbody.children,tr);
    const c=Array.prototype.indexOf.call(tr.children,td);
    r1=Math.min(r1,r);r2=Math.max(r2,r);c1=Math.min(c1,c);c2=Math.max(c2,c);

function gridSetValue(cellInput,val){
  if(cellInput.tagName==='SELECT'){

    if(!opt)return false;

  }else{

function gridGetValue(cellInput){return cellInput.value}
let gridLastMouse=null, gridRafId=null;
function gridAutoScrollAndTrack(){

  const table=gridDown?(gridAnchor&&gridAnchor.table):(gridFillFrom&&gridFillFrom.table);
  if(table && gridLastMouse){
    const wrap=table.closest('.table-wrap');
    if(wrap){
      const rect=wrap.getBoundingClientRect();
      const margin=40;
      if(gridLastMouse.y<rect.top+margin) wrap.scrollTop-=Math.max(2,(rect.top+margin-gridLastMouse.y)*0.5);
      else if(gridLastMouse.y>rect.bottom-margin) wrap.scrollTop+=Math.max(2,(gridLastMouse.y-(rect.bottom-margin))*0.5);
    }
    const under=document.elementFromPoint(gridLastMouse.x,gridLastMouse.y);
    const el=under && under.closest && under.closest('.cell-input');
    if(el){
      const info=gridInfo(el);
      if(info && info.table===table){
        if(gridDown){
          gridFocusCell={r:info.r,c:info.c};
          gridHighlight(gridAnchor.table,gridAnchor.r,gridAnchor.c,info.r,info.c);
        }else{
          gridFocusCell={r:info.r,c:info.c};
          gridHighlight(gridFillFrom.table,gridFillFrom.r1,gridFillFrom.c1,Math.max(info.r,gridFillFrom.r2),gridFillFrom.c2);

document.addEventListener('mouseup',()=>{

          const ci=gridCellInputAt(from.table,r,c);
          if(ci)gridSetValue(ci,values[idx%srcHeight]);

document.addEventListener('keydown',e=>{
  const active=document.activeElement;
  if(!active||!active.classList||!active.classList.contains('cell-input'))return;
  const info=gridInfo(active);if(!info)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){
    const sel=gridSelectionOf(info.table);
    if(sel && (sel.r2>sel.r1||sel.c2>sel.c1)){
      e.preventDefault();
      const lines=[];
      for(let r=sel.r1;r<=sel.r2;r++){
        const cols=[];
        for(let c=sel.c1;c<=sel.c2;c++){const ci=gridCellInputAt(info.table,r,c);cols.push(ci?gridGetValue(ci):'')}
        lines.push(cols.join('\t'));
      }
      navigator.clipboard?.writeText(lines.join('\n')).catch(()=>{});
    }

  }

    if(!navigator.clipboard?.readText)return;

      if(!text)return;

      const grid=rows.map(l=>l.split('\t'));
      if(!grid.length)return;
      const gCols=Math.max(...grid.map(g=>g.length));
      const sel=gridSelectionOf(info.table);
      const startR=sel?sel.r1:info.r, startC=sel?sel.c1:info.c;
      // cola TUDO o que foi copiado; só repete se a seleção for múltipla do que foi copiado (igual Excel)
      const selR=sel?sel.r2-sel.r1+1:1, selC=sel?sel.c2-sel.c1+1:1;
      const nR=(selR>grid.length&&selR%grid.length===0)?selR:grid.length;
      const nC=(selC>gCols&&selC%gCols===0)?selC:gCols;

      const hostId=gridHostId(info.table);
      const avisos=[],alertOrig=window.alert;
      gridBatch=true;window.alert=m=>{if(!avisos.includes(m))avisos.push(m)};
      let table=info.table;

        const tem=table.tBodies[0].children.length;
        if(endR>=tem&&GRID_ADD_ROWS[hostId]){GRID_ADD_ROWS[hostId](endR-tem+1);table=gridTableOf(hostId,table)}
        for(let r=startR;r<=endR;r++){
          for(let c=startC;c<=endC;c++){
            const ci=gridCellInputAt(table,r,c);if(!ci)continue;

      if(avisos.length)alert('Colado, mas algumas células não foram aceitas:\n\n'+avisos.slice(0,8).join('\n')+(avisos.length>8?`\n... e mais ${avisos.length-8}`:''));
    }).catch(()=>{});

  }
  if(e.shiftKey && ['ArrowDown','ArrowUp','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();

    const dr=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0,dc=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;

  }
});

/* ===== ARRASTAR LINHA PRA REORDENAR ===================================================
   O "⠿" no início de cada linha arrasta ela pra cima/baixo dentro da própria tabela —
   igual mover uma linha inteira no Excel. Genérico: cada tabela só precisa dizer qual
   array do banco e qual função de renderizar usar. */
let rowDragData=null;
const ROW_DRAG_TABLES={};
function registerRowDrag(key,getArray,rerender){ROW_DRAG_TABLES[key]={getArray,rerender}}
function rowDragStart(e,tableKey,id){
  rowDragData={tableKey,id};

  try{e.dataTransfer.setData('text/plain',id)}catch(err){}
}
function rowDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move'}
function rowDrop(e,tableKey,targetId){
  e.preventDefault();
  if(!rowDragData || rowDragData.tableKey!==tableKey || rowDragData.id===targetId){rowDragData=null;return}
  const cfg=ROW_DRAG_TABLES[tableKey];if(!cfg)return;
  const arr=cfg.getArray();
  const fromIdx=arr.findIndex(x=>x.id===rowDragData.id);
  const toIdx=arr.findIndex(x=>x.id===targetId);
  if(fromIdx<0||toIdx<0){rowDragData=null;return}
  const [moved]=arr.splice(fromIdx,1);
  arr.splice(toIdx,0,moved);
  // com ordenação A→Z/Z→A ligada a tabela não mostraria a nova posição — volta pra ordem manual
  const sortOff={key:'',dir:1};
  if(tableKey==='animals')animalSort=sortOff;else if(tableKey==='iatf')iatfSort=sortOff;else if(tableKey==='acasal')acasalSort=sortOff;
  else if(tableKey==='embrioes')embrioesSort=sortOff;else if(tableKey==='fiv')fivSort=sortOff;else if(tableKey==='stock')stockSort=sortOff;
  save();
  cfg.rerender();
  rowDragData=null;
}

// Cores das categorias nos gráficos (mesma ordem da lista de categorias; testadas pra daltonismo)
const CAT_BAR_COLORS=['#2a78d6','#e08a1e','#7a52c7','#1b9e8f','#a08a10','#d2559a'];
function catBarColor(c){const i=categories().findIndex(x=>x===c);return i<0?'#8a958d':CAT_BAR_COLORS[i%CAT_BAR_COLORS.length]}
const DASH_GREEN='#14804a', DASH_GOLD='#a08a10';
let dashMore={bulls:false,stock:false,donors:false,fivBulls:false};
function dashToggle(k){dashMore[k]=!dashMore[k];dashboard()} window.dashToggle=dashToggle;
const pctTxt=v=>v===null?'—':(Math.round(v*10)/10).toLocaleString('pt-BR')+'%';
function rateOf(rows,get){const d=rows.filter(r=>isDiagnosed(get(r)));const p=d.filter(r=>normResult(get(r))==='P').length;return {n:d.length,p,rate:d.length?p/d.length*100:null}}
function barRow(name,color,st){
  const w=st.rate===null?0:Math.max(st.rate,st.p?2:0);
  return `<div class="crow" title="${esc(name)}: ${st.p} prenha(s) em ${st.n} resultado(s)"><div class="nm"><span class="sw" style="background:${color}"></span>${esc(name)}</div><div class="tr"><div class="fl" style="width:${w}%;background:${color}"></div></div><div class="vl">${pctTxt(st.rate)} <small>${st.p}/${st.n}</small></div></div>`;
}
// % de prenhez de UMA IATF (ou da estação toda), com o geral grande e uma barra por categoria
function iatfCard(titulo,data,rows,total){
  const g=rateOf(rows,r=>r.result);
  const cats=categories().map(c=>[c,rateOf(rows.filter(r=>r.category===c),r=>r.result)]).filter(([,st])=>st.n);
  return `<div class="dcard${total?' total':''}"><div class="hd"><div><div class="t">${esc(titulo)}</div>${data?`<div class="d">${esc(data)}</div>`:''}</div><div class="big">${pctTxt(g.rate)}<small>${g.p} de ${g.n} prenhas</small></div></div>
  ${cats.map(([c,st])=>barRow(c,catBarColor(c),st)).join('')||'<div class="dempty">Sem resultado ainda</div>'}</div>`;
}
function iatfSection(){
  const rows=seasonRows();
  const cycles=[...new Set(rows.filter(r=>isDiagnosed(r.result)).map(r=>Number(r.cycle)))].sort((a,b)=>a-b);
  if(!cycles.length)return '<div class="dcard dempty">Lance os resultados (P, V ou PRT) na tela IATF pra ver a % de prenhez.</div>';
  return `<div class="dash-grid">${iatfCard('Estação toda','',rows,true)}${cycles.map(c=>iatfCard(`${c}ª IATF`,cycleDate(c)?fmtDate(cycleDate(c)):'',rows.filter(r=>Number(r.cycle)===c),false)).join('')}</div>`;
}
// Touros da estação: doses usadas (Qtd da IATF + 1 por retorno) e % de prenhez (IATF e retorno com resultado)
function bullStats(){
  const map={};const get=n=>{const k=norm(n);return map[k]=map[k]||{name:String(n).trim(),doses:0,n:0,p:0}};
  seasonRows().forEach(r=>{
    if(String(r.firstSire||'').trim()){const b=get(r.firstSire);b.doses+=Number(r.qty)||0;if(isDiagnosed(r.result)){b.n++;if(normResult(r.result)==='P')b.p++}}
    if(String(r.returnSire||'').trim()){const b=get(r.returnSire);b.doses+=1;if(normResult(r.returnResult)){b.n++;if(normResult(r.returnResult)==='P')b.p++}}
  });
  return Object.values(map).filter(b=>b.doses||b.n).map(b=>({...b,rate:b.n?b.p/b.n*100:null}))
    .sort((a,b)=>b.doses-a.doses||b.n-a.n||(b.rate??-1)-(a.rate??-1)||a.name.localeCompare(b.name,'pt-BR'));
}
function bullSection(){
  const all=bullStats();if(!all.length)return '<div class="dempty">Nenhum touro usado nas IATFs desta estação ainda.</div>';
  const min=Number(db.settings.bullMinUses||5);
  const list=dashMore.bulls?all:all.slice(0,10);
  return `<table class="dtable"><thead><tr><th class="rk">#</th><th>Touro</th><th>% de prenhez</th><th class="num">Prenhas</th><th class="num">Doses usadas</th></tr></thead><tbody>
  ${list.map((b,i)=>`<tr class="${b.n&&b.n<min?'few':''}" title="${esc(b.name)}: ${b.p} prenha(s) em ${b.n} resultado(s), ${b.doses} dose(s)"><td class="rk">${i+1}</td><td><strong>${esc(b.name)}</strong>${b.n&&b.n<min?'<span class="few-tag">poucos dados</span>':''}</td>
  <td><div class="bar"><div class="tr"><div class="fl" style="width:${b.rate||0}%;background:${DASH_GREEN}"></div></div><b>${pctTxt(b.rate)}</b></div></td><td class="num">${b.p}/${b.n}</td><td class="num"><strong>${b.doses}</strong></td></tr>`).join('')}
  </tbody></table>${all.length>10?`<button class="dmore" onclick="dashToggle('bulls')">${dashMore.bulls?'− Mostrar só os 10 primeiros':`+ Ver todos os touros (${all.length})`}</button>`:''}`;
}
function stockSection(){
  const all=db.semen.map(s=>({name:s.name,b:stockBalance(s)})).filter(x=>String(x.name||'').trim()).sort((a,b)=>b.b-a.b);
  if(!all.length)return '<div class="dempty">Nenhum sêmen cadastrado.</div>';
  const list=dashMore.stock?all:all.slice(0,10);
  return `<table class="dtable"><thead><tr><th>Touro</th><th class="num">Saldo (doses)</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.name)}</td><td class="num"><strong class="${x.b<=0?'stock-low':''}">${x.b}</strong></td></tr>`).join('')}</tbody></table>
  ${all.length>10?`<button class="dmore" onclick="dashToggle('stock')">${dashMore.stock?'− Mostrar só os 10 maiores':`+ Ver todos (${all.length})`}</button>`:''}`;
}
/* ----- FIV ----- */
function fivSection(){
  const rows=seasonFiv().filter(r=>String(r.rgdDoadora||'').trim());
  const g=rateOf(rows,r=>r.resultado);
  const aguard=rows.filter(r=>!normResult(r.resultado)).length;
  const doadoras=new Set(rows.map(r=>norm(r.rgdDoadora))).size;
  const tipos=['Fresco','VIT','DT'];
  // tudo aqui vem só das linhas da FIV (Embriões está em espera e não entra no dashboard)
  const datas=fivDatasLista().filter(Boolean);

function matrizCurrentCycle(rgd){
  const rows=seasonRows().filter(r=>r.rgd===rgd);
  return rows.length?Math.max(...rows.map(r=>Number(r.cycle)||0)):'';
}
function setAnimalIatfCycle(id,val,el){
  const a=db.animals.find(x=>x.id===id);if(!a)return;
  val=String(val||'').trim();
  if(!val){
    // Limpar o campo agora remove de UMA VEZ todas as linhas vazias (sem qtd/resultado/retorno/2º
    // acasalamento) dessa matriz na estação — antes só tirava a IATF mais alta, então se ela tinha
    // várias linhas vazias por engano (ex: 3, 5, 22) você tinha que limpar uma de cada vez até sobrar
    // só a de verdade. Linha com QUALQUER dado preenchido nunca é apagada aqui, sempre fica intacta.
    const todas=db.iatf.filter(r=>r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd));
    const vazias=todas.filter(iatfRowIsEmpty);
    if(!vazias.length){el.value=matrizCurrentCycle(a.rgd);return}
    const ciclos=vazias.map(r=>Number(r.cycle)).sort((x,y)=>x-y).join(', ');
    if(!confirm(`Remover ${a.rgd} da(s) IATF ${ciclos} (vazia(s), sem nenhum dado lançado)? Lançamentos com dados preenchidos não são mexidos.`)){el.value=matrizCurrentCycle(a.rgd);return}
    const idsVazias=new Set(vazias.map(r=>r.id));
    db.iatf=db.iatf.filter(r=>!idsVazias.has(r.id));
    save();
    el.value=matrizCurrentCycle(a.rgd);
    return;
  }
  const atual=matrizCurrentCycle(a.rgd);
  const cy=Number(val);
  if(!Number.isFinite(cy)||cy<1||!Number.isInteger(cy)){alert('Informe um número de IATF válido (1, 2, 3...).');el.value=atual;return}
  // Antes de criar a nova, some sozinho com qualquer linha VAZIA que essa matriz tenha em OUTRO
  // ciclo (ex: digitou 22 sem querer, queria 2 — a 22 fica vazia, "presa" e o campo não saía dela).
  // Isso resolve numa edição só. Linha com QUALQUER dado preenchido nunca é tocada aqui.
  const outrasVazias=db.iatf.filter(r=>r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd)&&Number(r.cycle)!==cy&&iatfRowIsEmpty(r));
  if(outrasVazias.length){
    const idsVazias=new Set(outrasVazias.map(r=>r.id));
    db.iatf=db.iatf.filter(r=>!idsVazias.has(r.id));
  }
  if(!seasonRows().some(r=>r.rgd===a.rgd&&Number(r.cycle)===cy)){
    db.iatf.push({id:uid('i'),seasonId:a.seasonId,category:a.category,cycle:cy,rgd:a.rgd,firstSire:a.firstSire||'',secondSire:'',qty:0,result:'',return:''});
    save();
  }
  const depois=matrizCurrentCycle(a.rgd);
  if(Number(depois)!==cy){
    // Ainda sobrou uma IATF maior com dado de verdade — não dá pra apagar sozinho, avisa por quê.
    alert(`Criei a ${cy}ª IATF pra ${a.rgd}, mas o campo continua mostrando ${depois}ª porque essa já tem dado lançado (qtd/resultado/retorno) e não posso apagar sozinho. Se for engano, vá na aba IATF, ciclo ${depois}, e exclua a linha de lá.`);
  }
  el.value=depois;
} window.setAnimalIatfCycle=setAnimalIatfCycle;

// Edição direta na tabela de matrizes, espelhando no IATF (mesma estação, comparação tolerante a maiúsculas/espaços)
function editAnimalCell(id,key,val,el){
  const a=db.animals.find(x=>x.id===id);if(!a)return;
  val=String(val||'').trim();
  if(key==='rgd'){
    const old=a.rgd;
    if(!val){alert('O RGD não pode ficar vazio.');el.value=old;return}
    if(seasonAnimals(a.seasonId).some(x=>x.id!==id&&norm(x.rgd)===norm(val))){alert('Já existe uma matriz com esse RGD nesta estação.');el.value=old;return}
    a.rgd=val;
    db.iatf.forEach(r=>{if(r.seasonId===a.seasonId&&norm(r.rgd)===norm(old))r.rgd=val});
  }else if(key==='firstSire'){
    if(val && !sireExists(val)){alert(`O touro "${val}" não existe no Estoque. Cadastre em Estoque primeiro.`);el.value=el.dataset.prev||'';return}
    // vale pra última inseminação dela (IATF mais recente ou o retorno dela) — IATFs antigas ficam como estão
    setAnimalSire(a,val);
  }else if(key==='category'){
    a.category=val;
    db.iatf.forEach(r=>{if(r.seasonId===a.seasonId&&norm(r.rgd)===norm(a.rgd))r.category=val});
    if(el){el.classList.remove('cat-vacas','cat-primi','cat-preco');el.classList.add(catClass(val));}
  }else if(key==='createdAt'){
    a.createdAt=val; // pode deixar vazio também, sem problema
  }
  el.dataset.prev=val;
  // Não recria a tabela a cada edição: mantém foco e rolagem exatamente onde estão.
  save();
} window.editAnimalCell=editAnimalCell;

/* IATF */
function getIatfCycleCategories(cycle=iatfCycle){
  const sid=db?.meta?.activeSeasonId;if(!sid)return [];
  db.iatfCycleCategories=db.iatfCycleCategories||{};
  db.iatfCycleCategories[sid]=db.iatfCycleCategories[sid]||{};
  return db.iatfCycleCategories[sid][String(Number(cycle))]||[];
}
function setIatfCycleCategories(cycle,cats){
  const sid=db.meta.activeSeasonId;
  db.iatfCycleCategories=db.iatfCycleCategories||{};
  db.iatfCycleCategories[sid]=db.iatfCycleCategories[sid]||{};
  db.iatfCycleCategories[sid][String(Number(cycle))]=[...new Set(cats)];
}
function iatfRowsFiltered(){
  // As caixinhas de categoria só controlam a montagem automática em massa (ver toggleIatfCategory).
  // A tabela sempre mostra TUDO que já está nesta IATF, categoria marcada ou não — inclusive uma
  // matriz que você colocou manualmente pela coluna "IATF atual" em Matrizes.
  let rows=seasonRows().filter(r=>Number(r.cycle)===Number(iatfCycle)).filter(r=>excelPass('iatf',r));
  const k=iatfSort.key,d=iatfSort.dir;if(k)rows.sort((a,b)=>String(a[k]??'').localeCompare(String(b[k]??''),'pt-BR',{numeric:true})*d);return rows
}
function sortIatf(k){if(iatfSort.key===k)iatfSort.dir*=-1;else iatfSort={key:k,dir:1};renderIatfRows()} window.sortIatf=sortIatf;
function iff(k,v){iatfFilters[k]=v;renderIatfRows()} window.iff=iff;
function eligibleForIatf(a,cycle){
  if(!a||!a.rgd)return false;
  // Não "volta no tempo": se ela já tem QUALQUER lançamento nesta IATF ou numa IATF à frente
  // (ex: ela já está na 10ª), não entra aqui — é isso que fazia ela aparecer em várias IATFs
  // de uma vez quando as categorias eram marcadas fora de ordem.
  const jaAdiante=seasonRows().some(r=>r.rgd===a.rgd&&Number(r.cycle)>=Number(cycle));
  if(jaAdiante)return false;
  // Para a categoria escolhida: quem nunca entrou antes aparece; quem já entrou volta se
  // o último diagnóstico anterior for V ou se ainda estiver sem resultado.
  const previous=seasonRows().filter(r=>r.rgd===a.rgd&&Number(r.cycle)<Number(cycle)).sort((x,y)=>Number(y.cycle)-Number(x.cycle));
  if(!previous.length)return true;
  const latest=previous[0];
  const res=effectiveResult(latest);
  return !res || res==='V';
}
function isIatfExcluded(rgd,cycle=iatfCycle){
  const sid=db?.meta?.activeSeasonId;
  return (db.iatfExcluded||[]).some(x=>x.seasonId===sid&&Number(x.cycle)===Number(cycle)&&x.rgd===rgd);
}
function prepareIatfCategories(){
  const cats=getIatfCycleCategories(iatfCycle);if(!cats.length)return;
  const existing=new Set(seasonRows().filter(r=>Number(r.cycle)===Number(iatfCycle)).map(r=>r.rgd));
  let changed=false;
  cats.forEach(cat=>{
    seasonAnimals().filter(a=>a.category===cat&&eligibleForIatf(a,iatfCycle)).forEach(a=>{
      if(existing.has(a.rgd)||isIatfExcluded(a.rgd,iatfCycle))return;
      db.iatf.push({id:uid('i'),seasonId:db.meta.activeSeasonId,category:a.category,cycle:iatfCycle,rgd:a.rgd,firstSire:a.firstSire||'',secondSire:'',qty:0,result:'',return:''});
      existing.add(a.rgd);changed=true;
    });
  });
  if(changed)save();
}
function toggleIatfCategory(cat,checked){
  let cats=getIatfCycleCategories(iatfCycle).slice();
  if(checked){if(!cats.includes(cat))cats.push(cat)}
  else{
    cats=cats.filter(c=>c!==cat);
    // Ao desmarcar, apaga somente linhas automáticas ainda totalmente vazias.
    db.iatf=db.iatf.filter(r=>!(r.seasonId===db.meta.activeSeasonId&&Number(r.cycle)===Number(iatfCycle)&&r.category===cat&&iatfRowIsEmpty(r)));
  }
  setIatfCycleCategories(iatfCycle,cats);
  if(checked)prepareIatfCategories();else save();
  renderIatfRows();
} window.toggleIatfCategory=toggleIatfCategory;
function selectIatfCycle(v){iatfCycle=Number(v);iatfCategory='';iatfPage()} window.selectIatfCycle=selectIatfCycle;

      <div class="date-box"><label>Data da ${iatfCycle}ª IATF</label><input type="date" class="input" style="min-width:145px" value="${esc(cycleDate(iatfCycle))}" onchange="setCycleDate(${iatfCycle},this.value)"></div>

function animalDatalist(){return `<datalist id="animalsList">${seasonAnimals().map(a=>`<option value="${esc(a.rgd)}">${esc(a.category)}</option>`).join('')}</datalist>`}
function prtAnimals(){
  return seasonAnimals().filter(a=>latestStatus(a.rgd)==='PRT').map(a=>{
    const rows=seasonRows().filter(r=>r.rgd===a.rgd&&effectiveResult(r)==='PRT').sort((x,y)=>Number(y.cycle)-Number(x.cycle));
    return {...a, prtCycle: rows.length?Number(rows[0].cycle):''}
  })
}
function renderIatfRows(){

  const __view=captureViewPosition();
  const rows=iatfRowsFiltered();

  root.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;font-size:11px;color:#69746c"><span><strong style="color:#233129">${qtdUsada}</strong> dose(s) de sêmen usadas nesta IATF</span><span><strong style="color:#233129;margin-right:4px">${rows.length}</strong> matriz(es) exibida(s) de <strong style="color:#233129;margin:0 4px">${total}</strong> nesta IATF</span></div><div class="table-wrap"><table><thead>
  <tr><th></th><th>${excelHead('iatf','rgd','RGD')}</th><th>${excelHead('iatf','firstSire','1º Acasalamento')}</th><th style="width:125px;min-width:125px;max-width:125px">${excelHead('iatf','secondSire','2º Acasal. (curral)')}</th><th style="width:52px;min-width:52px;max-width:52px;text-align:center;padding-left:2px;padding-right:2px">Nº Caneca</th><th style="width:64px;min-width:64px;max-width:64px;text-align:center;padding-left:8px">${excelHead('iatf','qty','Qtd')}</th><th>${excelHead('iatf','result','Result.')}</th><th>${excelHead('iatf','return','Retorno (data)')}</th><th>${excelHead('iatf','returnSire','Touro Retorno')}</th><th>${excelHead('iatf','category','Categoria')}</th><th></th></tr>
  </thead><tbody>${rows.map((r,i)=>`<tr ondragover="rowDragOver(event)" ondrop="rowDrop(event,'iatf','${r.id}')">
  ${rowHandleTd('iatf',r.id)}
  <td><strong>${esc(r.rgd)}</strong></td>
  <td><input class="cell-input iatf-sire" list="bullsList" data-id="${r.id}" data-prev="${esc(r.firstSire)}" value="${esc(r.firstSire)}" onfocus="this.select()" onchange="updateIatfSire(this)"></td>
<td><input class="cell-input iatf-sire2" data-id="${r.id}" value="${esc(r.secondSire||'')}" placeholder="—" autocomplete="off" onchange="updateIatfCell('${r.id}','secondSire',this.value)"></td>
<td><input class="cell-input iatf-caneca nav-caneca" type="text" value="${esc(iatfCaneca(r))}" style="${r.caneca?'':'color:#7a857d'}" title="${r.caneca?'Digitado':'Puxado do Estoque (pode digitar por cima)'}" onkeydown="iatfEnter(event,'nav-caneca')" onchange="updateIatfCaneca('${r.id}',this.value,this)"></td>
<td><input class="cell-input nav-qtd iatf-qty" inputmode="decimal" data-id="${r.id}" value="${r.qty||''}" onkeydown="iatfEnter(event,'nav-qtd')" onchange="updateIatfCell('${r.id}','qty',this.value)"></td>
  <td><input class="cell-input nav-result iatf-result" list="resultList" maxlength="3" data-id="${r.id}" value="${esc(r.result||'')}" oninput="this.value=this.value.toUpperCase()" onkeydown="iatfEnter(event,'nav-result')" onchange="updateIatfResult('${r.id}',this.value,this)"></td>
  <td><input class="cell-input iatf-retorno nav-ret" type="date" value="${esc(r.return||'')}" onkeydown="iatfEnter(event,'nav-ret')" onchange="updateIatfReturn('${r.id}','return',this.value,this)"></td>
  <td><input class="cell-input iatf-rsire nav-rsire" list="bullsList" value="${esc(r.returnSire||'')}" data-prev="${esc(r.returnSire||'')}" placeholder="—" onfocus="this.select()" onkeydown="iatfEnter(event,'nav-rsire')" onchange="updateIatfReturn('${r.id}','returnSire',this.value,this)"></td>
  <td><span class="badge ${catClass(r.category)}">${esc(r.category)}</span></td>
  <td><button class="mini" onclick="deleteIatf('${r.id}')">Excluir</button></td></tr>`).join('')}</tbody></table></div>`;
  restoreViewPosition(__view);
}
// Enter desce pra mesma coluna na linha de baixo. A posição é guardada ANTES de confirmar a célula,
// porque algumas telas (ex: Estoque) redesenham a tabela ao salvar e a célula antiga some.
function iatfEnter(e,cls){if(e.key!=='Enter')return;e.preventDefault();const i=$$('.'+cls).indexOf(e.target);e.target.blur();const els=$$('.'+cls);const nx=els[i+1];if(i>=0&&nx){nx.focus();if(typeof nx.select==='function')nx.select()}} window.iatfEnter=iatfEnter;
function updateIatfCell(id,key,val){const r=db.iatf.find(x=>x.id===id);if(!r)return;r[key]=key==='qty'?Number(String(val).replace(',','.'))||0:val;save()} window.updateIatfCell=updateIatfCell;
function updateIatfSire(el){
  const val=el.value.trim();
  if(val && !sireExists(val)){alert(`O touro "${val}" não existe no Estoque.`);el.value=el.dataset.prev||'';return}
  const r=db.iatf.find(x=>x.id===el.dataset.id);
  if(r){
    r.firstSire=val;
    // cada IATF tem o seu touro; a aba Matrizes mostra o da última inseminação
    syncAnimalSire(r.seasonId,r.rgd);
    // touro novo = caneca nova: volta a puxar a do Estoque
    r.caneca='';
    save();el.dataset.prev=val;
    const cn=el.closest('tr')?.querySelector('.iatf-caneca');if(cn){cn.value=iatfCaneca(r);cn.style.color='#7a857d'}
  }
} window.updateIatfSire=updateIatfSire;
function updateIatfCaneca(id,val,el){
  const r=db.iatf.find(x=>x.id===id);if(!r)return;
  val=String(val||'').trim();
  // vazio ou igual ao do Estoque = automático
  r.caneca=(!val||val===stockCaneca(r.firstSire))?'':val;
  save();
  if(el){el.value=iatfCaneca(r);el.style.color=r.caneca?'':'#7a857d'}
} window.updateIatfCaneca=updateIatfCaneca;
function updateIatfReturn(id,key,val,el){
  const r=db.iatf.find(x=>x.id===id);if(!r)return;
  val=String(val||'').trim();
  if(key==='returnSire'){
    if(val&&!sireExists(val)){alert(`O touro "${val}" não existe no Estoque.`);el.value=el.dataset.prev||'';return}
    r.returnSire=val;el.dataset.prev=val;
  }else if(key==='returnResult'){
    const v=normResult(val);
    if(val&&!v){alert('Resultado do retorno deve ser P, V ou PRT.');el.value=r.returnResult||'';return}
    r.returnResult=v;el.value=v;
  }else r.return=val;
  syncAnimalSire(r.seasonId,r.rgd);
  const before=db.iatf.length;
  const res=effectiveResult(r);
  if(res&&res!=='V')removeEmptyFollowUps(r);
  save();
  if(db.iatf.length!==before){
    if(document.activeElement&&document.activeElement!==el&&typeof document.activeElement.blur==='function')document.activeElement.blur();
    renderIatfRows();
  }
} window.updateIatfReturn=updateIatfReturn;
function ensureNextIatf(r){
  const next=Number(r.cycle)+1;
  if(!seasonRows().some(x=>x.rgd===r.rgd&&Number(x.cycle)===next)){
    db.iatf.push({id:uid('i'),seasonId:db.meta.activeSeasonId,category:r.category,cycle:next,rgd:r.rgd,firstSire:r.firstSire,secondSire:'',qty:0,result:'',return:''})
  }
}
// Remove os ciclos seguintes dessa matriz que ainda estão vazios (sem qtd/resultado/retorno)
function removeEmptyFollowUps(r){
  db.iatf=db.iatf.filter(x=>!(x.seasonId===r.seasonId&&x.rgd===r.rgd&&Number(x.cycle)>Number(r.cycle)&&iatfRowIsEmpty(x)))
}
function updateIatfResult(id,val,el){
  val=normResult(val);
  if(el.value.trim() && !val){alert('Resultado deve ser P, V ou PRT.');el.value='';return}
  const r=db.iatf.find(x=>x.id===id);if(!r)return;
  r.result=val; el.value=val;
  // Na nova lógica, nenhuma matriz é lançada automaticamente na próxima IATF.
  const before=db.iatf.length;
  if(val!=='V')removeEmptyFollowUps(r);
  save();
  // Só reconstrói a tabela inteira se alguma linha realmente sumiu — do contrário isso quebrava
  // o foco no meio da digitação (você apertava Enter e "voltava" pra célula errada).
  if(db.iatf.length!==before){
    // Se tiver outra célula com edição em andamento (ainda focada, valor ainda não confirmado),
    // força ela a confirmar ANTES de reconstruir a tabela — assim nada digitado se perde.
    if(document.activeElement && document.activeElement!==el && typeof document.activeElement.blur==='function')document.activeElement.blur();
    renderIatfRows();
  }
} window.updateIatfResult=updateIatfResult;

/* PAINEL DE PRTs — devolver manualmente para uma IATF */
function openPrtPanel(){
  const list=prtAnimals();
  if(!list.length)return openModal(`<h2>PRTs</h2><div class="notice green">Nenhuma matriz com resultado PRT nesta estação.</div><div class="actions"><button class="primary" onclick="closeModal()">Fechar</button></div>`);
  const porCat=categories().map(cat=>{
    const l=list.filter(a=>a.category===cat);
    if(!l.length)return '';
    return `<div style="margin-bottom:14px"><div class="sub" style="font-weight:700;margin-bottom:6px"><span class="badge ${catClass(cat)}">${cat}</span> — ${l.length}</div>
    ${l.map(a=>`<label class="excel-value" style="padding:6px 2px;border-bottom:1px solid #edf0ee"><input type="checkbox" class="prt-pick" value="${esc(a.rgd)}"><span><strong>${esc(a.rgd)}</strong> <span class="muted">— PRT na ${a.prtCycle}ª IATF</span></span></label>`).join('')}</div>`
  }).join('');
  openModal(`<h2>PRTs — devolver para uma IATF</h2>
  <div class="notice green">Marque as matrizes que voltam a ser trabalhadas e escolha em qual IATF elas devem reaparecer para você classificar de novo.</div>
  <div style="max-height:340px;overflow:auto;border:1px solid #e3e7e4;border-radius:8px;padding:10px">${porCat}</div>
  <div class="form-grid" style="margin-top:14px">
    <div class="field"><label>Devolver para</label><select id="prtCycle">${Array.from({length:maxIatfCycle()},(_,i)=>i+1).map(c=>`<option value="${c}" ${c===iatfCycle?'selected':''}>${c}ª IATF</option>`).join('')}</select></div>
    <div class="field" style="justify-content:flex-end"><button class="ghost" onclick="prtSelectAll()">Marcar todas</button></div>
  </div>
  <div class="actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="returnPrts()">Devolver selecionadas</button></div>`)
} window.openPrtPanel=openPrtPanel;
/* PAINEL DE RETORNOS — todas as matrizes que tiveram retorno nesta estação */
function returnRows(){
  return seasonRows().filter(hasReturn).sort((a,b)=>String(b.return||'').localeCompare(String(a.return||''))||Number(b.cycle)-Number(a.cycle)||String(a.rgd).localeCompare(String(b.rgd),'pt-BR',{numeric:true}));
}
function openReturnsPanel(){
  const list=returnRows();
  if(!list.length)return openModal(`<h2>Retornos</h2><div class="notice green">Nenhum retorno lançado nesta estação. Preencha Retorno (data) e Touro Retorno na tabela da IATF.</div><div class="actions"><button class="primary" onclick="closeModal()">Fechar</button></div>`);
  openModal(`<h2>Retornos — ${esc(activeSeason().name)}</h2>
  <div class="notice green">Lance aqui o <strong>resultado do retorno</strong> (P, V ou PRT) — Enter desce pra próxima. Pra colocar matrizes numa IATF, marque e escolha qual embaixo.</div><datalist id="retResList"><option value="P"></option><option value="V"></option><option value="PRT"></option></datalist>
  <div class="table-wrap" style="max-height:340px"><table><thead><tr><th style="width:30px"><input type="checkbox" onchange="$$('.ret-pick').forEach(x=>x.checked=this.checked)" title="Marcar todas"></th><th>Data</th><th>RGD</th><th>Categoria</th><th>Após a</th><th>Touro</th><th>Resultado</th></tr></thead><tbody>
  ${list.map(r=>`<tr><td><input type="checkbox" class="ret-pick" value="${esc(r.rgd)}"></td><td>${fmtDate(r.return)||'—'}</td><td><strong>${esc(r.rgd)}</strong></td><td><span class="badge ${catClass(r.category)}">${esc(r.category||'')}</span></td><td>${Number(r.cycle)}ª IATF</td><td>${esc(r.returnSire||'—')}</td><td><input class="cell-input iatf-result nav-ret-res" list="retResList" maxlength="3" style="border:1px solid #d7ded9!important" value="${esc(r.returnResult||'')}" placeholder="—" oninput="this.value=this.value.toUpperCase()" onkeydown="iatfEnter(event,'nav-ret-res')" onchange="updateIatfReturn('${r.id}','returnResult',this.value,this)"></td></tr>`).join('')}
  </tbody></table></div>
  <div class="form-grid" style="margin-top:14px">
    <div class="field"><label>Adicionar as marcadas na</label><select id="retCycle">${Array.from({length:maxIatfCycle()},(_,i)=>i+1).map(c=>`<option value="${c}" ${c===iatfCycle?'selected':''}>${c}ª IATF</option>`).join('')}</select></div>
    <div class="field" style="justify-content:flex-end"><button class="primary" onclick="returnsAddToIatf()">Adicionar na IATF</button></div>
  </div>
  <div class="actions"><button class="ghost" onclick="exportReturns()">⬇ Baixar Excel</button><button class="ghost" onclick="closeModal()">Fechar</button></div>`);
} window.openReturnsPanel=openReturnsPanel;
function returnsAddToIatf(){
  const picks=[...new Set($$('.ret-pick').filter(x=>x.checked).map(x=>x.value))];
  if(!picks.length)return alert('Marque pelo menos uma matriz.');
  const cy=Number($('#retCycle').value);
  const ja=picks.filter(rgd=>seasonRows().some(r=>r.rgd===rgd&&Number(r.cycle)===cy));
  const novas=picks.filter(rgd=>!ja.includes(rgd));
  if(!novas.length)return alert(`Todas as marcadas já estão na ${cy}ª IATF.`);
  if(!confirm(`Adicionar ${novas.length} matriz(es) na ${cy}ª IATF?\n\n${novas.join(', ')}`+(ja.length?`\n\n(${ja.length} já estava(m) nessa IATF e fica(m) como está.)`:'')))return;
  let criadas=0;
  novas.forEach(rgd=>{
    const a=seasonAnimals().find(x=>x.rgd===rgd);if(!a)return;
    db.iatf.push({id:uid('i'),seasonId:db.meta.activeSeasonId,category:a.category,cycle:cy,rgd,firstSire:currentSire(a),secondSire:'',qty:0,result:'',return:'',returnSire:'',returnResult:''});
    criadas++;
  });
  save();closeModal();iatfCycle=cy;
  alert(`${criadas} matriz(es) adicionada(s) na ${cy}ª IATF.`);
  iatfPage();
} window.returnsAddToIatf=returnsAddToIatf;
function exportReturns(){
  const out=returnRows().map(r=>({DATA_RETORNO:fmtDate(r.return),RGD:r.rgd,CATEGORIA:r.category||'',APOS_IATF:Number(r.cycle),TOURO_RETORNO:r.returnSire||'',RESULTADO_RETORNO:r.returnResult||''}));
  jsonToXlsx(out,'retornos_'+fileSafe(activeSeason().name)+'.xlsx','Retornos');
} window.exportReturns=exportReturns;
function prtSelectAll(){$$('.prt-pick').forEach(x=>x.checked=true)} window.prtSelectAll=prtSelectAll;
function returnPrts(){
  const picks=$$('.prt-pick').filter(x=>x.checked).map(x=>x.value);
  if(!picks.length)return alert('Marque pelo menos uma matriz.');
  const cy=Number($('#prtCycle').value);
  let criadas=0,jaExistiam=0;
  picks.forEach(rgd=>{
    const a=seasonAnimals().find(x=>x.rgd===rgd);if(!a)return;
    if(seasonRows().some(r=>r.rgd===rgd&&Number(r.cycle)===cy)){jaExistiam++;return}
    db.iatf.push({id:uid('i'),seasonId:db.meta.activeSeasonId,category:a.category,cycle:cy,rgd,firstSire:a.firstSire||'',secondSire:'',qty:0,result:'',return:''});
    criadas++
  });
  save();closeModal();iatfCycle=cy;
  alert(`${criadas} matriz(es) devolvida(s) para a ${cy}ª IATF.`+(jaExistiam?`\n${jaExistiam} já estavam nessa IATF.`:''));
  iatfPage()
} window.returnPrts=returnPrts;
function quickAddAnimalToCycle(){
  const jaNaIatf=new Set(seasonRows().filter(r=>Number(r.cycle)===Number(iatfCycle)).map(r=>r.rgd));
  const disponiveis=seasonAnimals().filter(a=>!jaNaIatf.has(a.rgd)).map(a=>({...a,status:latestStatus(a.rgd)})).sort((a,b)=>a.rgd.localeCompare(b.rgd,'pt-BR',{numeric:true}));
  if(!disponiveis.length)return alert('Todas as matrizes cadastradas já estão nesta IATF.');

function qaApplyFilters(){
  const cats=new Set($$('.qa-cat:checked').map(x=>x.value));
  const stats=new Set($$('.qa-status:checked').map(x=>x.value));
  const q=norm(($('#qaSearch')||{value:''}).value).toLowerCase();
  let visiveis=0;
  $$('.qa-row').forEach(x=>{
    const ok=cats.has(x.dataset.cat)&&stats.has(x.dataset.status)&&(!q||x.dataset.search.includes(q));
    x.classList.toggle('hidden',!ok);
    if(ok)visiveis++;
  });
  const c=$('#qaCount');if(c)c.textContent=`${visiveis} matriz(es) visível(is)`;
} window.qaApplyFilters=qaApplyFilters;

} window.qaSelectAll=qaSelectAll;
function saveQuickAnimal(){
  const rgds=$$('.qa-pick').filter(x=>x.checked).map(x=>x.value);

  rgds.forEach(rgd=>{
    const a=seasonAnimals().find(x=>x.rgd===rgd);if(!a)return;
    if(seasonRows().some(r=>r.rgd===a.rgd&&Number(r.cycle)===iatfCycle))return;
    db.iatf.push({id:uid('i'),seasonId:db.meta.activeSeasonId,category:a.category,cycle:iatfCycle,rgd:a.rgd,firstSire:a.firstSire||'',secondSire:'',qty:0,result:'',return:''});

function outputIatfRows(){
  const cat=$('#outCat').value,cy=$('#outCycle').value,res=$('#outResult').value,current=$('#outCurrent').value==='yes';

  if(current&&Number(cy)===Number(iatfCycle)){
    return iatfRowsFiltered().filter(r=>(!cat||r.category===cat)&&(!res||normResult(r.result)===res));
  }
  // Outra IATF ou "Todas": os filtros das colunas (▼) valem pra todas as IATFs escolhidas.
  const rows=seasonRows().filter(r=>(!current||excelPass('iatf',r))&&(!cat||r.category===cat)&&(!cy||Number(r.cycle)===Number(cy))&&(!res||normResult(r.result)===res));
  return rows.sort((a,b)=>Number(a.cycle)-Number(b.cycle)||String(a.category).localeCompare(String(b.category))||String(a.rgd).localeCompare(String(b.rgd),'pt-BR',{numeric:true}))
}

/* IMPORTAÇÃO — Acasalamentos e Não Utilizadas (respeita a estação ativa) */
function importAcasalExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const errs=[],prepared=[];
    rows.forEach((r,i)=>{
      const line=i+2;
      const rgd=String(pick(r,['RGD'])||'').trim();
      if(!rgd)return;
      let cat=String(pick(r,['CATEGORIA'])||'').trim();
      if(cat){const m=matchList(categories(),cat);if(!m){errs.push(`Linha ${line}: categoria "${cat}" não existe (use: ${categories().join(', ')}).`);return}cat=m}
      const vals={};
      ACASAL_COLS.forEach(([k,label])=>{
        const key=label.replace(/[ºª]/g,'').trim().replace(' ','_').toUpperCase(); // ex: "1º IATF" -> "1_IATF"
        const v=String(pick(r,[key,label])||'').trim();
        if(v && !sireExists(v)){errs.push(`Linha ${line}: touro "${v}" (${label}) não existe no Estoque.`);return}
        vals[k]=v;
      });
      prepared.push({rgd,cat,...vals});
    });
    if(errs.length){showImportErrors('Importação com problemas',`Corrija ${errs.length} linha(s) e envie o Excel novamente. Nada foi importado.`,errs);return}
    if(!prepared.length)return alert('Nenhum RGD encontrado no arquivo.');
    let novos=0,atualizados=0;
    db.acasalamentos=db.acasalamentos||[];
    prepared.forEach(x=>{

/* EMBRIÕES — Estoque / Saída Fazenda / Usados, cada um com Fresco/VIT/DT. GLOBAL (não pertence a
   nenhuma estação — é estoque de verdade, junto com o Estoque de Sêmen, e continua entre estações).
   Uma linha por RGD Doadora + Touro (uma doadora pode ter várias linhas, uma pra cada touro usado). */
// Regra "FIV dá baixa nos Usados dos Embriões": DESLIGADA por padrão (em espera, a pedido do dono,
// até terminar de lançar os embriões). Liga/desliga no botão da tela Embriões (db.settings.fivBaixaEmbrioes).
function embUsados(rgd, touro, tipo){
  if(!db.settings.fivBaixaEmbrioes)return 0;
  return (db.fiv||[]).filter(f=>norm(f.rgdDoadora)===norm(rgd) && norm(f.sire||'')===norm(touro||'') && f.tipo===tipo).length;
}
function embRowCalc(e){
  const estTotal=(Number(e.estFresco)||0)+(Number(e.estVit)||0)+(Number(e.estDt)||0);
  const saidaTotal=(Number(e.saidaFresco)||0)+(Number(e.saidaVit)||0)+(Number(e.saidaDt)||0);
  const usoFresco=embUsados(e.rgd,e.touro,'Fresco'),usoVit=embUsados(e.rgd,e.touro,'VIT'),usoDt=embUsados(e.rgd,e.touro,'DT');
  const usoTotal=usoFresco+usoVit+usoDt;
  // Estoque + Saída − Usados: às vezes o embrião vai direto do estoque central pra vaca, sem
  // passar por "saída fazenda" antes — então o saldo tem que considerar os dois potes juntos.
  const saldoFresco=(Number(e.estFresco)||0)+(Number(e.saidaFresco)||0)-usoFresco;
  const saldoVit=(Number(e.estVit)||0)+(Number(e.saidaVit)||0)-usoVit;
  const saldoDt=(Number(e.estDt)||0)+(Number(e.saidaDt)||0)-usoDt;
  const saldoTotal=estTotal+saidaTotal-usoTotal;
  return {estTotal,saidaTotal,usoFresco,usoVit,usoDt,usoTotal,saldoFresco,saldoVit,saldoDt,saldoTotal};
}
function embrioesRowsFiltered(){
  let rows=(db.embrioes||[]).map(e=>({...e,...embRowCalc(e)})).filter(e=>excelPass('embrioes',e));
  const k=embrioesSort.key,d=embrioesSort.dir;
  if(k)rows.sort((a,b)=>{
    const av=a[k],bv=b[k];
    if(typeof av==='number'||typeof bv==='number')return ((Number(av)||0)-(Number(bv)||0))*d;
    return String(av??'').localeCompare(String(bv??''),'pt-BR',{numeric:true})*d;
  });
  return rows;
}

function editEmbriao(id,key,val,el){
  const e=(db.embrioes||[]).find(x=>x.id===id);if(!e)return;
  if(key==='rgd'){e.rgd=String(val||'').trim();save();return}
  if(key==='touro'){
    val=String(val||'').trim();
    if(val && !sireExists(val)){alert(`O touro "${val}" não existe no Estoque. Cadastre em Estoque primeiro.`);el.value=e.touro||'';return}
    e.touro=val;save();return
  }
  const n=Number(String(val).replace(',','.'));
  e[key]=Number.isFinite(n)?Math.max(0,n):0;
  save();
  const tr=el.closest('tr');if(!tr)return;
  const calc=embRowCalc(e);
  ['estTotal','saidaTotal','usoTotal','saldoFresco','saldoVit','saldoDt','saldoTotal'].forEach(k=>{const c=tr.querySelector('.c-'+k);if(c){c.textContent=calc[k];const col=embCellColor(k,calc[k]);if(k.startsWith('saldo'))c.style.color=col||'#216440'}});
  const tfoot=tr.closest('table')?.querySelector('tfoot');
  if(tfoot)tfoot.outerHTML=embrioesTotalsRowHTML(embrioesRowsFiltered());

function importEmbrioesExcel(file){
  readExcel(file,rows=>{
    if(!rows.length)return alert('O Excel não possui linhas para importar.');
    const errs=[],prepared=[];
    rows.forEach((r,i)=>{
      const line=i+2;
      const rgd=String(pick(r,['RGD'])||'').trim();
      if(!rgd)return;
      const touro=String(pick(r,['TOURO'])||'').trim();
      if(touro && !sireExists(touro)){errs.push(`Linha ${line}: touro "${touro}" não existe no Estoque.`);return}
      const num=(names)=>{const v=pick(r,names);if(v===''||v===undefined||v===null)return 0;const n=Number(String(v).replace(',','.'));if(!Number.isFinite(n)||n<0){errs.push(`Linha ${line}: valor inválido em ${names[0]}.`);return 0}return n};
      prepared.push({
        rgd,touro,
        estFresco:num(['ESTOQUE_FRESCO','FRESCO']),
        estVit:num(['ESTOQUE_VIT','VIT']),
        estDt:num(['ESTOQUE_DT','DT']),
        saidaFresco:num(['SAIDA_FRESCO']),
        saidaVit:num(['SAIDA_VIT']),
        saidaDt:num(['SAIDA_DT'])
      });
    });
    if(errs.length){showImportErrors('Importação com problemas',`Corrija ${errs.length} linha(s) e envie o Excel novamente. Nada foi importado.`,errs);return}
    if(!prepared.length)return alert('Nenhum RGD encontrado no arquivo.');
    db.embrioes=db.embrioes||[];
    let novos=0,atualizados=0;
    prepared.forEach(x=>{
      // a chave é RGD + Touro (uma doadora pode ter uma linha por touro usado nela)
      const existing=db.embrioes.find(e=>norm(e.rgd)===norm(x.rgd)&&norm(e.touro||'')===norm(x.touro||''));
      if(existing){
        // soma ao que já existe (é assim que o estoque acumula entre sessões/OPUs)
        existing.estFresco=(Number(existing.estFresco)||0)+x.estFresco;
        existing.estVit=(Number(existing.estVit)||0)+x.estVit;
        existing.estDt=(Number(existing.estDt)||0)+x.estDt;
        existing.saidaFresco=(Number(existing.saidaFresco)||0)+x.saidaFresco;
        existing.saidaVit=(Number(existing.saidaVit)||0)+x.saidaVit;
        existing.saidaDt=(Number(existing.saidaDt)||0)+x.saidaDt;
        atualizados++;
      }else{
        db.embrioes.push({id:uid('emb'),rgd:x.rgd,touro:x.touro,estFresco:x.estFresco,estVit:x.estVit,estDt:x.estDt,saidaFresco:x.saidaFresco,saidaVit:x.saidaVit,saidaDt:x.saidaDt});
        novos++;
      }
    });
    save();
    alert(`${novos} doadora(s) nova(s) e ${atualizados} com estoque somado ao que já existia.`);
    if(page==='embrioes')embrioesPage();
  })
} window.importEmbrioesExcel=importEmbrioesExcel;

function touroOptionsForRgd(rgd){

/* FIV por data (igual IATF): cada FIV é uma data; a tabela mostra só a FIV escolhida em cima.
   As datas criadas ficam em db.fivDatas[estação] (pra FIV vazia não sumir); linhas antigas sem data
   aparecem em "Sem data". */
function fivDatasLista(){
  const sid=db.meta.activeSeasonId;
  const ds=new Set([...((db.fivDatas||{})[sid]||[]),...seasonFiv().map(r=>r.data||'').filter(Boolean)]);
  const lista=[...ds].sort();
  if(seasonFiv().some(r=>!r.data))lista.push('');
  return lista;
}
function fivAtual(){
  const l=fivDatasLista();
  if(fivData===null||!l.includes(fivData))fivData=l.length?l.filter(Boolean).slice(-1)[0]??l[0]:null;
  return fivData;
}
const fivNome=d=>{const l=fivDatasLista().filter(Boolean);return d?`${l.indexOf(d)+1}ª FIV — ${fmtDate(d)}`:'Sem data'};
function fivDaData(){const d=fivAtual();return d===null?[]:seasonFiv().filter(r=>(r.data||'')===d)}
function fivLocal(d){return (((db.fivLocais||{})[db.meta.activeSeasonId])||{})[d||'']||''}
function setFivLocal(v){
  const d=fivAtual();if(d===null)return;const sid=db.meta.activeSeasonId;
  db.fivLocais=db.fivLocais||{};db.fivLocais[sid]=db.fivLocais[sid]||{};
  v=String(v||'').trim();if(v)db.fivLocais[sid][d]=v;else delete db.fivLocais[sid][d];
  save();

  const loc=(db.fivLocais||{})[sid];if(loc&&loc[velha||'']!==undefined){loc[nova]=loc[velha||''];delete loc[velha||'']}

function excluirFivVazia(){
  const d=fivAtual();if(d===null)return;

  if(n){
    if(!confirm(`Excluir a ${nome}?\n\nIsso apaga as ${n} linha(s) dela.`))return;
    if(!confirm(`Confirme mais uma vez: apagar a ${nome} com ${n} linha(s)?\n\n(Se errar, use o botão Desfazer.)`))return;
    const ids=new Set(fivDaData().map(r=>r.id));
    db.fiv=db.fiv.filter(r=>!ids.has(r.id));
  }
  const sid=db.meta.activeSeasonId;
  if(db.fivDatas&&db.fivDatas[sid])db.fivDatas[sid]=db.fivDatas[sid].filter(x=>x!==d);
  if(db.fivLocais&&db.fivLocais[sid])delete db.fivLocais[sid][d||''];

function editFiv(id,key,val,el){

  if(key==='tipo'){
    // Tipo é digitado (dá pra colar): F/Fresco, V/VIT, DT — maiúscula ou minúscula

    if(val && !v){alert('Tipo deve ser Fresco, VIT ou DT.');el.value=r.tipo||'';return}

function editStockCell(id,key,val,el){
  const s=db.semen.find(x=>x.id===id);if(!s)return;
  if(key==='name'){
    val=val.trim();const old=s.name;
    if(!val){if(old){alert('O nome do touro não pode ficar vazio.');el.value=old}return}
    if(db.semen.some(x=>x.id!==id&&norm(x.name)===norm(val))){alert('Já existe um cadastro com esse nome.');el.value=old;return}
    s.name=val;if(old)renameSireEverywhere(old,val)
  }else if(key==='initial'){s.initial=Number(String(val).replace(',','.'))||0}
  else if(key==='used'){
    const v=String(val).trim();
    if(v===''){s.usedOverride=null}                       // vazio = volta ao automático
    else{
      const n=Number(v.replace(',','.'));
      if(!Number.isFinite(n)||n<0){alert('Informe um número válido em "Usado".');renderStock();return}
      s.usedOverride=(n===usedAuto(s))?null:n;            // igual ao automático = mantém automático
    }
  }
  else s[key]=val;
  save();renderStock()
} window.editStockCell=editStockCell;
// Troca o nome do touro em todo lugar que referencia ele (Matrizes, IATF 1º e 2º, Acasalamentos,
// Embriões, FIV e Exclusões) — antes só Matrizes e IATF 1º eram atualizados e o resto ficava órfão.
function renameSireEverywhere(old,val){
  const o=norm(old);
  const fix=(obj,k)=>{if(obj&&norm(obj[k])===o)obj[k]=val};
  db.animals.forEach(a=>fix(a,'firstSire'));
  db.iatf.forEach(r=>{fix(r,'firstSire');fix(r,'secondSire');fix(r,'returnSire')});
  (db.acasalamentos||[]).forEach(a=>ACASAL_COLS.forEach(([k])=>fix(a,k)));
  (db.embrioes||[]).forEach(e=>fix(e,'touro'));
  (db.fiv||[]).forEach(f=>fix(f,'sire'));
  (db.deletedAnimals||[]).forEach(d=>{fix(d.animal,'firstSire');(d.iatf||[]).forEach(r=>{fix(r,'firstSire');fix(r,'secondSire');fix(r,'returnSire')})});

function sireInUse(name){

// quantos lançamentos usam o valor (todas as estações) — pra não deixar excluir algo em uso
function listItemUsage(kind,v){
  const n=norm(v);
  if(kind==='destinos')return (db.naoUtilizadas||[]).filter(r=>norm(r.destino)===n).length;
  return db.animals.filter(a=>norm(a.category)===n).length+db.iatf.filter(r=>norm(r.category)===n).length
    +(db.acasalamentos||[]).filter(a=>norm(a.category)===n).length+(db.naoUtilizadas||[]).filter(r=>norm(r.category)===n).length;

function addListItem(kind){
  const el=$('#newItem-'+kind);const v=(el?el.value:'').trim();if(!v)return;
  const items=listItems(kind);
  if(matchList(items,v))return alert(`"${v}" já está na lista.`);
  db.settings[kind]=[...items,v];save();settings();
} window.addListItem=addListItem;
function renameListItem(kind,i,el){
  const items=listItems(kind).slice();const old=items[i];const v=el.value.trim();
  if(!v){alert('O nome não pode ficar vazio.');el.value=old;return}
  if(v===old)return;
  if(items.some((x,j)=>j!==i&&norm(x)===norm(v))){alert(`"${v}" já está na lista.`);el.value=old;return}
  const usos=listItemUsage(kind,old);
  if(usos&&!confirm(`Renomear "${old}" para "${v}"?\n\nIsso troca o nome em ${usos} lançamento(s), em todas as estações.`)){el.value=old;return}
  items[i]=v;db.settings[kind]=items;
  const o=norm(old);
  const fix=(obj,k)=>{if(obj&&norm(obj[k])===o)obj[k]=v};
  if(kind==='destinos'){(db.naoUtilizadas||[]).forEach(r=>fix(r,'destino'))}
  else{
    db.animals.forEach(a=>fix(a,'category'));db.iatf.forEach(r=>fix(r,'category'));
    (db.acasalamentos||[]).forEach(a=>fix(a,'category'));(db.naoUtilizadas||[]).forEach(r=>fix(r,'category'));
    (db.iatfExcluded||[]).forEach(x=>fix(x,'category'));
    (db.deletedAnimals||[]).forEach(d=>{fix(d.animal,'category');(d.iatf||[]).forEach(r=>fix(r,'category'))});
    Object.values(db.iatfCycleCategories||{}).forEach(bySeason=>Object.keys(bySeason||{}).forEach(cy=>{bySeason[cy]=(bySeason[cy]||[]).map(c=>norm(c)===o?v:c)}));
  }
  Object.keys(excelFilters).forEach(k=>excelFilters[k]={});
  save();settings();
} window.renameListItem=renameListItem;
function moveListItem(kind,i,d){
  const items=listItems(kind).slice();const j=i+d;if(j<0||j>=items.length)return;
  [items[i],items[j]]=[items[j],items[i]];db.settings[kind]=items;save();settings();
} window.moveListItem=moveListItem;
function removeListItem(kind,i){
  const items=listItems(kind);const v=items[i];
  if(items.length<=1)return alert('A lista precisa ter pelo menos um item.');
  const usos=listItemUsage(kind,v);
  if(usos)return alert(`"${v}" está em uso em ${usos} lançamento(s) (em alguma estação) e não pode ser excluída.\n\nSe quiser trocar o nome, é só editar o texto — isso atualiza todos os lançamentos.`);
  if(!confirm(`Excluir "${v}" da lista?`))return;
  db.settings[kind]=items.filter((_,j)=>j!==i);save();settings();
} window.removeListItem=removeListItem;
