<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153e2c">
<title>Caderneta · App Nelore MRA</title>
<link rel="icon" href="../logo.webp">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--verde:#1f6a49;--verde-esc:#153e2c;--verde-claro:#eef6f1;--ouro:#b39a3b;--fundo:#f4f6f4;--borda:#e3e8e4;--linha:#eef1ef;--texto:#17211c;--suave:#5d6a62;--muito-suave:#8a958d;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--texto);background:var(--fundo)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:var(--fundo)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.hidden{display:none!important}
/* topo */
.topo{background:var(--verde-esc);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.topo-in{max-width:1800px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topo img{width:34px;height:34px;border-radius:50%}
.topo .t{font-size:16px;font-weight:800;line-height:1.1}.topo .s{font-size:11.5px;opacity:.75}
.topo .acoes{margin-left:auto;display:flex;gap:6px}
.icobtn{background:#ffffff14;color:#fff;border:1px solid #ffffff30;border-radius:9px;height:36px;padding:0 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.topo-in>.voltar-app{margin:0 4px 0 0;align-self:center}
/* estrutura */
.pag{max-width:1800px;margin:0 auto;padding:18px 24px 120px}
.pag>section{min-width:0}
.lateral{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:18px}
.bloco h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muito-suave)}
.meses-v{display:flex;flex-direction:column;gap:2px}
.mes-i{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;display:flex;justify-content:space-between;color:var(--texto)}
.mes-i:hover{background:#e9efea}.mes-i.on{background:var(--verde);color:#fff;font-weight:700}
.lado-acoes{display:flex;flex-direction:column;gap:6px}
/* abas */
.abas{display:flex;gap:4px;background:#e7ece8;border-radius:11px;padding:4px;width:max-content;max-width:100%;margin-bottom:14px}
.aba{border:0;background:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:700;color:var(--suave);white-space:nowrap}
.aba.on{background:#fff;color:var(--verde-esc);box-shadow:0 1px 3px #0002}
/* cabeçalho da lista */
.cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.barra-f{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.barra-f .campo{display:flex;flex-direction:column;gap:4px}.barra-f label{font-size:11.5px;font-weight:700;color:var(--suave)}
.barra-f select{border:1px solid #d7ded9;border-radius:9px;padding:8px 10px;font-size:14.5px;background:#fff;min-width:210px;outline:none}
.barra-f select:focus{border-color:#72a386}
.barra-f .busca{margin-left:0;flex:1 1 240px;max-width:380px}
.barra-f .acoes-f{margin-left:auto;display:flex;gap:6px}
.barra-f .acoes-f .btn{padding:8px 12px;font-size:13.5px}
#avisoF:empty{display:none}
.aviso-f{display:inline-flex;gap:8px;align-items:center;background:#fff6e0;border:1px solid #f0d9a8;color:#6b4f12;border-radius:9px;padding:6px 10px;font-size:13px}
.aviso-f button{border:1px solid #e3c98a;background:#fff;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700;color:#6b4f12}
.thf{display:flex;align-items:center;justify-content:space-between;gap:4px}
.tabd th.c .thf{justify-content:center}.tabd th.n .thf{justify-content:flex-end}
.fbtn{border:0;background:none;color:var(--muito-suave);font-size:11px;padding:1px 5px;border-radius:5px;flex:none}.fbtn:hover{background:#e6ece8}.fbtn.on{color:var(--verde);background:var(--verde-claro);font-weight:800}
.fpainel{position:fixed;z-index:40;background:#fff;border:1px solid var(--borda);border-radius:12px;box-shadow:0 10px 30px #0003;padding:10px;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--texto);font-weight:400}
.fp-ord{display:flex;gap:6px;margin-bottom:8px}.fp-ord .btn{flex:1;padding:6px;font-size:12.5px}
.fp-busca{width:100%;border:1px solid #d7ded9;border-radius:8px;padding:6px 9px;font-size:13.5px;margin-bottom:6px;outline:none}
.fp-lista{max-height:200px;overflow:auto;border:1px solid var(--linha);border-radius:8px;padding:4px 8px;margin:4px 0 8px}
.fp-it{display:flex;gap:7px;align-items:center;padding:4px 0;cursor:pointer}
.fp-acoes{display:flex;gap:6px;justify-content:flex-end}.fp-acoes .btn{padding:7px 12px;font-size:13px}
.cab{margin:0 0 6px 2px}.cab .qtd{color:var(--muito-suave);font-size:12.5px}
.cab .qtd b{color:var(--texto)}
.busca{position:relative;margin-left:auto;flex:0 1 320px;min-width:200px}
.busca input{width:100%;border:1px solid var(--borda);border-radius:10px;padding:8px 12px 8px 34px;background:#fff;font-size:14.5px;outline:none}
.busca input:focus{border-color:#72a386;box-shadow:0 0 0 3px #72a38622}
.busca:before{content:"🔎";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.btn-primary{background:var(--verde);color:#fff}.btn-primary:hover{background:#185b3e}
.btn-ghost{background:#fff;border:1px solid var(--borda);color:#334139}.btn-ghost:hover{background:#f7f9f7}
.btn-danger{background:#fff;border:1px solid #e7bbb5;color:#a33627}
/* faixa de meses (celular) */
.faixa{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;margin:0 -16px 10px}
.faixa::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--borda);background:#fff;border-radius:99px;padding:7px 13px;font-size:13.5px;white-space:nowrap}
.pill.on{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:700}
/* tabela do computador */
.tabd{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:auto;max-height:calc(100vh - 200px)}
.tabd table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:13.5px;table-layout:fixed}
.tabd th{position:sticky;top:0;z-index:2;background:#f3f5f3;color:var(--suave);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:7px 8px;border-bottom:1px solid var(--borda);border-right:1px solid #e8ebe9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabd td{padding:0 8px;height:34px;border-bottom:1px solid #edf0ee;border-right:1px solid #f0f2f1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabd tbody tr{cursor:pointer}.tabd tbody tr:hover td{background:#f5faf7}
.tabd .c{text-align:center}.tabd .n{text-align:right}
.tabd td.quebra{white-space:normal;word-break:break-word;padding-top:6px;padding-bottom:6px;line-height:1.35}
.tabd .por{color:var(--muito-suave);font-size:12px}
.tabd tr.rapido td{position:sticky;top:31px;z-index:1;background:#f6faf7;padding:6px 5px;height:auto;border-bottom:2px solid #cfe0d5;overflow:visible}
.tabd .rapido input,.tabd .rapido select{width:100%;border:1px solid #d7ded9;border-radius:7px;padding:7px 9px;font-size:13.5px;background:#fff;outline:none;min-width:0}
.tabd .rapido input:focus,.tabd .rapido select:focus{border-color:#72a386;box-shadow:0 0 0 2px #72a38633}
.tabd .rapido .lancar{width:100%;border:0;border-radius:7px;background:var(--verde);color:#fff;font-weight:800;padding:8px 0;font-size:13px}
.tabd .rapido .bfoto{width:100%;border:1px dashed #9fbfab;border-radius:7px;background:#fff;color:var(--verde-esc);font-weight:700;padding:7px 4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabd .vazio{cursor:default;white-space:normal;height:auto}
.tabd .rs{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:3}
.tabd .rs:hover{background:#72a38644}
input[list]::-webkit-calendar-picker-indicator{display:none!important;opacity:0}
.sexo{display:inline-block;min-width:22px;text-align:center;font-weight:800;font-size:12px;border-radius:5px;padding:1px 6px}
.sexo.M{background:#e4eefb;color:#235fa8}.sexo.F{background:#fbe6f0;color:#a8336d}
.tag-obs{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:1px 7px;background:#f1f4f2;color:#4a5850}
.tag-obs.ruim{background:#fbeeec;color:#a33627}.tag-obs.gem{background:#fff4dc;color:#8a5a12}
.minis{display:flex;gap:4px}.minis img{width:30px;height:30px;border-radius:5px;object-fit:cover;background:#eef1ef;cursor:zoom-in}
.xdel{border:0;background:none;border-radius:6px;padding:3px 6px;font-size:14px;opacity:.45}.xdel:hover{opacity:1;background:#fbeeec}
.pend{color:#a0681a;font-weight:700}
.sit{display:inline-block;font-size:12px;font-weight:800;border-radius:5px;padding:1px 8px;background:#f1f4f2;color:#4a5850}
.sit-0{background:#e3f3e8;color:#1f6a49}.sit-1{background:#e4eefb;color:#235fa8}.sit-2{background:#fbeeec;color:#a33627}.sit-3{background:#f3ebe1;color:#7a4a1c}
/* lista do celular */
.lista{display:none;background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.reg{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--linha);cursor:pointer;align-items:center}
.reg:last-child{border-bottom:0}
.reg .corpo{flex:1;min-width:0}
.reg .l1{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .l1.duas{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.reg .l2{font-size:12.5px;color:var(--suave);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .dir{display:flex;align-items:center;gap:6px}
.reg .mini-foto{width:38px;height:38px;border-radius:7px;object-fit:cover;background:#eef1ef}
.vazio{padding:36px 20px;text-align:center;color:var(--suave);line-height:1.5}
.offline{background:#fff3d6;border:1px solid #ecd28f;color:#6b4f12;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.fab{display:none;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--verde);color:#fff;border:0;border-radius:16px;padding:15px 20px;font-size:16px;font-weight:800;box-shadow:0 8px 24px #153e2c55;z-index:8}
/* formulário */
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.folha{background:#fff;width:min(600px,100%);max-height:92vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.folha-cab{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linha)}
.folha-cab h2{margin:0;font-size:17px}.folha-cab .x{margin-left:auto;border:0;background:#f1f4f2;width:34px;height:34px;border-radius:50%;font-size:18px}
.folha-corpo{padding:16px 18px;overflow:auto}
.folha-pe{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--linha);background:#fafbfa;flex-wrap:wrap}
.folha-pe .esq{margin-right:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:12.5px;color:var(--suave);font-weight:700}
.input{width:100%;border:1px solid #d7ded9;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;outline:none}
.input:focus{border-color:#72a386;box-shadow:0 0 0 3px #72a38622}
textarea.input{min-height:96px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid #d7ded9;background:#fff;border-radius:10px;padding:10px;font-weight:800;font-size:15px}
.seg button.on.M{background:#235fa8;border-color:#235fa8;color:#fff}.seg button.on.F{background:#a8336d;border-color:#a8336d;color:#fff}
.fotos{display:flex;gap:8px;flex-wrap:wrap}.foto{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:#eef1ef}
.foto img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}.foto button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:#000a;color:#fff;line-height:1;font-size:14px}
.addfoto{width:76px;height:76px;border:2px dashed #b7c9bd;border-radius:10px;display:grid;place-items:center;color:var(--verde);font-weight:700;font-size:12px;text-align:center;background:#fff;cursor:pointer}
.zoom{position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:40;padding:10px}.zoom img{max-width:100%;max-height:100%;border-radius:8px}
.menu{position:absolute;right:16px;top:54px;background:#fff;color:var(--texto);border:1px solid var(--borda);border-radius:12px;box-shadow:0 10px 30px #0003;padding:6px;z-index:20;min-width:190px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:14.5px}.menu button:hover{background:#f3f6f4}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17211c;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:50;max-width:90vw;text-align:center}
/* Prenha/Vazia */
.pz-top{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.pz-top .campo{display:flex;flex-direction:column;gap:4px}.pz-top label{font-size:11.5px;font-weight:700;color:var(--suave)}
.pz-top select,.pz-top input{border:1px solid #d7ded9;border-radius:9px;padding:9px 11px;font-size:16px;background:#fff;outline:none}
.pz-top select:focus,.pz-top input:focus{border-color:#72a386;box-shadow:0 0 0 3px #72a38622}
#pzEst{min-width:120px;font-weight:800;color:var(--verde-esc)}
.pz-rgd{flex:1 1 200px;max-width:280px}.pz-rgd input{width:100%;font-weight:800;font-size:17px}
.pz-achou{font-weight:400;color:#9a5a12}
.pz-bts{display:flex;gap:8px}.pz-b{border:0;border-radius:11px;padding:11px 16px;font-weight:800;font-size:15.5px;color:#fff}
.pz-b.P{background:#1f7a4d}.pz-b.V{background:#c0392b}.pz-b.T{background:#d9822b}
.pz-chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.pz-chips::-webkit-scrollbar{display:none}.pz-chips .aviso-f{flex:none;white-space:nowrap}
.pz-chips .pill b{margin-left:4px}.pz-chips .pill.on.P{background:#1f7a4d;border-color:#1f7a4d}.pz-chips .pill.on.V{background:#c0392b;border-color:#c0392b}.pz-chips .pill.on.T{background:#d9822b;border-color:#d9822b}
.pz-lista{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:hidden;max-width:760px}
.pz-reg{display:grid;grid-template-columns:minmax(0,1fr) 130px 120px minmax(0,1fr) 34px;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--linha)}
.pz-reg:last-child{border-bottom:0}.pz-cab{background:#f3f5f3;padding:6px 12px;position:sticky;top:0;z-index:2}.pz-cab .thf{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);font-weight:700}.pz-cab .fbtn{font-size:12px;padding:2px 7px}.pz-reg .rgd{font-weight:800;font-size:15px;cursor:pointer}.pz-reg .info{font-size:12.5px;color:var(--muito-suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz-sel{width:100%;border:1px solid #d7ded9;border-radius:8px;padding:6px 8px;font-size:14.5px;font-weight:800;outline:none}
.pz-sel.P{background:#e3f3e8;color:#1f6a49;border-color:#b9dcc6}.pz-sel.V{background:#fbeeec;color:#a33627;border-color:#ecc3bd}.pz-sel.T{background:#fdf0dc;color:#9a5a12;border-color:#efd3a6}
/* ===== celular ===== */
@media(max-width:860px){
  .pag{grid-template-columns:minmax(0,1fr);padding:12px 16px 110px;gap:0}
  .tabd,.so-desk{display:none!important}
  .barra-f select{min-width:0;width:100%}.barra-f .campo{flex:1 1 100%}.barra-f .busca{max-width:none;flex-basis:100%}
  .lista{display:block}
  .abas{width:100%}.aba{flex:1;padding:9px 6px}
  .fab{display:block}
  .pz-top .campo{flex:1 1 100%}.pz-top .campo:first-child{flex:0 0 105px}.pz-top .pz-rgd{flex:1 1 0;max-width:none}#pzEst{width:100%}
  .pz-bts{width:100%}.pz-b{flex:1;padding:15px 6px;font-size:16.5px}
  .pz-reg{grid-template-columns:minmax(0,1fr) 118px 30px;row-gap:0}.pz-reg .info{grid-column:1;grid-row:2}.pz-reg .info.por{display:none}.pz-reg .rgd{grid-row:1}
  .pz-reg .pz-sel{grid-column:2;grid-row:1/3}.pz-reg .xdel{grid-column:3;grid-row:1/3}
  .pz-cab{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}.pz-cab>*{grid-row:1!important;grid-column:auto!important}.pz-cab .info.por,.pz-cab>span:last-child{display:none!important}
  .aba{font-size:13px;padding:9px 4px;min-width:0}.abas{overflow:hidden}
  .modal{padding:0;align-items:flex-end}
  .folha{width:100%;max-height:96vh;border-radius:18px 18px 0 0}
  .folha-pe{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
@media(max-width:600px){.topo-in>img{display:none}}
@media(min-width:861px){.topo .so-cel{display:none}}
.pz-desk{display:flex}.pz-cel{display:none}@media(max-width:860px){.pz-desk{display:none!important}.pz-cel{display:flex}}
@media print{.topo,.barra-f,.fbtn,.fab,.offline,.busca,.abas,.so-cel,tr.rapido,.xdel,.lista,.pz-top,.pz-chips,.pz-reg .xdel{display:none!important}.pz-lista{border:0;max-width:none}.pz-sel{border:0;background:none!important;appearance:none;padding:0}.pag{display:block;padding:0}.tabd{display:block!important;max-height:none;overflow:visible;border:0}}
</style>
</head>
<body>
<script src="../barra-app.js" data-alvo=".topo-in"></script>
<header class="topo"><div class="topo-in">
  <img src="../logo.webp" alt="Nelore MRA">
  <div><div class="t">Caderneta</div><div class="s" id="quem"></div></div>
  <div class="acoes">
    <button class="icobtn so-cel" onclick="abrirMenu(event)" aria-label="Mais opções">⋯</button>
  </div>
</div></header>

<div class="pag">
  <section>
    <div id="offline" class="offline hidden">📵 Sem internet. Pode lançar normal: fica guardado no aparelho e envia sozinho quando a internet voltar.</div>
    <div class="abas" id="abas">
      <button class="aba" data-aba="nasc" onclick="irAba('nasc')">🐮 Nascimentos</button>
      <button class="aba" data-aba="geral" onclick="irAba('geral')">📝 <span class="so-desk">Lançamento </span>Geral</button>
      <button class="aba" data-aba="prenhez" onclick="irAba('prenhez')">🩺 Prenha/Vazia</button>
    </div>
    <div id="secPz" class="hidden">
      <div class="pz-top">
        <div class="campo"><label>Estação</label><select id="pzEst" onchange="trocarEstacao(this.value)"></select></div>

<script>
/* CADERNETA — duas abas:
   • Nascimentos: RGD Mãe, N° Receptora, Sexo, Data, Peso (kg), Pelagem, Observação (lista + texto livre)
   • Lançamento Geral: Data, Acontecimento (texto livre), Fotos
   Tudo em apps/caderneta/lancamentos (campo aba = 'nasc' | 'geral', mes = AAAA-MM). Lançamentos sem "aba" são do
   modelo antigo e não aparecem mais. Fotos comprimidas em apps/caderneta/fotos. Funciona sem internet. */
const FIREBASE_CONFIG={apiKey:'AIzaSyD9yib_iQYHcOG2B2C70cWXJ9SkTiIDt94',authDomain:'app-nelore-mra.firebaseapp.com',projectId:'app-nelore-mra',storageBucket:'app-nelore-mra.firebasestorage.app',messagingSenderId:'1043343802346',appId:'1:1043343802346:web:219f5d73748271a85dfc93'};
const ADMIN_EMAIL='mandrade.gado@terra.com.br', USER_DOMAIN='@app-nelore-mra.firebaseapp.com';
const OBS_LISTA=['Natimorto','Morte','Gêmeos'];
// Pelagem: lista fixa (guarda a sigla)
const PELAGENS=[['Br','Branco'],['Cz','Cinza'],['Mn','Manchado'],['Pp','Preto'],['Pv','Vermelho']];
const opcoesPel=atual=>'<option value="">—</option>'+PELAGENS.map(([s,n])=>`<option value="${s}" ${s===atual?'selected':''}>${s} (${n.toLowerCase()})</option>`).join('')+(atual&&!PELAGENS.some(p=>p[0]===atual)?`<option selected>${esc(atual)}</option>`:'');
const SITUACOES=['Entrada','Saída','Morte','Abate','Outros'];
const sitHtml=x=>x?`<span class="sit sit-${SITUACOES.indexOf(x)}">${esc(x)}</span>`:'';
const obsGeral=i=>i.obs??i.acontecimento??''; // lançamentos antigos tinham "acontecimento"
firebase.initializeApp(FIREBASE_CONFIG);
const fs=firebase.firestore();
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const col=fs.collection('apps').doc('caderneta').collection('lancamentos');
const cfgRef=fs.collection('apps').doc('caderneta').collection('config').doc('listas');
const colFotos=fs.collection('apps').doc('caderneta').collection('fotos');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const hoje=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtData=s=>s?s.split('-').reverse().join('/'):'';
const diaSem=s=>s?new Date(s+'T12:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''):'';
const numBR=v=>{const n=Number(String(v??'').trim().replace(/\./g,'').replace(',','.'));return String(v??'').trim()!==''&&Number.isFinite(n)?n:null};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const nomeMes=m=>{const [a,n]=m.split('-').map(Number);return `${MESES[n-1]} de ${a}`};
const curtoMes=m=>{const [a,n]=m.split('-').map(Number);return `${MESES[n-1].slice(0,3)}/${String(a).slice(2)}`};
let eu=null, ehAdmin=false, meuNome='', mes=hoje().slice(0,7), todos=[], itens=[], parar=null, miniFotos={}, pelagens=[];
let aba='nasc';try{const a=localStorage.getItem('app-nelore-mra-caderneta-aba');aba=a==='geral'||a==='prenhez'?a:'nasc'}catch(e){}

function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function statusRede(){$('#offline').classList.toggle('hidden',navigator.onLine)}
addEventListener('online',statusRede);addEventListener('offline',statusRede);statusRede();

firebase.auth().onAuthStateChanged(async u=>{
  if(!u){location.href='../index.html';return}
  eu=u;ehAdmin=String(u.email||'').toLowerCase()===ADMIN_EMAIL;
  let perfil=null;
  try{const d=await fs.collection('users').doc(u.uid).get();perfil=d.exists?d.data():null;try{localStorage.setItem('app-nelore-mra-perfil-'+u.uid,JSON.stringify(perfil))}catch(_){}}catch(e){console.warn(e);try{perfil=JSON.parse(localStorage.getItem('app-nelore-mra-perfil-'+u.uid)||'null')}catch(_){}}
  if(!ehAdmin&&(!perfil||perfil.ativo===false||!(perfil.apps&&perfil.apps.caderneta))){alert('Você não tem acesso à Caderneta. Fale com o administrador.');location.href='../index.html';return}
  meuNome=ehAdmin?'Administrador':((perfil&&(perfil.nome||perfil.usuario))||String(u.email).replace(USER_DOMAIN,''));
  $('#quem').textContent=meuNome;
  cfgRef.onSnapshot(d=>{pelagens=(d.exists&&d.data().pelagens)||[];estacoesPz=(d.exists&&d.data().estacoesPrenhez)||[];montarEstacoes();$('#dlPelagem').innerHTML=pelagens.map(l=>`<option value="${esc(l)}">`).join('')},()=>{});
  irAba(aba);
});

/* ---------- abas e filtro de mês ---------- */
function irAba(a){
  aba=a;try{localStorage.setItem('app-nelore-mra-caderneta-aba',a)}catch(e){}
  document.querySelectorAll('.aba').forEach(b=>b.classList.toggle('on',b.dataset.aba===a));
  const ehPz=a==='prenhez';$('#secPz').classList.toggle('hidden',!ehPz);$('#secGen').classList.toggle('hidden',ehPz);$('.fab').classList.toggle('hidden',ehPz);
  if(ehPz){fecharFiltro();if(parar){parar();parar=null}ouvirPz();return}
  if(pararPz){pararPz();pararPz=null}
  $('#busca').placeholder=a==='nasc'?'Buscar RGD, receptora, pelagem...':'Buscar RGD, situação, observação...';
  $('#rotMes').textContent=a==='nasc'?'Mês do nascimento':'Mês do lançamento';
  fecharFiltro();montarTabela();ouvirAba();
}
// carrega todos os lançamentos da aba; o mês é filtrado na tela
function ouvirAba(){
  if(parar)parar();
  todos=[];$('#lista').innerHTML='<div class="vazio">Carregando...</div>';$('#corpoD').innerHTML='';
  parar=col.where('aba','==',aba).onSnapshot({includeMetadataChanges:true},snap=>{
    todos=snap.docs.map(d=>({id:d.id,...d.data(),_pend:d.metadata.hasPendingWrites}));
    desenhar();
  },e=>{$('#lista').innerHTML=`<div class="vazio">Não consegui carregar.<br><small>${esc(e.message)}</small></div>`});
}
function montarMeses(){
  const ms=[...new Set([hoje().slice(0,7),...(mes?[mes]:[]),...todos.map(i=>i.mes).filter(m=>/^\d{4}-\d{2}$/.test(m||''))])].sort().reverse();
  const cont={};todos.forEach(i=>cont[i.mes]=(cont[i.mes]||0)+1);
  $('#selMes').innerHTML=`<option value="">Todos os meses</option>`+ms.map(m=>`<option value="${m}" ${m===mes?'selected':''}>${nomeMes(m)}</option>`).join('');
  $('#selMes').value=mes;
}
/* ---------- tabela do computador ---------- */
// [título, largura %, alinhamento, campo do filtro]
const COLS={
  nasc:[['RGD Mãe',13,'','rgdMae'],['N° Receptora',11,'','receptora'],['Sexo',7,'c','sexo'],['Data Nasc.',12,'','data'],['Peso (kg)',9,'n','peso'],['Pelagem',13,'','pelagem'],['Observação',20,'','obs'],['Por',10,'','por'],['',5]],
  geral:[['Data Lançamento',12,'','data'],['RGD',11,'','rgd'],['Situação',11,'','situacao'],['Observação',34,'','obs'],['Fotos',16],['Por',11,'','por'],['',5]]
};
const LARG_KEY=()=>'app-nelore-mra-caderneta-larguras-'+aba;
function montarTabela(){
  const cols=COLS[aba];
  const rapido=aba==='nasc'
    ?`<td><input id="rMae" placeholder="RGD Mãe" autocapitalize="characters"></td><td><input id="rRec" placeholder="Receptora" autocapitalize="characters"></td>
      <td><select id="rSexo"><option value="">—</option><option>M</option><option>F</option></select></td><td><input type="date" id="rData"></td>
      <td><input id="rPeso" inputmode="decimal" placeholder="kg"></td><td><select id="rPel">${opcoesPel('')}</select></td>
      <td><input id="rObs" list="dlObs" placeholder="Natimorto, Morte, Gêmeos ou escreva"></td><td colspan="2"><button class="lancar" onclick="lancarRapido()">+ Lançar</button></td>`
    :`<td><input type="date" id="rData"></td><td><input id="rRgd" placeholder="RGD" autocapitalize="characters"></td>
      <td><select id="rSit"><option value="">—</option>${SITUACOES.map(x=>`<option>${x}</option>`).join('')}</select></td><td><input id="rObsG" placeholder="Observação (Enter lança)"></td>
      <td><button class="bfoto" id="rFotoBtn" onclick="$('#rArq').click()">📷 Foto</button></td><td colspan="2"><button class="lancar" onclick="lancarRapido()">+ Lançar</button></td>`;
  $('#tabd').innerHTML=`<table><colgroup>${cols.map(c=>`<col style="width:${c[1]}%">`).join('')}</colgroup>
    <thead><tr class="cabcol">${cols.map(c=>`<th class="${c[2]||''}">${c[3]?`<div class="thf"><span>${c[0]}</span><button class="fbtn" data-k="${c[3]}" onclick="abrirFiltro(event,'${c[3]}')" title="Filtrar / ordenar">▾</button></div>`:c[0]}</th>`).join('')}</tr><tr class="rapido">${rapido}</tr></thead><tbody id="corpoD"></tbody></table>`;
  $('#rData').value='';fotosR=[];
  $('#tabd').querySelectorAll('.rapido input,.rapido select').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lancarRapido()}}));
  prepararLarguras();
}
function aplicarLarguras(){
  const cols=[...document.querySelectorAll('#tabd col')],tb=$('#tabd table');let l=null;
  try{l=JSON.parse(localStorage.getItem(LARG_KEY())||'null')}catch(e){}
  if(l&&l.length===cols.length){cols.forEach((c,i)=>c.style.width=l[i]+'px');tb.style.width=l.reduce((a,b)=>a+b,0)+'px';tb.style.minWidth='0'}
}
function prepararLarguras(){
  document.querySelectorAll('#tabd tr.cabcol th').forEach((th,i,lista)=>{if(i===lista.length-1)return;const h=document.createElement('span');h.className='rs';h.title='Arraste pra mudar a largura (duplo clique volta ao padrão)';th.appendChild(h);
    h.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();
      const ths=[...document.querySelectorAll('#tabd tr.cabcol th')],ws=ths.map(t=>t.offsetWidth),x0=e.clientX,w0=ws[i],cols=[...document.querySelectorAll('#tabd col')],tb=$('#tabd table');
      const mv=ev=>{ws[i]=Math.max(40,w0+ev.clientX-x0);cols.forEach((c,k)=>c.style.width=ws[k]+'px');tb.style.width=ws.reduce((a,b)=>a+b,0)+'px';tb.style.minWidth='0'};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);try{localStorage.setItem(LARG_KEY(),JSON.stringify(ws))}catch(e){}};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
    h.addEventListener('dblclick',()=>{try{localStorage.removeItem(LARG_KEY())}catch(e){}montarTabela();desenhar()})});
  aplicarLarguras();
}

/* ---------- lista ---------- */
const textoBusca=i=>aba==='nasc'?[i.rgdMae,i.receptora,i.sexo,i.pelagem,i.obs,i.peso,i.criadoPorNome].join(' '):[i.rgd,i.situacao,obsGeral(i),i.criadoPorNome].join(' ');
/* filtros da tabela (estilo Excel, igual Custos) */
// filtros da tabela ficam guardados no aparelho (não somem ao trocar de mês/aba nem ao recarregar)
const FILTRO_KEY='app-nelore-mra-caderneta-filtros';
const filtrosCol={nasc:{},geral:{},prenhez:{}},ordemCol={nasc:null,geral:null,prenhez:null};
try{const f=JSON.parse(localStorage.getItem(FILTRO_KEY)||'{}');Object.assign(filtrosCol,f.filtros||{});Object.assign(ordemCol,f.ordem||{})}catch(e){}
const guardarFiltros=()=>{try{localStorage.setItem(FILTRO_KEY,JSON.stringify({filtros:filtrosCol,ordem:ordemCol}))}catch(e){}};
const valCampo=(i,k)=>k==='data'?(i.data||''):k==='por'?(i.criadoPorNome||''):k==='peso'?(numBR(i.peso)??''):k==='obs'&&aba==='geral'?obsGeral(i):(i[k]||'');
const txtCampo=(i,k)=>{const v=valCampo(i,k);return v===''?'(vazio)':k==='data'?fmtData(v):k==='peso'?String(v).replace('.',','):String(v)};
const temFiltroCol=()=>Object.values(filtrosCol[aba]).some(Boolean);
function filtradas(exceto){const f=filtrosCol[aba],pzq=aba==='prenhez'?chaveRgd($('#pzRgd').value):'',q=aba==='prenhez'?'':$('#busca').value.trim().toLowerCase();
  return itens.filter(i=>(!pzq||i.k.includes(pzq))&&(!q||textoBusca(i).toLowerCase().includes(q))&&Object.entries(f).every(([k,vs])=>k===exceto||!vs||vs.includes(txtCampo(i,k))))}
function visiveis(){
  const o=ordemCol[aba];
  return filtradas().sort((a,b)=>{
    if(o){const va=valCampo(a,o.k),vb=valCampo(b,o.k);const r=typeof va==='number'&&typeof vb==='number'?va-vb:String(va).localeCompare(String(vb),'pt-BR',{numeric:true});if(r)return r*o.dir}
    return String(b.data).localeCompare(String(a.data))||String(b.criadoEmLocal||'').localeCompare(String(a.criadoEmLocal||''))});
}
function fecharFiltro(){const p=$('.fpainel');if(p)p.remove()}
document.addEventListener('click',fecharFiltro);
function abrirFiltro(ev,k){
  ev.stopPropagation();const aberto=$('.fpainel');if(aberto&&aberto.dataset.k===k){fecharFiltro();return}fecharFiltro();
  const vals=[...new Set(filtradas(k).map(i=>txtCampo(i,k)))].sort((a,b)=>k==='data'?a.split('/').reverse().join('').localeCompare(b.split('/').reverse().join('')):a.localeCompare(b,'pt-BR',{numeric:true}));
  const ativo=filtrosCol[aba][k];
  const p=document.createElement('div');p.className='fpainel';p.dataset.k=k;p.onclick=e=>e.stopPropagation();
  p.innerHTML=`<div class="fp-ord"><button class="btn btn-ghost" onclick="ordenarCol('${k}',1)">A→Z ▲</button><button class="btn btn-ghost" onclick="ordenarCol('${k}',-1)">Z→A ▼</button></div>
    <input class="fp-busca" placeholder="Buscar... (Enter aplica)">
    <label class="fp-it"><input type="checkbox" class="fp-todos" ${!ativo?'checked':''}> <b>Selecionar tudo</b></label>
    <div class="fp-lista">${vals.map(v=>`<label class="fp-it"><input type="checkbox" class="fp-cb" value="${esc(v)}" ${!ativo||ativo.includes(v)?'checked':''}> ${esc(v)}</label>`).join('')}</div>
    <div class="fp-acoes"><button class="btn btn-ghost" onclick="limparFiltroCol('${k}')">Limpar</button><button class="btn btn-primary" onclick="aplicarFiltroCol('${k}')">OK</button></div>`;
  document.body.appendChild(p);
  const r=ev.currentTarget.getBoundingClientRect(),w=Math.min(250,innerWidth-16);p.style.width=w+'px';
  p.style.left=Math.max(8,Math.min(r.right-w,innerWidth-w-8))+'px';const top=r.bottom+6;p.style.top=top+'px';
  if(top+p.offsetHeight>innerHeight-8)p.style.top=Math.max(8,r.top-p.offsetHeight-6)+'px';
  p.querySelector('.fp-busca').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();aplicarFiltroCol(k)}};
  p.querySelector('.fp-busca').oninput=e=>{const q=e.target.value.toLowerCase();p.querySelectorAll('.fp-lista .fp-it').forEach(l=>l.style.display=l.textContent.toLowerCase().includes(q)?'':'none')};
  p.querySelector('.fp-todos').onchange=e=>p.querySelectorAll('.fp-cb').forEach(c=>{if(c.parentElement.style.display!=='none')c.checked=e.target.checked});
}
function aplicarFiltroCol(k){const p=$('.fpainel');const busca=p.querySelector('.fp-busca').value.trim(),cbs=[...p.querySelectorAll('.fp-cb')],m=cbs.filter(c=>c.checked&&(!busca||c.parentElement.style.display!=='none')).map(c=>c.value);if(!m.length)return;filtrosCol[aba][k]=m.length===cbs.length?null:m;fecharFiltro();desenhar()}
function limparFiltroCol(k){filtrosCol[aba][k]=null;if(ordemCol[aba]&&ordemCol[aba].k===k)ordemCol[aba]=null;fecharFiltro();desenhar()}
function ordenarCol(k,dir){ordemCol[aba]={k,dir};fecharFiltro();desenhar()}
function limparTudoCol(){filtrosCol[aba]={};ordemCol[aba]=null;desenhar()}
const classeObs=o=>{const t=String(o||'').toLowerCase();return t.startsWith('natimorto')||t.startsWith('morte')?'ruim':t.startsWith('gêmeo')||t.startsWith('gemeo')?'gem':''};
const obsHtml=o=>o?(OBS_LISTA.some(x=>String(o).toLowerCase().startsWith(x.toLowerCase()))?`<span class="tag-obs ${classeObs(o)}">${esc(o)}</span>`:esc(o)):'';
function minisHtml(i){return (i.fotos||[]).map(f=>miniFotos[f]?`<img src="${miniFotos[f]}" alt="" onclick="event.stopPropagation();verFotoId('${f}')">`:'<span>📷</span>').join('')}
function carregarMinis(v){v.forEach(i=>(i.fotos||[]).forEach(f=>{if(!(f in miniFotos)){miniFotos[f]='';colFotos.doc(f).get().then(d=>{if(d.exists){miniFotos[f]=d.data().dados;desenhar()}}).catch(()=>{})}}))}
function desenhar(){
  if(aba==='prenhez')return desenharPz();
  guardarFiltros();
  itens=todos.filter(i=>i.aba===aba&&(!mes||i.mes===mes));
  montarMeses();
  const v=visiveis(),nc=COLS[aba].length;
  if(aba==='nasc'){const m=v.filter(i=>i.sexo==='M').length,f=v.filter(i=>i.sexo==='F').length;
    $('#qtd').innerHTML=`<b>${v.length}</b> nascimento${v.length===1?'':'s'}${v.length?` · ${m} M · ${f} F`:''}`}
  else $('#qtd').innerHTML=`<b>${v.length}</b> lançamento${v.length===1?'':'s'}`;
  document.querySelectorAll('#tabd .fbtn').forEach(b=>b.classList.toggle('on',!!(filtrosCol[aba][b.dataset.k]||(ordemCol[aba]&&ordemCol[aba].k===b.dataset.k))));
  $('#avisoF').innerHTML=temFiltroCol()||ordemCol[aba]?`<span class="aviso-f">🔎 ${temFiltroCol()?'Filtro na tabela':'Ordenado'} <button onclick="limparTudoCol()">Limpar</button></span>`:'';
  if(!v.length){
    const msg=itens.length?'Nada encontrado com esse filtro.':(mes?`Nada lançado em ${nomeMes(mes).toLowerCase()}.`:'Nada lançado ainda.');
    $('#corpoD').innerHTML=`<tr><td colspan="${nc}" class="vazio">${msg}</td></tr>`;
    $('#lista').innerHTML=`<div class="vazio">${msg}${itens.length?'':'<br>Toque em <b>+ Lançar</b>.'}</div>`;return}
  const del=i=>podeEditar(i)?`<button class="xdel" title="Excluir" onclick="event.stopPropagation();apagar('${i.id}')">🗑</button>`:'';
  const por=i=>i._pend?'<span class="pend">⏳ a enviar</span>':esc(i.criadoPorNome||'');
  if(aba==='nasc'){
    $('#corpoD').innerHTML=v.map(i=>`<tr onclick="abrirForm('${i.id}')"><td>${esc(i.rgdMae||'')}</td><td>${esc(i.receptora||'')}</td>
      <td class="c">${i.sexo?`<span class="sexo ${i.sexo}">${i.sexo}</span>`:''}</td><td>${fmtData(i.data)} <span class="por">${diaSem(i.data)}</span></td>
      <td class="n">${esc(i.peso||'')}</td><td>${esc(i.pelagem||'')}</td><td class="quebra">${obsHtml(i.obs)}</td><td class="por">${por(i)}</td><td class="c">${del(i)}</td></tr>`).join('');

    <div class="folha-pe">${so?'<button class="btn btn-ghost" style="margin-left:auto" onclick="fecharForm()">Fechar</button>':`${i?`<button class="btn btn-danger esq" onclick="apagar('${i.id}')">Excluir</button>`:'<span class="esq"></span>'}<button class="btn btn-ghost" onclick="fecharForm()">Cancelar</button>${i?'':'<button class="btn btn-ghost" onclick="salvar(null,true)" title="Salva e já abre outro">Salvar e +1</button>'}<button class="btn btn-primary" onclick="salvar(${i?`'${i.id}'`:'null'})">Salvar</button>`}</div></div>`;

function salvar(id,outro){
  const data=$('#fData').value;if(!data){toast(aba==='nasc'?'Informe a data de nascimento.':'Informe a data.');return}
  let dados;
  if(aba==='nasc'){
    dados={data,mes:data.slice(0,7),rgdMae:$('#fMae').value.trim().toUpperCase(),receptora:$('#fRec').value.trim().toUpperCase(),sexo:sexoForm,peso:$('#fPeso').value.trim(),pelagem:$('#fPel').value.trim(),obs:$('#fObs').value.trim()};
    if(dados.peso&&numBR(dados.peso)===null){toast('Peso: digite só número.');return}
  }else{
    dados={data,mes:data.slice(0,7),rgd:$('#fRgd').value.trim().toUpperCase(),situacao:$('#fSit').value,obs:$('#fObsG').value.trim()};
    if(!dados.situacao){toast('Escolha a situação.');return}
  }
  const ref=id?col.doc(id):col.doc();
  if(aba==='geral'){dados.fotos=gravarFotos(fotosForm,ref.id,dados.mes);removidas.forEach(fid=>colFotos.doc(fid).delete().catch(()=>{}))}
  if(id)ref.update({...dados,alteradoEm:firebase.firestore.FieldValue.serverTimestamp(),alteradoPor:meuNome}).catch(e=>toast('Não salvou: '+e.message));
  else ref.set(novoDoc(dados)).catch(e=>toast('Não salvou: '+e.message));

function apagar(id){

/* ---------- fotos: comprimidas no próprio aparelho (máx. 1280 px, ~150 KB) ---------- */
function desenharFotos(){
  const el=document.getElementById('fFotos');if(!el)return;
  el.innerHTML=fotosForm.map((f,k)=>`<div class="foto"><img src="${f.dados}" onclick="verFoto(fotosForm[${k}].dados)">${somenteVer?'':`<button type="button" onclick="tirarFoto(${k})" aria-label="Remover">×</button>`}</div>`).join('')
    +(!somenteVer&&fotosForm.length<4?`<div class="addfoto" onclick="document.getElementById('fArq').click()">📷<br>Adicionar</div>`:'')
    +(somenteVer&&!fotosForm.length?'<span style="font-size:13px;color:var(--muito-suave)">Sem fotos</span>':'');
}
function comprimir(arq){return new Promise((ok,erro)=>{const r=new FileReader();r.onerror=erro;r.onload=()=>{const img=new Image();img.onerror=erro;img.onload=()=>{
  const M=1280,k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=0.7,d=c.toDataURL('image/jpeg',q);while(d.length>600000&&q>0.3){q-=0.1;d=c.toDataURL('image/jpeg',q)}ok(d)};img.src=r.result};r.readAsDataURL(arq)})}
async function addFotos(files){for(const f of [...files].slice(0,4-fotosForm.length)){try{fotosForm.push({id:null,dados:await comprimir(f)})}catch(e){toast('Não consegui ler essa foto.')}}desenharFotos()}
function tirarFoto(k){const f=fotosForm[k];if(f.id)removidas.push(f.id);fotosForm.splice(k,1);desenharFotos()}
function verFoto(src){const z=document.createElement('div');z.className='zoom';z.onclick=()=>z.remove();z.innerHTML=`<img src="${src}">`;document.body.appendChild(z)}
function verFotoId(id){if(miniFotos[id])verFoto(miniFotos[id])}

/* ---------- Prenha/Vazia ----------
   Um documento por estação: apps/caderneta/config/prenhez_<estação> {animais:{<RGD sem espaço>:{rgd,resultado,data,em,por,porUid,criadoPorUid,anterior}}}.
   Fica em "config" porque lá qualquer um com acesso à Caderneta pode alterar (o funcionário troca o resultado
   de uma matriz lançada por outro). Grava só o animal que mudou (merge), funciona sem internet. */
const RES_PZ=[['Prenha','P'],['Vazia','V'],['PRT','T']],letraPz=r=>(RES_PZ.find(x=>x[0]===r)||[])[1]||'';
const EST_PADRAO='26/27';
let estacoesPz=[],estPz='',pz={},pararPz=null,filtroPz='';
try{estPz=localStorage.getItem('app-nelore-mra-caderneta-estacao')||''}catch(e){}
const normRgd=v=>{let t=String(v||'').toUpperCase().replace(/\s+/g,' ').trim();if(/^\d+$/.test(t))t='MRA '+t;return t.replace(/^MRA\s*(?=\d)/,'MRA ')};
const chaveRgd=v=>normRgd(v).replace(/[^A-Z0-9]/g,'');
const refPz=e=>fs.collection('apps').doc('caderneta').collection('config').doc('prenhez_'+e.replace(/[^0-9A-Za-z]+/g,'-'));
function listaEstacoes(){return [...new Set([EST_PADRAO,...estacoesPz,...(estPz?[estPz]:[])])].sort((a,b)=>b.localeCompare(a,'pt-BR',{numeric:true}))}
function montarEstacoes(){
  if(!estPz)estPz=EST_PADRAO;const l=listaEstacoes();
  $('#pzEst').innerHTML=l.map(e=>`<option ${e===estPz?'selected':''}>${esc(e)}</option>`).join('')+'<option value="__nova">+ Nova estação…</option>';
}
function trocarEstacao(v){
  if(v==='__nova'){const n=(prompt('Nome da nova estação (ex.: 27/28):')||'').trim();
    if(n){cfgRef.set({estacoesPrenhez:firebase.firestore.FieldValue.arrayUnion(n)},{merge:true}).catch(e=>toast('Não salvou: '+e.message));estacoesPz=[...estacoesPz,n];estPz=n}}
  else estPz=v;
  try{localStorage.setItem('app-nelore-mra-caderneta-estacao',estPz)}catch(e){}
  montarEstacoes();ouvirPz();
}
function ouvirPz(){
  if(pararPz)pararPz();montarEstacoes();
  pz={};$('#pzLista').innerHTML='<div class="vazio">Carregando...</div>';
  pararPz=refPz(estPz).onSnapshot(d=>{pz=(d.exists&&d.data().animais)||{};desenharPz()},e=>{$('#pzLista').innerHTML=`<div class="vazio">Não consegui carregar.<br><small>${esc(e.message)}</small></div>`});
}
function filtroPzSet(f){filtroPz=filtroPz===f?'':f;desenharPz()}
// usa os mesmos filtros ▾ das outras abas (itens = animais da estação, já com o botão Prenha/Vazia/PRT aplicado)
function visiveisPz(){
  itens=Object.entries(pz).filter(([k,x])=>x&&x.resultado&&(!filtroPz||x.resultado===filtroPz)).map(([k,x])=>({k,...x,criadoPorNome:x.por||'',criadoEmLocal:x.em||''}));
  return visiveis();
}
function desenharPz(){
  const todosPz=Object.values(pz).filter(x=>x&&x.resultado),n=todosPz.length,cont=r=>todosPz.filter(x=>x.resultado===r).length;
  $('#pzChips').innerHTML=`<button class="pill ${!filtroPz?'on':''}" onclick="filtroPzSet('')">Todas<b>${n}</b></button>`
    +RES_PZ.map(([r,l])=>{const c=cont(r);return `<button class="pill ${l} ${filtroPz===r?'on':''}" onclick="filtroPzSet('${r}')">${r}<b>${c}</b>${n&&r==='Prenha'?` · ${Math.round(c*100/n)}%`:''}</button>`}).join('');
  const typed=$('#pzRgd').value.trim(),ja=typed?pz[chaveRgd(typed)]:null;
  $('#pzAchou').innerHTML=ja&&ja.resultado?`· já está <b>${esc(ja.resultado)}</b>`:'';
  if(ja&&ja.resultado&&document.activeElement===$('#pzRgd'))$('#pzRes').value=ja.resultado;
  guardarFiltros();
  const v=visiveisPz(),fil=temFiltroCol()||ordemCol.prenhez;
  if(fil)$('#pzChips').innerHTML+=`<span class="aviso-f">🔎 ${temFiltroCol()?'Filtro na tabela':'Ordenado'} <button onclick="limparTudoCol()">Limpar</button></span>`;
  const fb=(k,t)=>`<div class="thf"><span>${t}</span><button class="fbtn ${filtrosCol.prenhez[k]||(ordemCol.prenhez&&ordemCol.prenhez.k===k)?'on':''}" onclick="abrirFiltro(event,'${k}')" title="Filtrar / ordenar">▾</button></div>`;
  const cab=`<div class="pz-reg pz-cab">${fb('rgd','RGD')}${fb('resultado','Resultado')}<div class="info">${fb('data','Data')}</div><div class="info por">${fb('por','Por')}</div><span></span></div>`;
  if(!v.length){$('#pzLista').innerHTML=(n?cab:'')+`<div class="vazio">${n?'Nada encontrado.':`Nada lançado na estação ${esc(estPz)}.`}</div>`;return}
  const podeDel=x=>ehAdmin||x.criadoPorUid===eu.uid;
  $('#pzLista').innerHTML=cab+v.slice(0,500).map(x=>`<div class="pz-reg"><div class="rgd" onclick="pegarPz('${x.k}')">${esc(x.rgd)}</div>
    <select class="pz-sel ${letraPz(x.resultado)}" onchange="gravarPz(pz['${x.k}'].rgd,this.value);desenharPz()">${RES_PZ.map(([r])=>`<option ${r===x.resultado?'selected':''}>${r}</option>`).join('')}</select>
    <div class="info">${fmtData(x.data)}</div><div class="info por">${esc(x.por||'')}</div>
    ${podeDel(x)?`<button class="xdel" title="Excluir" onclick="apagarPz('${x.k}')">🗑</button>`:'<span></span>'}</div>`).join('')
    +(v.length>500?`<div class="vazio">Mostrando 500 de ${v.length}. Digite o RGD pra achar.</div>`:'');
}
function pegarPz(k){const x=pz[k];if(!x)return;$('#pzRgd').value=x.rgd;$('#pzRgd').focus();desenharPz();scrollTo({top:0,behavior:'smooth'})}
function gravarPz(rgd,res){
  const k=chaveRgd(rgd),ant=pz[k],agora=new Date().toISOString();
  const val={rgd,resultado:res,data:hoje(),em:agora,por:meuNome,porUid:eu.uid,criadoPorUid:(ant&&ant.criadoPorUid)||eu.uid,anterior:ant&&ant.resultado&&ant.resultado!==res?ant.resultado:((ant&&ant.anterior)||'')};
  pz[k]=val;refPz(estPz).set({animais:{[k]:val}},{merge:true}).catch(e=>toast('Não salvou: '+e.message));
  return ant;
}
function lancarPz(res){
  const rgd=normRgd($('#pzRgd').value);
  if(!chaveRgd(rgd)){toast('Digite o RGD.');$('#pzRgd').focus();return}
  if(!res){toast('Escolha o resultado.');$('#pzRes').focus();return}
  const ant=gravarPz(rgd,res);
  toast((ant&&ant.resultado?`${rgd}: ${ant.resultado} → ${res}`:`${rgd}: ${res}`)+(navigator.onLine?'':' (guardado no aparelho)'));
  $('#pzRgd').value='';$('#pzRes').value='';desenharPz();$('#pzRgd').focus();
}
function apagarPz(k){const x=pz[k];if(!x||!confirm(`Excluir ${x.rgd} desta estação?`))return;
  delete pz[k];refPz(estPz).set({animais:{[k]:firebase.firestore.FieldValue.delete()}},{merge:true}).catch(e=>toast('Não excluiu: '+e.message));desenharPz();toast('Excluído.')}
$('#pzRgd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(innerWidth>860)$('#pzRes').focus()}});
$('#pzRes').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lancarPz($('#pzRes').value)}});
function exportarPz(){
  if(typeof XLSX==='undefined'){toast('Sem internet pra gerar o Excel agora.');return}
  const v=visiveisPz();if(!v.length){toast('Nada pra exportar.');return}
  const ws=XLSX.utils.json_to_sheet(v.map(x=>({RGD:x.rgd,RESULTADO:x.resultado,DATA:fmtData(x.data),LANCADO_POR:x.por||''})));
  ws['!cols']=[{wch:14},{wch:12},{wch:12},{wch:18}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Prenhez');XLSX.writeFile(wb,`caderneta_prenhez_${estPz.replace(/[^0-9A-Za-z]+/g,'-')}.xlsx`);
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
