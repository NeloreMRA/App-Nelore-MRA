<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Caderneta · App Nelore MRA</title>
<link rel="icon" href="../logo.webp">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-192.png">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--verde:#1f6a49;--verde-esc:#153e2c;--verde-claro:#eef6f1;--ouro:#b39a3b;--fundo:#f4f6f4;--borda:#e3e8e4;--linha:#eef1ef;--texto:#17211c;--suave:#5d6a62;--muito-suave:#8a958d;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--texto);background:var(--fundo)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:var(--fundo)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.hidden{display:none!important}
/* topo */
.topo{background:var(--verde-esc);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.topo-in{max-width:1800px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topo img{width:34px;height:34px;border-radius:50%}
.topo .t{font-size:16px;font-weight:800;line-height:1.1}.topo .s{font-size:11.5px;opacity:.75}
.topo .acoes{margin-left:auto;display:flex;gap:6px}
.icobtn{background:#ffffff14;color:#fff;border:1px solid #ffffff30;border-radius:9px;height:36px;padding:0 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.topo-in>.voltar-app{margin:0 4px 0 0;align-self:center}
/* estrutura */
.pag{max-width:1800px;margin:0 auto;padding:18px 24px 120px}
.pag>section{min-width:0}
.lateral{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:18px}
.bloco h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muito-suave)}
.meses-v{display:flex;flex-direction:column;gap:2px}
.mes-i{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px;display:flex;justify-content:space-between;color:var(--texto)}
.mes-i:hover{background:#e9efea}.mes-i.on{background:var(--verde);color:#fff;font-weight:700}
.lado-acoes{display:flex;flex-direction:column;gap:6px}
/* abas */
.abas{display:flex;gap:4px;background:#e7ece8;border-radius:11px;padding:4px;width:max-content;max-width:100%;margin-bottom:14px}
.aba{border:0;background:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:700;color:var(--suave);white-space:nowrap}
.aba.on{background:#fff;color:var(--verde-esc);box-shadow:0 1px 3px #0002}
/* cabeçalho da lista */
.cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.barra-f{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.barra-f .campo{display:flex;flex-direction:column;gap:4px}.barra-f label{font-size:11.5px;font-weight:700;color:var(--suave)}
.barra-f select{border:1px solid #d7ded9;border-radius:9px;padding:8px 10px;font-size:14.5px;background:#fff;min-width:210px;outline:none}
.barra-f select:focus{border-color:#72a386}
.barra-f .busca{margin-left:0;flex:1 1 240px;max-width:380px}
.barra-f .acoes-f{margin-left:auto;display:flex;gap:6px}
.barra-f .acoes-f .btn{padding:8px 12px;font-size:13.5px}
#avisoF:empty{display:none}
.aviso-f{display:inline-flex;gap:8px;align-items:center;background:#fff6e0;border:1px solid #f0d9a8;color:#6b4f12;border-radius:9px;padding:6px 10px;font-size:13px}
.aviso-f button{border:1px solid #e3c98a;background:#fff;border-radius:7px;padding:3px 8px;font-size:12px;font-weight:700;color:#6b4f12}
.thf{display:flex;align-items:center;justify-content:space-between;gap:4px}
.tabd th.c .thf{justify-content:center}.tabd th.n .thf{justify-content:flex-end}
.fbtn{border:0;background:none;color:var(--muito-suave);font-size:11px;padding:1px 5px;border-radius:5px;flex:none}.fbtn:hover{background:#e6ece8}.fbtn.on{color:var(--verde);background:var(--verde-claro);font-weight:800}
.fpainel{position:fixed;z-index:40;background:#fff;border:1px solid var(--borda);border-radius:12px;box-shadow:0 10px 30px #0003;padding:10px;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--texto);font-weight:400}
.fp-ord{display:flex;gap:6px;margin-bottom:8px}.fp-ord .btn{flex:1;padding:6px;font-size:12.5px}
.fp-busca{width:100%;border:1px solid #d7ded9;border-radius:8px;padding:6px 9px;font-size:13.5px;margin-bottom:6px;outline:none}
.fp-lista{max-height:200px;overflow:auto;border:1px solid var(--linha);border-radius:8px;padding:4px 8px;margin:4px 0 8px}
.fp-it{display:flex;gap:7px;align-items:center;padding:4px 0;cursor:pointer}
.fp-acoes{display:flex;gap:6px;justify-content:flex-end}.fp-acoes .btn{padding:7px 12px;font-size:13px}
.cab{margin:0 0 6px 2px}.cab .qtd{color:var(--muito-suave);font-size:12.5px}
.cab .qtd b{color:var(--texto)}
.busca{position:relative;margin-left:auto;flex:0 1 320px;min-width:200px}
.busca input{width:100%;border:1px solid var(--borda);border-radius:10px;padding:8px 12px 8px 34px;background:#fff;font-size:14.5px;outline:none}
.busca input:focus{border-color:#72a386;box-shadow:0 0 0 3px #72a38622}
.busca:before{content:"🔎";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.btn-primary{background:var(--verde);color:#fff}.btn-primary:hover{background:#185b3e}
.btn-ghost{background:#fff;border:1px solid var(--borda);color:#334139}.btn-ghost:hover{background:#f7f9f7}
.btn-danger{background:#fff;border:1px solid #e7bbb5;color:#a33627}
/* faixa de meses (celular) */
.faixa{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 16px;margin:0 -16px 10px}
.faixa::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--borda);background:#fff;border-radius:99px;padding:7px 13px;font-size:13.5px;white-space:nowrap}
.pill.on{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:700}
/* tabela do computador */
.tabd{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:auto;max-height:calc(100vh - 200px)}
.tabd table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;font-size:13.5px;table-layout:fixed}
.tabd th{position:sticky;top:0;z-index:2;background:#f3f5f3;color:var(--suave);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:7px 8px;border-bottom:1px solid var(--borda);border-right:1px solid #e8ebe9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabd td{padding:0 8px;height:34px;border-bottom:1px solid #edf0ee;border-right:1px solid #f0f2f1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabd tbody tr{cursor:pointer}.tabd tbody tr:hover td{background:#f5faf7}
.tabd .c{text-align:center}.tabd .n{text-align:right}
.tabd td.quebra{white-space:normal;word-break:break-word;padding-top:6px;padding-bottom:6px;line-height:1.35}
.tabd .por{color:var(--muito-suave);font-size:12px}
.tabd tr.rapido td{position:sticky;top:31px;z-index:1;background:#f6faf7;padding:6px 5px;height:auto;border-bottom:2px solid #cfe0d5;overflow:visible}
.tabd .rapido input,.tabd .rapido select{width:100%;border:1px solid #d7ded9;border-radius:7px;padding:7px 9px;font-size:13.5px;background:#fff;outline:none;min-width:0}
.tabd .rapido input:focus,.tabd .rapido select:focus{border-color:#72a386;box-shadow:0 0 0 2px #72a38633}
.tabd .rapido .lancar{width:100%;border:0;border-radius:7px;background:var(--verde);color:#fff;font-weight:800;padding:8px 0;font-size:13px}
.tabd .rapido .bfoto{width:100%;border:1px dashed #9fbfab;border-radius:7px;background:#fff;color:var(--verde-esc);font-weight:700;padding:7px 4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabd .vazio{cursor:default;white-space:normal;height:auto}
.tabd .rs{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:3}
.tabd .rs:hover{background:#72a38644}
input[list]::-webkit-calendar-picker-indicator{display:none!important;opacity:0}
.sexo{display:inline-block;min-width:22px;text-align:center;font-weight:800;font-size:12px;border-radius:5px;padding:1px 6px}
.sexo.M{background:#e4eefb;color:#235fa8}.sexo.F{background:#fbe6f0;color:#a8336d}
.tag-obs{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:1px 7px;background:#f1f4f2;color:#4a5850}
.tag-obs.ruim{background:#fbeeec;color:#a33627}.tag-obs.gem{background:#fff4dc;color:#8a5a12}
.minis{display:flex;gap:4px}.minis img{width:30px;height:30px;border-radius:5px;object-fit:cover;background:#eef1ef;cursor:zoom-in}
.xdel{border:0;background:none;border-radius:6px;padding:3px 6px;font-size:14px;opacity:.45}.xdel:hover{opacity:1;background:#fbeeec}
.pend{color:#a0681a;font-weight:700}
.sit{display:inline-block;font-size:12px;font-weight:800;border-radius:5px;padding:1px 8px;background:#f1f4f2;color:#4a5850}
.sit-0{background:#e3f3e8;color:#1f6a49}.sit-1{background:#e4eefb;color:#235fa8}.sit-2{background:#fbeeec;color:#a33627}.sit-3{background:#f3ebe1;color:#7a4a1c}
/* lista do celular */
.lista{display:none;background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.reg{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--linha);cursor:pointer;align-items:center}
.reg:last-child{border-bottom:0}
.reg .corpo{flex:1;min-width:0}
.reg .l1{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .l1.duas{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.reg .l2{font-size:12.5px;color:var(--suave);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reg .dir{display:flex;align-items:center;gap:6px}
.reg .mini-foto{width:38px;height:38px;border-radius:7px;object-fit:cover;background:#eef1ef}
.vazio{padding:36px 20px;text-align:center;color:var(--suave);line-height:1.5}
.offline{background:#fff3d6;border:1px solid #ecd28f;color:#6b4f12;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.fab{display:none;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--verde);color:#fff;border:0;border-radius:16px;padding:15px 20px;font-size:16px;font-weight:800;box-shadow:0 8px 24px #153e2c55;z-index:8}
/* formulário */
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
.folha{background:#fff;width:min(600px,100%);max-height:92vh;display:flex;flex-direction:column;border-radius:16px;overflow:hidden}
.folha-cab{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linha)}
.folha-cab h2{margin:0;font-size:17px}.folha-cab .x{margin-left:auto;border:0;background:#f1f4f2;width:34px;height:34px;border-radius:50%;font-size:18px}
.folha-corpo{padding:16px 18px;overflow:auto}
.folha-pe{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--linha);background:#fafbfa;flex-wrap:wrap}
.folha-pe .esq{margin-right:auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:12.5px;color:var(--suave);font-weight:700}
.input{width:100%;border:1px solid #d7ded9;border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;outline:none}
.input:focus{border-color:#72a386;box-shadow:0 0 0 3px #72a38622}
textarea.input{min-height:96px;resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid #d7ded9;background:#fff;border-radius:10px;padding:10px;font-weight:800;font-size:15px}
.seg button.on.M{background:#235fa8;border-color:#235fa8;color:#fff}.seg button.on.F{background:#a8336d;border-color:#a8336d;color:#fff}
.fotos{display:flex;gap:8px;flex-wrap:wrap}.foto{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:#eef1ef}
.foto img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}.foto button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:#000a;color:#fff;line-height:1;font-size:14px}
.addfoto{width:76px;height:76px;border:2px dashed #b7c9bd;border-radius:10px;display:grid;place-items:center;color:var(--verde);font-weight:700;font-size:12px;text-align:center;background:#fff;cursor:pointer}
.zoom{position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:40;padding:10px}.zoom img{max-width:100%;max-height:100%;border-radius:8px}
.menu{position:absolute;right:16px;top:54px;background:#fff;color:var(--texto);border:1px solid var(--borda);border-radius:12px;box-shadow:0 10px 30px #0003;padding:6px;z-index:20;min-width:190px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:14.5px}.menu button:hover{background:#f3f6f4}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#17211c;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:50;max-width:90vw;text-align:center}
/* Prenha/Vazia */
.pz-top{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.pz-top .campo{display:flex;flex-direction:column;gap:4px}.pz-top label{font-size:11.5px;font-weight:700;color:var(--suave);white-space:nowrap;line-height:16px}
.pz-top select,.pz-top input{height:42px;border:1px solid #d7ded9;border-radius:9px;padding:0 11px;font-size:16px;background:#fff;outline:none}
.pz-top select:focus,.pz-top input:focus{border-color:#72a386;box-shadow:0 0 0 3px #72a38622}
#pzEst{min-width:120px;font-weight:800;color:var(--verde-esc)}
.pz-rgd{flex:1 1 200px;max-width:280px}.pz-obsc{flex:1 1 200px;max-width:320px}.pz-obsc input{width:100%}.pz-rgd input{width:100%;font-weight:800;font-size:17px}
.pz-rgd{position:relative}
.pz-ja{display:none;position:absolute;right:7px;bottom:7px;height:28px;align-items:center;gap:5px;border-radius:7px;padding:0 10px;font-size:13px;font-weight:800;color:#fff;pointer-events:none;white-space:nowrap}
.pz-ja.P,.pz-ja.V,.pz-ja.T{display:inline-flex}.pz-ja.P{background:#1f7a4d}.pz-ja.V{background:#c0392b}.pz-ja.T{background:#d9822b}
.pz-rgd.tem input{padding-right:150px;border-color:#e0a23c;box-shadow:0 0 0 3px #f5c86a55;background:#fffaf0}
.pz-bts{display:flex;gap:8px}.pz-b{border:0;border-radius:11px;padding:11px 16px;height:auto;font-weight:800;font-size:15.5px;color:#fff}
.pz-b.P{background:#1f7a4d}.pz-b.V{background:#c0392b}.pz-b.T{background:#d9822b}
.pz-chips{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.pz-chips::-webkit-scrollbar{display:none}.pz-chips .aviso-f{flex:none;white-space:nowrap}
.pz-chips .pill b{margin-left:4px}.pz-chips .pill.on.P{background:#1f7a4d;border-color:#1f7a4d}.pz-chips .pill.on.V{background:#c0392b;border-color:#c0392b}.pz-chips .pill.on.T{background:#d9822b;border-color:#d9822b}
.pz-lista{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:hidden;max-width:1100px}.pz-obs{width:100%;border:1px solid transparent;border-radius:7px;padding:5px 7px;font-size:13.5px;background:none;outline:none}.pz-obs:hover{border-color:#e3e8e4}.pz-obs:focus{border-color:#72a386;background:#fff}.pz-obs-cel{display:none}
.pz-reg{display:grid;grid-template-columns:minmax(0,1fr) 130px 110px minmax(0,1fr) minmax(0,2fr) 34px;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--linha)}
.pz-reg:last-child{border-bottom:0}.pz-cab{background:#f3f5f3;padding:6px 12px;position:sticky;top:0;z-index:2}.pz-cab .thf{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);font-weight:700}.pz-cab .fbtn{font-size:12px;padding:2px 7px}.pz-reg .rgd{font-weight:800;font-size:15px;cursor:pointer}.pz-reg .info{font-size:12.5px;color:var(--muito-suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz-sel{width:100%;border:1px solid #d7ded9;border-radius:8px;padding:6px 8px;font-size:14.5px;font-weight:800;outline:none}
.pz-sel.P{background:#e3f3e8;color:#1f6a49;border-color:#b9dcc6}.pz-sel.V{background:#fbeeec;color:#a33627;border-color:#ecc3bd}.pz-sel.T{background:#fdf0dc;color:#9a5a12;border-color:#efd3a6}
.reg.vdc{display:block;padding:12px 14px}
.vdc-top{display:flex;align-items:baseline;gap:8px}.vdc-tot{font-size:17px;font-weight:800;color:var(--verde-esc)}.vdc-dt{margin-left:auto;font-size:12.5px;color:var(--muito-suave);position:relative;top:7px}.vdc-x{align-self:center;border:0;background:none;color:#a7b1aa;font-size:11px;width:20px;height:20px;line-height:20px;padding:0;border-radius:5px}.vdc-x:hover{background:#fbeeec;color:#a33627}
.vdc-sub{font-size:12.5px;color:var(--suave);margin:1px 0 6px}
.vd-oculto{display:none!important}
.vd-mais{display:block;border:0;background:none;color:var(--verde);font-weight:800;font-size:13px;padding:5px 0 0;cursor:pointer}
.vd-rgd-in{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-weight:800;font-size:15px;background:none;outline:none}.vd-rgd-in:hover{border-color:#e3e8e4}.vd-rgd-in:focus{border-color:#72a386;background:#fff}
.vdx-bts{display:flex;gap:8px;margin-bottom:10px}.vdx-bts .btn{padding:7px 12px;font-size:13px}
.vdx-lista{border:1px solid var(--borda);border-radius:10px;max-height:52vh;overflow:auto}
.vdx-it{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--linha);font-size:14px;cursor:pointer}.vdx-it:last-child{border-bottom:0}.vdx-it input{width:18px;height:18px}
@media print{.vd-oculto{display:revert!important}.vdc-l.vd-oculto{display:flex!important}.vd-mais{display:none!important}}
.vdc-ls{border-top:1px solid var(--linha);padding-top:5px}.vdc-l{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:14.5px}.vdc-l b{flex:1;font-weight:700}
.vdc-mk{display:inline-block;background:#e8f3ec;color:var(--verde);border-radius:5px;padding:2px 8px;font-size:12px;font-weight:800;line-height:1.4}
.vdc-mar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--suave);padding-top:7px;margin-top:4px;border-top:1px solid var(--linha)}
.vdc-obs{font-size:12.5px;color:var(--suave);margin-top:5px}
.cab .vd-nova{margin-left:auto;padding:8px 16px}
.vd-res{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.vd-k{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:9px 14px;display:flex;flex-direction:column;gap:2px;min-width:120px}

.vd-it button{border:0;background:#f1f4f2;width:26px;height:26px;border-radius:50%;font-size:15px;line-height:1}

@media(min-width:861px){.topo .so-cel{display:none}}
.pz-desk{display:flex}.pz-cel{display:none}@media(max-width:860px){.pz-desk{display:none!important}.pz-cel{display:flex}}
@media print{html,body{background:#fff!important}.tabd col{width:auto!important}.tabd td.n,.tabd td.c,.vd-mc{white-space:nowrap!important}.tabd td:last-child,.tabd th:last-child{display:none}.tit-imp{display:block!important;font-size:16px;font-weight:800;margin:0 0 8px}.tabd table{min-width:0!important;width:100%!important;table-layout:auto}.tabd td{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;height:auto!important;padding:5px 6px!important;font-size:11.5px}.tabd th{white-space:normal!important;font-size:9.5px;padding:5px 6px!important}.vd-k{padding:5px 9px}.vd-k b{font-size:14px}.toast,.vd-nova,.topo,.barra-f,.fbtn,.fab,.offline,.busca,.abas,.so-cel,tr.rapido,.xdel,.lista,.pz-top,.pz-chips,.pz-reg .xdel{display:none!important}.pz-lista{border:0;max-width:none}.pz-sel{border:0;background:none!important;appearance:none;padding:0}.pag{display:block;padding:0}.tabd{display:block!important;max-height:none;overflow:visible;border:0}}

<body>
<script src="../barra-app.js" data-alvo=".topo-in"></script>
<header class="topo"><div class="topo-in">

  </div>
</div></header>

<div class="pag">
  <section>

    <div class="abas" id="abas">
      <button class="aba" data-aba="nasc" onclick="irAba('nasc')">🐮 Nasc<span class="so-desk">imentos</span></button>
      <button class="aba" data-aba="geral" onclick="irAba('geral')">📝 <span class="so-desk">Lançamento </span>Geral</button>
      <button class="aba" data-aba="prenhez" onclick="irAba('prenhez')">🩺 Prenha<span class="so-desk">/Vazia</span></button>
      <button class="aba" data-aba="vendas" onclick="irAba('vendas')">💰 Vendas</button>
    </div>
    <div id="secPz" class="hidden">
      <div class="pz-top">
        <div class="campo"><label>Estação</label><select id="pzEst" onchange="trocarEstacao(this.value)"></select></div>

        <div class="campo pz-obsc"><label>Observação</label><input id="pzObs" placeholder="(se quiser)" autocomplete="off"></div>

        <div class="campo pz-desk"><label>&nbsp;</label><button class="btn btn-primary" onclick="lancarPz($('#pzRes').value)">+ Lançar</button></div>
        <div class="pz-bts pz-cel"><button class="pz-b P" onclick="lancarPz('Prenha')">Prenha</button><button class="pz-b V" onclick="lancarPz('Vazia')">Vazia</button><button class="pz-b T" onclick="lancarPz('PRT')">PRT</button></div>
        <div class="campo so-desk" style="margin-left:auto"><label>&nbsp;</label><div style="display:flex;gap:6px"><button class="btn btn-ghost" onclick="exportarPz()">⬇ Excel</button><button class="btn btn-ghost" onclick="window.print()">🖨 Imprimir</button></div></div>
      </div>
      <div class="pz-chips" id="pzChips"></div>
      <div class="pz-lista" id="pzLista"><div class="vazio">Carregando...</div></div>
    </div>
    <div id="secGen">
    <div class="barra-f">
      <div class="campo"><label id="rotMes">Mês</label><select id="selMes" onchange="mes=this.value;desenhar()"></select></div>
      <div class="busca"><input id="busca" placeholder="Buscar..." oninput="desenhar()"></div>
      <span id="avisoF"></span>
      <div class="acoes-f so-desk"><button class="btn btn-ghost" onclick="exportarMes()">⬇ Excel</button><button class="btn btn-ghost" id="btnPdfCad" onclick="exportarMes(true)">📄 PDF</button><button class="btn btn-ghost" onclick="window.print()">🖨 Imprimir</button></div>
    </div>
    <div class="tit-imp" id="titImp" style="display:none"></div>
    <div id="vdResumo"></div>
    <div class="cab"><span class="qtd" id="qtd"></span><button class="btn btn-primary so-desk vd-nova hidden" onclick="abrirForm()">+ Nova venda</button></div>
    <div class="tabd" id="tabd"></div>
    <div class="lista" id="lista"><div class="vazio">Carregando...</div></div>
    </div>
  </section>
</div>
<button class="fab" onclick="abrirForm()">+ Lançar</button>
<datalist id="dlPelagem"></datalist><datalist id="dlComp"></datalist><datalist id="dlMarcas"></datalist>
<datalist id="dlObs"><option value="Natimorto"><option value="Morte"><option value="Gêmeos"></datalist>
<input id="rArq" type="file" accept="image/*" multiple class="hidden" onchange="fotosRapido(this.files);this.value=''">

<script>
/* CADERNETA — duas abas:
   • Nascimentos: RGD Mãe, N° Receptora, Sexo, Data, Peso (kg), Pelagem, Observação (lista + texto livre)
   • Lançamento Geral: Data, Acontecimento (texto livre), Fotos
   Tudo em apps/caderneta/lancamentos (campo aba = 'nasc' | 'geral', mes = AAAA-MM). Lançamentos sem "aba" são do
   modelo antigo e não aparecem mais. Fotos comprimidas em apps/caderneta/fotos. Funciona sem internet. */
const FIREBASE_CONFIG={apiKey:'AIzaSyD9yib_iQYHcOG2B2C70cWXJ9SkTiIDt94',authDomain:'app-nelore-mra.firebaseapp.com',projectId:'app-nelore-mra',storageBucket:'app-nelore-mra.firebasestorage.app',messagingSenderId:'1043343802346',appId:'1:1043343802346:web:219f5d73748271a85dfc93'};
const ADMIN_EMAIL='mandrade.gado@terra.com.br', USER_DOMAIN='@app-nelore-mra.firebaseapp.com';
const OBS_LISTA=['Natimorto','Morte','Gêmeos'];
// Pelagem: lista fixa (guarda a sigla)
const PELAGENS=[['Br','Branco'],['Cz','Cinza'],['Mn','Manchado'],['Pp','Preto'],['Pv','Vermelho']];
const opcoesPel=atual=>'<option value="">—</option>'+PELAGENS.map(([s,n])=>`<option value="${s}" ${s===atual?'selected':''}>${s} (${n.toLowerCase()})</option>`).join('')+(atual&&!PELAGENS.some(p=>p[0]===atual)?`<option selected>${esc(atual)}</option>`:'');
const SITUACOES=['Entrada','Saída','Morte','Abate','Outros'];
const sitHtml=x=>x?`<span class="sit sit-${SITUACOES.indexOf(x)}">${esc(x)}</span>`:'';
const obsGeral=i=>i.obs??i.acontecimento??''; // lançamentos antigos tinham "acontecimento"
firebase.initializeApp(FIREBASE_CONFIG);
const fs=firebase.firestore();
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const col=fs.collection('apps').doc('caderneta').collection('lancamentos');
const cfgRef=fs.collection('apps').doc('caderneta').collection('config').doc('listas');
const colFotos=fs.collection('apps').doc('caderneta').collection('fotos');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const hoje=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtData=s=>s?s.split('-').reverse().join('/'):'';
const diaSem=s=>s?new Date(s+'T12:00').toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''):'';
const numBR=v=>{const n=Number(String(v??'').trim().replace(/\./g,'').replace(',','.'));return String(v??'').trim()!==''&&Number.isFinite(n)?n:null};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const nomeMes=m=>{const [a,n]=m.split('-').map(Number);return `${MESES[n-1]} de ${a}`};
const curtoMes=m=>{const [a,n]=m.split('-').map(Number);return `${MESES[n-1].slice(0,3)}/${String(a).slice(2)}`};
let eu=null, ehAdmin=false, meuNome='', mes=hoje().slice(0,7) /* abre sempre no mês atual */, todos=[], itens=[], parar=null, miniFotos={}, pelagens=[];
let aba='nasc';try{const a=localStorage.getItem('app-nelore-mra-caderneta-aba');aba=['geral','prenhez','vendas'].includes(a)?a:'nasc'}catch(e){}

function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function statusRede(){$('#offline').classList.toggle('hidden',navigator.onLine)}
addEventListener('online',statusRede);addEventListener('offline',statusRede);statusRede();

firebase.auth().onAuthStateChanged(async u=>{
  if(!u){location.href='../index.html';return}
  eu=u;ehAdmin=String(u.email||'').toLowerCase()===ADMIN_EMAIL;
  let perfil=null;
  try{const d=await fs.collection('users').doc(u.uid).get();perfil=d.exists?d.data():null;try{localStorage.setItem('app-nelore-mra-perfil-'+u.uid,JSON.stringify(perfil))}catch(_){}}catch(e){console.warn(e);try{perfil=JSON.parse(localStorage.getItem('app-nelore-mra-perfil-'+u.uid)||'null')}catch(_){}}
  if(!ehAdmin&&(!perfil||perfil.ativo===false||!(perfil.apps&&perfil.apps.caderneta))){alert('Você não tem acesso à Caderneta. Fale com o administrador.');location.href='../index.html';return}
  meuNome=ehAdmin?'Administrador':((perfil&&(perfil.nome||perfil.usuario))||String(u.email).replace(USER_DOMAIN,''));
  $('#quem').textContent=meuNome;
  cfgRef.onSnapshot(d=>{pelagens=(d.exists&&d.data().pelagens)||[];marcasVd=(d.exists&&d.data().marcasVenda)||[];compradores=(d.exists&&d.data().compradores)||[];$('#dlComp').innerHTML=compradores.map(l=>`<option value="${esc(l)}">`).join('');estacoesPz=(d.exists&&d.data().estacoesPrenhez)||[];montarEstacoes();$('#dlPelagem').innerHTML=pelagens.map(l=>`<option value="${esc(l)}">`).join('')},()=>{});
  irAba(aba);
});

/* ---------- abas e filtro de mês ---------- */
function irAba(a){
  aba=a;try{localStorage.setItem('app-nelore-mra-caderneta-aba',a)}catch(e){}
  document.querySelectorAll('.aba').forEach(b=>b.classList.toggle('on',b.dataset.aba===a));
  const ehPz=a==='prenhez';$('#secPz').classList.toggle('hidden',!ehPz);$('#secGen').classList.toggle('hidden',ehPz);$('.fab').classList.toggle('hidden',ehPz);
  if(ehPz){fecharFiltro();if(parar){parar();parar=null}ouvirPz();return}
  if(pararPz){pararPz();pararPz=null}
  $('#busca').placeholder=a==='nasc'?'Buscar RGD, receptora, pelagem...':a==='vendas'?'Buscar RGD, marca, comprador...':'Buscar RGD, situação, observação...';
  $('#rotMes').textContent=a==='nasc'?'Mês do nascimento':a==='vendas'?'Mês da venda':'Mês do lançamento';
  $('.vd-nova').classList.toggle('hidden',a!=='vendas');if(a!=='vendas')$('#vdResumo').innerHTML='';
  fecharFiltro();montarTabela();ouvirAba();
}
// carrega todos os lançamentos da aba; o mês é filtrado na tela
function ouvirAba(){
  if(parar)parar();
  todos=[];$('#lista').innerHTML='<div class="vazio">Carregando...</div>';$('#corpoD').innerHTML='';
  parar=col.where('aba','==',aba).onSnapshot({includeMetadataChanges:true},snap=>{
    todos=snap.docs.map(d=>({id:d.id,...d.data(),_pend:d.metadata.hasPendingWrites}));
    desenhar();
  },e=>{$('#lista').innerHTML=`<div class="vazio">Não consegui carregar.<br><small>${esc(e.message)}</small></div>`});
}
function montarMeses(){
  const ms=[...new Set([hoje().slice(0,7),...(mes?[mes]:[]),...todos.map(i=>i.mes).filter(m=>/^\d{4}-\d{2}$/.test(m||''))])].sort().reverse();
  const cont={};todos.forEach(i=>cont[i.mes]=(cont[i.mes]||0)+1);
  $('#selMes').innerHTML=`<option value="">Todos os meses</option>`+ms.map(m=>`<option value="${m}" ${m===mes?'selected':''}>${nomeMes(m)}</option>`).join('');
  $('#selMes').value=mes;
}
/* ---------- tabela do computador ---------- */
// [título, largura %, alinhamento, campo do filtro]
const COLS={
  nasc:[['RGD Mãe',13,'','rgdMae'],['N° Receptora',11,'','receptora'],['Sexo',7,'c','sexo'],['Data Nasc.',12,'','data'],['Peso (kg)',9,'n','peso'],['Pelagem',13,'','pelagem'],['Observação',20,'','obs'],['Por',10,'','por'],['',5]],
  geral:[['Data Lançamento',12,'','data'],['RGD',11,'','rgd'],['Situação',11,'','situacao'],['Observação',34,'','obs'],['Fotos',16],['Por',11,'','por'],['',5]],
  vendas:[['Data',10,'','data'],['Comprador',13,'','comprador'],['Animais (RGD · marca)',25,'','animaisTxt'],['Cab.',5,'c','cab'],['Valor/cab (R$)',10,'n','valorCab'],['Valor total (R$)',11,'n','total'],['Por marca',15,'','marcasTxt'],['Observação',11,'','obs'],['',4]]
};
const LARG_KEY=()=>'app-nelore-mra-caderneta-larguras-'+aba;
function montarTabela(){
  const cols=COLS[aba];
  const rapido=aba==='vendas'?'':aba==='nasc'
    ?`<td><input id="rMae" placeholder="RGD Mãe" autocapitalize="characters"></td><td><input id="rRec" placeholder="Receptora" autocapitalize="characters"></td>
      <td><select id="rSexo"><option value="">—</option><option>M</option><option>F</option></select></td><td><input type="date" id="rData"></td>
      <td><input id="rPeso" inputmode="decimal" placeholder="kg"></td><td><select id="rPel">${opcoesPel('')}</select></td>
      <td><input id="rObs" list="dlObs" placeholder="Natimorto, Morte, Gêmeos ou escreva"></td><td colspan="2"><button class="lancar" onclick="lancarRapido()">+ Lançar</button></td>`
    :`<td><input type="date" id="rData"></td><td><input id="rRgd" placeholder="RGD" autocapitalize="characters"></td>
      <td><select id="rSit"><option value="">—</option>${SITUACOES.map(x=>`<option>${x}</option>`).join('')}</select></td><td><input id="rObsG" placeholder="Observação (Enter lança)"></td>
      <td><button class="bfoto" id="rFotoBtn" onclick="$('#rArq').click()">📷 Foto</button></td><td colspan="2"><button class="lancar" onclick="lancarRapido()">+ Lançar</button></td>`;
  $('#tabd').innerHTML=`<table><colgroup>${cols.map(c=>`<col style="width:${c[1]}%">`).join('')}</colgroup>
    <thead><tr class="cabcol">${cols.map(c=>`<th class="${c[2]||''}">${c[3]?`<div class="thf"><span>${c[0]}</span><button class="fbtn" data-k="${c[3]}" onclick="abrirFiltro(event,'${c[3]}')" title="Filtrar / ordenar">▾</button></div>`:c[0]}</th>`).join('')}</tr>${rapido?`<tr class="rapido">${rapido}</tr>`:''}</thead><tbody id="corpoD"></tbody></table>`;
  if($('#rData'))$('#rData').value='';fotosR=[];
  $('#tabd').querySelectorAll('.rapido input,.rapido select').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lancarRapido()}}));
  prepararLarguras();
}
function aplicarLarguras(){
  const cols=[...document.querySelectorAll('#tabd col')],tb=$('#tabd table');let l=null;
  try{l=JSON.parse(localStorage.getItem(LARG_KEY())||'null')}catch(e){}
  if(l&&l.length===cols.length){cols.forEach((c,i)=>c.style.width=l[i]+'px');tb.style.width=l.reduce((a,b)=>a+b,0)+'px';tb.style.minWidth='0'}
}
function prepararLarguras(){
  document.querySelectorAll('#tabd tr.cabcol th').forEach((th,i,lista)=>{if(i===lista.length-1)return;const h=document.createElement('span');h.className='rs';h.title='Arraste pra mudar a largura (duplo clique volta ao padrão)';th.appendChild(h);
    h.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();
      const ths=[...document.querySelectorAll('#tabd tr.cabcol th')],ws=ths.map(t=>t.offsetWidth),x0=e.clientX,w0=ws[i],cols=[...document.querySelectorAll('#tabd col')],tb=$('#tabd table');
      const mv=ev=>{ws[i]=Math.max(40,w0+ev.clientX-x0);cols.forEach((c,k)=>c.style.width=ws[k]+'px');tb.style.width=ws.reduce((a,b)=>a+b,0)+'px';tb.style.minWidth='0'};
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);try{localStorage.setItem(LARG_KEY(),JSON.stringify(ws))}catch(e){}};
      document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
    h.addEventListener('dblclick',()=>{try{localStorage.removeItem(LARG_KEY())}catch(e){}montarTabela();desenhar()})});
  aplicarLarguras();
}

/* ---------- lista ---------- */

/* filtros da tabela (estilo Excel, igual Custos) */

const filtrosCol={nasc:{},geral:{},prenhez:{},vendas:{}},ordemCol={nasc:null,geral:null,prenhez:null,vendas:null};
try{const f=JSON.parse(localStorage.getItem(FILTRO_KEY)||'{}');Object.assign(filtrosCol,f.filtros||{});Object.assign(ordemCol,f.ordem||{})}catch(e){}
const guardarFiltros=()=>{try{localStorage.setItem(FILTRO_KEY,JSON.stringify({filtros:filtrosCol,ordem:ordemCol}))}catch(e){}};
const valCampo=(i,k)=>k==='valorCab'?vdCab(i):k==='total'?vdTotal(i):k==='cab'?(i.animais||[]).length:k==='animaisTxt'?vdAnimaisTxt(i):k==='marcasTxt'?vdMarcasTxt(i):k==='data'?(i.data||''):k==='por'?(i.criadoPorNome||''):k==='peso'?(numBR(i.peso)??''):k==='obs'&&aba==='geral'?obsGeral(i):(i[k]||'');
const txtCampo=(i,k)=>{const v=valCampo(i,k);return v===''?'(vazio)':k==='valorCab'||k==='total'?brl(v):k==='data'?fmtData(v):k==='peso'?String(v).replace('.',','):String(v)};
const valoresCol=(i,k)=>k==='animaisTxt'?(i.animais||[]).map(a=>a.rgd).filter(Boolean):k==='marcasTxt'?vdPorMarca(i).map(x=>x.marca):[txtCampo(i,k)];
const temFiltroCol=()=>Object.values(filtrosCol[aba]).some(Boolean);
function filtradas(exceto){const f=filtrosCol[aba],pzq=aba==='prenhez'?chaveRgd($('#pzRgd').value):'',q=aba==='prenhez'?'':$('#busca').value.trim().toLowerCase();
  return itens.filter(i=>(!pzq||i.k.includes(pzq))&&(!q||textoBusca(i).toLowerCase().includes(q))&&Object.entries(f).every(([k,vs])=>k===exceto||!vs||valoresCol(i,k).some(x=>vs.includes(x))))}
function visiveis(){
  const o=ordemCol[aba];
  return filtradas().sort((a,b)=>{
    if(o){const va=valCampo(a,o.k),vb=valCampo(b,o.k);const r=typeof va==='number'&&typeof vb==='number'?va-vb:String(va).localeCompare(String(vb),'pt-BR',{numeric:true});if(r)return r*o.dir}
    return String(b.data).localeCompare(String(a.data))||String(b.criadoEmLocal||'').localeCompare(String(a.criadoEmLocal||''))});
}
function fecharFiltro(){const p=$('.fpainel');if(p)p.remove()}

function abrirFiltro(ev,k){

    <input class="fp-busca" placeholder="Buscar... (Enter aplica)">

    <div class="fp-lista">${vals.map(v=>`<label class="fp-it"><input type="checkbox" class="fp-cb" value="${esc(v)}" ${!ativo||ativo.includes(v)?'checked':''}> ${esc(v)}</label>`).join('')}</div>

function aplicarFiltroCol(k){const p=$('.fpainel');const busca=p.querySelector('.fp-busca').value.trim(),cbs=[...p.querySelectorAll('.fp-cb')],m=cbs.filter(c=>c.checked&&(!busca||c.parentElement.style.display!=='none')).map(c=>c.value);if(!m.length)return;filtrosCol[aba][k]=m.length===cbs.length?null:m;fecharFiltro();desenhar()}

const classeObs=o=>{const t=String(o||'').toLowerCase();return t.startsWith('natimorto')||t.startsWith('morte')?'ruim':t.startsWith('gêmeo')||t.startsWith('gemeo')?'gem':''};
const obsHtml=o=>o?(OBS_LISTA.some(x=>String(o).toLowerCase().startsWith(x.toLowerCase()))?`<span class="tag-obs ${classeObs(o)}">${esc(o)}</span>`:esc(o)):'';

      const t2=[fmtData(i.data).slice(0,5),i.peso?esc(i.peso)+' kg':'',esc(i.pelagem||'')].filter(Boolean).join(' · ');
      return `<div class="reg" onclick="abrirForm('${i.id}')"><div class="corpo"><div class="l1">${i.sexo?`<span class="sexo ${i.sexo}">${i.sexo}</span> `:''}${t1}</div><div class="l2">${t2}${i.obs?' · '+obsHtml(i.obs):''}</div></div>
        <div class="dir">${i._pend?'<span class="pend">⏳</span>':''}${del(i)}</div></div>`}).join('');
  }else{

      <td>${esc(i.rgd||'')}</td><td>${sitHtml(i.situacao)}</td><td class="quebra">${esc(obsGeral(i))}</td><td><div class="minis">${minisHtml(i)}</div></td><td class="por">${por(i)}</td><td class="c">${del(i)}</td></tr>`).join('');

/* ---------- VENDAS ----------
   Cada venda: {aba:'vendas', data, mes, valorCab (R$ POR CABEÇA), comprador, animais:[{rgd,marca}], obs}.
   Valor total = valorCab × cabeças. Por marca = valorCab × cabeças da marca. (Vendas antigas tinham "valor": vale como por cabeça.) */
let vdForm=[],vdSoVer=false,marcasVd=[],compradores=[];
const brl=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0=v=>'R$ '+(Number(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const vdCab=i=>Number(i.valorCab??i.valor)||0;
const vdTotal=i=>Math.round(vdCab(i)*(i.animais||[]).length*100)/100;
function vdPorMarca(i){const m={};(i.animais||[]).forEach(a=>{const k=a.marca||'(sem marca)';m[k]=(m[k]||0)+1});const pc=vdCab(i);
  return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pt-BR')).map(([k,n])=>({marca:k,n,valor:pc*n}))}
const vdAnimaisTxt=i=>(i.animais||[]).map(a=>a.rgd+(a.marca?' - '+a.marca:'')).join('; ');
const vdMarcasTxt=i=>vdPorMarca(i).map(x=>`${x.marca} ${x.n} cab ${brl(x.valor)}`).join(' | ');
const VD_LIM=7,vdAbertas=new Set();
function vdVerMais(id){vdAbertas.has(id)?vdAbertas.delete(id):vdAbertas.add(id);desenhar()}
// esconde do 8º animal em diante até tocar em "+ ver mais" (na impressão sai tudo)
const vdOculto=(i,k)=>k>=VD_LIM&&!vdAbertas.has(i.id)?' vd-oculto':'';
const vdMaisBtn=i=>{const n=(i.animais||[]).length;if(n<=VD_LIM)return '';const ab=vdAbertas.has(i.id);return `<button type="button" class="vd-mais" onclick="event.stopPropagation();vdVerMais('${i.id}')">${ab?'− ver menos':`+ ver mais (${n-VD_LIM})`}</button>`};
const vdAnimaisHTML=i=>(i.animais||[]).map((a,k)=>`<span class="vd-an${vdOculto(i,k)}">${esc(a.rgd)}${a.marca?` <i>${esc(a.marca)}</i>`:''}</span>`).join(' ')+vdMaisBtn(i);
const vdMarcasHTML=(i,curto)=>vdPorMarca(i).map(x=>`<span class="vd-mc"><b>${esc(x.marca)}</b> ${x.n}${curto?'':' cab'} · ${curto?brl0(x.valor):brl(x.valor)}</span>`).join(curto?' ':'');
function vdResumoHTML(v){
  if(!v.length)return '';
  const tot=v.reduce((a,i)=>a+vdTotal(i),0),cab=v.reduce((a,i)=>a+(i.animais||[]).length,0),m={};
  v.forEach(i=>vdPorMarca(i).forEach(x=>{const y=m[x.marca]=m[x.marca]||{n:0,valor:0};y.n+=x.n;y.valor+=x.valor}));
  return `<div class="vd-res"><div class="vd-k"><span>Total vendido</span><b>${brl0(tot)}</b></div><div class="vd-k"><span>Cabeças</span><b>${cab}</b></div><div class="vd-k"><span>Média por cabeça</span><b>${brl0(cab?tot/cab:0)}</b></div>
    ${Object.entries(m).sort((a,b)=>b[1].valor-a[1].valor).map(([k,y])=>`<div class="vd-k marca"><span>${esc(k)} · ${y.n} cab</span><b>${brl0(y.valor)}</b></div>`).join('')}</div>`;
}
// "MRA 11000 - MRA" | "MRA 11000 MRA" (marca conhecida no fim) | "MRA 11000" (usa a marca do animal anterior)
function vdLer(t){
  t=String(t||'').trim().toUpperCase().replace(/\s+/g,' ');if(!t)return null;
  let rgd=t,marca='';
  const pd=t.split(/\s*-\s*/),ul=pd[pd.length-1];
  if(pd.length>1&&/^[A-Z][A-Z0-9]{0,5}$/.test(ul)&&/\d/.test(pd.slice(0,-1).join('-'))){marca=ul;rgd=pd.slice(0,-1).join('-').trim()}
  else{const ps=t.split(' ');const ult=ps[ps.length-1];if(ps.length>2&&marcasVd.concat(['MRA','JM','CR','JR','JM4']).includes(ult)){marca=ult;rgd=ps.slice(0,-1).join(' ')}}
  return rgd?{rgd,marca}:null;
}
function vdAddAnimal(){
  const el=$('#fAnimal');if(!el)return;const a=vdLer(el.value);if(!a){el.focus();return false}
  if(!a.marca){toast('Falta a marca: toque num botão de marca (ou "+ Outra").');el.focus();return false}
  if(vdForm.some(x=>x.rgd===a.rgd)){toast(a.rgd+' já está nessa venda.');el.select();return}
  vdForm.push(a);el.value='';vdDesenharForm();el.focus();return true;
}
// "+ Outra": digita uma marca nova (vira botão nas próximas vendas)
function vdOutra(){const b=$('#vdOutraBox');if(!b)return;b.classList.remove('hidden');const i=$('#vdOutraIn');i.value='';i.focus()}
function vdOutraOk(){const i=$('#vdOutraIn');const m=String(i&&i.value||'').trim().toUpperCase();if(!m){i&&i.focus();return}
  if(!marcasVd.includes(m))marcasVd.push(m);$('#vdOutraBox').classList.add('hidden');vdDesenharForm();vdMarcaChip(m)}
// colou várias linhas (ex.: do WhatsApp ou Excel): cada linha vira um animal
function vdColarEv(e){const t=(e.clipboardData||window.clipboardData).getData('text')||'';const ls=t.split(/[\r\n;]+/).map(x=>x.trim()).filter(Boolean);if(ls.length<2)return;e.preventDefault();const el=e.target,sem=[];ls.forEach(l=>{el.value=l;if(!vdAddAnimal())sem.push(l)});el.value='';if(sem.length)toast(`${sem.length} linha(s) sem marca não entraram: ${sem.join(', ')}`)}
function vdColar(el){const ls=String(el.value).split(/[\n;]+/).map(x=>x.trim()).filter(Boolean);if(ls.length<2)return;el.value='';ls.forEach(l=>{el.value=l;vdAddAnimal()})}
function vdTrocaRgd(k,el){const v=String(el.value||'').trim().toUpperCase().replace(/\s+/g,' ');
  if(!v){toast('O RGD não pode ficar vazio.');el.value=vdForm[k].rgd;return}
  if(vdForm.some((x,j)=>j!==k&&x.rgd===v)){toast(v+' já está nessa venda.');el.value=vdForm[k].rgd;return}
  vdForm[k].rgd=v;vdDesenharForm()}
function vdTira(k){vdForm.splice(k,1);vdDesenharForm()}
function vdMarcaChip(m){const el=$('#fAnimal');if(!el)return;const t=el.value.replace(/\s*-\s*[^-]*$/,'').trim();if(!t){toast('Digite o RGD primeiro e depois toque na marca.');el.focus();return}el.value=t+' - '+m;vdAddAnimal()}
function vdDesenharForm(){
  const l=$('#vdLista');if(!l)return;
  const valor=numBR(($('#fValor')||{}).value),n=vdForm.length,base={valorCab:valor||0,animais:vdForm};
  l.innerHTML=(n?vdForm.map((a,k)=>`<div class="vd-it"><span class="vd-n">${k+1}</span>${vdSoVer?`<b>${esc(a.rgd)}</b>`:`<input class="vd-rgd-in" value="${esc(a.rgd)}" autocapitalize="characters" autocomplete="off" onchange="vdTrocaRgd(${k},this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">`}${vdSoVer?`<span class="vd-mk">${esc(a.marca||'—')}</span>`:`<input class="vd-mk-in" list="dlMarcas" value="${esc(a.marca||'')}" placeholder="marca" autocapitalize="characters" onchange="vdForm[${k}].marca=this.value.trim().toUpperCase();vdDesenharForm()" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">`}${vdSoVer?'':`<button type="button" onclick="vdTira(${k})" aria-label="Tirar">×</button>`}</div>`).join(''):'<div class="vd-vazio">Nenhum animal ainda.</div>')
    +(n?`<div class="vd-tot"><span><b>${n}</b> cabeça${n===1?'':'s'}${valor?` × ${brl(valor)} = <b>${brl(valor*n)}</b>`:''}</span>${valor?`<div class="vd-div">${vdPorMarca(base).map(x=>`<span><b>${esc(x.marca)}</b> ${x.n} cab · ${brl(x.valor)}</span>`).join('')}</div>`:''}</div>`:'');
  const dl=$('#dlMarcas');if(dl)dl.innerHTML=[...new Set([...marcasVd,'MRA','JM','CR'])].map(x=>`<option value="${esc(x)}">`).join('');
  const mk=$('#vdMarcas');if(mk){const ls=[...new Set(['MRA','JM','CR',...marcasVd,...vdForm.map(a=>a.marca).filter(Boolean)])];mk.innerHTML=ls.map(x=>`<button type="button" class="pill" onclick="vdMarcaChip('${esc(x)}')">${esc(x)}</button>`).join('')+`<button type="button" class="pill outra" onclick="vdOutra()">+ Outra</button>`}
}
function vdGuardarListas(d){const ms=[...new Set(d.animais.map(a=>a.marca).filter(Boolean))].filter(x=>!marcasVd.includes(x)),up={};
  if(ms.length)up.marcasVenda=firebase.firestore.FieldValue.arrayUnion(...ms);if(d.comprador&&!compradores.includes(d.comprador))up.compradores=firebase.firestore.FieldValue.arrayUnion(d.comprador);
  if(Object.keys(up).length)cfgRef.set(up,{merge:true}).catch(()=>{})}

/* formulário (celular, editar, ver) */
let fotosForm=[],removidas=[],somenteVer=false,sexoForm='';
function fecharForm(){const f=document.getElementById('form');if(f)f.remove()}
function abrirForm(id,base){
  const i=id?itens.find(x=>x.id===id):null,b=base||{},so=!!(i&&!podeEditar(i)),ro=so?'disabled':'',v=k=>esc(i?(i[k]??''):(b[k]??''));
  const m=document.createElement('div');m.className='modal';m.id='form';m.onclick=e=>{if(e.target===m)m.remove()};
  const nome=aba==='nasc'?'nascimento':aba==='vendas'?'venda':'lançamento';
  let corpo;
  if(aba==='vendas'){
    vdForm=(i?(i.animais||[]):[]).map(a=>({...a}));
    corpo=`<div class="duas"><div class="field"><label>Data da venda *</label><input id="fData" ${ro} class="input" type="date" value="${i?v('data'):hoje()}"></div>
      <div class="field"><label>Valor por cabeça (R$) *</label><input id="fValor" ${ro} class="input" inputmode="decimal" placeholder="Ex: 3.000" value="${i&&vdCab(i)?esc(String(vdCab(i)).replace('.',',')):''}" oninput="vdDesenharForm()"></div></div>
      <div class="field"><label>Comprador</label><input id="fComp" ${ro} class="input" list="dlComp" value="${v('comprador')}" placeholder="(se quiser)"></div>
      <div class="field"><label>Animais — digite o <b>RGD</b> e toque na <b>marca</b> (ou digite RGD - Marca e Enter)</label>

        <div class="vd-marcas" id="vdMarcas"></div>
        <div class="vd-outra hidden" id="vdOutraBox"><input id="vdOutraIn" class="input" placeholder="Nome da marca" autocapitalize="characters" autocomplete="off" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();vdOutraOk()}"><button type="button" class="btn btn-primary" onclick="vdOutraOk()">OK</button></div>`}
        <div class="vd-lista" id="vdLista"></div></div>

    corpo=`<div class="duas"><div class="field"><label>RGD Mãe</label><input id="fMae" ${ro} class="input" value="${v('rgdMae')}" autocapitalize="characters"></div>
      <div class="field"><label>N° Receptora</label><input id="fRec" ${ro} class="input" value="${v('receptora')}" autocapitalize="characters"></div></div>
      <div class="duas"><div class="field"><label>Sexo</label><div class="seg">${['M','F'].map(x=>`<button type="button" ${ro} class="${x} ${sexoForm===x?'on':''}" onclick="sexoForm=sexoForm==='${x}'?'':'${x}';document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.textContent===sexoForm))">${x}</button>`).join('')}</div></div>
      <div class="field"><label>Data Nascimento *</label><input id="fData" ${ro} class="input" type="date" value="${i?v('data'):''}"></div></div>
      <div class="duas"><div class="field"><label>Peso Nascimento (kg)</label><input id="fPeso" ${ro} class="input" inputmode="decimal" value="${v('peso')}"></div>
      <div class="field"><label>Pelagem</label><select id="fPel" ${ro} class="input">${opcoesPel(i?i.pelagem||'':'')}</select></div></div>
      <div class="field" style="margin-bottom:0"><label>Observação</label><input id="fObs" ${ro} class="input" list="dlObs" value="${v('obs')}" placeholder="Natimorto, Morte, Gêmeos ou escreva"></div>`;
  }else{

      <div class="field"><label>Situação *</label><select id="fSit" ${ro} class="input"><option value="">—</option>${SITUACOES.map(x=>`<option ${i&&i.situacao===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Observação</label><textarea id="fObsG" ${ro} class="input">${esc(i?obsGeral(i):'')}</textarea></div>

        <input id="fArq" type="file" accept="image/*" capture="environment" multiple class="hidden" onchange="addFotos(this.files);this.value=''"></div>`;
  }
  m.innerHTML=`<div class="folha"><div class="folha-cab"><h2>${i?(so?(aba==='nasc'?'Nascimento':aba==='vendas'?'Venda':'Lançamento'):'Editar '+nome):(aba==='nasc'?'Novo nascimento':aba==='vendas'?'Nova venda':'Novo lançamento')}</h2><button class="x" onclick="fecharForm()" aria-label="Fechar">×</button></div>
    <div class="folha-corpo">${so?`<div class="offline" style="background:#f1f4f2;border-color:#dde4df;color:#4a5850">Lançado por ${esc(i.criadoPorNome||'')}. Só quem lançou (ou o administrador) pode alterar.</div>`:''}${corpo}</div>
    <div class="folha-pe">${so?'<button class="btn btn-ghost" style="margin-left:auto" onclick="fecharForm()">Fechar</button>':`${i?`<button class="btn btn-danger esq" onclick="apagar('${i.id}')">Excluir</button>`:'<span class="esq"></span>'}<button class="btn btn-ghost" onclick="fecharForm()">Cancelar</button>${i?'':'<button class="btn btn-ghost" onclick="salvar(null,true)" title="Salva e já abre outro">Salvar e +1</button>'}<button class="btn btn-primary" onclick="salvar(${i?`'${i.id}'`:'null'})">Salvar</button>`}</div></div>`;
  document.body.appendChild(m);
  fotosForm=[];removidas=[];somenteVer=so;

  if(aba==='geral'){desenharFotos();(i&&i.fotos||[]).forEach(fid=>colFotos.doc(fid).get().then(d=>{if(d.exists&&document.getElementById('form')){fotosForm.push({id:fid,dados:d.data().dados});desenharFotos()}}).catch(()=>{}))}

function salvar(id,outro){
  const data=$('#fData').value;if(!data){toast(aba==='nasc'?'Informe a data de nascimento.':'Informe a data.');return}
  let dados;
  if(aba==='vendas'){
    const pend=$('#fAnimal')&&$('#fAnimal').value.trim();if(pend)vdAddAnimal();
    const valor=numBR($('#fValor').value);if(valor===null||valor<=0){toast('Informe o valor por cabeça.');$('#fValor').focus();return}
    if(!vdForm.length){toast('Coloque pelo menos um animal.');$('#fAnimal').focus();return}
    const semM=vdForm.map((a,k)=>a.marca?-1:k).filter(k=>k>-1);
    if(semM.length){document.querySelectorAll('.vd-mk-in').forEach((x,k)=>x.classList.toggle('falta',semM.includes(k)));toast('Tem animal sem marca. Preencha a marca em vermelho.');const x=document.querySelectorAll('.vd-mk-in')[semM[0]];if(x)x.focus();return}
    dados={data,mes:data.slice(0,7),valorCab:valor,...(id?{valor:firebase.firestore.FieldValue.delete()}:{}),comprador:$('#fComp').value.trim(),animais:vdForm.map(a=>({rgd:a.rgd,marca:a.marca})),obs:$('#fObsV').value.trim()};
    vdGuardarListas(dados);
  }else if(aba==='nasc'){
    dados={data,mes:data.slice(0,7),rgdMae:$('#fMae').value.trim().toUpperCase(),receptora:$('#fRec').value.trim().toUpperCase(),sexo:sexoForm,peso:$('#fPeso').value.trim(),pelagem:$('#fPel').value.trim(),obs:$('#fObs').value.trim()};
    if(dados.peso&&numBR(dados.peso)===null){toast('Peso: digite só número.');return}
  }else{
    dados={data,mes:data.slice(0,7),rgd:$('#fRgd').value.trim().toUpperCase(),situacao:$('#fSit').value,obs:$('#fObsG').value.trim()};
    if(!dados.situacao){toast('Escolha a situação.');return}
  }
  const ref=id?col.doc(id):col.doc();
  if(aba==='vendas'&&!id)vdForm=[];
  if(aba==='geral'){dados.fotos=gravarFotos(fotosForm,ref.id,dados.mes);removidas.forEach(fid=>colFotos.doc(fid).delete().catch(()=>{}))}
  if(id)ref.update({...dados,alteradoEm:firebase.firestore.FieldValue.serverTimestamp(),alteradoPor:meuNome}).catch(e=>toast('Não salvou: '+e.message));
  else ref.set(novoDoc(dados)).catch(e=>toast('Não salvou: '+e.message));
  fecharForm();avisoSalvo();
  if(mes&&dados.mes!==mes){mes=dados.mes;desenhar()}
  if(outro)abrirForm(null,{});
}
function apagar(id){
  if(!confirm(aba==='vendas'?'Excluir esta venda?':'Excluir este lançamento?'))return;
  const i=todos.find(x=>x.id===id);(i&&i.fotos||[]).forEach(fid=>colFotos.doc(fid).delete().catch(()=>{}));
  col.doc(id).delete().catch(e=>toast('Não excluiu: '+e.message));
  fecharForm();toast('Excluído.');
}

/* ---------- fotos: comprimidas no próprio aparelho (máx. 1280 px, ~150 KB) ---------- */
function desenharFotos(){
  const el=document.getElementById('fFotos');if(!el)return;
  el.innerHTML=fotosForm.map((f,k)=>`<div class="foto"><img src="${f.dados}" onclick="verFoto(fotosForm[${k}].dados)">${somenteVer?'':`<button type="button" onclick="tirarFoto(${k})" aria-label="Remover">×</button>`}</div>`).join('')
    +(!somenteVer&&fotosForm.length<4?`<div class="addfoto" onclick="document.getElementById('fArq').click()">📷<br>Adicionar</div>`:'')
    +(somenteVer&&!fotosForm.length?'<span style="font-size:13px;color:var(--muito-suave)">Sem fotos</span>':'');
}
function comprimir(arq){return new Promise((ok,erro)=>{const r=new FileReader();r.onerror=erro;r.onload=()=>{const img=new Image();img.onerror=erro;img.onload=()=>{
  const M=1280,k=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);let q=0.7,d=c.toDataURL('image/jpeg',q);while(d.length>600000&&q>0.3){q-=0.1;d=c.toDataURL('image/jpeg',q)}ok(d)};img.src=r.result};r.readAsDataURL(arq)})}
async function addFotos(files){for(const f of [...files].slice(0,4-fotosForm.length)){try{fotosForm.push({id:null,dados:await comprimir(f)})}catch(e){toast('Não consegui ler essa foto.')}}desenharFotos()}
function tirarFoto(k){const f=fotosForm[k];if(f.id)removidas.push(f.id);fotosForm.splice(k,1);desenharFotos()}
function verFoto(src){const z=document.createElement('div');z.className='zoom';z.onclick=()=>z.remove();z.innerHTML=`<img src="${src}">`;document.body.appendChild(z)}
function verFotoId(id){if(miniFotos[id])verFoto(miniFotos[id])}

/* ---------- Excel das vendas: escolhe quais vendas; uma linha por animal ---------- */
function vdEscolherExcel(v,pdf){return escolherExcel(v,i=>`<b>${fmtData(i.data)}</b> · ${(i.animais||[]).length} cab · ${brl0(vdTotal(i))}${i.comprador?' · '+esc(i.comprador):''}`,'vdBaixarExcel',()=>false,pdf)}
function nsEscolherExcel(pdf){
  const ms={};todos.forEach(i=>{const k=String(i.data||'').slice(0,7);if(/^\d{4}-\d{2}$/.test(k))ms[k]=(ms[k]||0)+1});
  const ls=Object.keys(ms).sort().map(k=>({id:k,n:ms[k]}));if(!ls.length){toast('Nada pra exportar.');return}
  escolherExcel(ls,x=>`<b>${nomeMes(x.id)}</b> · ${x.n} nascimento${x.n>1?'s':''}`,'nsBaixarExcel',x=>!mes||x.id===mes,pdf)}
function escolherExcel(v,linha,baixar,marc=()=>true,pdf=false){
  const m=document.createElement('div');m.className='modal';m.id='form';m.onclick=e=>{if(e.target===m)m.remove()};
  m.innerHTML=`<div class="folha"><div class="folha-cab"><h2>${pdf?'Gerar PDF':'Baixar Excel'}</h2><button class="x" onclick="fecharForm()" aria-label="Fechar">×</button></div>
    <div class="folha-corpo"><div class="vdx-bts"><button type="button" class="btn btn-ghost" onclick="document.querySelectorAll('.vdx-cb').forEach(c=>c.checked=true)">Marcar ${baixar==='nsBaixarExcel'?'todos':'todas'}</button><button type="button" class="btn btn-ghost" onclick="document.querySelectorAll('.vdx-cb').forEach(c=>c.checked=false)">Desmarcar</button></div>
    <div class="vdx-lista">${v.slice().reverse().map(i=>`<label class="vdx-it"><input type="checkbox" class="vdx-cb" value="${i.id}"${marc(i)?' checked':''}><span>${linha(i)}</span></label>`).join('')}</div></div>
    <div class="folha-pe"><span class="esq"></span><button class="btn btn-ghost" onclick="fecharForm()">Cancelar</button><button class="btn btn-primary" onclick="${baixar}(${pdf?'true':''})">${pdf?'📄 Gerar PDF':'⬇ Baixar Excel'}</button></div></div>`;
  document.body.appendChild(m);
}
/* ---------- PDF das vendas e nascimentos: mesmo visual do Excel ---------- */
const pdfEsc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pdfTab(cab,linhas,centro=[],direita=[]){const al=k=>centro.includes(k)?' class="c"':direita.includes(k)?' class="d"':'';
  return `<table><thead><tr>${cab.map((h,k)=>`<th${al(k)}>${pdfEsc(h)}</th>`).join('')}</tr></thead><tbody>${linhas.map(l=>`<tr>${l.map((x,k)=>`<td${al(k)}>${pdfEsc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function pdfResumo(titulo,col,linhas,total,reais){const f=x=>reais?brl(x):x;
  return `<table class="res"><thead><tr><th>${pdfEsc(titulo)}</th><th class="d">${pdfEsc(col)}</th></tr></thead><tbody>${linhas.map(([a,b])=>`<tr><td>${pdfEsc(a)}</td><td class="d">${pdfEsc(f(b))}</td></tr>`).join('')}<tr class="tot"><td>TOTAL</td><td class="d">${pdfEsc(f(total))}</td></tr></tbody></table>`}
const pdfDoc=(titulo,sub,corpo)=>`<!doctype html><html><head><meta charset="utf-8"><style>
  html{background:#fff}body{margin:0;padding:18px 20px;font-family:Calibri,Carlito,Arial,sans-serif;color:#1d2a22;background:#fff;font-size:13px}
  h1{font-size:19px;margin:0 0 2px;color:#1f5f43}.sub{font-size:12.5px;color:#5d6a62;margin-bottom:12px}
  table{border-collapse:collapse;width:100%;margin-bottom:22px}
  th{background:#1f5f43;color:#fff;font-weight:700;text-align:left;padding:6px 8px;border:1px solid #d5ddd8}
  td{padding:5px 8px;border:1px solid #d5ddd8;vertical-align:top}
  .c{text-align:center}.d{text-align:right;white-space:nowrap}
  table.res{width:60%;margin-left:auto;margin-right:0}
  tr.tot td{background:#e8f3ec;font-weight:700}
</style></head><body><h1>${pdfEsc(titulo)}</h1><div class="sub">${pdfEsc(sub||'')}${sub?' · ':''}Gerado em ${new Date().toLocaleDateString('pt-BR')}</div>${corpo}</body></html>`;
const PDF_LIBS=['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
function pdfCarregaLibs(){
  const um=src=>new Promise((ok,erro)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>erro(new Error('lib'));document.head.appendChild(s)});
  return (window.html2canvas?Promise.resolve():um(PDF_LIBS[0])).then(()=>window.jspdf?0:um(PDF_LIBS[1]));
}
function pdfAviso(html){
  let f=document.getElementById('pdfAviso');
  if(!f){f=document.createElement('div');f.id='pdfAviso';f.style.cssText='position:fixed;inset:0;z-index:99999;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit';document.body.appendChild(f)}
  f.innerHTML=`<div style="background:#fff;border-radius:16px;padding:22px;width:340px;max-width:100%;box-shadow:0 20px 50px #0005;text-align:center;color:#233129">${html}</div>`;
  return f;
}
function pdfFechar(){const f=document.getElementById('pdfAviso');if(f)f.remove()}
const pdfNomeArq=t=>String(t||'documento').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\W+/g,'_').replace(/^_+|_+$/g,'').slice(0,80)+'.pdf';
async function gerarPdf(titulo,docHtml,largura,deitado){
  largura=largura||900;
  pdfAviso('<div style="font-size:30px">📄</div><div style="font-weight:800;font-size:17px;margin:6px 0 2px">Gerando o PDF…</div><div style="font-size:13px;color:#69746c">Só um instante</div>');
  let fr=null;
  try{
    await pdfCarregaLibs();
    fr=document.createElement('iframe');fr.setAttribute('aria-hidden','true');
    fr.style.cssText=`position:fixed;left:-30000px;top:0;width:${largura}px;height:1200px;border:0;background:#fff`;
    document.body.appendChild(fr);
    const d=fr.contentDocument;d.open();d.write(docHtml);d.close();
    await new Promise(r=>setTimeout(r,250));

function gravarPz(rgd,res,obs){
  const k=chaveRgd(rgd),ant=pz[k],agora=new Date().toISOString();
  const val={rgd,resultado:res,obs:obs!=null&&obs!==''?obs:((ant&&ant.obs)||''),data:hoje(),em:agora,por:meuNome,porUid:eu.uid,criadoPorUid:(ant&&ant.criadoPorUid)||eu.uid,anterior:ant&&ant.resultado&&ant.resultado!==res?ant.resultado:((ant&&ant.anterior)||'')};
  pz[k]=val;refPz(estPz).set({animais:{[k]:val}},{merge:true}).catch(e=>toast('Não salvou: '+e.message));
  return ant;
}
function lancarPz(res){
  const rgd=normRgd($('#pzRgd').value);
  if(!chaveRgd(rgd)){toast('Digite o RGD.');$('#pzRgd').focus();return}
  if(!res){toast('Escolha o resultado.');$('#pzRes').focus();return}
  const ant=gravarPz(rgd,res,$('#pzObs').value.trim());
  toast((ant&&ant.resultado?`${rgd}: ${ant.resultado} → ${res}`:`${rgd}: ${res}`)+(navigator.onLine?'':' (guardado no aparelho)'));
  $('#pzRgd').value='';$('#pzRes').value='';$('#pzObs').value='';desenharPz();$('#pzRgd').focus();
}
function apagarPz(k){const x=pz[k];if(!x||!confirm(`Excluir ${x.rgd} desta estação?`))return;
  delete pz[k];refPz(estPz).set({animais:{[k]:firebase.firestore.FieldValue.delete()}},{merge:true}).catch(e=>toast('Não excluiu: '+e.message));desenharPz();toast('Excluído.')}
$('#pzRgd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(innerWidth>860)$('#pzRes').focus()}});
$('#pzObs').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(innerWidth>860)$('#pzRes').focus()}});
$('#pzRes').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();lancarPz($('#pzRes').value)}});
function exportarPz(){
  if(typeof XLSX==='undefined'){toast('Sem internet pra gerar o Excel agora.');return}
  const v=visiveisPz();if(!v.length){toast('Nada pra exportar.');return}
  const ws=XLSX.utils.json_to_sheet(v.map(x=>({RGD:x.rgd,RESULTADO:x.resultado,DATA:fmtData(x.data),OBSERVACAO:x.obs||'',LANCADO_POR:x.por||''})));
  ws['!cols']=[{wch:14},{wch:12},{wch:12},{wch:34},{wch:18}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Prenhez');XLSX.writeFile(wb,`caderneta_prenhez_${estPz.replace(/[^0-9A-Za-z]+/g,'-')}.xlsx`);
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js').catch(()=>{});
</script>
