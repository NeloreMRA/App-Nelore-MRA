<div class="topo-cel"><button class="mn" onclick="menuCel()" aria-label="Menu">☰</button><b>🐮 Rebanho</b><button class="mn" onclick="abrirBusca()" aria-label="Buscar">🔎</button><select class="top-est" id="estCel" onchange="trocaEst(this.value)"></select></div>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="lg">🐮</div><div><b>Rebanho</b></div></div>
    <button class="busca-btn" onclick="abrirBusca()">🔎 Buscar animal</button>

    <div class="side-est"><label>Estação</label><select id="estSel" onchange="trocaEst(this.value)"></select></div>
    <div class="side-foot"><span class="dot" id="dot"></span><span id="status">Conectando...</span></div>
  </aside>
  <main id="main"><div class="vazio">Carregando...</div></main>

<script>
const FIREBASE_CONFIG={apiKey:'AIzaSyD9yib_iQYHcOG2B2C70cWXJ9SkTiIDt94',authDomain:'app-nelore-mra.firebaseapp.com',projectId:'app-nelore-mra',storageBucket:'app-nelore-mra.firebasestorage.app',messagingSenderId:'1043343802346',appId:'1:1043343802346:web:219f5d73748271a85dfc93'};
const ADMIN_EMAIL='mandrade.gado@terra.com.br';
firebase.initializeApp(FIREBASE_CONFIG);
const fs=firebase.firestore();
try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const raiz=fs.collection('apps').doc('rebanho'),blocosRef=raiz.collection('blocos');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){$$('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
const st=(t,ok=true)=>{$('#status').textContent=t;$('#dot').style.background=ok?'#7bd39e':'#e9b234'};

/* ---------- datas e números ---------- */
const HOJE=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fd=s=>s&&/^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const addD=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const meses=(a,b)=>a&&b?(new Date(b)-new Date(a))/(30.4375*864e5):null;
const n0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString('pt-BR');
const n1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10).toLocaleString('pt-BR');
const n2=v=>v==null||isNaN(v)?'—':(Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?n1(a/b*100)+'%':'—';
const numBR=s=>{s=String(s??'').trim().replace(/\s/g,'');if(!s)return null;const n=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);return isFinite(n)?n:null};
const norm=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,' ');
const media=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};

let IX={};
const ehFIV=n=>n.rec!=null&&n.rec!=='';           // produto de FIV (nasceu de receptora): o S-Gado conta à parte
function indexar(){
  const vivo=r=>!r.x;
  IX={mat:{},nasMae:{},cobMat:{},ests:[],nas:{},pesNas:{},pep:{},partoNF:{}};
  db.nas.filter(vivo).forEach(n=>IX.nas[n.id]=n);
  db.pep.filter(vivo).forEach(e=>IX.pep[e.id]=e);
  db.pes.filter(r=>vivo(r)&&IX.pep[r.pes]).forEach(r=>{(IX.pesNas[r.nas]=IX.pesNas[r.nas]||[]).push(r)});
  Object.values(IX.pesNas).forEach(a=>a.sort((x,y)=>String(x.data||IX.pep[x.pes].data).localeCompare(String(y.data||IX.pep[y.pes].data))));
  db.mat.filter(vivo).forEach(m=>IX.mat[norm(m.reg)]=m);
  db.nas.filter(vivo).forEach(n=>{(IX.nasMae[norm(n.mae)]=IX.nasMae[norm(n.mae)]||[]).push(n)});
  db.cob.filter(vivo).forEach(c=>{(IX.cobMat[norm(c.mat)]=IX.cobMat[norm(c.mat)]||[]).push(c)});
  Object.values(IX.nasMae).forEach(a=>a.sort((x,y)=>String(x.nasc).localeCompare(String(y.nasc))));
  Object.values(IX.cobMat).forEach(a=>a.sort((x,y)=>String(x.ins).localeCompare(String(y.ins))||Number(x.id)-Number(y.id)));
  db.cob.filter(c=>vivo(c)&&c.parto&&c.tipo!=='FIV').forEach(c=>{(IX.partoNF[norm(c.mat)]=IX.partoNF[norm(c.mat)]||new Set()).add(c.parto)});
  const es=new Set(db.cad.estacoes||[]);db.cob.forEach(c=>c.est&&es.add(c.est));IX.ests=[...es].sort(ordemEst);
  const pesos=db.nas.filter(n=>vivo(n)&&!ehFIV(n)&&n.pesoD).map(n=>n.pesoD),notas=db.nas.filter(n=>vivo(n)&&!ehFIV(n)&&n.notaD).map(n=>n.notaD);
  const tents=db.cob.filter(c=>vivo(c)&&c.tipo!=='FIV');
  IX.medPeso=media(pesos);IX.medNota=media(notas);IX.taxa=tents.length?tents.filter(c=>c.res==='PRENHE').length/tents.length:null;
  IX.medIEP=media(Object.keys(IX.nasMae).map(k=>indMatriz(k).iep));
  IX.rank=null;
}
const ordemEst=(a,b)=>{const k=s=>{const m=String(s).match(/^(\d{4})(?:\/(\d{4}))?/);return m?Number(m[1])*10+(m[2]?1:0):0};return k(a)-k(b)};
// nascimento "vinculado" (S-Gado): produto natural/artificial cuja data bate com a parição de uma cobertura da mãe
const vinculado=n=>!ehFIV(n)&&!!(IX.partoNF[norm(n.mae)]&&IX.partoNF[norm(n.mae)].has(n.nasc));
// indicadores da ficha, iguais ao S-Gado: tentativas = coberturas da aba (Natural/Artificial ou FIV), com ou sem toque;
// taxa de prenhez = prenhes ÷ tentativas; taxa de nascimento = nascimentos vinculados ÷ tentativas; peso e nota = média dos vinculados
function indMatriz(reg,aba='nat'){
  const k=norm(reg),m=IX.mat[k]||{},ns=(IX.nasMae[k]||[]),nat=ns.filter(n=>!ehFIV(n)),fiv=ns.filter(ehFIV),cs=IX.cobMat[k]||[];
  const datas=nat.map(n=>n.nasc).filter(Boolean).sort();const ints=[];for(let i=1;i<datas.length;i++)ints.push(meses(datas[i-1],datas[i]));
  const ca=cs.filter(c=>aba==='fiv'?c.tipo==='FIV':c.tipo!=='FIV'),pr=ca.filter(c=>c.res==='PRENHE').length,vinc=aba==='fiv'?fiv:nat.filter(vinculado);
  return {m,nat,fiv,cs,ca,vinc,iep:media(ints),p1:datas.length&&m.nasc?meses(m.nasc,datas[0]):null,
    peso:media(vinc.map(n=>n.pesoD).filter(Boolean)),nota:media(vinc.map(n=>n.notaD).filter(Boolean)),
    pr,vz:ca.filter(c=>c.res==='VAZIA').length,ab:ca.filter(c=>c.res==='ABORTO').length,tent:ca.length,taxa:ca.length?pr/ca.length:null,taxaNasc:ca.length?vinc.length/ca.length:null};
}
// ranking igual ao S-Gado (conferido nas 400 fichas): 50% taxa de prenhez + 30% taxa de nascimento + 20% peso médio à desmama (comparado ao maior)
function ranking(){
  if(IX.rank)return IX.rank;
  const lst=Object.keys(IX.mat).map(k=>({k,i:indMatriz(k)})).filter(x=>x.i.tent>0);
  const maxP=Math.max(1,...lst.map(x=>x.i.peso||0));
  lst.forEach(x=>x.s=Math.round(((x.i.taxa||0)*50+(x.i.taxaNasc||0)*30+((x.i.peso||0)/maxP)*20)*100)/100);
  lst.sort((a,b)=>b.s-a.s||(b.i.taxa||0)-(a.i.taxa||0)||b.i.vinc.length-a.i.vinc.length);IX.rank={pos:{},tot:lst.length};lst.forEach((x,i)=>IX.rank.pos[x.k]={p:i+1,s:x.s});return IX.rank;
}
// estatística da estação por método (regras do S-Gado): ordem da IA por data em cada matriz; "procedimento" conta todas;
// resultado final = o da ÚLTIMA inseminação de cada animal; na FIV o animal é a receptora (sem número, cada transferência conta como uma)
function estatMetodos(cs){
  const out={};
  ['ARTIFICIAL','NATURAL','FIV'].forEach(t=>{
    const a=cs.filter(c=>c.tipo===t),g={};
    a.forEach(c=>{const k=t==='FIV'?(c.rec?'r:'+norm(c.rec):'c:'+c.id):norm(c.mat);(g[k]=g[k]||[]).push(c)});
    const gs=Object.values(g).map(v=>v.sort((x,y)=>String(x.ins).localeCompare(String(y.ins))||Number(x.id)-Number(y.id)));
    const cont=l=>({P:l.filter(c=>c.res==='PRENHE').length,V:l.filter(c=>c.res==='VAZIA').length,A:l.filter(c=>c.res==='ABORTO').length});
    out[t]={proc:a.length,animais:gs.length,ordem:[gs.length,gs.filter(v=>v.length>=2).length,gs.reduce((s,v)=>s+Math.max(0,v.length-2),0)],porProc:cont(a),fim:cont(gs.map(v=>v[v.length-1]))};
  });
  return out;
}

/* ---------- FAROL da matriz (só matriz ATIVA): verde boa, amarelo atenção, vermelho ruim — com o motivo ---------- */
function farol(reg){
  const m=IX.mat[norm(reg)];if(!m||m.sit!=='ATIVA')return null;
  const i=indMatriz(reg),res=i.ca.filter(c=>['PRENHE','VAZIA','ABORTO'].includes(c.res));if(!res.length)return null;
  const ult=res.slice(-2),ver=[],ama=[];
  if(ult.length===2&&ult.every(c=>c.res!=='PRENHE'))ver.push('2 vazias seguidas');
  else if(ult[ult.length-1].res!=='PRENHE')ama.push('última cobertura vazia');
  const tx=IX.taxa||0.4;if(i.tent>=4&&i.taxa<tx*0.55)ver.push('prenhez baixa ('+Math.round(i.taxa*100)+'%)');else if(i.tent>=3&&i.taxa<tx*0.8)ama.push('prenhez abaixo da média ('+Math.round(i.taxa*100)+'%)');
  if(i.peso&&IX.medPeso&&i.vinc.filter(n=>n.pesoD).length>=2){if(i.peso<IX.medPeso*0.88)ver.push('bezerros leves na desmama ('+n0(i.peso)+' kg)');else if(i.peso<IX.medPeso*0.95)ama.push('bezerros abaixo da média ('+n0(i.peso)+' kg)')}
  if(i.iep&&i.iep>16)ama.push('intervalo entre partos de '+n1(i.iep)+' meses');
  return ver.length?{c:'vermelho',t:ver.join(' · ')}:ama.length?{c:'amarelo',t:ama.join(' · ')}:{c:'verde',t:'boa: emprenha e desmama bem'};
}
const bolinha=reg=>{const f=farol(reg);return f?`<i class="farol f-${f.c}" title="${esc(f.t)}"></i>`:''};

function graficoPeso(pts){
  if(pts.length<2)return '';
  const W=640,H=180,P=34,xs=pts.map(p=>new Date(p[0]).getTime()),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y1=Math.max(...ys)*1.1;
  const X=t=>P+(t-x0)/((x1-x0)||1)*(W-2*P),Y=v=>H-24-(v/y1)*(H-44);
  const lin=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  let ult=-99;const mostra=pts.map((p,i)=>{const ok=X(xs[i])-ult>=42||i===pts.length-1;if(ok)ult=X(xs[i]);return ok});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto"><line x1="${P}" y1="${H-24}" x2="${W-P}" y2="${H-24}" stroke="#e1e7e3"/><path d="${lin}" fill="none" stroke="#1f6a49" stroke-width="2.5"/>${pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p[1])}" r="4" fill="#1f6a49"/>${mostra[i]?`<text x="${X(xs[i])}" y="${Y(p[1])-9}" font-size="11" text-anchor="middle" font-weight="700" fill="#17211c">${n1(p[1])}</text><text x="${X(xs[i])}" y="${H-8}" font-size="10" text-anchor="middle" fill="#8a958d">${esc(p[2])}</text>`:''}`).join('')}</svg>`;
}

  if(t==='met')return [['','Todos'],['ARTIFICIAL','Artificial'],['NATURAL','Natural'],['FIV','FIV']];

}

  const fi={};db.nas.filter(n=>!n.x).forEach(n=>{const k=norm(n.pai);const x=fi[k]=fi[k]||{n:0,pd:[],p12:[]};x.n++;if(n.pesoD)x.pd.push(n.pesoD);(IX.pesNas[n.id]||[]).forEach(r=>{const mm=meses(n.nasc,dataPes(r));if(r.peso&&mm>=11&&mm<13)x.p12.push(r.peso)})});

function formCob(id,mat){const r=id?db.cob.find(x=>x.id===id):{mat:mat||'',est:est||IX.ests[IX.ests.length-1],tipo:'ARTIFICIAL'};if(!r)return;const d=DEF_COB();
  abrirModal(id?'Editar cobertura':'Nova cobertura',campos(d,r)+dl('dlMat',Object.values(IX.mat).map(m=>m.reg))+dl('dlRep',db.rep.map(x=>x.nome))+'<div style="font-size:12px;color:var(--suave);margin-top:8px">Prenhe: a previsão de parto é calculada sozinha (inseminação + 275 até + 315 dias; na monta natural até + 680).</div>',`${id?`<button class="btn del esq" onclick="excluir('cob','${id}')">Excluir</button>`:''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="okF">Salvar</button>`);
  $('#okF').onclick=()=>{const t={...r};lerCampos(d,t);if(!t.mat||!t.est||!t.ins)return toast('Preencha matriz, estação e inseminação.');if(!IX.mat[norm(t.mat)])return toast('Matriz não cadastrada: '+t.mat);
    if(t.res==='PRENHE'&&(!t.ppi||t.ins!==r.ins||t.tipo!==r.tipo)){t.ppi=addD(t.ins,275);t.ppf=prevFim(t)}
    Object.keys(r).forEach(k=>delete r[k]);Object.assign(r,t);if(!r.id)r.id=novoId();salvarRec('cob',r);fecharModal();desenhar();toast('Salvo.')}}
const DEF_NAS=()=>[['mae','Matriz (mãe) *','list','dlMat'],['prod','Nome do produto','txt'],['rgn','Registro (RGN)','txt'],['sexo','Sexo','sel',['M','F']],['nasc','Nascimento *','date'],['pesoN','Peso ao nascer (kg)','num'],['cor','Cor','sel',['BR','CZ','MB','MN','PV']],['pai','Reprodutor (pai)','list','dlRep'],['marca','Marca','sel',(db.cad.proprietarios||[]).map(p=>p.marca)],['sit','Situação','txt'],['rec','Código da receptora (FIV)','txt'],['desm','Data da desmama','date'],['pesoD','Peso à desmama (kg)','num'],['notaD','Nota à desmama','num'],['obs','Observação','area',null,1]];
function formNas(id,mae){const r=id?db.nas.find(x=>x.id===id):{mae:mae||'',marca:'MRA',sit:'ATIVO'};if(!r)return;const d=DEF_NAS();
  if(!id&&mae){const c=(IX.cobMat[norm(mae)]||[]).filter(c=>c.res==='PRENHE'&&!c.parto).pop();if(c){r.pai=c.rep;if(c.tipo==='FIV'&&c.rec)r.rec=c.rec}}
  abrirModal(id?'Editar nascimento':'Novo nascimento',campos(d,r)+dl('dlMat',Object.values(IX.mat).map(m=>m.reg))+dl('dlRep',db.rep.map(x=>x.nome)),`${id?`<button class="btn del esq" onclick="excluir('nas','${id}')">Excluir</button>`:''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="okF">Salvar</button>`);
  $('#okF').onclick=()=>{const t={...r};lerCampos(d,t);if(!t.mae||!t.nasc)return toast('Preencha mãe e nascimento.');
    Object.keys(r).forEach(k=>delete r[k]);Object.assign(r,t);if(!r.id)r.id=novoId();
    if(!id){const c=(IX.cobMat[norm(r.mae)]||[]).filter(c=>c.res==='PRENHE'&&!c.parto&&c.ins<r.nasc).pop();if(c){c.parto=r.nasc;salvarRec('cob',c)}} // parto fecha a cobertura prenhe
    salvarRec('nas',r);fecharModal();desenhar();toast('Salvo.')}}
const DEF_REP=[['nome','Nome *','txt'],['reg','Registro','txt'],['cod','Código','txt'],['obs','Comentário','area',null,1]];
function formRep(id){const r=id?db.rep.find(x=>x.id===id):{};if(!r)return;

/* ---------- Excel (planilha comum, do que está na tela com os filtros) ---------- */
let xlsxP=null;const xlsx=()=>xlsxP||(xlsxP=new Promise((ok,er)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>{xlsxP=null;er()};document.head.appendChild(s)}));
async function exportar(qual){
  try{await xlsx()}catch(e){return toast('Sem internet pra gerar o Excel.')}
  const tbl=$('#main table');if(!tbl)return;const lim0=lim;lim=1e9;desenhar();
  const rows=[...$('#main table').querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>{const i=td.querySelector('input,select');return i?(i.type==='date'?fd(i.value):i.value):td.innerText.trim()}).filter(x=>!/^✏️$/.test(x)));
  lim=lim0;desenhar();
  const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,{mat:'Matrizes',cob:'Coberturas',nas:'Nascimentos',rep:'Reprodutores',pes:'Pesagem'}[qual]||'Dados');
  XLSX.writeFile(wb,`rebanho_${qual}${qual==='pes'&&IX.pep[pesAberta]?'_'+String(IX.pep[pesAberta].epoca||'').replace(/\W/g,''):''}${est&&(qual==='cob'||qual==='rep')?'_'+est.replace('/','-'):''}.xlsx`);
}
