<style>
/* Rebanho: gestão reprodutiva das matrizes (dados vindos do S-Gado). App separado: guarda tudo em apps/rebanho/...

:root{--verde:#153e2c;--verde2:#1f6a49;--ativo:#24583f;--ouro:#e7b549;--fundo:#f3f5f3;--borda:#e1e7e3;--linha:#eef1ee;--texto:#17211c;--suave:#5d6a62;--muito:#8a958d;

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto);font-size:14px}
.hidden{display:none!important}

.brand b{display:block;font-size:15px;white-space:nowrap}.brand span{display:block;font-size:11.5px;opacity:.7}
.nav{border:0;background:none;color:#dce9e2;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center;font-size:14px}
.nav:hover,.nav.on{background:var(--ativo);color:#fff}
.side-est{margin-top:14px;border-top:1px solid #ffffff1f;padding-top:12px}.side-est label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;display:block;margin:0 0 6px 4px}
.side-est select,.top-est{width:100%;background:#24583f;color:#fff;border:1px solid #ffffff2a;border-radius:9px;padding:8px}

.s-ATIVA{background:var(--pf);color:var(--p)}.s-RECEPTORA{background:#e8eefb;color:#2c4a86}.s-VENDIDA,.s-ABATIDA,.s-MORTE,.s-DESCARTE,.s-ZERO-ANCA{background:#eef1ee;color:#5d6a62}

.rosca{display:flex;flex-direction:column;align-items:center;gap:8px}.rosca svg{width:150px;height:150px}
.rosca .lg{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12px}.rosca .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.abas{display:flex;gap:4px;margin-bottom:8px}.abas button{border:1px solid var(--borda);background:#fff;border-radius:99px;padding:5px 12px;font-weight:700;cursor:pointer;font-size:12.5px}.abas button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.tempo{position:relative;padding-left:18px}.tempo:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:#e1e7e3}

.ev .d{color:var(--muito);font-size:11.5px;display:inline-block;width:78px}
.rodape{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:8px;color:var(--suave)}.rodape b{color:var(--texto)}
.modal{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.folha{background:#fff;border-radius:16px;width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column}
.folha-cab{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--borda)}.folha-cab h2{margin:0;font-size:18px}.folha-cab .x{margin-left:auto;border:0;background:#f1f4f2;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.folha-corpo{padding:14px 16px;overflow:auto}.folha-pe{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--borda)}.folha-pe .esq{margin-right:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:block;font-size:12px;color:var(--suave);font-weight:600;margin-bottom:4px}.form .cheio{grid-column:1/-1}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--borda);border-radius:10px;padding:9px 10px;background:#fff}
.btn.del{color:var(--v);border-color:#f1c9c2}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#17211c;color:#fff;padding:11px 18px;border-radius:12px;z-index:90;max-width:90vw;text-align:center}
.vazio{padding:40px 10px;text-align:center;color:var(--suave)}
.imp{max-width:560px;margin:40px auto;text-align:center}.imp .card{padding:24px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.cols,.fic-top{grid-template-columns:minmax(0,1fr)}.dados,.ind{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
  .app{display:block}.side{display:none}
  .topo-cel{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:10px;background:var(--verde);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  .topo-cel .mn{border:0;border-radius:11px;background:#ffffff1c;color:#fff;width:42px;height:42px;font-size:20px;flex:none}
  .topo-cel b{font-size:15.5px;flex:1}.topo-cel .top-est{width:auto;max-width:130px;background:var(--ouro);color:var(--verde);font-weight:800;border:0;border-radius:20px}
  .menu-cel{position:fixed;left:0;right:0;top:58px;bottom:0;z-index:29;background:#f5f7f5;overflow:auto;padding:14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
  .menu-cel button{background:#fff;border:1px solid #e3e8e4;border-top:3px solid var(--verde2);border-radius:14px;padding:16px 14px;text-align:left;font-weight:700;font-size:15px}
  .menu-cel button.on{background:#eaf3ee}.menu-cel a{grid-column:1/-1;background:#fff;border:1px solid #e3e8e4;border-radius:14px;padding:14px;font-weight:700;color:var(--texto);text-decoration:none}
  main{padding:12px 10px 40px}.filtros input[type=search]{min-width:0;max-width:none;width:100%}
  .hero{flex-wrap:wrap;padding:14px}.hero .n{margin-left:0;text-align:left}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr}.modal{align-items:flex-end;padding:0}.folha{border-radius:16px 16px 0 0;max-height:96vh}
  header.pg .acoes{margin-left:0}
}
@media print{.side,.topo-cel,.acoes,.filtros,.mais{display:none!important}.app{display:block}.tw{max-height:none;overflow:visible}}
</style>

<body>
<script src="../barra-app.js" data-alvo=".side"></script>
<div class="topo-cel"><button class="mn" onclick="menuCel()" aria-label="Menu">☰</button><b>🐮 Rebanho</b><select class="top-est" id="estCel" onchange="trocaEst(this.value)"></select></div>
<div class="menu-cel hidden" id="menuCel"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="lg">🐮</div><div><b>Rebanho</b><span>Gestão reprodutiva</span></div></div>
    <nav id="nav"></nav>
    <div class="side-est"><label>Estação</label><select id="estSel" onchange="trocaEst(this.value)"></select></div>
    <div class="side-foot"><span class="dot" id="dot"></span><span id="status">Conectando...</span></div>
  </aside>
  <main id="main"><div class="vazio">Carregando...</div></main>
</div>
<script>
const FIREBASE_CONFIG={apiKey:'AIzaSyD9yib_iQYHcOG2B2C70cWXJ9SkTiIDt94',authDomain:'app-nelore-mra.firebaseapp.com',projectId:'app-nelore-mra',storageBucket:'app-nelore-mra.firebasestorage.app',messagingSenderId:'1043343802346',appId:'1:1043343802346:web:219f5d73748271a85dfc93'};
const ADMIN_EMAIL='mandrade.gado@terra.com.br';
firebase.initializeApp(FIREBASE_CONFIG);
const fs=firebase.firestore();
try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const raiz=fs.collection('apps').doc('rebanho'),blocosRef=raiz.collection('blocos');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){$$('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
const st=(t,ok=true)=>{$('#status').textContent=t;$('#dot').style.background=ok?'#7bd39e':'#e9b234'};

/* ---------- datas e números ---------- */
const HOJE=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fd=s=>s&&/^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const addD=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const meses=(a,b)=>a&&b?(new Date(b)-new Date(a))/(30.4375*864e5):null;
const n0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString('pt-BR');
const n1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10).toLocaleString('pt-BR');
const n2=v=>v==null||isNaN(v)?'—':(Math.round(v*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b?n1(a/b*100)+'%':'—';
const numBR=s=>{s=String(s??'').trim().replace(/\s/g,'');if(!s)return null;const n=Number(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s);return isFinite(n)?n:null};
const norm=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,' ');
const media=a=>{const v=a.filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((s,x)=>s+x,0)/v.length:null};

/* ---------- dados: blocos no Firestore ---------- */
const COLS={mat:{arq:'matrizes',tam:1800},nas:{arq:'nascimentos',tam:2000},cob:{arq:'coberturas',tam:2300},rep:{arq:'reprodutores',tam:5000}};
let blocos={},db={mat:[],nas:[],cob:[],rep:[],cad:{estacoes:[],classificacoes:[],situacoesMatriz:[],proprietarios:[]}},onde={},sujos=new Set(),tmSalvar=null;
function montar(){
  onde={};Object.keys(COLS).forEach(c=>db[c]=[]);
  Object.keys(blocos).sort((a,b)=>{const[x,i]=a.split('_'),[y,j]=b.split('_');return x===y?i-j:x.localeCompare(y)}).forEach(nb=>{
    const c=nb.split('_')[0];if(!COLS[c])return;(blocos[nb]||[]).forEach(r=>{db[c].push(r);onde[c+':'+r.id]=nb})});
  indexar();
}
function salvarRec(c,r){
  let nb=onde[c+':'+r.id];
  if(!nb){const ns=Object.keys(blocos).filter(b=>b.startsWith(c+'_')).sort((a,b)=>a.split('_')[1]-b.split('_')[1]);let ult=ns[ns.length-1];
    if(!ult||blocos[ult].length>=COLS[c].tam){ult=c+'_'+(ns.length?Number(ns[ns.length-1].split('_')[1])+1:0);blocos[ult]=[]}
    blocos[ult].push(r);db[c].push(r);onde[c+':'+r.id]=nb=ult}
  r.alt=HOJE();sujos.add(nb);clearTimeout(tmSalvar);st('Salvando...',false);tmSalvar=setTimeout(gravar,600);indexar();
}
async function gravar(){
  const lista=[...sujos];sujos.clear();
  try{for(const nb of lista)await blocosRef.doc(nb).set({itens:JSON.parse(JSON.stringify(blocos[nb]))});st('Sincronizado')}
  catch(e){console.error(e);lista.forEach(x=>sujos.add(x));st('Erro ao salvar',false);toast('Não salvou: '+e.message)}
}
async function salvarCad(){try{await blocosRef.doc('cad').set(JSON.parse(JSON.stringify(db.cad)));st('Sincronizado')}catch(e){toast('Não salvou: '+e.message)}}
const novoId=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* índices e contas */
let IX={};
const ehFIV=n=>n.rec!=null&&n.rec!=='';           // produto de FIV (nasceu de receptora): o S-Gado conta à parte
function indexar(){
  const vivo=r=>!r.x;
  IX={mat:{},nasMae:{},cobMat:{},ests:[]};
  db.mat.filter(vivo).forEach(m=>IX.mat[norm(m.reg)]=m);
  db.nas.filter(vivo).forEach(n=>{(IX.nasMae[norm(n.mae)]=IX.nasMae[norm(n.mae)]||[]).push(n)});
  db.cob.filter(vivo).forEach(c=>{(IX.cobMat[norm(c.mat)]=IX.cobMat[norm(c.mat)]||[]).push(c)});
  Object.values(IX.nasMae).forEach(a=>a.sort((x,y)=>String(x.nasc).localeCompare(String(y.nasc))));
  Object.values(IX.cobMat).forEach(a=>a.sort((x,y)=>String(x.ins).localeCompare(String(y.ins))));
  const es=new Set(db.cad.estacoes||[]);db.cob.forEach(c=>c.est&&es.add(c.est));IX.ests=[...es].sort(ordemEst);
  const pesos=db.nas.filter(n=>vivo(n)&&!ehFIV(n)&&n.pesoD).map(n=>n.pesoD),notas=db.nas.filter(n=>vivo(n)&&!ehFIV(n)&&n.notaD).map(n=>n.notaD);
  const res=db.cob.filter(c=>vivo(c)&&['PRENHE','VAZIA','ABORTO'].includes(c.res));
  IX.medPeso=media(pesos);IX.medNota=media(notas);IX.taxa=res.length?res.filter(c=>c.res==='PRENHE').length/res.length:null;
  IX.medIEP=media(Object.keys(IX.nasMae).map(k=>indMatriz(k).iep));
  IX.rank=null;
}
const ordemEst=(a,b)=>{const k=s=>{const m=String(s).match(/^(\d{4})(?:\/(\d{4}))?/);return m?Number(m[1])*10+(m[2]?1:0):0};return k(a)-k(b)};
function indMatriz(reg){
  const k=norm(reg),m=IX.mat[k]||{},ns=(IX.nasMae[k]||[]),nat=ns.filter(n=>!ehFIV(n)),fiv=ns.filter(ehFIV),cs=IX.cobMat[k]||[];
  const datas=nat.map(n=>n.nasc).filter(Boolean).sort();const ints=[];for(let i=1;i<datas.length;i++)ints.push(meses(datas[i-1],datas[i]));
  const res=cs.filter(c=>['PRENHE','VAZIA','ABORTO'].includes(c.res)),pr=res.filter(c=>c.res==='PRENHE').length;
  return {m,nat,fiv,cs,iep:media(ints),p1:datas.length&&m.nasc?meses(m.nasc,datas[0]):null,
    peso:media(nat.map(n=>n.pesoD).filter(Boolean)),nota:media(nat.map(n=>n.notaD).filter(Boolean)),
    pr,vz:res.filter(c=>c.res==='VAZIA').length,ab:res.filter(c=>c.res==='ABORTO').length,tent:res.length,taxa:res.length?pr/res.length:null,taxaNasc:pr?Math.min(1,nat.length/pr):null};
}
// ranking: 50% taxa de prenhez + 20% taxa de nascimento + 30% peso médio à desmama (comparado ao maior)
function ranking(){
  if(IX.rank)return IX.rank;
  const lst=Object.keys(IX.mat).map(k=>({k,i:indMatriz(k)})).filter(x=>x.i.tent>0);
  const maxP=Math.max(1,...lst.map(x=>x.i.peso||0));
  lst.forEach(x=>x.s=Math.round(((x.i.taxa||0)*50+(x.i.taxaNasc||0)*20+((x.i.peso||0)/maxP)*30)*10)/10);
  lst.sort((a,b)=>b.s-a.s);IX.rank={pos:{},tot:lst.length};lst.forEach((x,i)=>IX.rank.pos[x.k]={p:i+1,s:x.s});return IX.rank;
}

  return `<div class="${cheio?'cheio':''}"><label>${l}</label>${inp}</div>`}).join('')}</div>`}
function lerCampos(defs,r){defs.forEach(([k,,t])=>{const el=document.querySelector(`#modal [data-k="${k}"]`);if(!el)return;let v=el.value.trim();if(t==='num'){const x=numBR(v);if(x==null)delete r[k];else r[k]=x;return}if(['mat','mae','rep','pai','reg','prod'].includes(k))v=norm(v);if(v==='')delete r[k];else r[k]=v})}
const DEF_MAT=()=>[['reg','Registro *','txt'],['nome','Nome','txt'],['nasc','Nascimento','date'],['marca','Marca','sel',(db.cad.proprietarios||[]).map(p=>p.marca)],['sit','Situação','sel',db.cad.situacoesMatriz||[]],['origem','Origem','txt'],['pai','Nome do pai','list','dlRep'],['paiReg','Registro do pai','txt'],['avo','Avô materno','list','dlRep'],['maeReg','Registro da mãe','txt'],['obs','Observação','area',null,1]];
function formMat(id){const r=id?db.mat.find(x=>x.id===id):{sit:'ATIVA',marca:'MRA'};if(!r)return;const d=DEF_MAT();
  abrirModal(id?'Editar matriz':'Nova matriz',campos(d,r)+dl('dlRep',db.rep.map(x=>x.nome)),`${id?`<button class="btn del esq" onclick="excluir('mat','${id}')">Excluir</button>`:''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="okF">Salvar</button>`);
  $('#okF').onclick=()=>{const t={...r};lerCampos(d,t);if(!t.reg)return toast('Informe o registro.');const dup=IX.mat[norm(t.reg)];if(dup&&dup!==r)return toast('Já existe matriz com esse registro.');
    const antigo=r.reg;Object.keys(r).forEach(k=>delete r[k]);Object.assign(r,t);if(!r.id)r.id=novoId();
    if(antigo&&norm(antigo)!==norm(r.reg)){db.cob.forEach(c=>{if(norm(c.mat)===norm(antigo)){c.mat=r.reg;salvarRec('cob',c)}});db.nas.forEach(n=>{if(norm(n.mae)===norm(antigo)){n.mae=r.reg;salvarRec('nas',n)}})}
    salvarRec('mat',r);fecharModal();if(fichaReg)fichaReg=r.reg;desenhar();toast('Salvo.')}}
const DEF_COB=()=>[['mat','Matriz *','list','dlMat'],['est','Estação *','sel',IX.ests.slice().reverse()],['cls','Classificação','sel',db.cad.classificacoes||[]],['rep','Reprodutor','list','dlRep'],['cio','Data do cio','date'],['ins','Data da inseminação *','date'],['tipo','Método','sel',['ARTIFICIAL','NATURAL','FIV']],['toque','Data do toque','date'],['res','Resultado','sel',['PRENHE','VAZIA','ABORTO','PRT']],['rec','Nº da receptora','txt'],['parto','Data da parição','date'],['ppi','Previsão inicial','date'],['ppf','Previsão final','date'],['obs','Comentário','area',null,1]];
function formCob(id,mat){const r=id?db.cob.find(x=>x.id===id):{mat:mat||'',est:est||IX.ests[IX.ests.length-1],tipo:'ARTIFICIAL'};if(!r)return;const d=DEF_COB();
  abrirModal(id?'Editar cobertura':'Nova cobertura',campos(d,r)+dl('dlMat',Object.values(IX.mat).map(m=>m.reg))+dl('dlRep',db.rep.map(x=>x.nome))+'<div style="font-size:12px;color:var(--suave);margin-top:8px">Prenhe: a previsão de parto é calculada sozinha (inseminação + 275 e + 315 dias).</div>',`${id?`<button class="btn del esq" onclick="excluir('cob','${id}')">Excluir</button>`:''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="okF">Salvar</button>`);
  $('#okF').onclick=()=>{const t={...r};lerCampos(d,t);if(!t.mat||!t.est||!t.ins)return toast('Preencha matriz, estação e inseminação.');if(!IX.mat[norm(t.mat)])return toast('Matriz não cadastrada: '+t.mat);
    if(t.res==='PRENHE'&&(!t.ppi||t.ins!==r.ins)){t.ppi=addD(t.ins,275);t.ppf=addD(t.ins,315)}
    Object.keys(r).forEach(k=>delete r[k]);Object.assign(r,t);if(!r.id)r.id=novoId();salvarRec('cob',r);fecharModal();desenhar();toast('Salvo.')}}
const DEF_NAS=()=>[['mae','Matriz (mãe) *','list','dlMat'],['prod','Nome do produto','txt'],['rgn','Registro (RGN)','txt'],['sexo','Sexo','sel',['M','F']],['nasc','Nascimento *','date'],['pesoN','Peso ao nascer (kg)','num'],['cor','Cor','sel',['BR','CZ','MB','MN','PV']],['pai','Reprodutor (pai)','list','dlRep'],['marca','Marca','sel',(db.cad.proprietarios||[]).map(p=>p.marca)],['sit','Situação','txt'],['rec','Código da receptora (FIV)','txt'],['desm','Data da desmama','date'],['pesoD','Peso à desmama (kg)','num'],['notaD','Nota à desmama','num'],['obs','Observação','area',null,1]];
function formNas(id,mae){const r=id?db.nas.find(x=>x.id===id):{mae:mae||'',marca:'MRA',sit:'ATIVO'};if(!r)return;const d=DEF_NAS();
  if(!id&&mae){const c=(IX.cobMat[norm(mae)]||[]).filter(c=>c.res==='PRENHE'&&!c.parto).pop();if(c){r.pai=c.rep;if(c.tipo==='FIV'&&c.rec)r.rec=c.rec}}
  abrirModal(id?'Editar nascimento':'Novo nascimento',campos(d,r)+dl('dlMat',Object.values(IX.mat).map(m=>m.reg))+dl('dlRep',db.rep.map(x=>x.nome)),`${id?`<button class="btn del esq" onclick="excluir('nas','${id}')">Excluir</button>`:''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="okF">Salvar</button>`);
  $('#okF').onclick=()=>{const t={...r};lerCampos(d,t);if(!t.mae||!t.nasc)return toast('Preencha mãe e nascimento.');
    Object.keys(r).forEach(k=>delete r[k]);Object.assign(r,t);if(!r.id)r.id=novoId();
    if(!id){const c=(IX.cobMat[norm(r.mae)]||[]).filter(c=>c.res==='PRENHE'&&!c.parto&&c.ins<r.nasc).pop();if(c){c.parto=r.nasc;salvarRec('cob',c)}} // parto fecha a cobertura prenhe
    salvarRec('nas',r);fecharModal();desenhar();toast('Salvo.')}}
const DEF_REP=[['nome','Nome *','txt'],['reg','Registro','txt'],['cod','Código','txt'],['obs','Comentário','area',null,1]];
function formRep(id){const r=id?db.rep.find(x=>x.id===id):{};if(!r)return;
  abrirModal(id?'Editar reprodutor':'Novo reprodutor',campos(DEF_REP,r),`${id?`<button class="btn del esq" onclick="excluir('rep','${id}')">Excluir</button>`:''}<button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="okF">Salvar</button>`);
  $('#okF').onclick=()=>{const t={...r};lerCampos(DEF_REP,t);t.nome=norm(t.nome);if(!t.nome)return toast('Informe o nome.');if(db.rep.some(x=>x!==r&&!x.x&&norm(x.nome)===t.nome))return toast('Já existe.');Object.keys(r).forEach(k=>delete r[k]);Object.assign(r,t);if(!r.id)r.id=novoId();salvarRec('rep',r);fecharModal();desenhar();toast('Salvo.')}}

/* ---------- Excel (planilha comum, do que está na tela com os filtros) ---------- */
let xlsxP=null;const xlsx=()=>xlsxP||(xlsxP=new Promise((ok,er)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>{xlsxP=null;er()};document.head.appendChild(s)}));
async function exportar(qual){
  try{await xlsx()}catch(e){return toast('Sem internet pra gerar o Excel.')}
  const tbl=$('#main table');if(!tbl)return;const lim0=lim;lim=1e9;desenhar();
  const rows=[...$('#main table').querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>{const i=td.querySelector('input,select');return i?(i.type==='date'?fd(i.value):i.value):td.innerText.trim()}).filter(x=>!/^✏️$/.test(x)));
  lim=lim0;desenhar();
  const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,{mat:'Matrizes',cob:'Coberturas',nas:'Nascimentos',rep:'Reprodutores'}[qual]||'Dados');
  XLSX.writeFile(wb,`rebanho_${qual}${est&&(qual==='cob'||qual==='rep')?'_'+est.replace('/','-'):''}.xlsx`);
}
